  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, e); }
});
$('#sync').addEventListener('click', () => ACT['sync-now']());
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });
const ACT = {
  suite: (b) => { const m = b.parentElement.querySelector('.suite-menu'); m.hidden = !m.hidden; },
  more: () => openSheet('Recovery Lens', `<div class="grid g2" style="gap:8px">${NAV.map(([k, l, i, d]) => `<button class="li li-btn" data-go="${k}" style="border:1px solid var(--line);border-radius:12px;padding:12px;justify-content:flex-start;gap:12px"><span class="ico">${I[i]}</span><div><div class="t">${l}</div><div class="s">${d}</div></div></button>`).join('')}</div>`),
  quick: () => openSheet('Quick log', `<div class="grid g2" style="gap:8px">${[['morning', 'sun', 'Morning check-in', 'Sleep + feel + soreness, 30 s'], ['log-sleep', 'moon', 'Sleep', 'Last night'], ['checkin', 'pulse', 'Check-in', 'Energy, fatigue, soreness'], ['body', 'body', 'Soreness', 'Body map'], ['log-session', 'load', 'Training session', 'Shared with Athlete OS'], ['mobility', 'pulse', 'Mobility test', 'L/R range'], ['protocol', 'list', 'Recovery protocol', 'Start a routine']].map(([k, i, l, d]) => `<button class="li li-btn" data-act="q-${k}" style="border:1px solid var(--line);border-radius:12px;padding:12px;justify-content:flex-start;gap:12px"><span class="ico">${I[i]}</span><div><div class="t">${l}</div><div class="s">${d}</div></div></button>`).join('')}</div><div class="row" style="margin-top:12px">${mlLink('Log food or water in MacroLens')}</div>`),
  'q-morning': () => morningFlow(), 'q-log-sleep': () => sleepSheet(), 'q-checkin': () => { closeSheet(); go('readiness'); }, 'q-body': () => { closeSheet(); go('body'); }, 'q-log-session': () => sessionSheet(), 'q-mobility': () => mobilitySheet(), 'q-protocol': () => { closeSheet(); go('protocols'); },
  'log-sleep': (b) => sleepSheet(b?.dataset?.date || todayIso()),
  checkin: () => go('readiness'),
  'log-session': () => sessionSheet(),
  'bb-extra': (b) => { const x = (dayDoc(b.dataset.date)?.exercise || []).find((e) => (e.id || '') === b.dataset.id); if (x) sessionSheet(b.dataset.date, { ...x, date: b.dataset.date }); else toast('Session not found'); },
  mobility: () => mobilitySheet(),
  'new-proto': () => customSheet(),
  'new-exp': () => expSheet(),
  'add-event': (b) => eventSheet(b.dataset.date),
  'edit-event': (b) => eventSheet(null, b.dataset.id),
  'clear-chat': () => confirmSheet('Clear the AI Director conversation?', 'Clear', () => { doc('rl-ai').chat = []; persist('rl-ai'); render(); }),
  'sleep-goals': () => go('settings'),
  'edit-routine': () => routineSheet(),
  'import-wear': () => importSheet(),
  'sync-now': async () => { if (!remote) { const ok = await connectStore(); if (ok) { render(); toast('Synced'); } else toast('Sync needs Recovery Lens open inside Claude while signed in'); return; } retryN = 0; for (const k of RL_DOCS) if (cache[k] && lastSyncErr) pending.add(k); await flush(); render(); toast(syncState === 'synced' ? 'Synced' : 'Still not synced; your changes are safe on this device'); },
  export: () => exportData('json'), 'export-csv': () => exportData('csv'),
  'delete-all': () => deleteSheet(),
  'ai-brief': async (b) => {
    b.disabled = true; $('#brief').innerHTML = '<div class="skel" style="width:70%"></div><div class="skel" style="margin-top:8px"></div><div class="skel" style="margin-top:8px;width:85%"></div>';
    try {
      const r = await askAI(`${AI_RULES}\n\nAthlete data (JSON):\n${JSON.stringify(aiSnapshot(21))}\n\nApp's rule-based briefing for comparison:\n${JSON.stringify(ruleBriefing())}\n\nWrite today's recovery briefing. Use the app's readiness score as given (do not create your own). Return JSON {"status": string (1-2 sentences, current recovery status), "changes": [1-3 changes since the previous check-in, with numbers], "priority": string (the single biggest recovery priority and why), "actions": [3-5 specific recovery actions for today, may name protocols], "monitor": [1-3 things to watch, include missing data], "basis": string (which records you used)}.`);
      const A = doc('rl-ai'); A.briefings = { ...(A.briefings || {}), [todayIso()]: { data: r, at: Date.now() } };
      for (const k of Object.keys(A.briefings).sort().slice(0, -30)) delete A.briefings[k];
      persist('rl-ai'); render();
    } catch (e) { toast(aiErr(e)); render(); }
  },
};
Object.assign(ACT_EXTRA, { 'inj-from': (b) => injurySheet(null, { key: b.dataset.key, date: b.dataset.date }) });
Object.assign(ACT, ACT_EXTRA);
function routineSheet() {
  let steps = (rl().routine || defaultRoutine()).map((s) => ({ ...s }));
  const draw = (sh) => { $('#rt-l', sh).innerHTML = steps.map((s, i) => `<div class="li"><input type="text" value="${esc(s.t)}" data-i="${i}" data-f="t" maxlength="60" style="flex:1"><input type="text" value="${esc(s.time || '')}" data-i="${i}" data-f="time" maxlength="20" placeholder="when" style="width:110px"><button class="btn sm ghost" data-rm="${i}" aria-label="Remove">${I.x}</button></div>`).join(''); $$('[data-f]', sh).forEach((x) => x.oninput = () => (steps[Number(x.dataset.i)][x.dataset.f] = x.value)); $$('[data-rm]', sh).forEach((b) => b.onclick = () => { steps.splice(Number(b.dataset.rm), 1); draw(sh); }); };
  openSheet('Pre-sleep routine', `<p class="small muted" style="margin-top:-4px">Steps you check off each night. Keep it short (3-6 steps).</p><div class="list" id="rt-l"></div><div class="row" style="justify-content:space-between;margin-top:10px"><div class="row"><button class="btn sm" id="rt-add">${I.plus}Add step</button><button class="btn sm ghost" id="rt-def">Use default</button></div><button class="btn pri" id="rt-save">${I.check}Save</button></div>`, (sh) => {
    draw(sh);
    $('#rt-add', sh).onclick = () => { if (steps.length >= 10) return; steps.push({ t: '', time: '' }); draw(sh); };
    $('#rt-def', sh).onclick = () => { steps = defaultRoutine(); draw(sh); };
    $('#rt-save', sh).onclick = () => { steps = steps.filter((s) => s.t.trim()); if (!steps.length) return toast('Add at least one step'); const R = rl(); R.routine = steps.map((s) => ({ t: s.t.trim().slice(0, 60), time: (s.time || '').trim().slice(0, 20) })); persist('rl'); closeSheet(); toast('Routine saved'); render(); };
  });
}
function importSheet() {
  openSheet('Import wearable data', `<p class="small" style="color:var(--fg-2)">Choose a CSV or JSON export. Expected columns (any order, header row required): <code>date</code> (YYYY-MM-DD), and any of <code>sleep_hours</code>, <code>resting_hr</code>, <code>hrv</code>. Values are validated, labeled with the source, and never override nights you logged by hand. Re-importing the same dates updates them instead of duplicating.</p>
    <div class="fields"><label class="f">Source name<input type="text" id="im-src" maxlength="30" value="Wearable import"></label><label class="f">File<input type="file" id="im-f" accept=".csv,.json,text/csv,application/json"></label></div><div id="im-out" style="margin-top:10px"></div>`, (sh) => {
    $('#im-f', sh).onchange = async () => {
      const f = $('#im-f', sh).files[0]; if (!f) return; const out = $('#im-out', sh);
      if (f.size > 5e6) return (out.innerHTML = notice('red', 'File is larger than 5 MB.', 'alert'));
      try {
        const txt = await f.text(); let rows = [];
        if (/\.json$/i.test(f.name) || txt.trim().startsWith('[')) rows = JSON.parse(txt);
        else { const lines = txt.split(/\r?\n/).filter((l) => l.trim()); const hd = lines[0].split(',').map((h) => h.trim().toLowerCase().replace(/[^a-z_]/g, '')); rows = lines.slice(1).map((l) => { const c = l.split(','); return Object.fromEntries(hd.map((h, i) => [h, (c[i] || '').trim()])); }); }
        let ok = 0, bad = 0, upd = 0; const S = doc('rl-sleep'); S.imports = S.imports || {}; const src = $('#im-src', sh).value.trim() || 'Wearable import';
        for (const r of rows) {
          const d = String(r.date || '').slice(0, 10); if (!/^\d{4}-\d{2}-\d{2}$/.test(d) || d > todayIso()) { bad++; continue; }
          const v = { sleepH: Number(r.sleep_hours ?? r.sleepH), rhr: Number(r.resting_hr ?? r.rhr), hrv: Number(r.hrv) };
          const rec = { source: src, importedAt: Date.now() };
          if (v.sleepH > 0 && v.sleepH <= 16) rec.sleepH = r2(v.sleepH); if (v.rhr >= 30 && v.rhr <= 120) rec.rhr = Math.round(v.rhr); if (v.hrv > 0 && v.hrv <= 300) rec.hrv = Math.round(v.hrv);
          if (Array.isArray(r.stages)) { const sg = r.stages.filter((x) => x && /^\d{2}:\d{2}$/.test(x.s) && /^\d{2}:\d{2}$/.test(x.e) && STAGES.some((s) => s[0] === x.st)).slice(0, 300).map((x) => ({ s: x.s, e: x.e, st: x.st })); if (sg.length) rec.stages = sg; }
          if (rec.sleepH == null && rec.rhr == null && rec.hrv == null && !rec.stages) { bad++; continue; }
          if (S.imports[d]) upd++; S.imports[d] = rec; ok++;
        }
        if (ok) { persist('rl-sleep'); readyMemo.clear(); logSync('import', true, `${ok} days from ${f.name}`); }
        out.innerHTML = notice(ok ? 'em' : 'warn', `${ok} days imported${upd ? ` (${upd} updated)` : ''}${bad ? `, ${bad} rows skipped (bad date or values out of range)` : ''}.`, ok ? 'check' : 'alert');
      } catch (e) { out.innerHTML = notice('red', `Couldn't read that file: ${esc(e.message)}`, 'alert'); }
    };
  });
}
async function exportData(kind) {
  let data, name;
  if (kind === 'json') {
    data = JSON.stringify({ app: 'Recovery Lens', version: RL_VERSION, method: METHOD_VERSION, exportedAt: new Date().toISOString(), records: Object.fromEntries(RL_DOCS.map((k) => [k, cache[k] ?? lsGet(k) ?? null])), note: 'Nutrition and training records belong to MacroLens and Athlete OS; export them from those apps.' }, null, 1);
    name = `recovery-lens-${todayIso()}.json`;
  } else {
    const ks = [...new Set([...Object.keys(doc('rl-sleep').nights || {}), ...Object.keys(doc('rl-check').days || {}), ...bodyRecs().map((r) => r.date), ...Object.keys(doc('rl-ready').days || {})])].sort();
    const rows = [['date', 'readiness', 'readiness_confidence', 'sleep_hours', 'sleep_source', 'sleep_quality', 'bedtime', 'wake', 'energy', 'fatigue', 'mood', 'stress', 'motivation', 'avg_soreness', 'training_load', 'protein_g', 'calories', 'water_oz', 'protocol_minutes']];
    for (const d of ks) { const r = readinessFor(d), s = sleepOf(d), c = checkOf(d), n = nutritionOf(d); rows.push([d, r.score ?? '', r.confidence, s ? r2(s.h) : '', s?.source || '', s?.quality ?? '', s?.bed || '', s?.wake || '', c?.energy ?? '', c?.fatigue ?? '', c?.mood ?? '', c?.stress ?? '', c?.motivation ?? '', soreAvg(d) ?? '', perm().training ? loadOf(d) : '', n?.protein ?? '', n?.calories ?? '', waterOf(d) ?? '', protoMins(d)]); }
    data = rows.map((r) => r.map((v) => (/[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v)).join(',')).join('\n');
    name = `recovery-lens-daily-${todayIso()}.csv`;
  }
  try { const dl = window.claude?.use ? await claude.use('downloads') : null; if (!dl) throw new Error('none'); await dl.save({ filename: name, data }); toast('Export saved'); }
  catch (e) { if (e?.code === 'declined') return; openSheet('Export', `<p class="small">Downloading isn't available here. Copy the data below and save it as <b>${name}</b>.</p><textarea readonly id="exp-t" style="min-height:240px;font-size:11px;font-family:ui-monospace,monospace">${esc(data)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn pri" id="exp-c">Copy</button></div>`, (sh) => { $('#exp-c', sh).onclick = async () => { try { await navigator.clipboard.writeText(data); toast('Copied'); } catch { $('#exp-t', sh).select(); toast('Select all and copy'); } }; }); }
}
function deleteSheet() {
  openSheet('Delete Recovery Lens data', `${notice('red', 'This permanently deletes your Recovery Lens records on this device and in your Claude account: sleep logs, check-ins, body map, protocols, experiments, readiness history, AI chat and reports. MacroLens and Athlete OS data are not touched.', 'alert')}
    <label class="row small" style="margin-top:12px;gap:8px"><input type="checkbox" id="del-shared"> Also remove values Recovery Lens added to shared day records (sleep hours, check-in energy/soreness/fatigue, and sessions logged from Recovery Lens)</label>
    <label class="f" style="margin-top:12px">Type DELETE to confirm<input type="text" id="del-c" autocomplete="off"></label>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn danger" id="del-go">Delete permanently</button></div>`, (sh) => {
    $('#del-go', sh).onclick = async () => {
      if ($('#del-c', sh).value.trim() !== 'DELETE') return toast('Type DELETE to confirm');
      if ($('#del-shared', sh).checked) {
        const rlSleepDays = new Set(Object.keys(doc('rl-sleep').nights || {})), rlCheckDays = new Set(Object.keys(doc('rl-check').days || {}));
        for (const d of allDayKeys()) {
          const dd = dayDoc(d); if (!dd) continue; let ch = false;
          if (dd.feel && rlSleepDays.has(d) && dd.feel.sleepH != null) { delete dd.feel.sleepH; ch = true; }
          if (dd.feel && rlCheckDays.has(d)) { for (const k of ['energy', 'sore', 'fatigue']) if (k in dd.feel) { delete dd.feel[k]; ch = true; } }
          if ((dd.exercise || []).some((x) => x.source === 'recovery-lens')) { dd.exercise = dd.exercise.filter((x) => x.source !== 'recovery-lens'); ch = true; }
          if (ch) persist('day-' + d);
        }
      }
      for (const k of RL_DOCS) { cache[k] = null; lsDel(k); if (remote) pending.add(k); }
      await flush();
      for (const k of RL_DOCS) delete cache[k];
      closeSheet(); toast('Recovery Lens data deleted'); go('home');
    };
  });
}

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recovery Lens</title>
<meta name="description" content="Recovery Lens: readiness, sleep, muscle recovery, fueling, training load and recovery protocols for basketball. Shares data with Athlete OS and MacroLens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  --bg: #07090c; --bg-2: #0c0f13; --card: #12161b; --card-2: #181d23; --card-3: #1f252d;
  --line: rgba(255,255,255,.06); --line-2: rgba(255,255,255,.1);
  --fg: #f3f5f7; --fg-2: #c9d0d8; --muted: #8590a0; --faint: #5b6574;
  --em: #2fd29b; --em-2: #1fb583; --em-soft: rgba(47,210,155,.12); --em-glow: rgba(47,210,155,.28);
  --blue: #6f93ff; --blue-soft: rgba(111,147,255,.13); --violet: #a48bff; --violet-soft: rgba(164,139,255,.13);
  --amber: #f2b350; --amber-soft: rgba(242,179,80,.13); --red: #ff6b6b; --red-soft: rgba(255,107,107,.13);
  --cyan: #4fd1e8; --pink: #f07fb5;
  --f-d: "Space Grotesk", "Inter", system-ui, sans-serif; --f-b: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px; --r-s: 11px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-b); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--em); }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-d); font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: 26px; } h2 { font-size: 19px; } h3 { font-size: 15.5px; } h4 { font-size: 13.5px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .tiny { font-size: 11.5px; }
.num { font-family: var(--f-d); font-variant-numeric: tabular-nums; }
.up { color: var(--em); } .down { color: var(--red); } .warnc { color: var(--amber); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0,1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; border-right: 1px solid var(--line); background: var(--bg-2); padding: calc(18px + var(--safe-t)) 12px 18px; display: flex; flex-direction: column; gap: 4px; }
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: radial-gradient(circle at 30% 30%, #5ef0be, #12a873 70%); box-shadow: 0 0 18px var(--em-glow); display: grid; place-items: center; }
.logo-mark svg { width: 18px; height: 18px; color: #04140d; }
.logo b { font: 700 16px var(--f-d); letter-spacing: -.02em; } .logo b i { font-style: normal; color: var(--em); }
.logo small { display: block; color: var(--muted); font-size: 11px; }
.nav-sec { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 12px 10px 4px; }
.nav-a { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 10px; color: var(--fg-2); text-decoration: none; font-weight: 500; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.nav-a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav-a:hover { background: var(--card); color: var(--fg); }
.nav-a.on { background: var(--em-soft); color: var(--em); }
.side-foot { margin-top: auto; padding: 12px 10px 0; display: grid; gap: 8px; }
.main { min-width: 0; padding: calc(18px + var(--safe-t)) 28px 60px; max-width: 1180px; width: 100%; }
.topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.topbar .ttl { flex: 1; min-width: 0; }
.topbar .ttl small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); padding: 5px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.sync[data-s="synced"]::before { background: var(--em); box-shadow: 0 0 8px var(--em-glow); }
.sync[data-s="loading"]::before { background: var(--blue); animation: pulse 1s infinite; }
.sync[data-s="error"]::before { background: var(--red); }
.sync[data-s="local"]::before { background: var(--amber); }
@keyframes pulse { 50% { opacity: .3; } }
.mtop { display: none; }
.tabbar { display: none; }

/* ---------- cards & layout ---------- */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0,1fr)); } .g4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
.g-hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.g-side { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.side .suite { flex: none !important; }
input[type=date] { min-width: 138px; }
.span2 { grid-column: span 2; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.flat { background: var(--bg-2); }
.card.hl { background: linear-gradient(180deg, rgba(47,210,155,.06), transparent 60%), var(--card); }
.ch { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.ch > div:first-child { flex: 1 1 200px; min-width: 0; }
.ch .sub { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; font-weight: 400; font-family: var(--f-b); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rowb { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stack { display: grid; gap: 10px; }
.sp { height: 14px; }
.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* metric tiles */
.metric { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; min-width: 0; position: relative; cursor: pointer; transition: border-color .15s, transform .15s; text-align: left; width: 100%; }
.metric:hover { border-color: var(--line-2); }
.metric .lbl { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
.metric .lbl svg { width: 15px; height: 15px; }
.metric .val { font: 600 23px/1.1 var(--f-d); margin-top: 7px; font-variant-numeric: tabular-nums; }
.metric .val small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.metric .sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metric .bar { height: 4px; border-radius: 4px; background: var(--card-3); margin-top: 9px; overflow: hidden; }
.metric .bar i { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--em)); transition: width .6s ease; }
.metric.miss .val { color: var(--faint); font-size: 17px; }

/* chips, buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line-2); background: var(--card-2); color: var(--fg); padding: 9px 14px; border-radius: 11px; font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; transition: background .15s, border-color .15s; white-space: nowrap; }
.btn:hover { background: var(--card-3); }
.btn.pri { background: var(--em); color: #04140d; border-color: transparent; }
.btn.pri:hover { background: #45e0ad; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 6px 11px; font-size: 12.5px; border-radius: 9px; }
.btn.danger { color: var(--red); border-color: rgba(255,107,107,.3); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: transparent; font-size: 12.5px; color: var(--fg-2); cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--em-soft); border-color: transparent; color: var(--em); }
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; display: inline-flex; background: var(--bg-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { white-space: nowrap; flex: none; border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 12.5px; color: var(--muted); cursor: pointer; font-weight: 600; }
.seg button.on { background: var(--card-3); color: var(--fg); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--card-3); color: var(--fg-2); white-space: nowrap; }
.tag.em { background: var(--em-soft); color: var(--em); } .tag.blue { background: var(--blue-soft); color: var(--blue); } .tag.vi { background: var(--violet-soft); color: var(--violet); }
.tag.amber { background: var(--amber-soft); color: var(--amber); } .tag.red { background: var(--red-soft); color: var(--red); }
.src { font-size: 10.5px; color: var(--faint); font-weight: 500; }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li .t { font-weight: 600; } .li .s { font-size: 12px; color: var(--muted); }
.li-btn { background: none; border: 0; width: 100%; text-align: left; cursor: pointer; }
.ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--card-3); color: var(--c, var(--em)); flex: none; }
.ico svg { width: 17px; height: 17px; }

/* notices */
.note { border-radius: 12px; padding: 11px 13px; font-size: 12.8px; background: var(--card-2); border: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.note svg { width: 17px; height: 17px; flex: none; margin-top: 1px; }
.note.em { background: var(--em-soft); border-color: transparent; } .note.em svg { color: var(--em); }
.note.warn { background: var(--amber-soft); border-color: transparent; } .note.warn svg { color: var(--amber); }
.note.red { background: var(--red-soft); border-color: transparent; } .note.red svg { color: var(--red); }
.note.blue { background: var(--blue-soft); border-color: transparent; } .note.blue svg { color: var(--blue); }
.empty { text-align: center; padding: 26px 12px; color: var(--muted); }
.empty svg { width: 30px; height: 30px; color: var(--faint); margin-bottom: 6px; }
.empty b { display: block; color: var(--fg-2); margin-bottom: 4px; font-size: 14px; }

/* readiness ring */
.hero { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 20px; align-items: center; }
.ring { position: relative; width: 190px; height: 190px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .in b { font: 700 52px/1 var(--f-d); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring .in small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: .08em; }
.ring .in .na { font: 600 19px/1.2 var(--f-d); color: var(--fg-2); }
.ring-arc { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1); }
.comp { display: grid; gap: 9px; }
.comp-row { display: grid; grid-template-columns: 112px minmax(0,1fr) 44px; gap: 10px; align-items: center; font-size: 12.5px; }
.comp-row .nm { color: var(--fg-2); display: flex; gap: 6px; align-items: center; }
.comp-row .nm i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.comp-row .tr { height: 7px; border-radius: 6px; background: var(--card-3); overflow: hidden; }
.comp-row .tr i { display: block; height: 100%; border-radius: 6px; background: var(--c); transition: width .8s ease; }
.comp-row .v { text-align: right; font-family: var(--f-d); font-weight: 600; font-variant-numeric: tabular-nums; }
.comp-row.miss .nm, .comp-row.miss .v { color: var(--faint); }
.complete { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.complete .dots { display: flex; gap: 3px; }
.complete .dots i { width: 14px; height: 5px; border-radius: 3px; background: var(--card-3); }
.complete .dots i.on { background: var(--em); }

/* priorities / briefing */
.prio { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--card-2); align-items: flex-start; }
.prio + .prio { margin-top: 8px; }
.prio .ico { width: 30px; height: 30px; }
.prio b { display: block; font-size: 13.5px; } .prio span { font-size: 12.5px; color: var(--muted); }
.brief h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 12px 0 5px; font-family: var(--f-b); }
.brief h4:first-child { margin-top: 0; }
.brief ul { margin: 0; padding-left: 18px; } .brief li { margin: 3px 0; font-size: 13px; color: var(--fg-2); }
.ai-badge { font: 700 9.5px var(--f-b); letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; background: var(--violet-soft); color: var(--violet); vertical-align: middle; }
.rule-badge { font: 700 9.5px var(--f-b); letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; background: var(--blue-soft); color: var(--blue); vertical-align: middle; }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .ax { font: 10.5px var(--f-b); fill: var(--faint); }
.chart .gl { stroke: var(--line); }
.chart .rd { position: absolute; top: 0; right: 0; font-size: 11.5px; color: var(--fg-2); background: var(--card-3); padding: 3px 8px; border-radius: 7px; pointer-events: none; opacity: 0; transition: opacity .12s; white-space: nowrap; }
.chart.hov .rd { opacity: 1; }
.chart .cursor { stroke: var(--line-2); stroke-dasharray: 3 3; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kv > div { background: var(--bg-2); border-radius: 12px; padding: 10px 12px; }
.kv small { display: block; color: var(--muted); font-size: 11.5px; }
.kv b { font: 600 18px var(--f-d); font-variant-numeric: tabular-nums; }
.kv b small { display: inline; font-size: 11.5px; font-family: var(--f-b); }

/* heat table */
.heat { display: grid; gap: 3px; font-size: 11px; }
.heat .hc { height: 22px; border-radius: 5px; display: grid; place-items: center; font-variant-numeric: tabular-nums; color: rgba(255,255,255,.85); }
.heat .hl { color: var(--muted); display: flex; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* body map */
.bodywrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.bodymap { position: relative; background: radial-gradient(ellipse at 50% 40%, rgba(47,210,155,.05), transparent 65%), var(--bg-2); border-radius: 14px; padding: 10px 6px 4px; }
.bodymap svg { width: 100%; max-height: 520px; display: block; }
.bm-sil { fill: #1a2028; stroke: #262e38; stroke-width: 1; }
.bm-area { cursor: pointer; stroke: rgba(255,255,255,.08); stroke-width: 1; transition: fill .25s, stroke .15s, filter .15s; }
.bm-area:hover { stroke: rgba(255,255,255,.45); }
.bm-area.sel { stroke: var(--em); stroke-width: 2; filter: drop-shadow(0 0 6px var(--em-glow)); }
.bm-area:focus { outline: none; stroke: var(--em); }
.bm-lbl { font: 600 10px var(--f-b); fill: var(--faint); letter-spacing: .1em; }
.scale-l { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.scale-l .g { flex: 1; height: 7px; border-radius: 5px; background: linear-gradient(90deg, #27303b, #2fd29b 25%, #f2b350 60%, #ff6b6b); }
.sl { display: grid; gap: 4px; }
.sl label { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--fg-2); }
.sl label b { font-family: var(--f-d); }
input[type=range] { width: 100%; accent-color: var(--em); }

/* forms */
.fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.fields .full { grid-column: 1 / -1; }
label.f { display: grid; gap: 5px; font-size: 12.5px; color: var(--fg-2); font-weight: 500; }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea { width: 100%; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; color: var(--fg); outline: none; min-width: 0; }
input:focus, select:focus, textarea:focus { border-color: var(--em); }
textarea { min-height: 72px; resize: vertical; }
.pick10 { display: grid; grid-template-columns: repeat(11, minmax(0,1fr)); gap: 4px; }
.pick5 { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 5px; }
.pick10 button, .pick5 button { border: 1px solid var(--line-2); background: var(--bg-2); border-radius: 8px; padding: 7px 0; font-weight: 600; font-size: 12.5px; cursor: pointer; color: var(--fg-2); }
.pick10 button.on, .pick5 button.on { background: var(--em); color: #04140d; border-color: transparent; }
.pick5 button small { display: block; font-size: 9.5px; font-weight: 500; opacity: .75; }
.err { color: var(--red); font-size: 12px; min-height: 16px; }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); z-index: 50; opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet { position: fixed; z-index: 51; left: 50%; top: 50%; transform: translate(-50%, -46%); opacity: 0; transition: transform .22s ease, opacity .22s; width: min(620px, calc(100vw - 24px)); max-height: calc(100vh - 40px); overflow-y: auto; background: var(--card); border: 1px solid var(--line-2); border-radius: 20px; padding: 20px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.sheet.show { transform: translate(-50%, -50%); opacity: 1; }
.sheet .sh-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
.x { border: 0; background: var(--card-3); width: 30px; height: 30px; border-radius: 9px; cursor: pointer; color: var(--muted); display: grid; place-items: center; flex: none; }
.x svg { width: 16px; height: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(26px + var(--safe-b)); transform: translate(-50%, 20px); background: var(--card-3); border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* protocol */
.pcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; cursor: pointer; text-align: left; transition: border-color .15s; }
.pcard:hover { border-color: var(--line-2); }
.pcard .meta { display: flex; gap: 6px; flex-wrap: wrap; }
.step { display: grid; grid-template-columns: 28px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.step:first-child { border-top: 0; }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--card-3); display: grid; place-items: center; font: 600 12px var(--f-d); }
.step.done .n { background: var(--em); color: #04140d; }
.step .cue { font-size: 12.5px; color: var(--fg-2); margin-top: 3px; }
.player { text-align: center; padding: 8px 0; }
.player .clock { font: 700 54px/1 var(--f-d); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pbar { height: 6px; border-radius: 6px; background: var(--card-3); overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--em); border-radius: 6px; transition: width .3s; }
.minibody { width: 64px; flex: none; }

/* chat */
.chat { display: grid; gap: 12px; }
.msg { max-width: 88%; padding: 11px 14px; border-radius: 14px; font-size: 13.5px; }
.msg.u { justify-self: end; background: var(--em-soft); color: var(--fg); border-bottom-right-radius: 4px; }
.msg.a { background: var(--card-2); border-bottom-left-radius: 4px; }
.msg.a ul { margin: 6px 0 0; padding-left: 18px; } .msg.a li { margin: 2px 0; }
.msg .ev { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.typing { display: inline-flex; gap: 4px; } .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite; } .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 4px; }
.cal .dh { font-size: 11px; color: var(--faint); text-align: center; padding: 4px 0; }

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// =====================================================================================================
// RECOVERY LENS — page 6 of the Athlete OS bundle (Athlete OS · MacroLens · Gameplan · School · Training Center).
// SHARED DATA ARCHITECTURE
//   Every page of this artifact reads and writes ONE private collection: data/users/<viewer id>/ (Claude account,
//   private to the viewer, synced across devices) plus a same-device cache in localStorage under the "ml:" prefix.
//   Shared contracts Recovery Lens READS (written by the other apps):
//     core                 MacroLens: profile, targets, overrides, prefs.waterGoal, health.days{iso:{sleepH,rhr,hrv,steps}}
//     day-YYYY-MM-DD       MacroLens + Athlete OS: breakfast/lunch/dinner/snacks [food entries w/ addedAt], water (oz),
//                          exercise [{id,type,name,mins,int,rpe,time,notes,source,...}], feel {sleepH,energy,sore,fatigue}
//     aos                  Athlete OS: status (availability), profile.nextGame
//     aos-plan             Athlete OS calendar: events [{id,title,type,date,start,mins,recur}]
//     aos-games            Athlete OS games [{id,date,opp,...}]
//   Recovery Lens WRITES its own docs (prefix "rl"), and two shared fields so nothing is entered twice:
//     day-*.feel.{sleepH,energy,sore}   (same 1-5 scales Athlete OS uses)
//     day-*.exercise[]                  (same session schema as the Athlete OS Training Load Monitor; source "recovery-lens")
//   RL docs: rl (settings, permissions, events, custom protocols, sync log), rl-sleep, rl-check, rl-body, rl-proto,
//            rl-ready (stored readiness assessments + inputs + method version), rl-exp, rl-ai (chat, briefings, reports)
// =====================================================================================================

const RL_VERSION = '1.0.0';
const METHOD_VERSION = 'rl-readiness-1.0';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const r1 = (x) => Math.round(x * 10) / 10;
const r2 = (x) => Math.round(x * 100) / 100;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const clamp01 = (x) => clamp(x, 0, 1);
const uid = (p = 'r') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const sum = (a) => a.reduce((x, y) => x + (Number(y) || 0), 0);
const sd = (a) => { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(mean(a.map((v) => (v - m) ** 2))); };
const nn = (x) => x != null && !Number.isNaN(x);
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const todayIso = () => isoDate(new Date());
const parseIso = (iso) => new Date(iso + 'T12:00:00');
function shiftIso(iso, n) { const d = parseIso(iso); d.setDate(d.getDate() + n); return isoDate(d); }
const daysBetween = (a, b) => Math.round((parseIso(b) - parseIso(a)) / 864e5);
function lastNDays(n, end = todayIso()) { const o = []; for (let i = n - 1; i >= 0; i--) o.push(shiftIso(end, -i)); return o; }
function rangeDays(a, b) { const o = []; for (let d = a; d <= b; d = shiftIso(d, 1)) o.push(d); return o; }
const mondayOf = (iso) => shiftIso(iso, -((parseIso(iso).getDay() + 6) % 7));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const fmtD = (iso) => { const d = parseIso(iso); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtDL = (iso) => { const d = parseIso(iso); return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtDur = (m) => { m = Math.round(m); if (m < 60) return m + ' min'; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h ${r}m` : `${h}h`; };
const fmtH = (h) => (h == null ? '—' : `${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, '0')}m`);
const toMin = (t) => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fmtClock = (t) => { if (!t) return ''; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')}${ap}`; };
const minToClock = (m) => { m = ((Math.round(m) % 1440) + 1440) % 1440; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const fmtTs = (ts) => { const d = new Date(ts); return `${fmtD(isoDate(d))} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`; };
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

// ------------------------------------------------ storage ------------------------------------------------
const cache = {};
let remote = null, userId = null;
const pending = new Set();
let flushing = false, flushTimer = null, retryN = 0, syncState = 'local', lastSyncErr = '';
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('ml:' + k, JSON.stringify(v)); } catch {} };
const lsDel = (k) => { try { localStorage.removeItem('ml:' + k); } catch {} };
const lsKeys = () => { try { return Object.keys(localStorage).filter((k) => k.startsWith('ml:')).map((k) => k.slice(3)); } catch { return []; } };
const BLANK = {
  core: () => ({ profile: null, targets: null, overrides: {}, custom: [], recents: [], weights: [] }),
  aos: () => ({ profile: {}, customTests: [] }),
  'aos-plan': () => ({ events: [], routines: [], checks: {} }),
  'aos-games': () => ({ games: [] }),
  rl: () => ({ v: RL_VERSION, createdAt: Date.now(), settings: {}, perm: { nutrition: true, training: true, calendar: true }, events: [], custom: [], favs: [], routine: null, sync: [], sources: {} }),
  'rl-sleep': () => ({ nights: {}, routineLog: {} }),
  'rl-check': () => ({ days: {} }),
  'rl-body': () => ({ records: [] }),
  'rl-proto': () => ({ sessions: [], notes: {} }),
  'rl-ready': () => ({ days: {} }),
  'rl-exp': () => ({ experiments: [] }),
  'rl-ai': () => ({ chat: [], briefings: {}, reports: {}, insights: {}, daily: {} }),
  'rl-base': () => ({ current: null, history: {} }),
  'rl-game': () => ({ games: {} }),
  'rl-inj': () => ({ episodes: [] }),
};
const RL_DOCS = ['rl', 'rl-sleep', 'rl-check', 'rl-body', 'rl-proto', 'rl-ready', 'rl-exp', 'rl-ai', 'rl-base', 'rl-game', 'rl-inj'];
function doc(key) {
  if (!(key in cache)) cache[key] = lsGet(key) ?? (BLANK[key] ? BLANK[key]() : null);
  return cache[key];
}
const rl = () => doc('rl');
const core = () => doc('core');
function dayDoc(date, create = false) {
  const k = 'day-' + date;
  if (!doc(k) && create) cache[k] = { breakfast: [], lunch: [], dinner: [], snacks: [], water: 0 };
  return cache[k];
}
function persist(key) {
  const v = cache[key];
  if (v && typeof v === 'object' && !Array.isArray(v) && key.startsWith('rl')) v.updatedAt = Date.now();
  lsSet(key, v);
  if (!remote) { setSync('local'); return; }
  pending.add(key);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 600);
  scheduleRecalc();
}
function logSync(op, ok, detail) {
  const R = rl(); if (!R) return; R.sync = [{ at: Date.now(), op, ok, detail: String(detail || '').slice(0, 140) }, ...(R.sync || [])].slice(0, 40);
  lsSet('rl', R);
}
async function flush() {
  if (flushing || !remote || !pending.size) return;
  flushing = true; setSync('loading');
  const keys = [...pending]; let failed = false;
  try {
    for (const k of keys) {
      pending.delete(k);
      const v = cache[k];
      if (v == null) await remote.doc(k).delete?.(); else await remote.doc(k).set(JSON.parse(JSON.stringify(v)));
    }
    retryN = 0; lastSyncErr = '';
    if (keys.some((k) => k !== 'rl')) logSync('push', true, keys.join(', '));
    setSync('synced');
  } catch (e) {
    failed = true;
    keys.forEach((k) => pending.add(k));
    lastSyncErr = e?.message || 'Save failed';
    logSync('push', false, lastSyncErr);
    retryN++;
    setSync('error');
    if (retryN <= 3) setTimeout(flush, 2000 * retryN * retryN); // retry 2 s, 8 s, 18 s, then wait for the next change or a tap
  } finally { flushing = false; if (!failed && pending.size) setTimeout(flush, 50); }
}
function setSync(s) {
  syncState = s;
  const el = $('#sync'); if (!el) return;
  el.dataset.s = s;
  el.textContent = s === 'synced' ? 'Synced' : s === 'error' ? 'Sync failed · retry' : s === 'loading' ? 'Syncing…' : 'This device only';
  const m = $('#msync'); if (m) { m.dataset.s = s; m.textContent = el.textContent; }
}
async function connectStore() {
  if (!window.claude?.use) { setSync('local'); return false; }
  setSync('loading');
  let db = null, user = null;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch {}
  try { userId = user ? await user.id() : null; } catch { userId = null; }
  if (!db || !userId) { setSync('local'); return false; }
  const coll = db.collection('data/users/' + userId);
  let timedOut = false;
  const timer = setTimeout(() => { timedOut = true; setSync('local'); }, 10000);
  try {
    const snap = await coll.get();
    clearTimeout(timer);
    remote = coll;
    const remoteKeys = new Set();
    for (const d of snap.docs) {
      if (!d.exists) continue;
      remoteKeys.add(d.id);
      cache[d.id] = JSON.parse(JSON.stringify(d.data()));
      lsSet(d.id, cache[d.id]);
    }
    // Recovery Lens docs created on this device before sign-in get uploaded. Other apps' docs are theirs to upload.
    for (const k of lsKeys()) if (!remoteKeys.has(k) && k.startsWith('rl')) { doc(k); pending.add(k); }
    logSync('pull', true, `${snap.docs.length} records loaded`);
    setSync('synced');
    if (pending.size) flush();
    watchRemote(coll);
    return true;
  } catch (e) {
    clearTimeout(timer);
    logSync('pull', false, e?.message || 'Could not load');
    if (!timedOut) setSync('error');
    return false;
  }
}
// Automatic retrieval: new meals from MacroLens or sessions from Athlete OS (on any device) arrive while this page is open.
function watchRemote(coll) {
  try {
    if (typeof coll.onSnapshot !== 'function') return;
    coll.onSnapshot((snap) => {
      let changed = false;
      for (const d of snap.docs || []) {
        if (!d.exists || pending.has(d.id)) continue;
        const nv = JSON.stringify(d.data());
        if (JSON.stringify(cache[d.id]) !== nv) { cache[d.id] = JSON.parse(nv); lsSet(d.id, cache[d.id]); changed = true; }
      }
      if (changed) { scheduleRecalc(); softRender(); }
    }, () => {});
  } catch {}
}
let srT = null;
function softRender() { clearTimeout(srT); srT = setTimeout(() => { if (!sheetOpen()) render(); }, 400); }
window.addEventListener('pagehide', () => { if (pending.size) flush(); });

// ------------------------------------------------ settings & permissions ------------------------------------------------
const DEFAULT_WEIGHTS = { sleep: 25, wellness: 20, load: 20, soreness: 15, nutrition: 10, hydration: 10 };
function settings() {
  const s = rl().settings || {};
  const age = core()?.profile?.age;
  return {
    sleepGoal: Number(s.sleepGoal) || (age && age >= 18 ? 8 : 9), // AASM: 8-10 h for ages 13-18, 7+ h for adults
    bedTarget: s.bedTarget || '22:30', wakeTarget: s.wakeTarget || '06:45',
    weights: { ...DEFAULT_WEIGHTS, ...(s.weights || {}) },

}
const perm = () => ({ nutrition: true, training: true, calendar: true, ...(rl().perm || {}) });

// ------------------------------------------------ shared readers: training (Athlete OS) ------------------------------------------------
// Same formulas as the Athlete OS Training Load Monitor (Foster session RPE): load = minutes x session RPE.
const INT_RPE = { light: 3, moderate: 5, hard: 7 };
const sessionRPE = (x) => Number(x.rpe) || INT_RPE[x.int] || 5;
const sessionLoad = (x) => Math.round(sessionRPE(x) * (Number(x.mins) || 0));
const rawEx = (d) => dayDoc(d)?.exercise || [];
const exList = (d) => (perm().training ? rawEx(d) : []);
const loadOf = (d) => exList(d).reduce((a, x) => a + sessionLoad(x), 0);
const isActive = (d) => exList(d).some((x) => Number(x.mins) > 0);
const BB_TYPES = [
  // [type key used in day.exercise, label, color, lower-body demand 0-1, basketball?]
  ['game', 'Competitive game', '#ff7a45', 1, true], ['practice', 'Team practice', '#6f93ff', 0.9, true],
  ['skill', 'Individual workout', '#4fd1e8', 0.6, true], ['shooting', 'Shooting workout', '#2fd29b', 0.35, true],
  ['handles', 'Ball-handling workout', '#7dd3fc', 0.35, true], ['finishing', 'Finishing workout', '#5eead4', 0.6, true],
  ['conditioning', 'Conditioning', '#f2b350', 0.85, false], ['speed', 'Sprint session', '#fb923c', 0.9, false],
  ['jump', 'Jump training', '#f07fb5', 1, false], ['lift', 'Lifting (strength)', '#a48bff', 0.6, false],
  ['run', 'Run', '#fbbf24', 0.7, false], ['bike', 'Bike', '#facc15', 0.4, false], ['recovery', 'Recovery / mobility', '#94a3b8', 0.1, false],
  ['walk', 'Walk', '#94a3b8', 0.15, false], ['other', 'Other', '#64748b', 0.4, false],
];
const typeInfo = (t) => BB_TYPES.find((x) => x[0] === t) || BB_TYPES[BB_TYPES.length - 1];
/** Lifting is split by focus (lower/upper/full) with a field Recovery Lens adds; Athlete OS keeps reading the same session. */
// Same calorie estimate as Athlete OS/MacroLens (MET x intensity x body weight), so MacroLens can adjust targets for RL-logged sessions.
const MET_BY_TYPE = { practice: 6.5, game: 8, skill: 5.5, shooting: 4.5, handles: 5, finishing: 6, lift: 5, conditioning: 9, run: 9.8, bike: 7, speed: 8, recovery: 2.5, walk: 3.5, other: 5 };
const exBurnEst = (type, mins, int) => Math.round((MET_BY_TYPE[type] ?? 5) * ({ light: 0.8, moderate: 1, hard: 1.2 }[int] ?? 1) * (core()?.profile?.weightLb ?? 150) * 0.4536 * (Number(mins) / 60));
function sessionKind(x) {
  if (x.kind === 'jump') return 'Jump training';
  if (x.type === 'lift') return x.focus === 'upper' ? 'Upper-body lifting' : x.focus === 'lower' ? 'Lower-body lifting' : 'Lifting';
  return typeInfo(x.type)[1];
}
function lowerDemand(x) { if (x.kind === 'jump') return 1; if (x.type === 'lift') return x.focus === 'upper' ? 0.15 : x.focus === 'lower' ? 0.9 : 0.55; return typeInfo(x.type)[3]; }
/** High intensity = session RPE 7+; light = RPE 4 or less. A shooting session at RPE 3 is not a practice at RPE 8. */
const intensityOf = (x) => { const r = sessionRPE(x); return r >= 7 ? 'high' : r <= 4 ? 'light' : 'moderate'; };
function sessionsIn(days) { return days.flatMap((d) => exList(d).map((x) => ({ ...x, date: d, rpeV: sessionRPE(x), load: sessionLoad(x), est: !x.rpe }))); }
function trainingHistoryStart() { const ks = allDayKeys().filter((d) => rawEx(d).length); return ks[0] || null; }
function loadStats(end = todayIso()) {
  const d7 = lastNDays(7, end), d28 = lastNDays(28, end);
  const acute = sum(d7.map(loadOf)), chronic = sum(d28.map(loadOf)) / 4;
  const first = trainingHistoryStart();
  const history = first ? daysBetween(first, end) + 1 : 0;
  const acwr = chronic > 0 && history >= 21 ? r2(acute / chronic) : null;
  const l7 = d7.map(loadOf), m = mean(l7), s = sd(l7);
  let streak = 0; for (let d = end; isActive(d); d = shiftIso(d, -1)) streak++;
  let restDays = d7.filter((d) => !isActive(d)).length;
  return { acute, chronic: Math.round(chronic), acwr, history, monotony: s ? r2(m / s) : null, streak, restDays, est: sessionsIn(d7).some((x) => x.est) };
}
const acwrZone = (r) => (r == null ? ['', 'Building history'] : r < 0.8 ? ['blue', 'Below usual'] : r <= 1.3 ? ['em', 'Typical range'] : r <= 1.5 ? ['amber', 'Rising quickly'] : ['red', 'Large increase']);
const allDayKeys = () => [...new Set([...Object.keys(cache), ...lsKeys()].filter((k) => k.startsWith('day-')))].map((k) => k.slice(4)).sort();

// ------------------------------------------------ shared readers: nutrition (MacroLens) ------------------------------------------------

function protoById(id) {
  const p = PROTOS.find((x) => x.id === id) || (rl().custom || []).find((x) => x.id === id);
  if (!p) return null;
  const steps = p.steps.map((s) => ({ ex: exById(s[0]), sets: s[1], reps: s[2], secs: Number(s[3]) || 60 })).filter((s) => s.ex);
  const areas = [...new Set(steps.flatMap((s) => s.ex.areas))];
  const equip = [...new Set(steps.map((s) => s.ex.equip).filter((e) => e && e !== 'None'))];
  return { ...p, steps, areas, equip, mins: Math.max(1, Math.round(sum(steps.map((s) => s.secs)) / 60)), custom: !!p.custom };
}
const allProtos = () => [...PROTOS, ...(rl().custom || [])].map((p) => protoById(p.id)).filter(Boolean);

function sleepConsistency(end = todayIso(), n = 14) {
  const ds = lastNDays(n, end), b = ds.map(bedMin).filter(nn), w = ds.map(wakeMin).filter(nn);

  const s = (sd(b) + sd(w)) / 2;
  return { sdMin: Math.round(s), score: Math.round(clamp(100 - (s - 15) * 1.25, 0, 100)), n: Math.min(b.length, w.length) };
}

function playProtocol(id) {
  const p = protoById(id), started = Date.now(); let i = 0, left = p.steps[0].secs, running = false, timer = null; const done = new Set();
  const draw = (sh) => {
    const s = p.steps[i];
    $('#pl', sh).innerHTML = `<div class="pbar"><i style="width:${(done.size / p.steps.length) * 100}%"></i></div><div class="small muted" style="margin:8px 0 4px">Step ${i + 1} of ${p.steps.length} · ${done.size} done</div>
      <div class="row" style="gap:14px;align-items:center;margin:8px 0"><div class="minibody" style="width:54px">${bodySvg(s.ex.areas.some((a) => ['upperback', 'lowerback', 'glutes', 'hamstrings', 'calves'].includes(a)) ? 'back' : 'front', null, null, { mini: s.ex.areas })}</div><div style="flex:1;min-width:0"><h2>${esc(s.ex.name)}</h2><div class="small" style="color:var(--fg-2)">${s.sets > 1 ? s.sets + ' sets · ' : ''}${esc(s.reps)}</div></div></div>
      <p class="small" style="color:var(--fg-2)">${esc(s.ex.how)}</p>${s.ex.safe ? `<p class="tiny warnc">${esc(s.ex.safe)}</p>` : ''}
      <div class="player"><div class="clock">${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}</div><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" id="pl-prev" ${i === 0 ? 'disabled' : ''}>Back</button><button class="btn pri" id="pl-run">${running ? I.pause + 'Pause' : I.play + 'Start timer'}</button><button class="btn" id="pl-next">${done.has(i) ? 'Next' : 'Done · next'}</button></div></div>`;
    $('#pl-run', sh).onclick = () => { running = !running; clearInterval(timer); if (running) timer = setInterval(() => { left = Math.max(0, left - 1); if (!left) { running = false; clearInterval(timer); done.add(i); try { navigator.vibrate?.(200); } catch {} } draw(sh); }, 1000); draw(sh); };
    $('#pl-prev', sh).onclick = () => { clearInterval(timer); running = false; i--; left = p.steps[i].secs; draw(sh); };

    $('#pf-save', sh).onclick = () => { const m = clamp(Number($('#pf-m', sh).value) || mins, 1, 240); const P = doc('rl-proto'); P.sessions = [...(P.sessions || []), { id: uid('p'), protocolId: id, name: p.name, date: todayIso(), at: Date.now(), mins: m, stepsDone: done.size, stepsTotal: p.steps.length, notes: $('#pf-n', sh).value.trim(), createdAt: Date.now() }]; persist('rl-proto'); closeSheet(); toast(`${p.name} saved · ${m} min`); render(); };
  };
  openSheet(esc(p.name), `<div id="pl"></div><div class="row" style="justify-content:space-between;margin-top:14px"><span class="tiny muted">Total about ${p.mins} min</span><button class="btn sm ghost" id="pl-end">Finish early</button></div>`, (sh) => { draw(sh); $('#pl-end', sh).onclick = () => finish(sh); return () => clearInterval(timer); });

function morningFlow() {

    let body = '';
    if (step === 0) body = `<div class="fields"><label class="f">Lights out<input type="time" id="mf-bed" value="${S.bed}"></label><label class="f">Woke up<input type="time" id="mf-wake" value="${S.wake}"></label><label class="f full">Minutes to fall asleep<input type="number" id="mf-lat" min="0" max="240" value="${S.lat}"></label><div class="full"><div class="small" style="color:var(--fg-2);margin-bottom:5px">Sleep quality</div>${pick('quality', 5, S.quality, ['', 'Awful', 'Poor', 'OK', 'Good', 'Great'])}</div></div><div class="note" id="mf-calc" style="margin-top:10px"></div><p class="tiny muted" style="margin-top:6px">For night-time wake-ups and notes, use the full sleep log.</p>`;
    if (step === 1) body = `<div class="stack">${[['energy', 'Energy'], ['fatigue', 'Fatigue'], ['sore', 'Overall soreness'], ['mood', 'Mood'], ['stress', 'Stress'], ['motivation', 'Motivation']].map(([k, l]) => `<div><div class="small" style="margin-bottom:4px;color:var(--fg-2)">${l}</div>${pick(k, 5, S[k], LBL[k])}</div>`).join('')}</div>`;
    if (step === 2) body = `<p class="small" style="color:var(--fg-2);margin-top:-4px">Tap anything that's sore or tight, then pick how much. Skip if nothing is. Pain or anything that isn't normal soreness: log it on the body map so it's flagged.</p>
      <div class="list">${QUICK.map(([id, l]) => { const v = S.areas[id]; return `<div class="li"><span class="t" style="width:96px">${l}</span><div class="seg" data-qa="${id}">${[['', 'None'], [3, 'Mild'], [5, 'Sore'], [7, 'Very']].map(([x, lb]) => `<button data-v="${x}" class="${(v ?? '') === x ? 'on' : ''}">${lb}</button>`).join('')}</div></div>`; }).join('')}</div>${notice('blue', 'Quick taps log both sides at the same level. Use the body map for left/right detail, tightness and notes.', 'info')}`;
    if (step === 3) { const r = readinessFor(t), [, band, col] = bandOf(r.score); body = `<div style="display:grid;justify-items:center;gap:8px"><div class="ring" style="width:150px;height:150px">${ringSvg(r.score, col, 150, 11)}<div class="in"><div>${r.score != null ? `<b class="num" style="font-size:42px">${r.display}</b><small style="color:${col}">${band}</small>` : '<div class="na">Not enough<br>data</div>'}</div></div></div><div class="small muted">${Math.round(r.completeness * 100)}% of inputs · ${METHOD_VERSION}</div></div><div class="sp"></div>${priorities(t).slice(0, 2).map((p) => `<div class="prio"><span class="ico" style="--c:${p.c}">${I[p.ic] || I.info}</span><div><b>${esc(p.t)}</b><span>${esc(p.d)}</span></div></div>`).join('')}`; }
    sh.querySelector('.sh-b').innerHTML = dots + body + `<div class="err" id="mf-err"></div><div class="row" style="justify-content:space-between;margin-top:14px">${step > 0 && step < 3 ? '<button class="btn" id="mf-back">Back</button>' : '<span></span>'}<div class="row">${step < 3 ? `<button class="btn ghost" id="mf-skip">Skip</button><button class="btn pri" id="mf-next">${step === 2 ? 'Finish' : 'Next'}</button>` : '<button class="btn" data-go="readiness">Details</button><button class="btn pri" data-close>Done</button>'}</div></div>`;
    bindPicks(sh, S);
    if (step === 0) { const calc = () => { S.bed = $('#mf-bed', sh).value; S.wake = $('#mf-wake', sh).value; S.lat = Number($('#mf-lat', sh).value) || 0; const b = toMin(S.bed), w = toMin(S.wake); if (b == null || w == null) return; let ib = w - b; if (ib <= 0) ib += 1440; $('#mf-calc', sh).innerHTML = `${I.info}<div>In bed ${fmtH(ib / 60)} · asleep about <b>${fmtH(Math.max(0, ib - S.lat) / 60)}</b></div>`; }; calc(); $$('input', sh).forEach((i) => i.addEventListener('input', calc)); }
    $$('[data-qa]', sh).forEach((g) => g.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; S.areas[g.dataset.qa] = b.dataset.v === '' ? undefined : Number(b.dataset.v); $$('button', g).forEach((x) => x.classList.toggle('on', x === b)); });
    $('#mf-back', sh)?.addEventListener('click', () => { step--; draw(sh); });

    $('#mf-next', sh)?.addEventListener('click', () => {
      const err = $('#mf-err', sh);
      if (step === 0) {
        const b = toMin(S.bed), w = toMin(S.wake); if (b == null || w == null) return (err.textContent = 'Enter both times.');

        SL.nights[t] = { ...(prev || {}), bed: S.bed, wake: S.wake, latency: S.lat, waso: prev?.waso ?? 0, wakes: prev?.wakes ?? 0, quality: S.quality, notes: prev?.notes || '', inBedH: r2(ib / 60), asleepH: r2((asleep - (prev?.waso ?? 0)) / 60), source: 'Recovery Lens', createdAt: prev?.createdAt || Date.now(), updatedAt: Date.now() };
        persist('rl-sleep'); const dd = dayDoc(t, true); dd.feel = { ...(dd.feel || {}), sleepH: SL.nights[t].asleepH }; persist('day-' + t);
      }

        const ks = ['energy', 'mood', 'stress', 'motivation', 'fatigue', 'sore'];
        if (ks.some((k) => nn(S[k]))) {
          const C = doc('rl-check'); C.days = C.days || {}; const prev = C.days[t];

          persist('rl-check'); const dd = dayDoc(t, true); dd.feel = { ...(dd.feel || {}) }; for (const k of ['energy', 'sore', 'fatigue']) { if (nn(S[k])) dd.feel[k] = S[k]; else delete dd.feel[k]; } persist('day-' + t);
        }

      if (step === 2) finishAreas();
      readyMemo.clear(); step++; draw(sh);
    });
  };
  const finishAreas = () => {
    const B = doc('rl-body'); B.records = B.records || []; let n = 0;
    for (const [id, v] of Object.entries(S.areas)) { if (v == null) continue; const a = areaInfo(id); for (const side of a[3] ? ['L', 'R'] : ['C']) { const key = areaKey(id, side); const ex = B.records.find((r) => r.key === key && r.date === t && Date.now() - r.at < 6 * 3600e3); const rec = { ...(ex || {}), id: ex?.id || uid('b'), key, area: id, side, date: t, at: Date.now(), soreness: v, tightness: ex?.tightness ?? 0, discomfort: ex?.discomfort ?? 0, mobility: ex?.mobility ?? null, kind: ex?.kind || 'soreness', notes: ex?.notes || '', createdAt: ex?.createdAt || Date.now(), updatedAt: Date.now(), source: 'recovery-lens-quick' }; B.records = [...B.records.filter((r) => r.id !== rec.id), rec]; n++; } }
    if (n) persist('rl-body'); readyMemo.clear();
  };
  openSheet('Morning check-in', '', (sh) => { draw(sh); return () => render(); });
}

const gameRec = (d) => doc('rl-game').games?.[d] || null;
function gameInfo(d) {
  const logged = exList(d).find((x) => x.type === 'game'), sched = calItemsOn(d).find((x) => x.type === 'game' && x.kind !== 'logged');
  if (!logged && !sched) return null;
  const time = logged?.time || sched?.time || null, mins = Number(logged?.mins) || sched?.mins || 90;
  let endTs = null; if (time) { const e = parseIso(d); const [h, m] = time.split(':').map(Number); e.setHours(h, m + mins, 0, 0); endTs = e.getTime(); }
  return { date: d, title: sched?.title || logged?.name || 'Game', time, mins, logged, endTs };
}
/** A game today (after it ends) or yesterday with no post-game check-in yet. */
function pendingPostGame() {
  const t = todayIso();
  for (const d of [t, shiftIso(t, -1)]) {
    const g = gameInfo(d); if (!g || gameRec(d)) continue;
    if (d === t && (g.endTs ? Date.now() < g.endTs : new Date().getHours() < 18)) continue;
    return g;
  }
  return null;
}
/** Most recent game within the last 3 days (for the 72-hour tracker). */
function recentGame() { const t = todayIso(); for (let i = 0; i <= 3; i++) { const d = shiftIso(t, -i), g = gameInfo(d); if (g && (i > 0 || (g.endTs ? Date.now() > g.endTs : new Date().getHours() >= 18))) return g; } return null; }

  const pm = postMeals.reduce((a, e) => { const q = scaleE(e); return { c: a.c + q.carbs, p: a.p + q.protein }; }, { c: 0, p: 0 });
  const protoOn = (dd, ids) => (doc('rl-proto').sessions || []).some((s) => s.date === dd && (!ids || ids.includes(s.protocolId)));
  const sl1 = sleepOf(d1), sl2 = sleepOf(d2), w0 = waterOf(d), wt = waterTarget();

function coachReportText(rep, opts) {

  L.push('SUMMARY', `- Readiness: ${a.readiness != null ? `${a.readiness} avg over ${a.rdays} scored days` : 'not enough data'}`);
  L.push(`- Sleep: ${a.sleep != null ? `${fmtH(a.sleep)} avg, ${a.goalNights}/${a.snights} nights at the ${st.sleepGoal} h goal${a.bedSd != null ? `, bedtime varies ±${a.bedSd} min` : ''}` : 'not logged'}`);
  L.push(`- Training: ${a.sessions} sessions, load ${a.load}, ${a.hard} at RPE 7+, ${a.games} game(s), ${a.rest} rest day(s)`);
  if (opts.nutrition) L.push(`- Nutrition (logged days): ${a.ndays}/7 days logged${a.protein != null ? `, protein ${a.protein} g avg${a.pTarget ? ` (target ${a.pTarget})` : ''}` : ''}${a.water != null ? `, water ${a.water} oz avg` : ''}`);
  L.push(`- Soreness: ${a.sore != null ? `${a.sore}/10 avg` : 'not logged'}${a.topAreas.length ? `; most often ${a.topAreas.map((x) => `${x.name} (${x.days} days)`).join(', ')}` : ''}`);
  L.push(`- Recovery work: ${a.protos} protocol(s), ${a.protoMin} min`, '');
  if (rep.imp.length) { L.push('IMPROVEMENTS', ...rep.imp.map((x) => '- ' + x), ''); }
  if (rep.att.length) { L.push('NEEDS ATTENTION', ...rep.att.map((x) => '- ' + x), ''); }
  if (rep.recs.length) { L.push('PLAN FOR NEXT WEEK', ...rep.recs.map((x) => '- ' + x), ''); }
  if (opts.injuries) { const inj = injuries().filter((e) => e.status !== 'resolved' || (e.resolvedAt && e.resolvedAt >= rep.monday)); if (inj.length) { L.push('INJURY LOGS (athlete-reported)'); for (const e of inj) { const last = (e.logs || []).slice(-1)[0]; L.push(`- ${e.title} (${areaName(e.key)}), since ${fmtD(e.start)}: ${INJ_STATUS.find((s) => s[0] === e.status)[1]}${last ? `; last pain ${last.rest ?? '—'} at rest, ${last.activity ?? '—'} with activity (${fmtD(last.date)})` : ''}${e.clearance ? `; athlete recorded clearance by ${e.clearance.by} on ${fmtD(e.clearance.date)}` : ''}`); } L.push(''); } }

}

// ---------- readiness gauge context (previous day + weekly average) ----------
function gaugeContextHtml(date = todayIso()) {
  const r = readinessScore(date), y = readinessScore(shiftIso(date, -1)), wk = lastNDays(7, shiftIso(date, -1)).map(readinessScore).filter(nn);
  const chip = (lbl, v, d) => `<div style="background:var(--bg-2);border-radius:10px;padding:6px 10px;min-width:0"><div class="tiny muted">${lbl}</div><b class="num">${v ?? '—'}</b>${d != null ? ` <span class="tiny ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'}${Math.abs(d)}</span>` : ''}</div>`;
  return `<div class="row" style="gap:6px;margin-top:2px">${chip('Yesterday', y, r != null && y != null ? r - y : null)}${chip('7-day avg', wk.length ? Math.round(mean(wk)) : null, r != null && wk.length ? r - Math.round(mean(wk)) : null)}${chip('Days scored (7)', wk.length)}</div>`;
}

// ---------- radar ----------
function radarSvg(axes, series, size = 260) {
  const c = size / 2, R = size / 2 - 38, n = axes.length, ang = (i) => -Math.PI / 2 + (i * 2 * Math.PI) / n;
  const pt = (i, v) => [c + Math.cos(ang(i)) * R * (v / 100), c + Math.sin(ang(i)) * R * (v / 100)];
  let s = `<svg viewBox="0 0 ${size} ${size}" style="width:100%;max-width:${size + 40}px;display:block;margin:auto">`;
  for (const lv of [25, 50, 75, 100]) s += `<polygon points="${axes.map((_, i) => pt(i, lv).join(',')).join(' ')}" fill="none" stroke="var(--line-2)" stroke-dasharray="${lv === 100 ? '' : '2 3'}"/>`;
  axes.forEach((a, i) => { const [x, y] = pt(i, 100), [lx, ly] = pt(i, 122); s += `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)"/><text x="${lx}" y="${ly + 4}" text-anchor="middle" style="font:600 10.5px var(--f-b);fill:${a.miss ? 'var(--faint)' : 'var(--fg-2)'}">${esc(a.label)}</text>`; });
  for (const se of series) {
    const pts = se.values.map((v, i) => (nn(v) ? pt(i, v) : pt(i, 0)));
    s += `<polygon points="${pts.map((p) => p.join(',')).join(' ')}" fill="${se.color}" fill-opacity="${se.fill ?? 0.18}" stroke="${se.color}" stroke-width="2" ${se.dash ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round"/>`;
    se.values.forEach((v, i) => { if (nn(v)) { const [x, y] = pt(i, v); s += `<circle cx="${x}" cy="${y}" r="3.2" fill="${se.color}"><title>${esc(axes[i].label)}: ${v}</title></circle>`; } });
  }
  return s + '</svg>';
}
function radarCardHtml(date = todayIso()) {
  const r = readinessFor(date), prev = lastNDays(7, shiftIso(date, -1)).map(readinessFor);
  const avg = COMP.map(([k]) => { const v = prev.map((p) => p.comps.find((c) => c.k === k).score).filter(nn); return v.length >= 3 ? Math.round(mean(v)) : null; });
  const axes = r.comps.map((c) => ({ label: c.label === 'Training load' ? 'Load' : c.label, miss: c.score == null }));
  const best = r.comps.filter((c) => c.score != null).sort((a, b) => b.score - a.score), lo = best.slice(-1)[0], hi = best[0];
  return `<section class="card"><div class="ch"><div><h3>Recovery radar</h3><span class="sub">Six components today vs your 7-day average · missing axes sit at the center and are grayed</span></div></div>
    ${best.length >= 3 ? radarSvg(axes, [{ name: '7-day avg', color: 'var(--violet)', values: avg, dash: true, fill: 0.05 }, { name: 'Today', color: 'var(--em)', values: r.comps.map((c) => c.score) }]) + `<div class="legend" style="justify-content:center"><span><i style="--c:var(--em)"></i>Today</span><span><i style="--c:var(--violet)"></i>7-day average</span></div><p class="small" style="text-align:center;margin-top:6px">Strongest: <b>${esc(hi.label)}</b> (${hi.score}) · weakest: <b>${esc(lo.label)}</b> (${lo.score})</p>` : empty('Needs 3+ components', 'Log sleep, a check-in and soreness to see your shape.', 'pulse')}</section>`;
}

// ---------- trend timeline with overlays ----------
let trendOv = { sleep: true, fatigue: false, load: false, soreness: false };
function trendCardHtml() { return `<section class="card"><div class="ch"><div><h3>Recovery trend</h3><span class="sub">Readiness with overlays · overlays scaled 0-100, real values in the readout</span></div><div class="seg" id="tr-rng">${[7, 30, 90].map((n) => `<button data-n="${n}" class="${(viewArg?.trend || 30) === n ? 'on' : ''}">${n}d</button>`).join('')}</div></div>
  <div class="row" style="margin-bottom:8px" id="tr-ov">${[['sleep', 'Sleep', 'var(--blue)'], ['fatigue', 'Fatigue', 'var(--amber)'], ['load', 'Training load', 'var(--violet)'], ['soreness', 'Soreness', 'var(--pink)']].map(([k, l, c]) => `<button class="chip ${trendOv[k] ? 'on' : ''}" data-ov="${k}" style="${trendOv[k] ? `color:${c};background:color-mix(in srgb, ${c} 15%, transparent)` : ''}">${l}</button>`).join('')}</div><div class="chart" id="tr-c"></div></section>`; }
function drawTrend(el) {
  const n = viewArg?.trend || 30, days = lastNDays(n), st = settings();
  const sl = days.map(sleepH), fa = days.map((d) => checkOf(d)?.fatigue ?? null), ld = days.map((d) => (perm().training ? loadOf(d) : null)), so = days.map(soreAvg), mx = Math.max(1, ...ld.filter(nn));
  const series = [{ name: 'Readiness', color: 'var(--em)', values: days.map(readinessScore), area: true, width: 2.6 }];
  if (trendOv.sleep) series.push({ name: 'Sleep', color: 'var(--blue)', values: sl.map((h) => (h == null ? null : Math.min(120, Math.round((h / st.sleepGoal) * 100)))), tip: sl.map((h) => (h == null ? '—' : fmtH(h))), noDots: n > 30 });
  if (trendOv.fatigue) series.push({ name: 'Fatigue', color: 'var(--amber)', values: fa.map((f) => (f == null ? null : Math.round(((f - 1) / 4) * 100))), tip: fa.map((f) => (f == null ? '—' : f + '/5')), dash: true });
  if (trendOv.load) series.push({ name: 'Load', color: 'var(--violet)', values: ld.map((l) => (l == null ? null : Math.round((l / mx) * 100))), tip: ld.map((l) => (l == null ? '—' : String(l))), noDots: true });
  if (trendOv.soreness) series.push({ name: 'Soreness', color: 'var(--pink)', values: so.map((v) => (v == null ? null : v * 10)), tip: so.map((v) => (v == null ? '—' : v + '/10')), dash: true });
  lineChart($('#tr-c', el), { labels: days, series, yMin: 0, yMax: 120, h: 210 });
  $('#tr-rng', el).onclick = (e) => { const b = e.target.closest('[data-n]'); if (b) { viewArg = { ...(viewArg || {}), trend: Number(b.dataset.n) }; render(); } };
  $('#tr-ov', el).onclick = (e) => { const b = e.target.closest('[data-ov]'); if (b) { trendOv[b.dataset.ov] = !trendOv[b.dataset.ov]; render(); } };
}

// ---------- calendar heatmap (52 weeks) ----------
function calHeatHtml() {
  const t = todayIso(), end = shiftIso(mondayOf(t), 6), start = shiftIso(mondayOf(t), -51 * 7), days = rangeDays(start, end);
  const stored = doc('rl-ready').days || {};
  const val = (d) => (d > t ? undefined : stored[d]?.score ?? readinessScore(d));
  const col = (v) => (v === undefined ? 'transparent' : v == null ? 'var(--card-3)' : v >= 80 ? '#2fd29b' : v >= 65 ? '#6f93ff' : v >= 50 ? '#f2b350' : '#ff6b6b');
  const scored = days.map(val).filter(nn), weeks = [];
  for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));
  let months = ''; weeks.forEach((w, i) => { if (parseIso(w[0]).getDate() <= 7) months += `<span style="grid-column:${i + 2}" class="tiny faint">${MON[parseIso(w[0]).getMonth()]}</span>`; });
  return `<section class="card"><div class="ch"><div><h3>Readiness calendar</h3><span class="sub">Past 52 weeks · ${scored.length} scored days${scored.length ? ` · average ${Math.round(mean(scored))}` : ''} · tap a day</span></div></div>
    <div class="scroll-x" id="ch-scroll"><div style="display:grid;grid-template-columns:22px repeat(${weeks.length}, 13px);grid-auto-rows:13px;gap:3px;min-width:${weeks.length * 16 + 30}px">${months}${[0, 1, 2, 3, 4, 5, 6].map((r) => `<span class="tiny faint" style="grid-column:1;grid-row:${r + 2};line-height:13px">${['M', '', 'W', '', 'F', '', ''][r]}</span>${weeks.map((w, c) => { const d = w[r], v = val(d); return `<button data-rd="${d}" title="${fmtDL(d)}: ${v == null ? 'no score' : v}" aria-label="${fmtDL(d)} ${v ?? 'no score'}" style="grid-column:${c + 2};grid-row:${r + 2};width:13px;height:13px;border-radius:3px;border:${d === t ? '1.5px solid var(--fg)' : '0'};padding:0;background:${col(v)};cursor:${v === undefined ? 'default' : 'pointer'}" ${v === undefined ? 'disabled' : ''}></button>`; }).join('')}`).join('')}</div></div>
    <div class="legend"><span><i style="--c:var(--card-3)"></i>No score</span><span><i style="--c:#ff6b6b"></i>&lt;50</span><span><i style="--c:#f2b350"></i>50-64</span><span><i style="--c:#6f93ff"></i>65-79</span><span><i style="--c:#2fd29b"></i>80+</span></div></section>`;
}

// ---------- basketball workload breakdown (stacked weekly) ----------
const WL_CATS = [['Games', '#ff7a45', (x) => x.type === 'game'], ['Practices', '#6f93ff', (x) => x.type === 'practice'], ['Shooting & skills', '#2fd29b', (x) => ['shooting', 'handles', 'finishing', 'skill'].includes(x.type)], ['Lifting', '#a48bff', (x) => x.type === 'lift'], ['Conditioning & jumps', '#f2b350', (x) => ['conditioning', 'speed', 'run', 'bike'].includes(x.type)], ['Recovery & other', '#64748b', () => true]];
const wlCat = (x) => WL_CATS.findIndex((c) => c[2](x));
function workloadCardHtml() { return `<section class="card"><div class="ch"><div><h3>Basketball workload breakdown</h3><span class="sub">Weekly load by activity · 12 weeks</span></div><div class="seg" id="wl-m"><button data-m="load" class="${(viewArg?.wl || 'load') === 'load' ? 'on' : ''}">Load</button><button data-m="mins" class="${viewArg?.wl === 'mins' ? 'on' : ''}">Minutes</button></div></div><div class="chart" id="wl-c"></div><div class="legend">${WL_CATS.map(([l, c]) => `<span><i style="--c:${c}"></i>${l}</span>`).join('')}</div></section>`; }
function drawWorkload(el) {
  const m = viewArg?.wl || 'load', weeks = [...Array(12)].map((_, i) => shiftIso(mondayOf(todayIso()), -7 * (11 - i)));
  barChart($('#wl-c', el), { bars: weeks.map((w) => { const ss = sessionsIn(rangeDays(w, shiftIso(w, 6)).filter((d) => d <= todayIso())), vals = WL_CATS.map((_, i) => sum(ss.filter((x) => wlCat(x) === i).map((x) => (m === 'load' ? x.load : Number(x.mins) || 0)))); return { label: fmtD(w), segs: WL_CATS.map(([, c], i) => ({ v: vals[i], color: c })), tip: `<b>Week of ${fmtD(w)}</b> · ${WL_CATS.map(([l], i) => (vals[i] ? `${l} ${vals[i]}` : '')).filter(Boolean).join(' · ') || 'no sessions'}` }; }), h: 200, xfmt: (l) => l.split(' ')[1] ? l : l });
  $('#wl-m', el).onclick = (e) => { const b = e.target.closest('[data-m]'); if (b) { viewArg = { ...(viewArg || {}), wl: b.dataset.m }; render(); } };
}

// ---------- training load vs recovery (with flagged periods) ----------
function loadVsRecovery(days) {
  const l7 = days.map((d) => sum(lastNDays(7, d).map(loadOf))), r7 = days.map((d) => { const v = lastNDays(7, d).map(readinessScore).filter(nn); return v.length >= 3 ? mean(v) : null; });
  const flags = days.map((d, i) => { if (i < 7) return false; const lp = l7[i - 7], rp = r7[i - 7]; return lp > 150 && l7[i] > lp * 1.15 && r7[i] != null && rp != null && r7[i] <= rp - 5; });
  const periods = []; flags.forEach((f, i) => { if (f) { const last = periods[periods.length - 1]; if (last && last[1] === i - 1) last[1] = i; else periods.push([i, i]); } });
  return { l7, r7, flags, periods };
}
function lvrCardHtml() { return `<section class="card"><div class="ch"><div><h3>Training load vs recovery</h3><span class="sub">7-day load and 7-day readiness, synced · shaded = load rising while readiness falls</span></div></div><div class="chart" id="lvr-c"></div><div class="legend"><span><i style="--c:var(--amber)"></i>7-day load</span><span><i style="--c:var(--em)"></i>7-day readiness</span><span><i style="--c:rgba(255,107,107,.35)"></i>Watch period</span></div><p class="small" id="lvr-n" style="margin-top:6px"></p></section>`; }
function drawLvr(el) {
  const days = lastNDays(70), a = loadVsRecovery(days), mx = Math.max(1, ...a.l7);
  const host = $('#lvr-c', el);
  lineChart(host, { labels: days, series: [{ name: '7-day load', color: 'var(--amber)', values: a.l7.map((v) => Math.round((v / mx) * 100)), tip: a.l7.map(String), noDots: true, area: true }, { name: 'Readiness (7d)', color: 'var(--em)', values: a.r7.map((v) => (v == null ? null : Math.round(v))), noDots: true, width: 2.6 }], yMin: 0, yMax: 100, h: 200 });
  const svg = host.querySelector('svg'); if (svg && a.periods.length) { const W = svg.viewBox.baseVal.width, X = (i) => 34 + (i * (W - 44)) / (days.length - 1); svg.insertAdjacentHTML('afterbegin', a.periods.map(([s, e]) => `<rect x="${X(s) - 3}" y="12" width="${Math.max(6, X(e) - X(s) + 6)}" height="166" fill="rgba(255,107,107,.12)" rx="4"/>`).join('')); }
  $('#lvr-n', el).innerHTML = a.periods.length ? `${plural(a.periods.length, 'watch period')} in 10 weeks (most recent ${fmtD(days[a.periods[a.periods.length - 1][0]])}–${fmtD(days[a.periods[a.periods.length - 1][1]])}). A sign to plan easier days, not a prediction.` : a.r7.some(nn) ? '<span class="muted">No periods where load rose 15%+ while readiness fell 5+ points.</span>' : '<span class="muted">Needs readiness scores and training history.</span>';
}

// ---------- left vs right butterfly ----------
function lrButterflyHtml(metricK = 'soreness') {
  const t = todayIso(), from = shiftIso(t, -29), recs = bodyRecs().filter((r) => r.date >= from);
  const mob = (doc('rl-body').mobility || []).slice().sort((a, b) => b.at - a.at)[0];
  const rows = AREAS.filter((a) => a[3]).map(([id, l]) => {
    const v = (s) => { const x = recs.filter((r) => r.key === `${id}:${s}`).map((r) => (metricK === 'mobility' ? r.mobility : r[metricK])).filter(nn); return x.length ? r1(mean(x)) : null; };
    return { id, l, L: v('L'), R: v('R') };
  }).filter((x) => x.L != null || x.R != null);
  const max = metricK === 'mobility' ? 5 : 10;
  const bar = (v, side) => `<div style="display:flex;justify-content:${side === 'L' ? 'flex-end' : 'flex-start'};align-items:center;gap:6px">${side === 'R' ? '' : `<span class="tiny num">${v ?? '—'}</span>`}<div style="height:12px;border-radius:${side === 'L' ? '6px 2px 2px 6px' : '2px 6px 6px 2px'};width:${v == null ? 0 : (v / max) * 100}%;max-width:100%;background:${metricK === 'mobility' ? 'var(--blue)' : heatColor(v)}"></div>${side === 'R' ? `<span class="tiny num">${v ?? '—'}</span>` : ''}</div>`;
  const tests = mob ? MOB_TESTS.filter((m) => m[3] && (mob.tests?.[m[0] + 'L'] != null || mob.tests?.[m[0] + 'R'] != null)) : [];
  return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="tiny muted">Left ◂ · ▸ Right · 30-day average</span><div class="seg" id="lr-m">${[['soreness', 'Soreness'], ['tightness', 'Tightness'], ['mobility', 'Mobility']].map(([k, l]) => `<button data-k="${k}" class="${metricK === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    ${rows.length ? `<div style="display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);gap:6px 8px;align-items:center">${rows.map((r) => `${bar(r.L, 'L')}<span class="small" style="text-align:center">${r.l}${r.L != null && r.R != null && Math.abs(r.L - r.R) >= (metricK === 'mobility' ? 1 : 2) ? ' <span class="warnc">●</span>' : ''}</span>${bar(r.R, 'R')}`).join('')}</div><p class="tiny muted" style="margin-top:8px"><span class="warnc">●</span> = sides differ by ${metricK === 'mobility' ? '1+ point' : '2+ points'}.${metricK === 'mobility' ? ' Mobility is your 1-5 "how well does it move" rating (higher is better).' : ''}</p>` : `<p class="small muted">No ${metricK} ratings for both sides in 30 days.</p>`}
    ${tests.length ? `<div class="divider"></div><div class="small muted" style="margin-bottom:6px">Latest mobility test (${fmtD(mob.date)})</div><div style="display:grid;grid-template-columns:minmax(0,1fr) 120px minmax(0,1fr);gap:6px 8px;align-items:center">${tests.map(([k, l]) => { const L = mob.tests[k + 'L'], R = mob.tests[k + 'R'], mx = Math.max(L || 0, R || 0, 1); return `<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px"><span class="tiny num">${L ?? '—'}</span><div style="height:10px;border-radius:5px 2px 2px 5px;width:${((L || 0) / mx) * 100}%;background:var(--blue)"></div></div><span class="tiny" style="text-align:center">${esc(l)}</span><div style="display:flex;align-items:center;gap:6px"><div style="height:10px;border-radius:2px 5px 5px 2px;width:${((R || 0) / mx) * 100}%;background:var(--blue)"></div><span class="tiny num">${R ?? '—'}</span></div>`; }).join('')}</div>` : ''}`;
}

// ---------- sleep consistency (floating bars with target lines) ----------
function sleepBarsHtml() { return `<section class="card"><div class="ch"><div><h3>Sleep consistency</h3><span class="sub">Each bar runs from bedtime to wake · dashed = your targets</span></div><span class="num" id="sb-score" style="font-size:22px;font-weight:700"></span></div><div class="chart" id="sb-c"></div></section>`; }
function drawSleepBars(el, n = 14) {
  const host = $('#sb-c', el); if (!host) return;
  const days = lastNDays(n), N = doc('rl-sleep').nights || {}, st = settings(), W = chartW(host), h = 230, padL = 44, padR = 10, padT = 10, padB = 22;
  const off = (t) => { let m = toMin(t); m -= 18 * 60; if (m < 0) m += 1440; return m; }; // minutes after 6 pm
  const vals = days.map((d) => (N[d]?.bed && N[d]?.wake ? [off(N[d].bed), off(N[d].wake)] : null)).map((v) => (v && v[1] < v[0] ? [v[0], v[1] + 1440] : v));
  const all = vals.filter(Boolean).flat().concat([off(st.bedTarget), off(st.wakeTarget)]);
  let lo = Math.floor((Math.min(...all) - 30) / 60) * 60, hi = Math.ceil((Math.max(...all) + 30) / 60) * 60;
  const Y = (m) => padT + ((m - lo) / (hi - lo)) * (h - padT - padB), X = (i) => padL + ((i + 0.5) * (W - padL - padR)) / n, bw = Math.min(26, ((W - padL - padR) / n) * 0.55);
  let s = `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">`;
  for (let m = lo; m <= hi; m += 120) s += `<line class="gl" x1="${padL}" x2="${W - padR}" y1="${Y(m)}" y2="${Y(m)}"/><text class="ax" x="${padL - 6}" y="${Y(m) + 3}" text-anchor="end">${fmtClock(minToClock(m + 18 * 60))}</text>`;
  for (const [t0, lbl] of [[off(st.bedTarget), 'bed'], [off(st.wakeTarget), 'wake']]) s += `<line x1="${padL}" x2="${W - padR}" y1="${Y(t0)}" y2="${Y(t0)}" stroke="var(--em)" stroke-dasharray="4 4" opacity=".7"/><text class="ax" x="${W - padR}" y="${Y(t0) - 4}" text-anchor="end" style="fill:var(--em)">${lbl} ${fmtClock(lbl === 'bed' ? st.bedTarget : st.wakeTarget)}</text>`;
  vals.forEach((v, i) => { if (!v) { s += `<rect x="${X(i) - bw / 2}" y="${padT}" width="${bw}" height="${h - padT - padB}" rx="5" fill="none" stroke="var(--line)" stroke-dasharray="2 3"/>`; return; } const dev = Math.abs(v[0] - off(st.bedTarget)); s += `<rect x="${X(i) - bw / 2}" y="${Y(v[0])}" width="${bw}" height="${Y(v[1]) - Y(v[0])}" rx="5" fill="${days[i] === todayIso() ? 'var(--blue)' : dev <= 30 ? 'rgba(111,147,255,.7)' : 'rgba(133,144,160,.55)'}"/>`; });
  days.forEach((d, i) => { if (n <= 14 || i % 2 === 0) s += `<text class="ax" x="${X(i)}" y="${h - 6}" text-anchor="middle">${n <= 7 ? DOW[parseIso(d).getDay()] : parseIso(d).getDate()}</text>`; });
  s += `<line class="cursor" x1="0" x2="0" y1="${padT}" y2="${h - padB}" style="opacity:0"/></svg><div class="rd"></div>`;
  host.innerHTML = vals.some(Boolean) ? s : '<div class="empty small" style="padding:30px 0">Log bedtimes and wake times to see this chart</div>';
  if (vals.some(Boolean)) attachHover(host, days.map((_, i) => X(i)), W, padL, padR, (i) => vals[i] ? `<b>${fmtDL(days[i])}</b> · ${fmtClock(N[days[i]].bed)} → ${fmtClock(N[days[i]].wake)} · ${fmtH(N[days[i]].asleepH)}` : `<b>${fmtDL(days[i])}</b> · not logged`);
  const c = sleepConsistency(todayIso(), n); $('#sb-score', el).innerHTML = c ? `${c.score}<small class="muted" style="font-size:12px">/100</small>` : '';
}

// ---------- sleep stages (only when an imported source provides them) ----------
const STAGES = [['awake', 'Awake', '#ff8a7a'], ['rem', 'REM', '#a48bff'], ['light', 'Light', '#6f93ff'], ['deep', 'Deep', '#3b4fd8']];
function stagesHtml() {

function goalWeek(g, monday) {

const PHASES = [['preseason', 'Preseason', '#6f93ff'], ['inseason', 'In-season', '#ff7a45'], ['postseason', 'Postseason', '#a48bff'], ['offseason', 'Off-season', '#2fd29b']];

function phaseStats(s) {
  const end = s.end < todayIso() ? s.end : todayIso(), ds = s.start <= end ? rangeDays(s.start, end) : [], wks = Math.max(1, ds.length / 7);
  const v = (fn) => { const x = ds.map(fn).filter(nn); return x.length ? mean(x) : null; };
  const ss = sessionsIn(ds);
  return { days: ds.length, readiness: v(readinessScore), sleep: v(sleepH), sore: v(soreAvg), energy: v((d) => checkOf(d)?.energy ?? null), load: perm().training ? sum(ss.map((x) => x.load)) / wks : null, games: ss.filter((x) => x.type === 'game').length, sessions: ss.length / wks, protoDays: ds.filter((d) => protoMins(d) > 0).length / wks, injuries: (doc('rl-inj').episodes || []).filter((e) => e.start >= s.start && e.start <= s.end).length, scored: ds.filter((d) => readinessScore(d) != null).length };

let dict = null;
async function initDictation() { try { dict = window.claude?.use ? await claude.use('dictation') : null; } catch { dict = null; } }
function micBtn(targetSel) { return dict ? `<button type="button" class="btn ghost" data-mic="${targetSel}" aria-label="Speak instead of typing" title="Speak">${ic('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>')}</button>` : ''; }
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-mic]'); if (!b || !dict) return;
  const inp = document.querySelector(b.dataset.mic); if (!inp) return;
  if (b.dataset.on === '1') { dict.stop().catch(() => {}); return; }
  const base = inp.value ? inp.value.trim() + ' ' : ''; let finals = '';
  dict.onPartial?.(({ text }) => { inp.value = base + finals + text; });
  dict.onFinal?.(({ text }) => { finals += text + ' '; inp.value = (base + finals).trimEnd(); });
  dict.onState?.(({ state }) => { const on = state === 'listening'; b.dataset.on = on ? '1' : ''; b.style.color = on ? 'var(--red)' : ''; if (!on) inp.focus(); });
  dict.start().catch((err) => { if (err?.code === 'not_granted') { dict = null; b.remove(); } toast('Voice input isn\'t available. Type instead.'); });
});

document.addEventListener('click', (e) => {

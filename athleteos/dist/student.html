<style>/* Athlete suite: the app switcher, identical on every page. Uses each page's own tokens (--fg, --muted, --surface…). */
.suite { position: relative; display: inline-flex; min-width: 0; z-index: 30; }
.suite-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 6px 4px 0; border-radius: 12px; font: 700 18px/1.1 var(--f-display); letter-spacing: -.2px; min-width: 0; }
.suite-btn .suite-name { white-space: nowrap; }
.suite-btn .suite-name i { font-style: normal; color: var(--suite-c); }
.suite-btn svg { color: var(--muted); flex: none; transition: transform .15s; }
.suite-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.suite-btn:focus-visible { outline: 2px solid var(--suite-c); outline-offset: 2px; }
.suite-mark { width: 26px; height: 26px; border-radius: 8px; flex: none; background: linear-gradient(135deg, var(--suite-c), color-mix(in srgb, var(--suite-c) 55%, #7c3aed)); box-shadow: 0 6px 16px -8px var(--suite-c); position: relative; }
.suite-mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); }
.suite-menu { position: absolute; left: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .45); }
.suite-head { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 6px; }
.suite-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; color: var(--fg); text-decoration: none; }
.suite-item:hover, .suite-item:focus-visible { background: var(--surface-2); outline: none; }
.suite-item i { width: 10px; height: 34px; border-radius: 5px; background: var(--c); flex: none; }
.suite-item span { min-width: 0; flex: 1; }
.suite-item b { display: block; font: 600 15px var(--f-body); }
.suite-item small { display: block; color: var(--muted); font: 400 12.5px/1.3 var(--f-body); }
.suite-item em { font: 600 11px var(--f-body); font-style: normal; color: var(--c); }
.suite-item.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
.suite-item.going { opacity: .6; }

.suite { --surface: var(--panel); --surface-2: var(--raised); }
#suite-host-side { padding: 4px 4px 18px; }
.sl-top-suite { display: none; }
@media (max-width: 960px) { .sl-top-suite { display: flex; flex: none; } .sl-top-suite .suite-name { display: none; } }</style>

<script>
// ===================== Athlete suite: shared across every page of the bundle =====================
// One app switcher (the app's name, top-left, on every page), one theme setting, one list of apps.
// Each page calls Suite.mount(el, '<app id>', beforeLeave) — beforeLeave saves pending changes before navigating.
(function () {
  const APPS = [
    { id: 'hub', name: 'Hub', plain: 'Hub', href: 'index.html', desc: 'Every app in one place: your day, alerts and graphs', color: '#14b8a6' },
    { id: 'aos', name: 'Athlete<i>OS</i>', plain: 'Athlete OS', href: 'athlete.html', desc: 'Training, performance, load and the Lab', color: '#3d8bff' },
    { id: 'rl', name: 'Recovery<i>Lens</i>', plain: 'Recovery Lens', href: 'recovery.html', desc: 'Readiness, sleep, soreness and recovery', color: '#2fd29b' },
    { id: 'gp', name: 'Game<i>plan</i>', plain: 'Gameplan', href: 'gameplan.html', desc: 'Your day hour by hour, Top 3, night routine', color: '#22c55e' },
    { id: 'school', name: 'Student<i>Lens</i>', plain: 'Student Lens', href: 'student.html', desc: 'Classes, assignments, grades, studying and exams', color: '#6d7cff' },
    { id: 'btc', name: 'Training<i>Center</i>', plain: 'Training Center', href: 'btc.html', desc: 'Drills, workouts and running your sessions', color: '#f97316' },
    { id: 'ml', name: 'Macro<i>Lens</i>', plain: 'MacroLens', href: 'macrolens.html', desc: 'Food, macros, water and game-day fuel', color: '#eab308' },
  ];
  const THEME_KEY = 'macrolens-theme';
  function theme() {
    let c = 'dark'; try { c = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
    if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c); else document.documentElement.removeAttribute('data-theme');
  }
  const chev = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  function mount(el, current, beforeLeave) {
    if (!el) return;
    const me = APPS.find((a) => a.id === current) || APPS[0];
    el.classList.add('suite');
    el.style.setProperty('--suite-c', me.color);
    el.innerHTML = `<button type="button" class="suite-btn" aria-haspopup="menu" aria-expanded="false" aria-label="${me.plain}: switch app"><span class="suite-mark" aria-hidden="true"></span><span class="suite-name">${me.name}</span>${chev}</button>
      <div class="suite-menu" role="menu" hidden><div class="suite-head">Your apps · same data</div>${APPS.map((a) => `<a role="menuitem" class="suite-item${a.id === me.id ? ' on' : ''}" href="${a.href}" data-suite="${a.id}" style="--c:${a.color}" ${a.id === me.id ? 'aria-current="page"' : ''}><i></i><span><b>${a.plain}</b><small>${a.desc}</small></span>${a.id === me.id ? '<em>Here</em>' : ''}</a>`).join('')}</div>`;
    const btn = el.querySelector('.suite-btn'), menu = el.querySelector('.suite-menu');
    const set = (open) => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('.suite-item:not(.on)')?.focus(); };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(menu.hidden); });
    document.addEventListener('click', (e) => { if (!el.contains(e.target)) set(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { set(false); btn.focus(); } });
    menu.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-suite]'); if (!a) return;
      e.preventDefault(); e.stopPropagation();
      if (a.dataset.suite === me.id) return set(false);
      a.classList.add('going');
      try { await Promise.race([Promise.resolve(beforeLeave?.()), new Promise((r) => setTimeout(r, 2500))]); } catch {}
      location.href = a.getAttribute('href');
    });
  }
  window.Suite = { APPS, mount, theme, THEME_KEY };
})();

</script>
<script>
// ===================== Student Lens ↔ Hub bridge =====================
// Loaded after Student Lens's own scripts and before its app.js (vendor/student-lens, unchanged).
// 1. App switcher in the header (saves before leaving).
// 2. Account sync: the whole Student Lens state (minus uploaded file bodies) is kept in doc "sl-data", so it follows you
//    across devices. On open, the newer of this device and the account wins.
// 3. Publishes doc "life-school" { classes, items, grades, snaps, gpa, sl:true } so Hub, Athlete OS and Gameplan see your
//    classes, due work and grades (CONTRACT.md). Student Lens owns both docs.
// 4. Downloads (backup, reports) go through the Claude downloads capability, since plain file links are blocked here.
(function () {
  const lsJ = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };
  const lsW = (k, v) => { try { localStorage.setItem('ml:' + k, JSON.stringify(v)); } catch {} };
  const LOCAL_AT = 'sl:updatedAt';
  const localAt = () => { try { return Number(localStorage.getItem(LOCAL_AT)) || 0; } catch { return 0; } };
  const setLocalAt = (t) => { try { localStorage.setItem(LOCAL_AT, String(t)); } catch {} };
  let coll = null;
  const ready = (async () => {
    if (!window.claude?.use) return null;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) return null;
    coll = db.collection('data/users/' + id); return coll;
  })().catch(() => null);
  const withTimeout = (p, ms) => Promise.race([p, new Promise((r) => setTimeout(() => r(null), ms))]);
  async function writeDoc(k, v) { const c = await ready; if (c) { try { await c.doc(k).set(JSON.parse(JSON.stringify(v))); } catch (e) { console.error(e); } } }

  // ---------- state <-> doc ----------
  function snapshotState() {
    const o = JSON.parse(exportJSON());
    o.docs = (o.docs || []).map(({ data, ...rest }) => ({ ...rest, ...(data ? { onDevice: true } : {}) })); // file bodies stay on the device
    return o;
  }
  const hasData = () => S.classes.length || S.assignments.length || S.exams.length || S.sessions.length || S.decks.length;

  // ---------- life-school projection ----------
  const TYPE_MAP = { homework: 'hw', lab: 'hw', reading: 'hw', test: 'test', quiz: 'quiz', project: 'project', essay: 'essay', other: 'other' };
  const CAT_MAP = { test: 'test', exam: 'test', quiz: 'quiz' };
  const r1 = (x) => (x == null ? null : Math.round(x * 10) / 10);
  function project() {
    const t = today(), g = gpaFor();
    const classes = S.classes.map((c) => { const cg = classGrade(c.id) || {}; return { id: c.id, name: c.name, teacher: c.teacher || '', period: c.period || '', level: c.level || 'regular', color: c.color, core: c.core !== false, active: isActiveClass(c, t), slPct: r1(cg.pct), letter: cg.letter || null }; });
    const items = [
      ...S.assignments.filter((a) => a.due).map((a) => ({ id: a.id, title: a.title, cls: a.classId, type: TYPE_MAP[a.type] || 'other', due: a.due, time: a.dueTime || '', mins: Number(a.estMins) || DEF_MINS[a.type] || 30, done: isDone(a) })),
      ...S.exams.filter((e) => e.date).map((e) => ({ id: e.id, title: e.title, cls: e.classId, type: 'exam', due: e.date, time: e.time || '', mins: 60, done: (e.score != null && e.score !== '') || e.date < t })),
    ];
    const grades = S.classes.flatMap((c) => gradedItems(c.id).map((x) => { const a = x.kind === 'assignment' ? byId('assignments', x.id) : null; return { id: x.id, cls: c.id, title: x.title, cat: x.kind === 'exam' ? 'test' : CAT_MAP[a?.type] || 'hw', score: x.score, max: x.max, date: x.date }; }));
    const snaps = {}; for (const s of S.snapshots || []) if (s.gpa != null) snaps[s.date] = Math.round(s.gpa * 100) / 100;
    if (g) snaps[t] = Math.round(g.unweighted * 100) / 100;
    return { v: 1, sl: true, updated: t, classes, items, grades, snaps, gpa: g ? { unweighted: Math.round(g.unweighted * 100) / 100, weighted: Math.round(g.weighted * 100) / 100 } : null };
  }
  let lastProj = '';
  function publish() {
    try {
      const p = project(), key = JSON.stringify({ ...p, updated: 0 });
      if (key === lastProj) return; lastProj = key;
      lsW('life-school', p); writeDoc('life-school', p);
    } catch (e) { console.error(e); }
  }

  // ---------- sync ----------
  let pushT = null, applying = false;
  async function pushNow() {
    clearTimeout(pushT); pushT = null;
    const at = Date.now(); setLocalAt(at);
    publish();
    await writeDoc('sl-data', { updatedAt: at, state: snapshotState() });
  }
  const _flush = flushSave;
  flushSave = async function () { await _flush(); if (applying) return; clearTimeout(pushT); pushT = setTimeout(pushNow, 1500); };

  const _load = loadAll;
  loadAll = async function () {
    await _load();
    const c = await withTimeout(ready, 8000); if (!c) { publish(); return; }
    try {
      const snap = await withTimeout(c.get(), 8000);
      const d = snap?.docs?.find((x) => x.exists && x.id === 'sl-data'), remote = d ? JSON.parse(JSON.stringify(d.data())) : null;
      if (remote?.state && !validateBackup(remote.state) && (!hasData() || (remote.updatedAt || 0) > localAt())) {
        const bodies = Object.fromEntries((S.docs || []).filter((x) => x.data).map((x) => [x.id, x.data]));
        remote.state.docs = (remote.state.docs || []).map((x) => (bodies[x.id] ? { ...x, data: bodies[x.id] } : x));
        applying = true; importJSON(remote.state); await _flush(); applying = false;
        setLocalAt(remote.updatedAt || Date.now()); publish();
      } else if (hasData()) pushNow();
    } catch (e) { applying = false; console.error(e); publish(); }
  };

  // ---------- downloads ----------
  download = async function (name, text, type = 'text/plain') {
    try { const dl = window.claude?.use ? await claude.use('downloads') : null; if (!dl) throw new Error('none'); await dl.save({ filename: name, data: text }); }
    catch (e) { if (e?.code !== 'declined') toast('Saving files isn’t available here. Use Copy where offered.'); }
  };

  // ---------- switcher ----------
  async function saveNow() { try { await _flush(); if (pushT || !localAt()) await withTimeout(pushNow(), 2500); } catch {} }
  if (window.Suite) for (const id of ['suite-host-side', 'suite-host']) { const el = document.getElementById(id); if (el) Suite.mount(el, 'school', saveNow); }
  window.addEventListener('pagehide', () => { if (pushT) pushNow(); });
  window.SL_SUITE = { project, publish, pushNow, snapshotState };
})();

</script>

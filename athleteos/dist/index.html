<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Athlete OS</title>
<meta name="description" content="Athlete performance headquarters: analytics, basketball shot charts, testing and PRs, recovery, nutrition from MacroLens, and AI coaching.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Athlete OS: the same tokens as MacroLens, so both pages read as one product. */
:root {
  --bg: #eef2fb; --surface: #ffffff; --surface-2: #e6ebf7; --line: #d5ddef;
  --fg: #0b1330; --muted: #5b6687; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #dbe6ff;
  --protein: #3b7dd8; --carbs: #d99a12; --fat: #d2508f; --water: #1f9fd0; --over: #e0662a; --danger: #c93c3c;
  --good: #16a34a; --purple: #7c3aed; --glow: rgba(37, 99, 235, .2); --warn: #d97706;
  --hb: #2563eb; --str: #7c3aed; --cond: #0ea5a4; --oth: #94a3b8;
  --h0: #e3e8f4; --h1: #bcd2ff; --h2: #6ea2ff; --h3: #2563eb; --h4: #7c3aed;
  --scrim: rgba(10, 14, 30, .5); --shadow: rgba(20, 30, 70, .06);
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060a17; --surface: #0d1430; --surface-2: #161f42; --line: #222d57;
    --fg: #eef2ff; --muted: #8e9ac4; --accent: #3d8bff; --accent-soft: #14295c;
    --protein: #4da3ff; --carbs: #ffc23d; --fat: #c77dff; --water: #33d1ff; --over: #ff8a4c; --danger: #ff6b7a;
    --good: #2fd68a; --purple: #8b5cff; --glow: rgba(61, 139, 255, .35); --warn: #ffb547;
    --hb: #3d8bff; --str: #8b5cff; --cond: #2dd4bf; --oth: #64748b;
    --h0: #161f42; --h1: #173a7a; --h2: #2563eb; --h3: #3d8bff; --h4: #9b6bff;
    --scrim: rgba(2, 4, 14, .72); --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060a17; --surface: #0d1430; --surface-2: #161f42; --line: #222d57;
  --fg: #eef2ff; --muted: #8e9ac4; --accent: #3d8bff; --accent-soft: #14295c;
  --protein: #4da3ff; --carbs: #ffc23d; --fat: #c77dff; --water: #33d1ff; --over: #ff8a4c; --danger: #ff6b7a;
  --good: #2fd68a; --purple: #8b5cff; --glow: rgba(61, 139, 255, .35); --warn: #ffb547;
  --hb: #3d8bff; --str: #8b5cff; --cond: #2dd4bf; --oth: #64748b;
  --h0: #161f42; --h1: #173a7a; --h2: #2563eb; --h3: #3d8bff; --h4: #9b6bff;
  --scrim: rgba(2, 4, 14, .72); --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
:root[data-theme="dark"] body, :root:not([data-theme="light"]) body {
  background: radial-gradient(1200px 520px at 50% -180px, rgba(84, 70, 255, .22), transparent 70%), radial-gradient(900px 600px at 110% 30%, rgba(61, 139, 255, .10), transparent 60%), var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 1080px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--danger); }
.flat { color: var(--muted); }

/* header */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
:root[data-theme="dark"] .topbar, :root:not([data-theme="light"]) .topbar { background: rgba(6, 10, 23, .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.3px; white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; box-shadow: 0 6px 18px -6px var(--glow); }
.brand .mark svg { width: 17px; height: 17px; }
.brand i { font-style: normal; color: var(--accent); }
.top-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sync { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"]::before { background: var(--good); box-shadow: 0 0 6px var(--good); }
.sync[data-s="error"]::before { background: var(--over); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; flex: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.icon-btn svg { width: 19px; height: 19px; }
.fuel-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; font-weight: 600; font-size: 13px; text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--accent), var(--purple)); box-shadow: 0 8px 20px -10px var(--glow); white-space: nowrap; }

/* layout */
.view { display: grid; gap: 14px; }
.view[hidden] { display: none !important; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .span2 { grid-column: span 2; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px var(--shadow); min-width: 0; position: relative; }
:root[data-theme="dark"] .card, :root:not([data-theme="light"]) .card { background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0) 40%), var(--surface); border-color: rgba(120, 140, 255, .16); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 12px 30px -18px rgba(0, 0, 0, .8); }
.card.ai { border-color: rgba(139, 92, 255, .45); }
.card.ai::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(139, 92, 255, .16), rgba(61, 139, 255, .06) 55%, transparent); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.section-label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin: 8px 2px -4px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* controls */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--fg); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border-color: transparent; box-shadow: 0 8px 22px -8px var(--glow); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--fg); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px var(--shadow); }
:root[data-theme="dark"] .seg button.on, :root:not([data-theme="light"]) .seg button.on { background: var(--accent); color: #fff; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--fg); font-size: 16px; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
.fields { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fields .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.check input { width: auto; }

/* subnav */
.subnav { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; margin-bottom: -6px; background: var(--bg); scrollbar-width: none; }
:root[data-theme="dark"] .subnav, :root:not([data-theme="light"]) .subnav { background: rgba(6, 10, 23, .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 13px; border-radius: 99px; font-weight: 600; font-size: 13px; cursor: pointer; }
.subnav button.on { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border-color: transparent; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
:root[data-theme="dark"] .tabbar, :root:not([data-theme="light"]) .tabbar { background: rgba(9, 14, 34, .86); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-top-color: rgba(120, 140, 255, .14); }
.tabbar-inner { max-width: 620px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; display: grid; justify-items: center; gap: 3px; cursor: pointer; padding: 4px; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }
.tab.on svg { filter: drop-shadow(0 0 6px var(--glow)); }

/* KPIs */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.kpi b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .delta { font-size: 12px; font-weight: 600; }
.big { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.8px; line-height: 1; font-variant-numeric: tabular-nums; }
.delta-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--surface-2); }
.delta-pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); }
.delta-pill.down { background: color-mix(in srgb, var(--danger) 16%, transparent); }

/* greeting */
.hero { padding: 18px; overflow: hidden; }
.hero h1 { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 139, 255, .35), transparent 70%); pointer-events: none; }
.tagline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.blue { background: var(--accent-soft); color: var(--fg); }

/* rings */
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; align-items: start; }
.ring { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.row > .ring { flex: none; }
.ring-svg { position: relative; }
.ring-svg svg { display: block; transform: rotate(-90deg); }
.ring-svg .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-svg .center b { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.ring .lab { font-size: 12px; font-weight: 600; }
.ring .sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ring circle.fg { transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.chart .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart .hit { cursor: pointer; }
.tip { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%, calc(-100% - 12px)); background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 9px; font-size: 12px; font-weight: 600; white-space: normal; width: max-content; max-width: min(280px, 86vw); box-shadow: 0 8px 20px -6px rgba(0, 0, 0, .5); }
:root[data-theme="dark"] .tip, :root:not([data-theme="light"]) .tip { background: #eef2ff; color: #0b1330; }
.tip small { display: block; font-weight: 500; opacity: .7; font-size: 11px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.latest .big { font-size: 30px; }
.latest small { display: block; color: var(--muted); font-size: 12px; }

/* empty state */
.empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 22px 12px; border: 1px dashed var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.empty .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty .ico svg { width: 22px; height: 22px; }
.empty b { font-family: var(--f-display); font-size: 15px; }
.empty p { color: var(--muted); font-size: 13px; max-width: 34ch; }

/* heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat button { width: 15px; height: 15px; border-radius: 4px; border: 0; padding: 0; background: var(--h0); cursor: pointer; }
.heat button[data-l="1"] { background: var(--h1); }
.heat button[data-l="2"] { background: var(--h2); }
.heat button[data-l="3"] { background: var(--h3); box-shadow: 0 0 6px var(--glow); }
.heat button[data-l="4"] { background: var(--h4); box-shadow: 0 0 8px rgba(139, 92, 255, .6); }
.heat button.future { opacity: .25; cursor: default; }
.heat button.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.heat-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.heat-legend span { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li > div { min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { color: var(--muted); font-size: 12.5px; }
.li .v { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.li-btn { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; color: inherit; padding: 11px 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* PR tiles */
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pr { text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 14px; padding: 12px; cursor: pointer; color: inherit; min-width: 0; }
.pr.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.pr small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.pr b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; margin: 2px 0; }
.pr .none { color: var(--muted); font-size: 13px; font-weight: 600; }

/* court */
.court-wrap { max-width: 520px; margin: 0 auto; }
.court svg { width: 100%; height: auto; display: block; }
.court .zone { cursor: pointer; transition: opacity .2s; }
.court .zone:hover { opacity: .85; }
.court text { font-family: var(--f-display); pointer-events: none; }
.counter { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.counter .btn { padding: 16px; font-size: 16px; }
.make { background: color-mix(in srgb, var(--good) 22%, var(--surface-2)) !important; }
.miss { background: color-mix(in srgb, var(--danger) 18%, var(--surface-2)) !important; }

/* sheets */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; background: var(--surface); color: var(--fg); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .4); }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 22px; } }
dialog.sheet::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet-in { padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 20; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: .25s; max-width: calc(100vw - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* PR celebration */
.celebrate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim); animation: fade .25s; }
.celebrate .box { position: relative; text-align: center; padding: 28px 26px; border-radius: 24px; background: linear-gradient(160deg, #1a2350, #0d1430); color: #fff; box-shadow: 0 0 0 1px rgba(139, 92, 255, .5), 0 20px 60px rgba(61, 139, 255, .45); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); max-width: 320px; }
.celebrate .box .big { font-size: 44px; background: linear-gradient(135deg, #7fb6ff, #c3a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.celebrate .trophy { font-size: 46px; filter: drop-shadow(0 0 16px rgba(255, 200, 80, .7)); animation: bounce 1s ease-in-out infinite alternate; }

// ---- store.js ----
'use strict';
// ===================== storage =====================
// Athlete OS and MacroLens are two pages of one artifact. They share this device's storage (the "ml:" keys) and the
// same private Claude account collection, so a meal logged in MacroLens and a workout logged here are the same records.
// Docs from MacroLens: "core" {profile, targets, overrides, weights, measures, health, prefs...} and "day-YYYY-MM-DD"
// {breakfast, lunch, dinner, snacks, water, exercise, feel, type}. Athlete OS adds "aos", "aos-tests", "aos-shots",
// "aos-games", "aos-body" and "aos-coach".
const cache = {};
let remote = null;
const pending = new Set();
let flushing = false, flushTimer = null, flushPromise = null;
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };

const lsKeys = () => { try { return Object.keys(localStorage).filter((k) => k.startsWith('ml:')).map((k) => k.slice(3)); } catch { return []; } };
const BLANK = {
  core: () => ({ profile: null, targets: null, overrides: {}, custom: [], recents: [], weights: [] }),
  aos: () => ({ profile: {}, customTests: [] }),
  'aos-tests': () => ({ results: [] }),
  'aos-shots': () => ({ sessions: [] }),
  'aos-games': () => ({ games: [] }),
  'aos-body': () => ({ entries: [] }),
  'aos-coach': () => ({ workouts: [], reports: [], chat: [] }),
  'aos-handles': () => ({ sessions: [] }),
  'aos-finish': () => ({ sessions: [] }),
  'aos-film': () => ({ entries: [] }),
  'aos-goals': () => ({ goals: [] }),
  'aos-plan': () => ({ events: [], routines: [], checks: {} }),
  'aos-lib': () => ({ workouts: [], favs: [] }),
};
function doc(key) {
  if (!(key in cache)) cache[key] = lsGet(key) ?? (BLANK[key] ? BLANK[key]() : null);
  return cache[key];
}
const core = () => doc('core');
const aos = () => doc('aos');
const blankDay = () => ({ breakfast: [], lunch: [], dinner: [], snacks: [], water: 0 });
function dayDoc(date, create = false) {
  const k = 'day-' + date;
  if (!doc(k) && create) cache[k] = blankDay();
  return cache[k];
}
function persist(key) {
  lsSet(key, cache[key]);
  if (!remote) return;
  pending.add(key);

  flushTimer = setTimeout(flush, 600);
}

  if (!remote || !pending.size) return Promise.resolve();
  clearTimeout(flushTimer);

    try {
      while (pending.size) {
        const k = pending.values().next().value;
        pending.delete(k);
        await remote.doc(k).set(JSON.parse(JSON.stringify(cache[k])));

  })();

}

  el.textContent = s === 'synced' ? 'Synced' : s === 'error' ? 'Not synced' : s === 'loading' ? 'Syncing…' : 'This device';
  const n = document.getElementById('storage-note');

    ? 'Everything is saved to your Claude account and shared with MacroLens. Only you can see it.'
    : s === 'error' ? 'Saved on this device but could not sync. It will sync on the next save that goes through.'
      : 'Saved in this browser only. Open Athlete OS inside Claude while signed in to sync across devices.';

  const id = user ? await user.id() : null;

// ---- data.js ----
// ===================== nutrition (same math as MacroLens) =====================
const MEALS = [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner'], ['snacks', 'Snacks']];
const ACTIVITY = { sedentary: 1.2, light: 1.375, moderate: 1.55, very: 1.725, athlete: 1.9 };
const GOAL_DELTA = { lose: -400, maintain: 0, gain: 300 };
const entriesOf = (date) => { const d = dayDoc(date); return d ? MEALS.flatMap(([k]) => d[k] || []) : []; };
function totalsOf(date) {

const exList = (date) => dayDoc(date)?.exercise || [];

/** Mirrors MacroLens targets(): base targets, coach overrides, water goal, heavy/long-practice carbs, logged exercise, rest days. */

/** Stacked bars. groups: [{label, segs:[{v,color,name}], tip}] ; opts: h, fmt, goal. Rounded tops on the top segment. */

/** Bars (left axis) with a 0-100 line on the right axis: training load vs readiness. */
function drawCombo(el, days, o = {}) {
  if (!el) return;
  const W = widthOf(el), H = o.h || 220, L = 40, Rm = 34, T = 14, B = 24;
  let hi = Math.max(1, ...days.map((d) => d.bar)); const ticks = niceTicks(0, hi, 4); hi = ticks[ticks.length - 1];
  const slot = (W - L - Rm) / days.length, bw = Math.max(3, Math.min(22, slot * 0.6));
  const ys = (v) => T + (1 - v / hi) * (H - T - B), yr = (v) => T + (1 - v / 100) * (H - T - B), xc = (i) => L + slot * i + slot / 2;
  const line = days.map((d, i) => (d.line == null ? null : [r1(xc(i)), r1(yr(d.line))])).filter(Boolean);
  const every = Math.ceil(days.length / 7);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.label || 'Load and readiness')}">
    <g class="grid">${ticks.map((v) => `<line x1="${L}" x2="${W - Rm}" y1="${r1(ys(v))}" y2="${r1(ys(v))}"/>`).join('')}</g>
    <g class="axis">${ticks.map((v) => `<text x="${L - 6}" y="${r1(ys(v)) + 3.5}" text-anchor="end">${nf(v)}</text>`).join('')}
    ${[0, 50, 100].map((v) => `<text x="${W - Rm + 6}" y="${r1(yr(v)) + 3.5}" fill="var(--good)">${v}</text>`).join('')}
    ${days.map((d, i) => (i % every === 0 || i === days.length - 1 ? `<text x="${r1(xc(i))}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>` : '')).join('')}</g>
    ${days.map((d, i) => { const h = H - B - ys(d.bar); return d.bar ? `<rect x="${r1(xc(i) - bw / 2)}" y="${r1(ys(d.bar))}" width="${r1(bw)}" height="${r1(h)}" rx="${Math.min(5, bw / 2)}" fill="${d.color || 'var(--accent)'}" opacity=".9"/>` : ''; }).join('')}
    ${line.length > 1 ? `<path d="${smoothPath(line)}" fill="none" stroke="var(--good)" stroke-width="2.6"/>` : ''}
    ${line.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="var(--surface)" stroke="var(--good)" stroke-width="2"/>`).join('')}
    ${days.map((d, i) => d.mark ? `<text x="${r1(xc(i))}" y="${T + 4}" text-anchor="middle" font-size="12">${d.mark}</text>` : '').join('')}
    ${days.map((d, i) => `<rect class="hit" x="${r1(L + slot * i)}" y="${T}" width="${r1(slot)}" height="${H - T - B}" fill="transparent" data-tip="${esc(d.tip)}|${esc(d.full)}"/>`).join('')}
  </svg>`;
}

const state = { view: 'home', sub: {} };
const RENDER = {};
function parseHash() {
  let [v, s] = (location.hash.slice(1) || 'home').split(/[-/]/);
  if (v === 'tests') { v = 'train'; s = 'tests'; }
  const view = VIEWS.some((x) => x[0] === v) ? v : 'home';
  state.view = view;
  if (s && SUBS[view]?.some((x) => x[0] === s)) state.sub[view] = s;
}
function go(view, sub) {
  if (view === 'tests') { view = 'train'; sub = 'tests'; }
  const h = '#' + view + (sub ? '-' + sub : '');
  if (location.hash !== h) history.replaceState(null, '', h);
  parseHash(); render(); window.scrollTo(0, 0);
}
const subOf = (v) => state.sub[v] || SUBS[v]?.[0][0];
function render() {
  // Only the active screen keeps content, so element ids are never duplicated.
  for (const [v] of VIEWS) { const x = $('#view-' + v); x.hidden = v !== state.view; if (x.hidden) x.innerHTML = ''; }
  $$('.tab').forEach((t) => { const on = t.dataset.view === state.view; t.classList.toggle('on', on); t.setAttribute('aria-current', on ? 'page' : 'false'); });
  const el = $('#view-' + state.view);
  const subs = SUBS[state.view];
  const nav = subs ? `<nav class="subnav" aria-label="Sections">${subs.map(([k, l]) => `<button type="button" data-sub="${k}" class="${k === subOf(state.view) ? 'on' : ''}">${l}</button>`).join('')}</nav>` : '';
  el.innerHTML = nav + `<div class="view" id="vbody"></div>`;
  try { RENDER[state.view]($('#vbody', el), subOf(state.view)); } catch (err) { console.error(err); $('#vbody', el).innerHTML = `<div class="card"><b>Something went wrong drawing this screen.</b><p class="muted small">${esc(err.message)}</p></div>`; }

  $('.subnav .on', el)?.scrollIntoView({ inline: 'center', block: 'nearest' });

// Re-render only the active screen body (keeps scroll position).
function refresh() { const y = window.scrollY; render(); window.scrollTo(0, y); }
document.addEventListener('click', (e) => {

// Metrics you can chart over time: every test with results, plus shooting and workout ratings.
function perfMetrics() {
  const out = [];
  for (const t of allTests()) {
    const rs = resultsOf(t.id); if (!rs.length) continue;
    out.push({ id: 't:' + t.id, name: t.name, lowerBetter: t.better === 'lower', fmt: (v) => fmtVal(t, v), pts: rs.map((r) => ({ date: r.date, v: r.value })) });
  }
  const byDay = (filter) => {
    const m = {}; for (const s of shotSessions()) { const z = filter(s); if (!z.a) continue; m[s.date] = m[s.date] || { m: 0, a: 0 }; m[s.date].m += z.m; m[s.date].a += z.a; }
    return Object.entries(m).filter(([, v]) => v.a >= 10).map(([date, v]) => ({ date, v: r1((v.m / v.a) * 100), tip: `${Math.round((v.m / v.a) * 100)}% (${v.m}/${v.a})` }));
  };
  const all = byDay(sessionTotals); if (all.length) out.push({ id: 's:all', name: 'Shooting % (all shots)', fmt: (v) => Math.round(v) + '%', pts: all });
  const three = byDay((s) => { const t = sessionTotals(s); return { m: t.m3, a: t.a3 }; }); if (three.length) out.push({ id: 's:3', name: '3-point %', fmt: (v) => Math.round(v) + '%', pts: three });
  const ft = byDay((s) => { const c = catAgg([s]).ftc; return c; }); if (ft.length) out.push({ id: 's:ft', name: 'Free throw %', fmt: (v) => Math.round(v) + '%', pts: ft });
  const gp = games().filter((g) => g.pts != null); if (gp.length) out.push({ id: 'g:pts', name: 'Points per game', fmt: (v) => nf(v), pts: gp.map((g) => ({ date: g.date, v: g.pts, tip: `${g.pts} pts${g.opp ? ' vs ' + g.opp : ''}` })) });
  const rt = allDayKeys().map((d) => { const r = exList(d).map((x) => x.rating).filter(Boolean); return r.length ? { date: d, v: r1(mean(r)) } : null; }).filter(Boolean);
  if (rt.length) out.push({ id: 'w:rating', name: 'Workout rating (1-5)', fmt: (v) => r1(v) + '/5', pts: rt });
  const vol = []; for (let i = 25; i >= 0; i--) { const m = shiftIso(mondayOf(todayIso()), -7 * i), mins = sum(lastNDays(7, shiftIso(m, 6)).map((d) => trainingOf(d).mins)); vol.push({ date: m, v: r1(mins / 60), tip: `${r1(mins / 60)} h week of ${fmtD(m)}` }); }
  if (vol.some((p) => p.v > 0)) { const first = vol.findIndex((p) => p.v > 0); out.push({ id: 'w:hours', name: 'Training hours per week', fmt: (v) => r1(v) + ' h', pts: vol.slice(first) }); }
  return out;
}

  document.body.appendChild(box);
  const colors = ['#3d8bff', '#8b5cff', '#2fd68a', '#ffc23d', '#ff6fb1', '#33d1ff'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 1.8 + Math.random() * 1.8 + 's'; c.style.animationDelay = Math.random() * 0.4 + 's'; c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c); setTimeout(() => c.remove(), 4200);

  const close = () => box.remove();
  box.addEventListener('click', (e) => { if (e.target === box || e.target.closest('button')) close(); });
  $('button', box).focus();
}

      ${ring(w.waterGoalDays, w.days || 1, { color: 'var(--water)', label: 'Water goal', sub: `${w.waterGoalDays} of ${w.days} days`, center: `<b>${w.waterGoalDays}</b>` })}

      ${row('Training sessions', w.sessions, lw.sessions)}${row('Training hours', r1(w.mins / 60), r1(lw.mins / 60), ' h')}${row('Basketball workouts', w.hoopsN, lw.hoopsN)}${row('Strength workouts', w.liftN, lw.liftN)}
      ${row('Shots taken', w.shotA || null, lw.shotA || null)}${row('Shooting %', w.shotPct == null ? null : r1(w.shotPct * 100), lw.shotPct == null ? null : r1(lw.shotPct * 100), '%', false, true)}

const REP_SECTIONS = [['training', 'Training completed'], ['improvements', 'Performance improvements'], ['nutrition', 'Nutrition consistency'], ['recovery', 'Recovery trends'], ['prs', 'Personal records'], ['fix', 'Areas to improve'], ['next', 'Priorities for next week']];
const reportHtml = (r) => `<div class="ai-out">${r.grade ? `<p><span class="big" style="font-size:28px">${esc(r.grade)}</span> <span class="small">${esc(r.headline || '')}</span></p>` : ''}${REP_SECTIONS.map(([k, l]) => (r[k]?.length ? `<div><h4>${l}</h4><ul>${r[k].map((x) => `<li class="small">${esc(x)}</li>`).join('')}</ul></div>` : '')).join('')}${r.missing ? `<p class="tiny muted">Not recorded: ${esc(r.missing)}</p>` : ''}</div>`;
ACTIONS['gen-report'] = async (b) => {
  const mon = ui('repWeek', mondayOf(todayIso())); b.disabled = true; $('#rep-out').innerHTML = '<p class="muted small">Coach is reviewing your week…</p>';
  try {
    const snap = fullSnapshot(21); snap.reportWeek = weekStats(mon); snap.weekBefore = weekStats(shiftIso(mon, -7)); snap.reportWeek.prs = snap.reportWeek.prs.map((p) => ({ test: p.t.name, value: p.r.value, prev: p.prev })); snap.weekBefore.prs = snap.weekBefore.prs.length;
    const r = await askAI(`${AI_RULES}\n\nSnapshot:\n${JSON.stringify(snap)}\n\nWrite the weekly report for the week starting ${mon} (reportWeek) compared with weekBefore. Return JSON {"grade": "A|B|C|D" (effort and consistency only, never body weight), "headline": string (one sentence), ${REP_SECTIONS.map(([k]) => `"${k}": [1-3 short bullet strings]`).join(', ')}, "missing": string (what wasn't logged that would make this more accurate)}. Use real numbers. Empty array if a section has no data.`);
    const rep = { mon, date: todayIso(), grade: String(r.grade || '').slice(0, 2), headline: String(r.headline || ''), missing: String(r.missing || '') };
    for (const [k] of REP_SECTIONS) rep[k] = (Array.isArray(r[k]) ? r[k] : []).map(String).slice(0, 4);
    const c = doc('aos-coach'); c.reports = [...(c.reports || []).filter((x) => x.mon !== mon), rep].slice(-20); persist('aos-coach');
    $('#rep-out').innerHTML = reportHtml(rep);
  } catch (e) { $('#rep-out').innerHTML = `<p class="small down">${esc(aiError(e))}</p>`; }
  b.disabled = false;
};

      <label>Minutes<input type="number" id="ws-mins" min="5" max="480" value="${o.mins || 60}" inputmode="numeric"></label><label>Start time<input type="time" id="ws-time"></label>
      <label>Date<input type="date" id="ws-date" value="${date}" max="${todayIso()}"></label><label>Intensity<select id="ws-int">${['light', 'moderate', 'hard'].map((k) => `<option ${k === int ? 'selected' : ''}>${k}</option>`).join('')}</select></label></div>

    <div><p class="muted small" style="margin-bottom:6px">How did it go? (optional, used for correlations)</p><div class="scale" id="ws-rate">${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-r="${n}">${n}</button>`).join('')}</div></div>
    <label>Notes<input id="ws-notes" maxlength="200" placeholder="Optional"></label>
    <p class="muted small" id="ws-kcal"></p>
    <button type="button" class="btn primary" id="ws-save">Save workout</button>`, (d) => {

    $('#ws-rate', d).addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; rating = rating === Number(b.dataset.r) ? 0 : Number(b.dataset.r); $$('[data-r]', d).forEach((x) => x.classList.toggle('on', Number(x.dataset.r) === rating)); });

const LEFT_Z = ['lc3', 'lw3', 'lbm', 'le'], RIGHT_Z = ['rc3', 'rw3', 'rbm', 're'];

function longestStreak(log) { let best = 0, cur = 0; for (const [, mk, n] of log || []) { if (n === 1 && mk) { cur++; best = Math.max(best, cur); } else if (n === 1) cur = 0; } return best; }

const COMBOS = ['Crossover', 'Between the legs', 'Behind the back', 'Hesitation', 'In-and-out', 'Spin', 'Retreat', 'Snatch back', 'Double cross', 'Between-cross'];

  const hs = handleSessions(), r = ui('hRange', '90'), cur = hs.filter((s) => inRange(s.date, r));
  const mins = sum(cur.map((s) => s.mins)), weak = sum(cur.map((s) => s.weakMins || 0)), loss = sum(cur.map((s) => s.losses || 0));
  const combos = {}; for (const s of cur) for (const c of s.combos || []) combos[c] = (combos[c] || 0) + 1;
  const cod = hs.filter((s) => s.cod).map((s) => ({ date: s.date, v: s.cod, tip: `${s.cod}s` }));
  el.innerHTML = `<section class="card"><div class="card-head"><div><h3>Ball handling</h3><span class="sub">Weak hand, combos, change of direction, ball security</span></div><div class="row">${seg('hRange', [['30', '30D'], ['90', '90D'], ['365', '1Y'], ['all', 'All']], r)}<button type="button" class="btn sm primary" data-act="add-handles">＋ Session</button></div></div>
    ${cur.length ? `<div class="kpis four"><div class="kpi"><small>Sessions</small><b>${cur.length}</b><span class="tiny muted">${fmtDur(mins)} total</span></div><div class="kpi"><small>Weak hand share</small><b>${mins ? Math.round((weak / mins) * 100) + '%' : '—'}</b><span class="tiny muted">${fmtDur(weak)} · aim for 40%+</span></div><div class="kpi"><small>Ball security</small><b>${mins ? r1((loss / mins) * 10) : '—'}</b><span class="tiny muted">losses per 10 min</span></div><div class="kpi"><small>Best COD time</small><b>${cod.length ? Math.min(...cod.map((x) => x.v)) + 's' : '—'}</b><span class="tiny muted">cone drill</span></div></div>
      <h4 style="margin:14px 0 6px">Weak vs strong hand minutes by week</h4><div class="chart" id="h-wk"></div><div class="legend"><span><i style="background:var(--purple)"></i>Weak hand</span><span><i style="background:var(--accent)"></i>Strong hand / both</span></div>`
    : emptyState('No ball-handling sessions', 'Log minutes, how much was weak hand, the combos you drilled and ball losses. Weak-hand development and ball security trend from here.', 'ball', '<button type="button" class="btn sm primary" data-act="add-handles">Log a session</button>')}</section>
  ${cur.length ? `<div class="grid two"><section class="card"><div class="card-head"><div><h3>Combos drilled</h3><span class="sub">Sessions that included each move</span></div></div>${Object.keys(combos).length ? `<div class="stack">${Object.entries(combos).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div><div class="row-between small"><span>${esc(c)}</span><b>${n}</b></div>${hbar((n / cur.length) * 100)}</div>`).join('')}</div><p class="muted tiny" style="margin-top:8px">Not drilled in range: ${COMBOS.filter((c) => !combos[c]).join(', ') || 'none, nice'}</p>` : '<p class="muted small">Tag combos when you log a session.</p>'}</section>
    <section class="card"><div class="card-head"><div><h3>Change of direction and ball security</h3></div></div>${cod.length >= 2 ? '<div class="chart" id="h-cod"></div>' : '<p class="muted small">Time the same cone drill each session to see change-of-direction progress (needs 2 timed sessions).</p>'}<div class="chart" id="h-loss" style="margin-top:10px"></div></section></div>
    <section class="card"><div class="card-head"><h3>Sessions</h3></div><div class="list">${[...cur].reverse().slice(0, 20).map((s) => `<div class="li"><div><div class="t">${esc(fmtDL(s.date))} · ${fmtDur(s.mins)}</div><div class="s">${s.weakMins || 0} min weak · ${s.losses || 0} losses${s.cod ? ` · COD ${s.cod}s` : ''}${(s.combos || []).length ? ' · ' + esc(s.combos.join(', ')) : ''}</div></div><button type="button" class="chip" data-act="del-dev" data-doc="aos-handles" data-id="${s.id}">Delete</button></div>`).join('')}</div></section>` : ''}`;
  if (!cur.length) return;
  const wk = []; for (let i = 7; i >= 0; i--) { const m = shiftIso(mondayOf(todayIso()), -7 * i), xs = hs.filter((s) => s.date >= m && s.date <= shiftIso(m, 6)), wm = sum(xs.map((s) => s.weakMins || 0)), tm = sum(xs.map((s) => s.mins)); wk.push({ label: `${parseIso(m).getMonth() + 1}/${parseIso(m).getDate()}`, full: 'Week of ' + fmtD(m), segs: [{ v: wm, color: 'var(--purple)' }, { v: Math.max(0, tm - wm), color: 'var(--accent)' }], tip: tm ? `${tm} min · ${Math.round((wm / tm) * 100)}% weak hand` : 'none' }); }
  drawBars($('#h-wk'), wk, { fmt: (v) => v + ' min', h: 160 });
  if (cod.length >= 2) drawLine($('#h-cod'), cod, { fmt: (v) => v + 's', h: 140, color: 'var(--good)', label: 'Change-of-direction time' });
  drawLine($('#h-loss'), cur.filter((s) => s.mins).map((s) => ({ date: s.date, v: r1(((s.losses || 0) / s.mins) * 10), tip: `${s.losses || 0} losses in ${s.mins} min` })), { fmt: (v) => v + ' per 10 min', h: 140, color: 'var(--over)', yMin: 0, label: 'Ball losses per 10 minutes' });
};
ACTIONS['add-handles'] = () => {
  const drills = DRILLS.filter((d) => d[2] === 'Ball handling');
  openSheet('Ball-handling session', `<div class="fields"><label>Date<input type="date" id="bh-date" value="${todayIso()}" max="${todayIso()}"></label><label>Total minutes<input type="number" id="bh-mins" min="5" max="240" value="30" inputmode="numeric"></label>
    <label>Weak-hand minutes<input type="number" id="bh-weak" min="0" max="240" value="10" inputmode="numeric"></label><label>Ball losses (fumbles, kicked balls)<input type="number" id="bh-loss" min="0" max="200" value="0" inputmode="numeric"></label>
    <label class="full">Cone drill time (s, optional)<input type="number" id="bh-cod" step="0.01" min="3" max="120" inputmode="decimal" placeholder="Same course every time"></label></div>
    <div><p class="muted small" style="margin-bottom:6px">Combos drilled</p><div class="chips" id="bh-c">${COMBOS.map((c) => `<button type="button" class="chip" data-combo="${c}">${c}</button>`).join('')}</div></div>
    <div><p class="muted small" style="margin-bottom:6px">Drills</p><div class="chips" id="bh-d">${drills.map((d) => `<button type="button" class="chip" data-drill="${d[0]}">${d[1]}</button>`).join('')}</div></div>
    <label>Notes<input id="bh-note" maxlength="160"></label><label class="check"><input type="checkbox" id="bh-ex" checked> Also log it as a skill workout</label>
    <button type="button" class="btn primary" id="bh-save">Save session</button>`, (d) => {
    d.addEventListener('click', (e) => { const c = e.target.closest('[data-combo],[data-drill]'); if (c) c.classList.toggle('on'); });
    $('#bh-save', d).addEventListener('click', () => {
      const mins = Math.round(Number($('#bh-mins', d).value)), weak = Math.round(Number($('#bh-weak', d).value) || 0), cod = Number($('#bh-cod', d).value) || null;
      if (!(mins >= 5)) return toast('Minutes must be 5 or more'); if (weak > mins) return toast('Weak-hand minutes can\'t exceed the total');
      const s = { id: uid('h'), date: $('#bh-date', d).value || todayIso(), mins, weakMins: weak, losses: Math.round(Number($('#bh-loss', d).value) || 0), cod, combos: $$('[data-combo].on', d).map((x) => x.dataset.combo), drills: $$('[data-drill].on', d).map((x) => x.dataset.drill), note: $('#bh-note', d).value.trim().slice(0, 160) };
      const H = doc('aos-handles'); H.sessions = [...(H.sessions || []), s]; persist('aos-handles');
      if ($('#bh-ex', d).checked) addWorkout(s.date, { type: 'skill', name: 'Ball handling', mins, int: 'moderate', notes: s.combos.join(', '), source: 'athlete-os' });
      if (cod) { const prev = handleSessions().filter((x) => x.id !== s.id && x.cod).map((x) => x.cod); if (prev.length && cod < Math.min(...prev)) celebrate('Fastest cone drill', cod + 's', `Previous best ${Math.min(...prev)}s`); }
      closeSheet(); toast('Session saved'); refresh();
    });
  });
};
ACTIONS['del-dev'] = (b) => confirmSheet('Delete this entry?', 'Delete', () => { const D = doc(b.dataset.doc), k = D.sessions ? 'sessions' : 'entries'; D[k] = (D[k] || []).filter((x) => x.id !== b.dataset.id); persist(b.dataset.doc); refresh(); });

// ----- finishing -----
HOOPS.finishing = (el) => {
  const r = ui('fRange', '90'), fs = finishSessions(), cur = fs.filter((s) => inRange(s.date, r)), T = finishTotals(cur);
  const p = (x) => (x.a ? pctTxt(x.m / x.a) : '—');
  el.innerHTML = `<section class="card"><div class="card-head"><div><h3>Finishing</h3><span class="sub">By finish type and hand · contact finishing</span></div><div class="row">${seg('fRange', [['30', '30D'], ['90', '90D'], ['365', '1Y'], ['all', 'All']], r)}<button type="button" class="btn sm primary" data-act="add-finish">＋ Session</button></div></div>
    ${T.a ? `<div class="rings">${ring(T.m, T.a, { size: 96, stroke: 9, color: 'var(--good)', label: 'Overall', sub: `${T.m}/${T.a}`, center: `<b>${p(T)}</b>` })}${ring(T.L.m, T.L.a || 1, { size: 96, stroke: 9, color: 'var(--purple)', label: 'Left hand', sub: `${T.L.m}/${T.L.a}`, center: `<b>${p(T.L)}</b>` })}${ring(T.R.m, T.R.a || 1, { size: 96, stroke: 9, color: 'var(--accent)', label: 'Right hand', sub: `${T.R.m}/${T.R.a}`, center: `<b>${p(T.R)}</b>` })}${ring(T.by.contact.m, T.by.contact.a || 1, { size: 96, stroke: 9, color: 'var(--over)', label: 'Contact', sub: `${T.by.contact.m}/${T.by.contact.a}`, center: `<b>${p(T.by.contact)}</b>` })}</div>
      <h4 style="margin:16px 0 6px">By finish type (left vs right)</h4><div class="chart" id="f-type"></div><div class="legend"><span><i style="background:var(--purple)"></i>Left</span><span><i style="background:var(--accent)"></i>Right</span></div>
      <div class="cmp" style="margin-top:12px"><span class="h">Type</span><span class="h">Left</span><span class="h">Right</span><span class="h">All</span>${FINISH_TYPES.filter(([k]) => T.by[k].a).map(([k, l]) => `<span>${l}</span><span class="muted num">${p(T.by[k].L)} <span class="tiny">(${T.by[k].L.a})</span></span><span class="muted num">${p(T.by[k].R)} <span class="tiny">(${T.by[k].R.a})</span></span><b>${p(T.by[k])}</b>`).join('')}</div>`
    : emptyState('No finishing sessions', 'Log makes and attempts by finish type and hand (layups, reverses, floaters, euro, contact, scoops, power). Weak-hand finishing is where guards separate.', 'ball', '<button type="button" class="btn sm primary" data-act="add-finish">Log a session</button>')}</section>
  ${fs.length >= 2 ? `<section class="card"><div class="card-head"><div><h3>Finishing trend</h3><span class="sub">% per session</span></div></div><div class="chart" id="f-trend"></div></section>` : ''}
  ${cur.length ? `<section class="card"><div class="card-head"><h3>Sessions</h3></div><div class="list">${[...cur].reverse().slice(0, 20).map((s) => { const t = finishTotals([s]); return `<div class="li"><div><div class="t">${esc(fmtDL(s.date))} · ${t.m}/${t.a}</div><div class="s">Left ${t.L.m}/${t.L.a} · right ${t.R.m}/${t.R.a}${s.note ? ' · ' + esc(s.note) : ''}</div></div><div class="row"><span class="v">${p(t)}</span><button type="button" class="chip" data-act="del-dev" data-doc="aos-finish" data-id="${s.id}">Delete</button></div></div>`; }).join('')}</div></section>` : ''}`;
  if (T.a) drawGroupedBars($('#f-type'), FINISH_TYPES.filter(([k]) => T.by[k].a).map(([k, l]) => ({ label: l.split(' ')[0], full: l, a: T.by[k].L, b: T.by[k].R })));
  if (fs.length >= 2) drawLine($('#f-trend'), fs.map((s) => { const t = finishTotals([s]); return t.a ? { date: s.date, v: r1((t.m / t.a) * 100), tip: `${Math.round((t.m / t.a) * 100)}% (${t.m}/${t.a})` } : null; }).filter(Boolean), { fmt: (v) => Math.round(v) + '%', color: 'var(--good)', label: 'Finishing %' });
};
/** Two bars per group (left / right percentages). */
function drawGroupedBars(el, groups) {
  drawBars(el, groups.flatMap((g) => [
    { label: g.label, full: g.full + ' · left', segs: [{ v: g.a.a ? Math.round((g.a.m / g.a.a) * 100) : 0, color: 'var(--purple)' }], tip: g.a.a ? `Left ${Math.round((g.a.m / g.a.a) * 100)}% (${g.a.m}/${g.a.a})` : 'Left: none' },
    { label: '', full: g.full + ' · right', segs: [{ v: g.b.a ? Math.round((g.b.m / g.b.a) * 100) : 0, color: 'var(--accent)' }], tip: g.b.a ? `Right ${Math.round((g.b.m / g.b.a) * 100)}% (${g.b.m}/${g.b.a})` : 'Right: none' },
  ]), { fmt: (v) => v + '%', tick: (v) => v + '%', h: 180 });
}
ACTIONS['add-finish'] = () => openSheet('Finishing session', `<div class="fields"><label>Date<input type="date" id="fi-date" value="${todayIso()}" max="${todayIso()}"></label><label>Minutes (optional)<input type="number" id="fi-mins" min="5" max="240" inputmode="numeric"></label></div>
  <div class="cmp" style="grid-template-columns:minmax(0,1.2fr) repeat(2,minmax(0,1fr))"><span class="h">Type</span><span class="h">Left made/att</span><span class="h">Right made/att</span>

    if (!Object.keys(rows).length) return toast('Enter at least one row');
    const s = { id: uid('f'), date: $('#fi-date', d).value || todayIso(), rows, note: $('#fi-note', d).value.trim().slice(0, 160) };

    closeSheet(); toast('Finishing saved'); refresh();
  });
});

// ----- basketball IQ and film -----
const FILM_TYPES = [['film', 'Game film'], ['study', 'Player study'], ['obs', 'Game observation'], ['pnr', 'Pick-and-roll reads'], ['def', 'Defensive recognition']];
HOOPS.iq = (el) => {
  const fs = filmEntries(), q = ui('fq', ''), mins30 = sum(fs.filter((f) => inRange(f.date, '30')).map((f) => f.mins || 0));
  const acc = (type) => { const xs = fs.filter((f) => f.type === type && f.reads); return { r: sum(xs.map((f) => f.reads)), c: sum(xs.map((f) => f.correct || 0)), ser: xs.map((f) => ({ date: f.date, v: Math.round(((f.correct || 0) / f.reads) * 100), tip: `${f.correct}/${f.reads} correct` })) }; };
  const P = acc('pnr'), D = acc('def');
  const players = {}; for (const f of fs) if (f.player) (players[f.player] = players[f.player] || []).push(f);
  const shown = fs.filter((f) => !q || `${f.title} ${f.player} ${f.notes} ${f.takeaways} ${(f.tags || []).join(' ')}`.toLowerCase().includes(q.toLowerCase())).reverse();
  const iqGoals = goals().filter((g) => g.source === 'film:mins30' || /iq|film|read|decision/i.test(g.title));

    ${fs.length ? `<div class="kpis four"><div class="kpi"><small>Film (30 days)</small><b>${mins30}</b><span class="tiny muted">minutes</span></div><div class="kpi"><small>Entries</small><b>${fs.length}</b></div><div class="kpi"><small>PnR read accuracy</small><b>${P.r ? pctTxt(P.c / P.r) : '—'}</b><span class="tiny muted">${P.c}/${P.r} reads</span></div><div class="kpi"><small>Defensive recognition</small><b>${D.r ? pctTxt(D.c / D.r) : '—'}</b><span class="tiny muted">${D.c}/${D.r}</span></div></div>
      <h4 style="margin:14px 0 6px">Film minutes per week</h4><div class="chart" id="film-wk"></div>`
    : emptyState('Start your film log', 'Log film sessions, notes from games you watch, and your pick-and-roll and defensive reads (how many you got right). Your IQ rating comes from this.', 'spark', '<button type="button" class="btn sm primary" data-act="add-film">Add an entry</button>')}</section>
  ${P.ser.length >= 2 || D.ser.length >= 2 ? `<section class="card"><div class="card-head"><div><h3>Read accuracy trend</h3><span class="sub">% of reads you got right per session</span></div></div>${P.ser.length >= 2 ? '<h4 style="margin-bottom:4px">Pick-and-roll</h4><div class="chart" id="pnr-acc"></div>' : ''}${D.ser.length >= 2 ? '<h4 style="margin:10px 0 4px">Defense</h4><div class="chart" id="def-acc"></div>' : ''}</section>` : ''}

  ${Object.keys(players).length ? `<section class="card"><div class="card-head"><div><h3>Player study library</h3><span class="sub">Players you've studied and what you took from them</span></div></div><div class="list">${Object.entries(players).sort((a, b) => b[1].length - a[1].length).map(([p, xs]) => `<details class="li" style="display:block"><summary class="row-between" style="cursor:pointer"><span class="t">${esc(p)}</span><span class="tiny muted">${xs.length} session${xs.length === 1 ? '' : 's'} · ${sum(xs.map((x) => x.mins || 0))} min</span></summary><ul class="small" style="margin:8px 0 0;padding-left:18px">${xs.filter((x) => x.takeaways || x.notes).map((x) => `<li>${esc(x.takeaways || x.notes)} <span class="muted tiny">(${esc(fmtD(x.date))})</span></li>`).join('') || '<li class="muted">No takeaways written yet.</li>'}</ul></details>`).join('')}</div></section>` : ''}
  ${fs.length ? `<section class="card"><div class="card-head"><h3>Film library</h3></div><input id="fq" placeholder="Search notes, players, tags…" value="${esc(q)}" style="margin-bottom:10px"><div class="list">${shown.slice(0, 40).map((f) => `<div class="li" style="align-items:flex-start"><div><div class="t">${esc(f.title || FILM_TYPES.find((x) => x[0] === f.type)?.[1])}</div><div class="s">${esc(fmtD(f.date))} · ${esc(FILM_TYPES.find((x) => x[0] === f.type)?.[1] || '')}${f.mins ? ' · ' + f.mins + ' min' : ''}${f.player ? ' · ' + esc(f.player) : ''}${f.reads ? ` · ${f.correct}/${f.reads} reads` : ''}</div>${f.takeaways ? `<div class="s">💡 ${esc(f.takeaways)}</div>` : ''}${f.notes ? `<div class="s">${esc(f.notes)}</div>` : ''}${(f.tags || []).length ? `<div class="chips" style="margin-top:4px">${f.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}</div><button type="button" class="chip" data-act="del-dev" data-doc="aos-film" data-id="${f.id}">Delete</button></div>`).join('') || '<p class="muted small">No matches.</p>'}</div></section>` : ''}`;
  if (fs.length) { const wk = []; for (let i = 7; i >= 0; i--) { const m = shiftIso(mondayOf(todayIso()), -7 * i), v = sum(fs.filter((f) => f.date >= m && f.date <= shiftIso(m, 6)).map((f) => f.mins || 0)); wk.push({ label: `${parseIso(m).getMonth() + 1}/${parseIso(m).getDate()}`, full: 'Week of ' + fmtD(m), segs: [{ v, color: 'var(--purple)' }], tip: `${v} min` }); } drawBars($('#film-wk'), wk, { h: 150, fmt: (v) => v + ' min' }); }

  $('#fq')?.addEventListener('input', (e) => { setUi('fq', e.target.value); clearTimeout(HOOPS.t); HOOPS.t = setTimeout(() => { refresh(); const i = $('#fq'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); });
};

    <h4 style="margin:14px 0 6px">Performance trends</h4><div class="list">${[['Development score', devHistory(12).map((x) => x.v), 'var(--accent)'], ['Shooting %', shotSessions().slice(-12).map((s) => sessionTotals(s).pct * 100).filter((x) => Number.isFinite(x)), 'var(--good)'], ['Weekly training hours', [7, 6, 5, 4, 3, 2, 1, 0].map((i) => sum(lastNDays(7, shiftIso(todayIso(), -7 * i)).map((d) => trainingOf(d).mins)) / 60), 'var(--purple)'], ['Game Score', games().map(gameScore).filter((x) => x != null).slice(-10), 'var(--warn)']].filter(([, v]) => v.length >= 2 && v.some((x) => x)).map(([l, v, c]) => `<div class="li"><span class="small">${l}</span><span class="row">${spark(v, c, 110)}<b class="num">${r1(v[v.length - 1])}</b></span></div>`).join('') || '<p class="muted small">Trends appear as you log.</p>'}</div></section>
  <section class="card"><div class="card-head"><div><h3>Achievements</h3><span class="sub">${Object.keys(ach).length} of ${ACHIEVEMENTS.length} unlocked</span></div></div><div class="ach-grid">${ACHIEVEMENTS.map(([id, n, d]) => `<div class="ach ${ach[id] ? 'on' : ''}" title="${esc(d)}"><span class="ach-i">${ach[id] ? '🏅' : '🔒'}</span><b>${esc(n)}</b><span class="tiny muted">${ach[id] ? esc(fmtD(ach[id])) : esc(d)}</span></div>`).join('')}</div></section>
  <section class="card"><div class="card-head"><div><h3>Milestones and PR timeline</h3><span class="sub">Every record and unlock, newest first</span></div></div>${milestoneTimeline()}</section>`;
};
function milestoneTimeline() {
  const ev = [...allPRs().map(({ t, r, prev }) => ({ date: r.date, i: '🏆', t: `${t.name}: ${fmtVal(t, r.value)}`, s: `beat ${fmtVal(t, prev)}` })), ...Object.entries(aos().ach || {}).map(([id, d]) => ({ date: d, i: '🏅', t: ACHIEVEMENTS.find((a) => a[0] === id)?.[1] || id, s: 'achievement' })), ...goals().filter((g) => goalState(g).status === 'done').map((g) => ({ date: (g.history || []).slice(-1)[0]?.date || todayIso(), i: '🎯', t: g.title, s: 'goal completed' })), ...games().filter((g) => g.pts != null && g.pts === Math.max(...games().map((x) => x.pts || 0)) && g.pts > 0).map((g) => ({ date: g.date, i: '🔥', t: `Career high: ${g.pts} pts`, s: g.opp ? 'vs ' + g.opp : '' }))].sort((a, b) => b.date.localeCompare(a.date));
  return ev.length ? `<div class="tl">${ev.slice(0, 30).map((e) => `<div class="tl-i done"><span class="tl-d">${esc(fmtD(e.date))}</span><b>${e.i} ${esc(e.t)}</b><span class="tiny muted">${esc(e.s)}</span></div>`).join('')}</div>` : emptyState('No milestones yet', 'PRs, achievements and completed goals land on this timeline.', 'trophy');
}
ACTIONS['edit-profile'] = () => {
  const p = aos().profile || {}, inch = (v) => (v ? `${Math.floor(v / 12)}-${Math.round(v % 12)}` : '');
  openSheet('Edit athlete profile', `<div class="fields"><label>Name<input id="ep-name" maxlength="30" value="${esc(p.name || '')}"></label><label>Position<input id="ep-pos" maxlength="30" value="${esc(p.position || '')}" placeholder="PG, combo guard"></label>
    <label>Team<input id="ep-team" maxlength="40" value="${esc(p.team || '')}"></label><label>Jersey #<input id="ep-num" maxlength="3" value="${esc(p.jersey || '')}" inputmode="numeric"></label>
    <label>Class / grade<input id="ep-grade" maxlength="20" value="${esc(p.grade || '')}"></label><label>Dominant hand<select id="ep-hand"><option></option>${['Right', 'Left', 'Both'].map((h) => `<option ${p.hand === h ? 'selected' : ''}>${h}</option>`).join('')}</select></label>
    <label>Wingspan (ft-in)<input id="ep-wing" value="${inch(p.wingspan)}" placeholder="6-2"></label><label>Standing reach (ft-in)<input id="ep-reach" value="${inch(p.reach)}" placeholder="7-11"></label></div>
    <div><p class="muted small" style="margin-bottom:6px">Playing style</p><div class="chips" id="ep-style">${STYLES_PLAY.map((s) => `<button type="button" class="chip ${(p.style || []).includes(s) ? 'on' : ''}" data-st="${s}">${s}</button>`).join('')}</div></div>
    <p class="muted tiny">Height, weight and age come from MacroLens (Profile). Weigh-ins update weight automatically.</p><button type="button" class="btn primary" id="ep-save">Save</button>`, (d) => {
    $('#ep-style', d).addEventListener('click', (e) => { const c = e.target.closest('[data-st]'); if (c) c.classList.toggle('on'); });
    $('#ep-save', d).addEventListener('click', () => {
      const parse = (s) => { s = s.trim(); if (!s) return null; const m = s.match(/^(\d)\D+(\d{1,2})/); const v = m ? Number(m[1]) * 12 + Number(m[2]) : Number(s); return v >= 48 && v <= 120 ? v : NaN; };
      const wing = parse($('#ep-wing', d).value), reach = parse($('#ep-reach', d).value);
      if (Number.isNaN(wing) || Number.isNaN(reach)) return toast('Use feet-inches like 6-2');
      aos().profile = { ...p, name: $('#ep-name', d).value.trim(), position: $('#ep-pos', d).value.trim(), team: $('#ep-team', d).value.trim(), jersey: $('#ep-num', d).value.trim(), grade: $('#ep-grade', d).value.trim(), hand: $('#ep-hand', d).value, wingspan: wing, reach, style: $$('[data-st].on', d).map((x) => x.dataset.st) };
      persist('aos'); closeSheet(); toast('Profile saved'); refresh();
    });
  });
};

// ----- export / import -----
const exportKeys = () => [...new Set([...Object.keys(cache), ...lsKeys()])].filter((k) => k === 'core' || k.startsWith('day-') || k.startsWith('aos'));
ACTIONS.data = () => openSheet('Export and import', `<p class="small">Export everything (food log, workouts, tests, shooting, goals, calendar) as one JSON file. Import merges a file back in: new days and entries are added, nothing you already have is overwritten.</p>
  <button type="button" class="btn primary" id="dx-exp">Export my data</button>
  <div class="hr"></div><label>Import a file<input type="file" id="dx-file" accept=".json,application/json"></label><p class="muted small" id="dx-msg"></p>`, (d) => {
  $('#dx-exp', d).addEventListener('click', async () => {
    const docs = {}; for (const k of exportKeys()) { const v = doc(k); if (v != null) docs[k] = v; }
    const data = JSON.stringify({ app: 'athlete-os', version: 2, exported: new Date().toISOString(), docs }, null, 1), name = `athlete-os-${todayIso()}.json`;
    try { const dl = window.claude?.use ? await claude.use('downloads') : null; if (!dl) throw new Error('none'); await dl.save({ filename: name, data }); $('#dx-msg', d).textContent = 'Export saved.'; }
    catch (e) { if (e?.code === 'declined') return; $('#dx-msg', d).innerHTML = `Downloading isn't available here. Copy this instead:<textarea style="min-height:140px;font-size:11px;margin-top:6px" readonly>${esc(data)}</textarea>`; }
  });
  $('#dx-file', d).addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text()); if (j.app !== 'athlete-os' || !j.docs) throw new Error('Not an Athlete OS export');
      let added = 0;
      for (const [k, v] of Object.entries(j.docs)) {
        if (!(k === 'core' || k.startsWith('day-') || k.startsWith('aos'))) continue;
        const cur = doc(k);
        if (k.startsWith('day-')) { if (!cur) { cache[k] = v; persist(k); added++; } continue; }
        if (k === 'core') { if (!cur?.profile && v.profile) { cache.core = { ...v, ...cur, profile: v.profile }; persist('core'); added++; } continue; }
        // aos docs: merge arrays by id, keep current scalars
        const merged = { ...v, ...cur };
        for (const [field, arr] of Object.entries(v)) if (Array.isArray(arr) && Array.isArray(cur?.[field])) { const ids = new Set(cur[field].map((x) => x?.id ?? JSON.stringify(x))); const extra = arr.filter((x) => !ids.has(x?.id ?? JSON.stringify(x))); merged[field] = [...cur[field], ...extra]; added += extra.length; }
        cache[k] = merged; persist(k);
      }
      $('#dx-msg', d).textContent = `Imported ${added} new item${added === 1 ? '' : 's'}.`; refresh();
    } catch (err) { $('#dx-msg', d).textContent = err.message === 'Not an Athlete OS export' ? 'That file isn\'t an Athlete OS export.' : 'Couldn\'t read that file.'; }
  });
});

// ----- customizable Home -----
const WIDGETS = [['status', 'Readiness & availability'], ['today', "Today's schedule"], ['checklist', 'Daily checklist'], ['rec', 'Recovery'], ['fuel', 'Fuel today'], ['ai', 'Coach recommendation'], ['score', 'Development score'], ['load', 'Training load'], ['goals', 'Goals'], ['week', 'Training consistency'], ['prs', 'Latest PRs'], ['preview', 'Analytics preview'], ['ach', 'Achievements']];
const DEFAULT_W = ['status', 'today', 'rec', 'fuel', 'ai', 'score', 'goals', 'week', 'prs', 'preview'];
const widgetList = () => { const w = aos().profile?.widgets; return Array.isArray(w) && w.length ? w.filter((k) => WIDGETS.some((x) => x[0] === k)) : DEFAULT_W; };
const _homeHero = RENDER.home;
RENDER.home = (el) => {
  _homeHero(el);
  const hero = $('.hero', el); [...el.children].forEach((c) => { if (c !== hero) c.remove(); });
  const fresh = checkAchievements(); if (fresh.length) setTimeout(() => toast(`Achievement unlocked: ${fresh.join(', ')}`), 400);
  snapshotGoals();
  const R = { status: homeStatus, today: homeToday, checklist: homeChecklist, rec: homeRecovery, fuel: homeFuel, ai: homeAI, score: homeScore, load: homeLoad, goals: homeGoals, week: homeWeek, prs: homePRs, preview: homePreview, ach: homeAch };
  const wide = new Set(['fuel']);
  const grid = document.createElement('div'); grid.className = 'grid two widgets'; el.appendChild(grid);
  for (const k of widgetList()) { const s = document.createElement('section'); s.className = 'card' + (k === 'ai' ? ' ai' : '') + (wide.has(k) ? ' span2' : ''); s.dataset.widget = k; grid.appendChild(s); try { R[k](s); } catch (err) { console.error(err); s.innerHTML = `<p class="muted small">Couldn't draw this card.</p>`; } }
  el.insertAdjacentHTML('beforeend', '<button type="button" class="btn ghost block" data-act="widgets">Customize home</button>');
};
function homeStatus(el) {
  const st = availability(), rd = readiness(), ls = loadStats(), [zc, zl] = acwrZone(ls.acwr);
  el.innerHTML = `<div class="card-head"><div><h3>Ready to train?</h3><span class="sub">Readiness, load and availability</span></div><button type="button" class="btn sm" data-act="status">Status</button></div>
    <div class="row" style="gap:14px;flex-wrap:nowrap">${ring(rd?.score ?? 0, 100, { size: 92, stroke: 9, color: !rd ? 'var(--oth)' : rd.score >= 70 ? 'var(--good)' : rd.score >= 45 ? 'var(--warn)' : 'var(--danger)', center: `<b style="font-size:24px">${rd?.score ?? '—'}</b><span class="tiny muted">ready</span>` })}
    <div class="stack" style="gap:5px;min-width:0"><span class="band ${st.status === 'available' ? 'hi' : st.status === 'limited' ? 'mid' : 'lo'}" style="width:max-content">${st.status === 'available' ? 'Available' : st.status === 'limited' ? 'Limited' : 'Out'}${st.area ? ': ' + esc(st.area) : ''}</span><span class="band ${zc}" style="width:max-content">Load: ${zl}</span><span class="small">${esc(restAdvice()[0]?.[1] || 'Check in to get today\'s readiness.')}</span></div></div>`;
}
function homeChecklist(el) { const d = todayIso(), items = itemsOn(d); el.innerHTML = `<div class="card-head"><div><h3>Daily checklist</h3><span class="sub">${items.filter((x) => isChecked(d, x.key)).length} of ${items.length} done</span></div><button type="button" class="btn sm" data-go="train-today">Open</button></div>${items.length ? checklistHtml(d, items) : emptyState('No checklist', 'Build a routine in Train.', 'calendar', '<button type="button" class="btn sm primary" data-act="routine">Build a routine</button>')}`; }
function homeScore(el) { const ds = devScore(), h = devHistory(8); el.innerHTML = `<div class="card-head"><div><h3>Development score</h3><span class="sub">Updates as you log</span></div><button type="button" class="btn sm" data-go="analytics-overview">Breakdown</button></div>${ds ? `<div class="row" style="gap:14px;flex-wrap:nowrap">${ring(ds.score, 100, { size: 100, stroke: 10, color: 'var(--accent)', color2: 'var(--purple)', center: `<b style="font-size:28px">${ds.score}</b>` })}<div class="stack" style="gap:4px"><span class="small">Skills ${ds.skill} · consistency ${ds.cons} · momentum ${ds.mom}</span>${h.length >= 2 ? spark(h.map((x) => x.v), 'var(--accent)', 140, 34) : ''}</div></div>` : emptyState('Needs two skill ratings', 'Log tests, shooting or skill sessions to get your score.', 'chart')}`; }
function homeLoad(el) { const days = lastNDays(14), ls = loadStats(), [zc, zl] = acwrZone(ls.acwr); el.innerHTML = `<div class="card-head"><div><h3>Training load</h3><span class="sub">14 days · <span class="band ${zc}">${zl}</span></span></div><button type="button" class="btn sm" data-go="train-load">Details</button></div>${days.some((d) => loadOf(d)) ? '<div class="chart" id="hw-load"></div>' : '<p class="muted small">No training logged in 14 days.</p>'}`; if (days.some((d) => loadOf(d))) drawCombo($('#hw-load', el), days.map((d) => ({ label: String(parseIso(d).getDate()), full: fmtDL(d), bar: loadOf(d), color: { high: 'var(--danger)', medium: 'var(--warn)', low: 'var(--accent)', rest: 'var(--oth)' }[dayIntensity(d)], line: readiness(d)?.score ?? null, tip: `Load ${loadOf(d)}` })), { h: 150 }); }
function homeGoals(el) { const gs = goals().filter((g) => goalState(g).status !== 'done').slice(0, 4); el.innerHTML = `<div class="card-head"><div><h3>Goals</h3><span class="sub">${goals().length} total</span></div><button type="button" class="btn sm" data-go="train-goals">Roadmap</button></div>${gs.length ? gs.map((g) => { const s = goalState(g); return `<div style="margin-bottom:10px"><div class="row-between small"><span class="t">${esc(g.title)}</span><span><span class="band ${STATUS_TXT[s.status][0]}">${STATUS_TXT[s.status][1]}</span> <b>${s.pct}%</b></span></div>${hbar(s.pct)}</div>`; }).join('') : emptyState('No active goals', 'Set measurable targets that track themselves.', 'trophy', '<button type="button" class="btn sm primary" data-act="goal">＋ Goal</button>')}`; }
function homeAch(el) { const a = aos().ach || {}, got = ACHIEVEMENTS.filter((x) => a[x[0]]).sort((x, y) => a[y[0]].localeCompare(a[x[0]])); el.innerHTML = `<div class="card-head"><div><h3>Achievements</h3><span class="sub">${got.length} of ${ACHIEVEMENTS.length}</span></div><button type="button" class="btn sm" data-go="profile">All</button></div>${got.length ? `<div class="chips">${got.slice(0, 8).map((x) => `<span class="tag blue">🏅 ${esc(x[1])}</span>`).join('')}</div>` : '<p class="muted small">Your first workout unlocks the first badge.</p>'}`; }
ACTIONS.widgets = () => {
  let list = [...widgetList()];
  const draw = (d) => { $('#wl', d).innerHTML = [...list, ...WIDGETS.map((w) => w[0]).filter((k) => !list.includes(k))].map((k) => { const on = list.includes(k), i = list.indexOf(k); return `<div class="li"><label class="check" style="flex:1"><input type="checkbox" data-wk="${k}" ${on ? 'checked' : ''}> ${esc(WIDGETS.find((w) => w[0] === k)[1])}</label>${on ? `<button type="button" class="chip" data-wu="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Move up">↑</button><button type="button" class="chip" data-wd="${i}" ${i === list.length - 1 ? 'disabled' : ''} aria-label="Move down">↓</button>` : ''}</div>`; }).join(''); };
  openSheet('Customize home', '<p class="muted small">Pick the cards on your Home screen and their order.</p><div class="list" id="wl"></div><div class="row"><button type="button" class="btn" id="w-reset">Reset</button><button type="button" class="btn primary" id="w-save" style="flex:1">Save</button></div>', (d) => {
    draw(d);
    d.addEventListener('change', (e) => { const c = e.target.closest('[data-wk]'); if (!c) return; list = c.checked ? [...list, c.dataset.wk] : list.filter((k) => k !== c.dataset.wk); draw(d); });
    d.addEventListener('click', (e) => { const u = e.target.closest('[data-wu]'), w = e.target.closest('[data-wd]'); const i = Number((u || w)?.dataset.wu ?? (u || w)?.dataset.wd); if (!u && !w) return; const j = u ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; draw(d); });
    $('#w-reset', d).addEventListener('click', () => { list = [...DEFAULT_W]; draw(d); });
    $('#w-save', d).addEventListener('click', () => { if (!list.length) return toast('Keep at least one card'); aos().profile = { ...(aos().profile || {}), widgets: list }; persist('aos'); closeSheet(); refresh(); });
  });
};

// ---- main.js ----
// ===================== boot =====================
$('#tabbar').innerHTML = `<div class="tabbar-inner">${VIEWS.filter((v) => !v[3]).map(([k, l, i]) => `<button type="button" class="tab" data-view="${k}">${ICONS[i]}${l}</button>`).join('')}</div>`;
$('#tabbar').addEventListener('click', (e) => { const t = e.target.closest('.tab'); if (t) go(t.dataset.view); });
$('#brand-mark').innerHTML = ICONS.logo;
$('#btn-apps').innerHTML = ICONS.grid;
$('#btn-settings').innerHTML = ICONS.user;
parseHash();
mirrorCourtLab();
render();
connectStore(() => { mirrorCourtLab(); refresh(); });
(async () => {
  if (!window.claude?.use) return;
  try { ai = await claude.use('sample'); } catch { ai = null; }
  if (ai) refresh();
})();
// Day rollover while the app stays open.
let lastDay = todayIso();
setInterval(() => { if (todayIso() !== lastDay) { lastDay = todayIso(); refresh(); } }, 60000);

</script>

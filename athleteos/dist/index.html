<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Athlete OS</title>
<meta name="description" content="Athlete performance headquarters: analytics, basketball shot charts, testing and PRs, recovery, nutrition from MacroLens, and AI coaching.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Athlete OS: the same tokens as MacroLens, so both pages read as one product. */
:root {
  --bg: #eef2fb; --surface: #ffffff; --surface-2: #e6ebf7; --line: #d5ddef;
  --fg: #0b1330; --muted: #5b6687; --accent: #2563eb; --accent-ink: #ffffff; --accent-soft: #dbe6ff;
  --protein: #3b7dd8; --carbs: #d99a12; --fat: #d2508f; --water: #1f9fd0; --over: #e0662a; --danger: #c93c3c;
  --good: #16a34a; --purple: #7c3aed; --glow: rgba(37, 99, 235, .2); --warn: #d97706;
  --hb: #2563eb; --str: #7c3aed; --cond: #0ea5a4; --oth: #94a3b8;
  --h0: #e3e8f4; --h1: #bcd2ff; --h2: #6ea2ff; --h3: #2563eb; --h4: #7c3aed;
  --scrim: rgba(10, 14, 30, .5); --shadow: rgba(20, 30, 70, .06);
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #060a17; --surface: #0d1430; --surface-2: #161f42; --line: #222d57;
    --fg: #eef2ff; --muted: #8e9ac4; --accent: #3d8bff; --accent-soft: #14295c;
    --protein: #4da3ff; --carbs: #ffc23d; --fat: #c77dff; --water: #33d1ff; --over: #ff8a4c; --danger: #ff6b7a;
    --good: #2fd68a; --purple: #8b5cff; --glow: rgba(61, 139, 255, .35); --warn: #ffb547;
    --hb: #3d8bff; --str: #8b5cff; --cond: #2dd4bf; --oth: #64748b;
    --h0: #161f42; --h1: #173a7a; --h2: #2563eb; --h3: #3d8bff; --h4: #9b6bff;
    --scrim: rgba(2, 4, 14, .72); --shadow: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #060a17; --surface: #0d1430; --surface-2: #161f42; --line: #222d57;
  --fg: #eef2ff; --muted: #8e9ac4; --accent: #3d8bff; --accent-soft: #14295c;
  --protein: #4da3ff; --carbs: #ffc23d; --fat: #c77dff; --water: #33d1ff; --over: #ff8a4c; --danger: #ff6b7a;
  --good: #2fd68a; --purple: #8b5cff; --glow: rgba(61, 139, 255, .35); --warn: #ffb547;
  --hb: #3d8bff; --str: #8b5cff; --cond: #2dd4bf; --oth: #64748b;
  --h0: #161f42; --h1: #173a7a; --h2: #2563eb; --h3: #3d8bff; --h4: #9b6bff;
  --scrim: rgba(2, 4, 14, .72); --shadow: rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
:root[data-theme="dark"] body, :root:not([data-theme="light"]) body {
  background: radial-gradient(1200px 520px at 50% -180px, rgba(84, 70, 255, .22), transparent 70%), radial-gradient(900px 600px at 110% 30%, rgba(61, 139, 255, .10), transparent 60%), var(--bg);
  background-attachment: fixed;
}
.wrap { max-width: 1080px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 17px; font-weight: 600; }
h4 { font-size: 14px; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--danger); }
.flat { color: var(--muted); }

/* header */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
:root[data-theme="dark"] .topbar, :root:not([data-theme="light"]) .topbar { background: rgba(6, 10, 23, .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: -.3px; white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; box-shadow: 0 6px 18px -6px var(--glow); }
.brand .mark svg { width: 17px; height: 17px; }
.brand i { font-style: normal; color: var(--accent); }
.top-actions { display: flex; align-items: center; gap: 8px; min-width: 0; }
.sync { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.sync[data-s="synced"]::before { background: var(--good); box-shadow: 0 0 6px var(--good); }
.sync[data-s="error"]::before { background: var(--over); }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; flex: none; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: grid; place-items: center; color: var(--fg); }
.icon-btn svg { width: 19px; height: 19px; }
.fuel-link { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 12px; font-weight: 600; font-size: 13px; text-decoration: none; color: #fff; background: linear-gradient(135deg, var(--accent), var(--purple)); box-shadow: 0 8px 20px -10px var(--glow); white-space: nowrap; }

/* layout */
.view { display: grid; gap: 14px; }
.view[hidden] { display: none !important; }
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .span2 { grid-column: span 2; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: 0 1px 2px var(--shadow); min-width: 0; position: relative; }
:root[data-theme="dark"] .card, :root:not([data-theme="light"]) .card { background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0) 40%), var(--surface); border-color: rgba(120, 140, 255, .16); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 12px 30px -18px rgba(0, 0, 0, .8); }
.card.ai { border-color: rgba(139, 92, 255, .45); }
.card.ai::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(135deg, rgba(139, 92, 255, .16), rgba(61, 139, 255, .06) 55%, transparent); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head .sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.section-label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-family: var(--f-body); font-weight: 600; margin: 8px 2px -4px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 10px; }
.hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

/* controls */
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 16px; font-weight: 600; cursor: pointer; text-decoration: none; color: var(--fg); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border-color: transparent; box-shadow: 0 8px 22px -8px var(--glow); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--fg); }
.chip.on { background: var(--accent); color: #fff; border-color: transparent; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px var(--shadow); }
:root[data-theme="dark"] .seg button.on, :root:not([data-theme="light"]) .seg button.on { background: var(--accent); color: #fff; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; color: var(--fg); font-size: 16px; min-width: 0; }
textarea { min-height: 80px; resize: vertical; }
.fields { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fields .full { grid-column: 1 / -1; }
.check { display: flex; align-items: center; gap: 8px; color: var(--fg); }
.check input { width: auto; }

/* subnav */
.subnav { position: sticky; top: calc(58px + env(safe-area-inset-top, 0px)); z-index: 4; display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; margin-bottom: -6px; background: var(--bg); scrollbar-width: none; }
:root[data-theme="dark"] .subnav, :root:not([data-theme="light"]) .subnav { background: rgba(6, 10, 23, .86); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
.subnav::-webkit-scrollbar { display: none; }
.subnav button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 7px 13px; border-radius: 99px; font-weight: 600; font-size: 13px; cursor: pointer; }
.subnav button.on { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border-color: transparent; }

/* tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
:root[data-theme="dark"] .tabbar, :root:not([data-theme="light"]) .tabbar { background: rgba(9, 14, 34, .86); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-top-color: rgba(120, 140, 255, .14); }
.tabbar-inner { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
.tab { background: none; border: 0; color: var(--muted); font-size: 11px; font-weight: 600; display: grid; justify-items: center; gap: 3px; cursor: pointer; padding: 4px; }
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }
.tab.on svg { filter: drop-shadow(0 0 6px var(--glow)); }

/* KPIs */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 760px) { .kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface-2); border-radius: 14px; padding: 12px; min-width: 0; }
.kpi small { display: block; color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.kpi b { display: block; font-family: var(--f-display); font-size: 24px; font-weight: 700; letter-spacing: -.5px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .delta { font-size: 12px; font-weight: 600; }
.big { font-family: var(--f-display); font-size: 34px; font-weight: 700; letter-spacing: -.8px; line-height: 1; font-variant-numeric: tabular-nums; }
.delta-pill { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 700; background: var(--surface-2); }
.delta-pill.up { background: color-mix(in srgb, var(--good) 16%, transparent); }
.delta-pill.down { background: color-mix(in srgb, var(--danger) 16%, transparent); }

/* greeting */
.hero { padding: 18px; overflow: hidden; }
.hero h1 { font-size: 24px; font-weight: 700; letter-spacing: -.5px; }
.hero::after { content: ""; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(61, 139, 255, .35), transparent 70%); pointer-events: none; }
.tagline { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.tag { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag.blue { background: var(--accent-soft); color: var(--fg); }

/* rings */
.rings { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 10px; align-items: start; }
.ring { display: grid; justify-items: center; gap: 4px; text-align: center; min-width: 0; }
.row > .ring { flex: none; }
.ring-svg { position: relative; }
.ring-svg svg { display: block; transform: rotate(-90deg); }
.ring-svg .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring-svg .center b { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.ring .lab { font-size: 12px; font-weight: 600; }
.ring .sub { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ring circle.fg { transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }

/* charts */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis text { fill: var(--muted); font-size: 10.5px; font-family: var(--f-body); }
.chart .grid line { stroke: var(--line); stroke-dasharray: 3 4; }
.chart .hit { cursor: pointer; }
.tip { position: absolute; pointer-events: none; z-index: 3; transform: translate(-50%, calc(-100% - 12px)); background: var(--fg); color: var(--bg); padding: 6px 9px; border-radius: 9px; font-size: 12px; font-weight: 600; white-space: normal; width: max-content; max-width: min(280px, 86vw); box-shadow: 0 8px 20px -6px rgba(0, 0, 0, .5); }
:root[data-theme="dark"] .tip, :root:not([data-theme="light"]) .tip { background: #eef2ff; color: #0b1330; }
.tip small { display: block; font-weight: 500; opacity: .7; font-size: 11px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.chart-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.latest .big { font-size: 30px; }
.latest small { display: block; color: var(--muted); font-size: 12px; }

/* empty state */
.empty { display: grid; justify-items: center; text-align: center; gap: 8px; padding: 22px 12px; border: 1px dashed var(--line); border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.empty .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.empty .ico svg { width: 22px; height: 22px; }
.empty b { font-family: var(--f-display); font-size: 15px; }
.empty p { color: var(--muted); font-size: 13px; max-width: 34ch; }

/* heatmap */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat button { width: 15px; height: 15px; border-radius: 4px; border: 0; padding: 0; background: var(--h0); cursor: pointer; }
.heat button[data-l="1"] { background: var(--h1); }
.heat button[data-l="2"] { background: var(--h2); }
.heat button[data-l="3"] { background: var(--h3); box-shadow: 0 0 6px var(--glow); }
.heat button[data-l="4"] { background: var(--h4); box-shadow: 0 0 8px rgba(139, 92, 255, .6); }
.heat button.future { opacity: .25; cursor: default; }
.heat button.sel { outline: 2px solid var(--fg); outline-offset: 1px; }
.heat-legend { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.heat-legend span { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* lists */
.list { display: grid; }
.li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li > div { min-width: 0; }
.li .t { font-weight: 600; overflow-wrap: anywhere; }
.li .s { color: var(--muted); font-size: 12.5px; }
.li .v { font-family: var(--f-display); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.li-btn { width: 100%; background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; color: inherit; padding: 11px 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }

/* PR tiles */
.pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pr { text-align: left; background: var(--surface-2); border: 1px solid transparent; border-radius: 14px; padding: 12px; cursor: pointer; color: inherit; min-width: 0; }
.pr.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
.pr small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; }
.pr b { display: block; font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; margin: 2px 0; }
.pr .none { color: var(--muted); font-size: 13px; font-weight: 600; }

/* court */
.court-wrap { max-width: 520px; margin: 0 auto; }
.court svg { width: 100%; height: auto; display: block; }
.court .zone { cursor: pointer; transition: opacity .2s; }
.court .zone:hover { opacity: .85; }
.court text { font-family: var(--f-display); pointer-events: none; }
.counter { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.counter .btn { padding: 16px; font-size: 16px; }
.make { background: color-mix(in srgb, var(--good) 22%, var(--surface-2)) !important; }
.miss { background: color-mix(in srgb, var(--danger) 18%, var(--surface-2)) !important; }

/* sheets */
dialog.sheet { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 560px; max-height: 92vh; background: var(--surface); color: var(--fg); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .4); }
@media (min-width: 640px) { dialog.sheet { margin: auto; border-radius: 22px; } }
dialog.sheet::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.sheet-in { padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; overflow-y: auto; max-height: 92vh; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 20; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: .25s; max-width: calc(100vw - 32px); pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* PR celebration */
.celebrate { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim); animation: fade .25s; }
.celebrate .box { position: relative; text-align: center; padding: 28px 26px; border-radius: 24px; background: linear-gradient(160deg, #1a2350, #0d1430); color: #fff; box-shadow: 0 0 0 1px rgba(139, 92, 255, .5), 0 20px 60px rgba(61, 139, 255, .45); animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); max-width: 320px; }
.celebrate .box .big { font-size: 44px; background: linear-gradient(135deg, #7fb6ff, #c3a6ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.celebrate .trophy { font-size: 46px; filter: drop-shadow(0 0 16px rgba(255, 200, 80, .7)); animation: bounce 1s ease-in-out infinite alternate; }

/* AI */

/* recovery band */

.scale { display: flex; gap: 6px; }

/* apps */

}

/* ===== Edition 2 ===== */
/* calendar */

.cal-h { text-align: center; font-size: 11px; font-weight: 700; color: var(--muted); padding-bottom: 2px; }
.cal-d { position: relative; aspect-ratio: 1 / 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; display: grid; align-content: start; justify-items: start; padding: 4px 5px; font-weight: 600; font-size: 12.5px; }
.cal-d.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cal-d.sel { background: linear-gradient(135deg, var(--accent), var(--purple)); color: #fff; border-color: transparent; }

.cal-d.sel .cal-done { color: #fff; }
/* timeline */
.tl { display: grid; gap: 0; position: relative; padding-left: 18px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--accent), var(--purple)); border-radius: 2px; }
.tl-i { position: relative; display: grid; gap: 1px; padding: 8px 0 8px 8px; }

.tl-d { font-size: 11.5px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .04em; }
/* profile */

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }

.ach-i { font-size: 20px; }

/* reports */

.report-sec { padding: 14px 0; border-bottom: 1px solid var(--line); }

.widgets .card { animation: rise .35s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .widgets .card { animation: none; } }
.scale button:disabled, .chip:disabled { opacity: .4; cursor: default; }
details > summary { list-style: none; }
details > summary::-webkit-details-marker { display: none; }

/* ===== Expansion 2 ===== */
@media (max-width: 400px) { .tab { font-size: 10px; padding: 4px 1px; } .tab svg { width: 21px; height: 21px; } }
/* week view */

/* routines */

/* guided player */

/* mind */
.mslider { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 99px; padding: 0; border: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 30%, var(--surface-2)), var(--c)); margin: 8px 0 2px; }

.ex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.ex-card { position: relative; display: grid; gap: 4px; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 18%, var(--surface-2)), var(--surface-2)); color: var(--fg); cursor: pointer; }
.ex-card b { font-family: var(--f-display); font-size: 16px; }

.jentry { padding: 12px 0; border-top: 1px solid var(--line); display: grid; gap: 4px; }
.jentry:first-of-type { border-top: 0; }
/* goal roadmap */

.lane { display: grid; align-content: start; gap: 8px; scroll-snap-align: start; padding: 10px; border-radius: 14px; background: color-mix(in srgb, var(--surface-2) 60%, transparent); min-width: 0; }

.lab-h { background: color-mix(in srgb, var(--purple) 20%, transparent); color: var(--purple); }

.lab-x b { font-size: 14px; } .lab-x span { font-size: 12.5px; color: var(--muted); }
.lab-x:hover { border-color: var(--purple); }
@media (max-width: 430px) { .pe-grid { grid-template-columns: minmax(0, 1fr) 48px 58px 46px; gap: 5px 4px; } .pe-l { font-size: 12px; } .lab-table { font-size: 12.5px; } .ld-r { grid-template-columns: 80px minmax(0, 1fr) 70px; } .tab { font-size: 9px; } }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.lab-kbtn { border: 0; text-align: left; cursor: pointer; color: var(--fg); font: inherit; }
.lab-kbtn:hover { outline: 1px solid var(--purple); }
.lab-table.lab-cmp .lt-h > span, .lab-table.lab-cmp .lt-r > * { min-width: 0; overflow-wrap: anywhere; }
.lab-table.lab-cmp .lt-h > span { text-transform: none; letter-spacing: 0; font-size: 11.5px; }
.cmp-g { display: grid; gap: 6px; margin-bottom: 14px; }
.cmp-b { display: grid; grid-template-columns: minmax(0, 120px) minmax(0, 1fr) 56px; gap: 8px; align-items: center; }
.cmp-b > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-b > div { height: 10px; background: var(--surface-2); border-radius: 6px; overflow: hidden; } .cmp-b > div i { display: block; height: 100%; border-radius: 6px; }
.cmp-b b { text-align: right; }
@media (max-width: 430px) { .lab-table.lab-cmp { font-size: 11.5px; } .cmp-b { grid-template-columns: 84px minmax(0, 1fr) 48px; } }
/* Brand = suite switcher */
.brand#suite-host { gap: 0; }
/* Home chart dashboard */
.tabbar-inner { grid-template-columns: repeat(7, 1fr); }
.vz-grid { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .vz-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vz { background: var(--surface-2); border-radius: 14px; padding: 12px 12px 6px; min-width: 0; }
.vz-h { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.vz-h b { font-size: 13.5px; }
.vz-none { padding: 26px 0; text-align: center; margin: 0; }
/* Do first */
.df { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.df-list { display: grid; gap: 8px; }
.df-i { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; }
.df-i b { display: block; font-size: 14.5px; }
.df-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.df-ic svg { width: 19px; height: 19px; }
.df-chk { margin: 0; white-space: nowrap; }
/* Up next */
.un-row { display: grid; grid-template-columns: 4px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px 10px 0; background: var(--surface-2); border-radius: 12px; margin-bottom: 6px; overflow: hidden; }
.un-row > i { align-self: stretch; background: var(--c); }
.un-row b { display: block; font-size: 16px; overflow-wrap: anywhere; }
/* Week calendar */
.tl-strip { position: relative; height: 22px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.tl-strip i { position: absolute; top: 3px; bottom: 3px; border-radius: 5px; opacity: .9; }
.tl-strip b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.tl-axis { display: flex; justify-content: space-between; margin: 3px 0 12px; }
.wkc { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.wkc-d { position: relative; display: grid; justify-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; min-width: 0; font: inherit; }
.wkc-d.today { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.wkc-d > b { font: 700 18px var(--f-display); }
.wkc-ev { display: flex; gap: 2px; min-height: 6px; align-items: center; } .wkc-ev i { width: 6px; height: 6px; border-radius: 50%; } .wkc-ev em { font-size: 9px; font-style: normal; color: var(--muted); }
.wkc-l { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); padding: 0 2px; }
.wkc-gp { position: absolute; top: 4px; right: 4px; font-size: 9.5px; font-weight: 700; background: #22c55e; color: #04140b; border-radius: 99px; padding: 0 5px; }
.wkc-tr { font-size: 10px; font-weight: 700; color: var(--good); }
/* Command Center */
.cc { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.cc-brief { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
.cc-brief p { margin: 3px 0 0; font-size: 14.5px; line-height: 1.5; }
.cc-sys { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
@media (min-width: 760px) { .cc-sys { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.cc-s { display: grid; justify-items: start; gap: 2px; text-align: left; border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface-2); border-radius: 12px; padding: 8px 9px; color: var(--fg); cursor: pointer; font: inherit; min-width: 0; }
.cc-s .cc-ic { color: var(--c); width: 18px; height: 18px; } .cc-s .cc-ic svg { width: 18px; height: 18px; }
.cc-n { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.cc-s b { font-size: 13px; overflow-wrap: anywhere; } .cc-s em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--c); }
.cc-pri { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 6px; } .cc-pri li b { display: block; font-size: 14px; }
/* Patterns */
.pt-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.pt-wd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 90px; align-items: end; }
.pt-wd > div { display: grid; justify-items: center; gap: 3px; height: 100%; align-content: end; }
.pt-wd i { width: 70%; border-radius: 6px 6px 3px 3px; display: block; }
button.cc-pt { display: block; width: 100%; text-align: left; border: 1px dashed color-mix(in srgb, var(--purple) 50%, transparent); color: var(--fg); font: inherit; cursor: pointer; }
/* School */
.mode-school .tabbar { display: none; }
.mode-school body { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
.sc-load { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 120px; align-items: end; }
.sc-load > div { display: grid; justify-items: center; gap: 3px; height: 100%; align-content: end; }
.sc-load i { width: 64%; border-radius: 6px 6px 3px 3px; background: linear-gradient(180deg, #38bdf8, #0284c7); display: block; }
.sc-bars { display: grid; gap: 10px; }
.sc-bar { display: grid; grid-template-columns: minmax(0, 110px) minmax(0, 1fr) 70px; gap: 8px; align-items: center; }
.sc-bar > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-bar > div { position: relative; height: 12px; background: var(--surface-2); border-radius: 6px; }
.sc-bar > div i { display: block; height: 100%; border-radius: 6px; }
.sc-bar > div b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .5; }
.sc-bar > span:last-child { text-align: right; }
.wkc-sc { position: absolute; top: 4px; left: 4px; font-size: 9.5px; font-weight: 700; background: #0ea5e9; color: #04141f; border-radius: 99px; padding: 0 5px; }
.sc-load, .pt-wd { align-items: stretch; }
.sc-load > div, .pt-wd > div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; min-height: 0; }
.sc-load > div i, .pt-wd > div i { flex: none; }
/* Command Center 2.0 */
.d2-status { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: color-mix(in srgb, var(--c) 12%, var(--surface-2)); border-left: 4px solid var(--c); margin-bottom: 10px; }
.d2-status p { margin: 0; font-size: 14.5px; line-height: 1.5; }
.d2-badge { justify-self: start; font: 700 11.5px var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.d2-brief { margin-top: 12px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.d2-bh { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px; background: var(--surface-2); }
.d2-row { display: grid; grid-template-columns: 22px 78px minmax(0, 1fr); gap: 8px; padding: 9px 12px; border-top: 1px solid var(--line); align-items: start; font-size: 13.5px; }
.d2-ic { width: 20px; height: 20px; color: var(--accent); } .d2-ic svg { width: 18px; height: 18px; }
.d2-k { font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.d2-v { overflow-wrap: anywhere; }
.d2-more { margin-top: 10px; }
.d2-mode { margin-top: 12px; max-width: 240px; }
.home-compact .card-head .sub, .home-compact .d2-more, .home-compact .vz-h .muted { display: none; }
.home-compact .d2-row:nth-child(n+6) { display: none; }
.d2-pin { margin-left: auto; border: 0; background: none; color: var(--warn); font-size: 16px; cursor: pointer; padding: 0 0 0 6px; line-height: 1; }
.vz-h { align-items: center; }
.d2-heat { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
.d2-heat > div { display: grid; grid-template-rows: repeat(7, 1fr); gap: 3px; }
.d2-heat i, .d2-hl i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--h0); }
.d2-hl i { width: 10px; }
.d2-heat i.h1, .d2-hl i.h1 { background: var(--h1); } .d2-heat i.h2, .d2-hl i.h2 { background: var(--h2); } .d2-heat i.h3, .d2-hl i.h3 { background: var(--h3); } .d2-heat i.h4, .d2-hl i.h4 { background: var(--h4); }
.d2-heat i.fut { background: transparent; border: 1px dashed var(--line); }
.d2-hl { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
.d2-tl { position: relative; height: 26px; border-radius: 8px; background: var(--surface-2); }
.d2-tl::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 2px; background: var(--line); }
.d2-tl i { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; z-index: 1; border: 2px solid var(--surface); }
.d2-ev { display: grid; gap: 8px; margin-top: 10px; }
.d2-e { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 8px; align-items: start; } .d2-e b { display: block; font-size: 13.5px; }

/* Athlete suite: the app switcher, identical on every page. Uses each page's own tokens (--fg, --muted, --surface…). */
.suite { position: relative; display: inline-flex; min-width: 0; z-index: 30; }
.suite-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 6px 4px 0; border-radius: 12px; font: 700 18px/1.1 var(--f-display); letter-spacing: -.2px; min-width: 0; }
.suite-btn .suite-name { white-space: nowrap; }
.suite-btn .suite-name i { font-style: normal; color: var(--suite-c); }
.suite-btn svg { color: var(--muted); flex: none; transition: transform .15s; }
.suite-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.suite-btn:focus-visible { outline: 2px solid var(--suite-c); outline-offset: 2px; }
.suite-mark { width: 26px; height: 26px; border-radius: 8px; flex: none; background: linear-gradient(135deg, var(--suite-c), color-mix(in srgb, var(--suite-c) 55%, #7c3aed)); box-shadow: 0 6px 16px -8px var(--suite-c); position: relative; }
.suite-mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); }
.suite-menu { position: absolute; left: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .45); }
.suite-head { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 6px; }
.suite-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; color: var(--fg); text-decoration: none; }
.suite-item:hover, .suite-item:focus-visible { background: var(--surface-2); outline: none; }
.suite-item i { width: 10px; height: 34px; border-radius: 5px; background: var(--c); flex: none; }
.suite-item span { min-width: 0; flex: 1; }
.suite-item b { display: block; font: 600 15px var(--f-body); }
.suite-item small { display: block; color: var(--muted); font: 400 12.5px/1.3 var(--f-body); }
.suite-item em { font: 600 11px var(--f-body); font-style: normal; color: var(--c); }
.suite-item.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
.suite-item.going { opacity: .6; }

/* ===================== COURTSIDE LOOK =====================
   Layout concept: a scoreboard header, then cards grouped under quiet section labels; solid accents instead of
   blue-to-purple gradients; hardwood amber reserved for streaks and records; big tabular numbers like a scoreboard.
   Loaded after os.css: it only restyles. Light and dark both come from the existing tokens plus three new ones. */
:root { --amber: #c2410c; --amber-soft: #fdebdc; --card-r: 20px; --hair: color-mix(in srgb, var(--line) 70%, transparent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --amber: #ff9b54; --amber-soft: #33200f; --hair: rgba(140, 160, 255, .12); } }
:root[data-theme="dark"] { --amber: #ff9b54; --amber-soft: #33200f; --hair: rgba(140, 160, 255, .12); }

/* ground: one quiet glow, no purple wash */
:root[data-theme="dark"] body, :root:not([data-theme="light"]) body { background: radial-gradient(900px 420px at 50% -220px, rgba(61, 139, 255, .16), transparent 70%), var(--bg); background-attachment: fixed; }

/* header */
.topbar { border-bottom: 1px solid var(--hair); padding-block: 9px; }
.top-actions { gap: 6px; }
.icon-btn { border-radius: 12px; border-color: var(--hair); background: var(--surface-2); }
.fuel-link { background: var(--surface-2); color: var(--fg); border: 1px solid var(--hair); box-shadow: none; }
.fuel-link::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #eab308; }

/* buttons: solid accent with a top highlight */
.btn { border-radius: 12px; border-color: var(--hair); transition: background .15s, border-color .15s, transform .1s; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .22), 0 6px 18px -10px var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #fff); }
.chip.on, .seg button.on { background: var(--accent); color: #fff; border-color: transparent; }
.ai-badge { background: var(--purple); }
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:active { transform: none; } }

/* sub navigation: calm pills, active = accent tint */
.subnav { padding-top: 6px; }
.subnav button { background: transparent; border-color: var(--hair); color: var(--muted); }
.subnav button:hover { color: var(--fg); }
.subnav button.on { background: var(--accent-soft); color: var(--fg); border-color: color-mix(in srgb, var(--accent) 55%, transparent); box-shadow: none; }

/* tab bar: active tab sits in a pill */
.tab { position: relative; padding: 6px 2px 4px; }
.tab svg { width: 22px; height: 22px; padding: 3px 12px; box-sizing: content-box; border-radius: 99px; transition: background .15s; }
.tab.on { color: var(--fg); }
.tab.on svg { color: var(--accent); background: var(--accent-soft); filter: none; }
@media (max-width: 430px) { .tab svg { padding: 3px 8px; } }

/* cards: one radius, hairline border, less glow */
.card { border-radius: var(--card-r); border-color: var(--hair); }
:root[data-theme="dark"] .card, :root:not([data-theme="light"]) .card { background: var(--surface); border-color: var(--hair); box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset; }
.card-head h3 { font-size: 17.5px; letter-spacing: -.2px; }
.card-head .sub { font-size: 12.5px; }
.widgets .card { animation: none; }
.list .li { transition: background .12s; }
.empty { border-radius: 16px; border-color: var(--hair); }

/* numbers read like a scoreboard */
.kpi { background: var(--surface-2); border: 1px solid var(--hair); border-radius: 16px; }
.kpi small { font-size: 11px; letter-spacing: .08em; }
.kpi b { font-size: 26px; letter-spacing: -.6px; }
.tag { border: 1px solid var(--hair); }

/* Home: scoreboard header */
.look-hero { padding: 18px 18px 14px; }
.look-hero::after { opacity: .5; }
.look-hero h1 { font-size: 26px; }
.sb { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.sb-cell { display: grid; justify-items: center; align-content: start; gap: 2px; text-align: center; padding: 10px 2px 8px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--hair); min-width: 0; }
.sb-cell .ring { gap: 0; }
.sb-cell circle:not(.fg) { stroke: var(--line); }
.sb-cell circle.fg { filter: none !important; }
.sb-n { font: 700 14px var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
.sb-l { font: 600 10px var(--f-body); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 4px; }
.sb-s { font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sb-streak { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px; border-radius: 16px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); }
.sb-fire { display: grid; flex: none; } .sb-fire svg { width: 20px; height: 20px; }
.sb-st { display: flex; align-items: center; gap: 8px; flex: none; }
.sb-st span { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .06em; }
.sb-st small { font-weight: 500; text-transform: none; letter-spacing: 0; opacity: .85; }
.sb-big { font: 700 30px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.8px; }
.sb-days { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; flex: 1; min-width: 0; margin-left: auto; max-width: 240px; }
.sb-days i { aspect-ratio: 1; border-radius: 4px; background: color-mix(in srgb, var(--amber) 16%, transparent); max-width: 100%; }
.sb-days i.on { background: var(--amber); }
.sb-days i.now { outline: 2px solid var(--fg); outline-offset: 1px; }
@media (max-width: 380px) { .sb-l { font-size: 9px; letter-spacing: .02em; } }
.jump { display: flex; gap: 6px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; border: 1px solid var(--hair); background: transparent; color: var(--fg); border-radius: 99px; padding: 6px 14px; font: 600 13px var(--f-body); cursor: pointer; }
.jump button:hover { background: var(--surface-2); }
.d2-mode { margin-top: 12px; }

/* Home: section labels */
.sec-label { display: flex; align-items: baseline; gap: 10px; padding: 14px 4px 0; scroll-margin-top: calc(70px + env(safe-area-inset-top, 0px)); }
.sec-label h2 { font: 700 13px var(--f-body); text-transform: uppercase; letter-spacing: .12em; color: var(--fg); }
.sec-label span { font-size: 12.5px; color: var(--muted); }
.sec-label::after { content: ""; flex: 1; height: 1px; background: var(--hair); align-self: center; }
.widgets [data-group="progress"] .card-head h3::before, .widgets [data-group="progress"].card .card-head h3::before { content: none; }

/* Command Center: stronger hierarchy */
.cc { border-color: color-mix(in srgb, var(--accent) 35%, var(--hair)); }
.d2-status { border-left-width: 0; border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); }
.d2-badge { display: inline-flex; align-items: center; gap: 6px; }
.d2-badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 25%, transparent); }
.cc-s { border-top-width: 1px; border-color: var(--hair); position: relative; overflow: hidden; }
.cc-s::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); }
.d2-brief { border-color: var(--hair); }
.d2-row:nth-child(even) { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }

/* charts */
.chart .axis text { font-variant-numeric: tabular-nums; }
.vz { border: 1px solid var(--hair); }
.legend span { display: inline-flex; align-items: center; }

/* records and streak moments use the amber */
.d2-e .d2-ic[style*="--warn"], .tag.pr { color: var(--amber); }
.celebrate .big, .pr-grid .v { color: var(--amber); }

/* ---- app-wide pass: the last gradients become solid, rings lose their glow ---- */
:root { --court-mid: #c9c6c0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --court-mid: #3b4160; } }
:root[data-theme="dark"] { --court-mid: #3b4160; }
.brand .mark, .avatar, .prio-n { background: var(--accent); }
.bar > i { background: var(--accent); }
.cal-d.sel { background: var(--accent); }

// ---- suite.js ----
// ===================== Athlete suite: shared across every page of the bundle =====================
// One app switcher (the app's name, top-left, on every page), one theme setting, one list of apps.
// Each page calls Suite.mount(el, '<app id>', beforeLeave) — beforeLeave saves pending changes before navigating.
(function () {
  const APPS = [
    { id: 'hub', name: 'Hub', plain: 'Hub', href: 'hub.html', desc: 'Every app in one place: your day, alerts and graphs', color: '#14b8a6' },
    { id: 'aos', name: 'Athlete<i>OS</i>', plain: 'Athlete OS', href: 'index.html', desc: 'Training, performance, load and the Lab', color: '#3d8bff' },
    { id: 'gp', name: 'Game<i>plan</i>', plain: 'Gameplan', href: 'gameplan.html', desc: 'Your day hour by hour, Top 3, night routine', color: '#22c55e' },
    { id: 'school', name: 'School', plain: 'School', href: 'school.html', desc: 'Classes, assignments, tests and grades', color: '#0ea5e9' },
    { id: 'btc', name: 'Training<i>Center</i>', plain: 'Training Center', href: 'btc.html', desc: 'Drills, workouts and running your sessions', color: '#f97316' },
    { id: 'ml', name: 'Macro<i>Lens</i>', plain: 'MacroLens', href: 'macrolens.html', desc: 'Food, macros, water and game-day fuel', color: '#eab308' },
  ];
  const THEME_KEY = 'macrolens-theme';
  function theme() {
    let c = 'dark'; try { c = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
    if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c); else document.documentElement.removeAttribute('data-theme');
  }
  const chev = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  function mount(el, current, beforeLeave) {
    if (!el) return;
    const me = APPS.find((a) => a.id === current) || APPS[0];
    el.classList.add('suite');
    el.style.setProperty('--suite-c', me.color);
    el.innerHTML = `<button type="button" class="suite-btn" aria-haspopup="menu" aria-expanded="false" aria-label="${me.plain}: switch app"><span class="suite-mark" aria-hidden="true"></span><span class="suite-name">${me.name}</span>${chev}</button>
      <div class="suite-menu" role="menu" hidden><div class="suite-head">Your apps · same data</div>${APPS.map((a) => `<a role="menuitem" class="suite-item${a.id === me.id ? ' on' : ''}" href="${a.href}" data-suite="${a.id}" style="--c:${a.color}" ${a.id === me.id ? 'aria-current="page"' : ''}><i></i><span><b>${a.plain}</b><small>${a.desc}</small></span>${a.id === me.id ? '<em>Here</em>' : ''}</a>`).join('')}</div>`;
    const btn = el.querySelector('.suite-btn'), menu = el.querySelector('.suite-menu');
    const set = (open) => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('.suite-item:not(.on)')?.focus(); };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(menu.hidden); });
    document.addEventListener('click', (e) => { if (!el.contains(e.target)) set(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { set(false); btn.focus(); } });
    menu.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-suite]'); if (!a) return;
      e.preventDefault(); e.stopPropagation();
      if (a.dataset.suite === me.id) return set(false);
      a.classList.add('going');
      try { await Promise.race([Promise.resolve(beforeLeave?.()), new Promise((r) => setTimeout(r, 2500))]); } catch {}
      location.href = a.getAttribute('href');
    });
  }
  window.Suite = { APPS, mount, theme, THEME_KEY };
})();

'use strict';
// ===================== storage =====================
// Athlete OS and MacroLens are two pages of one artifact. They share this device's storage (the "ml:" keys) and the
// same private Claude account collection, so a meal logged in MacroLens and a workout logged here are the same records.
// Docs from MacroLens: "core" {profile, targets, overrides, weights, measures, health, prefs...} and "day-YYYY-MM-DD"
// {breakfast, lunch, dinner, snacks, water, exercise, feel, type}. Athlete OS adds "aos", "aos-tests", "aos-shots",
// "aos-games", "aos-body" and "aos-coach".
const cache = {};
let remote = null;
const pending = new Set();
let flushing = false, flushTimer = null, flushPromise = null;
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('ml:' + k, JSON.stringify(v)); } catch {} };
const lsKeys = () => { try { return Object.keys(localStorage).filter((k) => k.startsWith('ml:')).map((k) => k.slice(3)); } catch { return []; } };
const BLANK = {
  core: () => ({ profile: null, targets: null, overrides: {}, custom: [], recents: [], weights: [] }),
  aos: () => ({ profile: {}, customTests: [] }),
  'aos-tests': () => ({ results: [] }),
  'aos-shots': () => ({ sessions: [] }),
  'aos-games': () => ({ games: [] }),
  'aos-body': () => ({ entries: [] }),
  'aos-coach': () => ({ workouts: [], reports: [], chat: [] }),
  'aos-handles': () => ({ sessions: [] }),
  'aos-finish': () => ({ sessions: [] }),
  'aos-film': () => ({ entries: [] }),
  'aos-goals': () => ({ goals: [] }),
  'aos-plan': () => ({ events: [], routines: [], checks: {} }),
  'aos-lib': () => ({ workouts: [], favs: [] }),
  'aos-mind': () => ({ checks: {}, journal: [], sessions: [] }),
  'aos-intel': () => ({ ins: {}, recs: {}, reviews: {} }),

function doc(key) {
  if (!(key in cache)) cache[key] = lsGet(key) ?? (BLANK[key] ? BLANK[key]() : null);
  return cache[key];
}

const aos = () => doc('aos');
const blankDay = () => ({ breakfast: [], lunch: [], dinner: [], snacks: [], water: 0 });
function dayDoc(date, create = false) {
  const k = 'day-' + date;
  if (!doc(k) && create) cache[k] = blankDay();
  return cache[k];
}
function persist(key) {

});
const inRange = (iso, r) => r === 'all' || daysBetween(iso, todayIso()) < Number(r);
const rangeStart = (r, pts) => (r === 'all' ? pts[0]?.date || todayIso() : shiftIso(todayIso(), -(Number(r) - 1)));

const ML = (route) => `macrolens.html${route ? '#' + route : ''}`;
const mlLink = (route, label, cls = 'btn sm') => `<a class="${cls}" data-ml href="${ML(route)}">${label}</a>`;
function greeting() { const h = new Date().getHours(); return h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
const fmtClock = (hhmm) => { if (!hhmm) return ''; const [h, m] = hhmm.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h < 12 ? 'AM' : 'PM'}`; };
const addMin = (hhmm, m) => { const [h, mm] = hhmm.split(':').map(Number); const t = (h * 60 + mm + Number(m)) % 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };

function homeToday(el) {
  const today = todayIso(), d = dayDoc(today) || {}, pr = d.practice, sch = core().sched, rows = [];
  if (pr?.start) rows.push({ t: pr.start, title: `${pr.type === 'game' ? 'Game' : 'Practice'} · ${fmtDur(Number(pr.mins) || 120)}`, s: `Ends ${fmtClock(addMin(pr.start, Number(pr.mins) || 120))}`, c: 'var(--hb)' });
  if (sch?.on) for (const [k, l] of [['breakfast', 'Breakfast'], ['lunch', 'Lunch'], ['dinner', 'Dinner']]) if (sch[k]) rows.push({ t: sch[k], title: l, s: 'Eating schedule', c: 'var(--good)' });
  rows.sort((a, b) => a.t.localeCompare(b.t));
  const done = exList(today), gp = gpBlocks(today);
  el.innerHTML = `<div class="card-head"><div><h3>Today's schedule</h3><span class="sub">${done.length ? `${done.length} workout${done.length > 1 ? 's' : ''} logged · ${fmtDur(trainingOf(today).mins)}` : d.type === 'rest' ? 'Rest day' : 'Nothing logged yet'}</span></div>
    <div class="row"><button type="button" class="btn sm" data-act="plan-practice">Plan practice</button><button type="button" class="btn sm primary" data-act="log-workout">＋ Workout</button></div></div>

      ${done.map((x) => `<div class="li"><div class="row" style="flex-wrap:nowrap"><span class="dot" style="background:${CATS.find((c) => c[0] === catOf(x.type))[2]}"></span><div><div class="t">✓ ${esc(x.name || 'Workout')}</div><div class="s">${fmtDur(x.mins)} · ${esc(x.int || 'moderate')}${x.source === 'apple-health' ? ' · Apple Health' : ''}</div></div></div><span class="v small">${x.time ? fmtClock(x.time) : ''}</span></div>`).join('')}

function homeRecovery(el) {
  const today = todayIso(), rs = recoveryScore(today), r = recoveryInputs(today);
  const prev = lastNDays(7, shiftIso(today, -1)).map(recoveryScore).filter(Boolean).map((x) => x.score);
  if (!rs) {
    el.innerHTML = `<div class="card-head"><div><h3>Recovery</h3><span class="sub">0-100 score from sleep, energy, soreness and heart rate</span></div></div>
      ${emptyState('Check in to get your score', 'Your score needs at least two of: sleep hours, energy, soreness, resting heart rate or HRV. Nothing is guessed.', 'moon', '<button type="button" class="btn sm primary" data-act="checkin">Morning check-in</button>')}
      ${r.sleepH != null || r.energy != null || r.sore != null ? `<p class="muted small" style="margin-top:8px">Today so far: ${[r.sleepH != null && `${r.sleepH} h sleep`, r.energy != null && `energy ${r.energy}/5`, r.sore != null && `soreness ${r.sore}/5`].filter(Boolean).join(' · ')}</p>` : ''}`;
    return;
  }
  const [cls, lab] = recBand(rs.score), avg = prev.length ? Math.round(mean(prev)) : null;
  el.innerHTML = `<div class="card-head"><div><h3>Recovery</h3><span class="sub">Based on ${rs.parts.map((p) => p[0].toLowerCase()).join(', ')}</span></div><button type="button" class="btn sm" data-act="checkin">Update</button></div>
    <div class="row" style="gap:16px;flex-wrap:nowrap">
      ${ring(rs.score, 100, { size: 112, stroke: 11, color: cls === 'hi' ? 'var(--good)' : cls === 'mid' ? 'var(--warn)' : 'var(--danger)', color2: 'var(--accent)', center: `<b style="font-size:30px">${rs.score}</b><span class="tiny muted">/ 100</span>` })}
      <div class="stack" style="gap:6px;min-width:0">
        <span class="band ${cls}">${lab} recovery</span>
        <span class="small">${recAdvice(rs.score, r)}</span>
        ${avg != null ? `<span class="tiny muted">7-day average ${avg} ${deltaPill(rs.score - avg, false, '')}</span>` : ''}
      </div>
    </div>`;
}
function recAdvice(s, r) {
  if (s >= 70) return 'Good to train hard today.';
  if (s >= 45) return r.sleepH != null && r.sleepH < 7 ? 'Train, but keep the hardest work short. Aim for 8+ hours tonight.' : 'Normal session, watch how your legs feel in warmups.';
  return 'Go lighter today: skill work, mobility, extra sleep and a full dinner.';
}

// Metrics you can chart over time: every test with results, plus shooting and workout ratings.
function perfMetrics() {
  const out = [];
  for (const t of allTests()) {
    const rs = resultsOf(t.id); if (!rs.length) continue;
    out.push({ id: 't:' + t.id, name: t.name, lowerBetter: t.better === 'lower', fmt: (v) => fmtVal(t, v), pts: rs.map((r) => ({ date: r.date, v: r.value })) });
  }
  const byDay = (filter) => {
    const m = {}; for (const s of shotSessions()) { const z = filter(s); if (!z.a) continue; m[s.date] = m[s.date] || { m: 0, a: 0 }; m[s.date].m += z.m; m[s.date].a += z.a; }
    return Object.entries(m).filter(([, v]) => v.a >= 10).map(([date, v]) => ({ date, v: r1((v.m / v.a) * 100), tip: `${Math.round((v.m / v.a) * 100)}% (${v.m}/${v.a})` }));
  };
  const all = byDay(sessionTotals); if (all.length) out.push({ id: 's:all', name: 'Shooting % (all shots)', fmt: (v) => Math.round(v) + '%', pts: all });
  const three = byDay((s) => { const t = sessionTotals(s); return { m: t.m3, a: t.a3 }; }); if (three.length) out.push({ id: 's:3', name: '3-point %', fmt: (v) => Math.round(v) + '%', pts: three });
  const ft = byDay((s) => { const c = catAgg([s]).ftc; return c; }); if (ft.length) out.push({ id: 's:ft', name: 'Free throw %', fmt: (v) => Math.round(v) + '%', pts: ft });
  const gp = games().filter((g) => g.pts != null); if (gp.length) out.push({ id: 'g:pts', name: 'Points per game', fmt: (v) => nf(v), pts: gp.map((g) => ({ date: g.date, v: g.pts, tip: `${g.pts} pts${g.opp ? ' vs ' + g.opp : ''}` })) });
  const rt = allDayKeys().map((d) => { const r = exList(d).map((x) => x.rating).filter(Boolean); return r.length ? { date: d, v: r1(mean(r)) } : null; }).filter(Boolean);
  if (rt.length) out.push({ id: 'w:rating', name: 'Workout rating (1-5)', fmt: (v) => r1(v) + '/5', pts: rt });
  const vol = []; for (let i = 25; i >= 0; i--) { const m = shiftIso(mondayOf(todayIso()), -7 * i), mins = sum(lastNDays(7, shiftIso(m, 6)).map((d) => trainingOf(d).mins)); vol.push({ date: m, v: r1(mins / 60), tip: `${r1(mins / 60)} h week of ${fmtD(m)}` }); }
  if (vol.some((p) => p.v > 0)) { const first = vol.findIndex((p) => p.v > 0); out.push({ id: 'w:hours', name: 'Training hours per week', fmt: (v) => r1(v) + ' h', pts: vol.slice(first) }); }
  return out;
}

ANALYTICS.performance = (el) => {
  const ms = perfMetrics(), r = ui('perfRange', '90');
  if (!ms.length) {
    el.innerHTML = `<section class="card"><div class="card-head"><div><h3>Performance progression</h3><span class="sub">Vertical, sprints, lifts, shooting and more over time</span></div></div>
      ${emptyState('Nothing to chart yet', 'Add a test result (vertical, 40-yard, squat…) or log a shooting session. Each metric gets its own progression graph.', 'chart', '<div class="row" style="justify-content:center"><button type="button" class="btn sm primary" data-act="add-test">＋ Test result</button><button type="button" class="btn sm" data-act="shoot">Shooting session</button></div>')}</section>`;
    return;
  }
  const cur = ms.find((m) => m.id === ui('perfMetric')) || ms[0];
  const pts = cur.pts.filter((p) => inRange(p.date, r));
  const first = pts[0], last = pts[pts.length - 1];
  const ch = pts.length >= 2 ? (cur.lowerBetter ? -1 : 1) * pctChange(last.v, first.v) : null;
  const best = cur.pts.reduce((b, p) => (b == null || (cur.lowerBetter ? p.v < b : p.v > b) ? p.v : b), null);
  el.innerHTML = `<section class="card">
    <div class="card-head"><div><h3>Performance progression</h3><span class="sub">Pick a metric and a time range</span></div>
      <select id="perf-metric" aria-label="Metric" style="max-width:240px">${ms.map((m) => `<option value="${m.id}" ${m.id === cur.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div>
    <div class="chart-top"><div class="latest"><small>Latest · ${last ? esc(fmtD(last.date)) : ''}</small><span class="big">${last ? esc(cur.fmt(last.v)) : '—'}</span> ${ch != null ? deltaPill(ch) : ''} <span class="tiny muted">${ch != null ? 'vs start of range (green = better)' : ''}</span></div>${seg('perfRange', RANGES, r)}</div>
    <div class="chart" id="perf-chart"></div>
    ${pts.length < 2 ? `<p class="notice">Only ${pts.length} result${pts.length === 1 ? '' : 's'} in this range. Pick a wider range or log more to see a trend.</p>` : ''}
    <div class="kpis four" style="margin-top:12px">
      <div class="kpi"><small>All-time best</small><b>${esc(cur.fmt(best))}</b></div>
      <div class="kpi"><small>Entries</small><b>${cur.pts.length}</b></div>
      <div class="kpi"><small>First logged</small><b style="font-size:17px">${esc(fmtD(cur.pts[0].date))}</b></div>
      <div class="kpi"><small>Change overall</small><b style="font-size:20px">${cur.pts.length >= 2 ? deltaPill((cur.lowerBetter ? -1 : 1) * pctChange(cur.pts[cur.pts.length - 1].v, cur.pts[0].v)) : '—'}</b></div>
    </div>
  </section>
  <div class="grid two">
    <section class="card"><div class="card-head"><div><h3>Improvement by test</h3><span class="sub">First result → personal record</span></div></div><div id="imp-list"></div></section>
    <section class="card"><div class="card-head"><div><h3>Personal record history</h3><span class="sub">Every time you beat your best</span></div><button type="button" class="btn sm" data-go="tests">Tests</button></div><div id="pr-hist"></div></section>
  </div>`;
  drawLine($('#perf-chart'), pts, { fmt: cur.fmt, label: cur.name, color: 'var(--accent)' });
  $('#perf-metric').addEventListener('change', (e) => { setUi('perfMetric', e.target.value); refresh(); });
  const imp = allTests().map((t) => { const rs = resultsOf(t.id); if (rs.length < 2) return null; const pr = prOf(t.id); return { t, first: rs[0].value, pr: pr.value, pct: improvePct(t, rs[0].value, pr.value) }; }).filter(Boolean).sort((a, b) => b.pct - a.pct);
  $('#imp-list').innerHTML = imp.length ? `<div class="list">${imp.map((x) => `<div class="li"><div><div class="t">${esc(x.t.name)}</div><div class="s">${esc(fmtVal(x.t, x.first))} → ${esc(fmtVal(x.t, x.pr))}</div></div>${deltaPill(x.pct)}</div>`).join('')}</div>` : emptyState('Needs two results per test', 'Re-test the same thing every 4-6 weeks to see your improvement percentage.', 'trophy');
  const h = allPRs().slice(0, 8);
  $('#pr-hist').innerHTML = h.length ? `<div class="list">${h.map(({ t, r, prev }) => `<div class="li"><div><div class="t">${esc(t.name)}</div><div class="s">${esc(fmtDL(r.date))}</div></div><div style="text-align:right"><div class="v">${esc(fmtVal(t, r.value))}</div><div class="tiny muted">from ${esc(fmtVal(t, prev))}</div></div></div>`).join('')}</div>` : emptyState('No PRs beaten yet', 'Your first result for a test sets the bar. Beat it and it lands here.', 'trophy');
};

ANALYTICS.training = (el) => {
  const mode = ui('volMode', 'weekly'), sel = ui('heatDay', null);
  const groups = [];
  const seg4 = (days) => { const by = { hoops: 0, strength: 0, cond: 0, other: 0 }; let n = 0; for (const d of days) { const t = trainingOf(d); n += t.sessions; for (const k in by) by[k] += t.by[k]; } return { by, n }; };

/** Adds a second series to a line chart drawn by drawLine with a fixed y range (same x domain from the base series). */
function overlayLine(el, base, pts, color, yMin, yMax, name) {

  const W = Number(svg.getAttribute('width')), H = Number(svg.getAttribute('height')), L = 40, R = 14, T = 14, B = 24;
  const dates = [...base, ...pts].map((p) => parseIso(p.date).getTime()), t0 = parseIso(base[0].date).getTime(), t1 = parseIso(base[base.length - 1].date).getTime();
  if (Math.min(...dates) < t0 || Math.max(...dates) > t1) { /* drawn on the base series' axis; points outside are clipped */ }
  const ticks = niceTicks(yMin - (yMax - yMin) * 0.12, yMax + (yMax - yMin) * 0.12, 4), lo = Math.max(ticks[0], yMin), hi = Math.min(ticks[ticks.length - 1], yMax);

}
function recTips(days) {
  const tips = [], last7 = days.slice(-7);

  if (sl.length >= 3 && mean(sl) < 8) tips.push(['moon', `You averaged ${r1(mean(sl))} h of sleep on ${sl.length} logged nights. Teen athletes recover best with 8-10 h: try a fixed bedtime 30 minutes earlier.`]);
  const vol = last7.map((d) => trainingOf(d).mins), restN = last7.filter((d) => !isActive(d)).length;
  if (sum(vol) > 0 && restN === 0) tips.push(['calendar', 'You trained all 7 of the last 7 days. Plan at least one full rest or easy mobility day each week.']);
  const so = last7.map((d) => recoveryInputs(d).sore).filter((x) => x != null);
  if (so.length >= 2 && mean(so) >= 3.5) tips.push(['bolt', `Soreness has averaged ${r1(mean(so))}/5. Keep hard lower-body work away from game days, and add 10 minutes of mobility after practice.`]);
  const food = last7.filter(hasFood), lowP = food.filter((d) => totalsOf(d).protein < targets(d).protein * 0.8).length;
  if (food.length >= 3 && lowP >= 2) tips.push(['fork', `Protein was under 80% of your goal on ${lowP} of ${food.length} logged days. A 20-30 g protein snack within 2 hours after training helps muscles repair.`]);
  const wd = last7.filter((d) => waterOf(d) > 0), lowW = wd.filter((d) => waterOf(d) < targets(d).waterOz * 0.7).length;
  if (wd.length >= 3 && lowW >= 2) tips.push(['drop', `Water was under 70% of your goal on ${lowW} days. Even mild dehydration lowers energy and shooting accuracy late in practice.`]);
  if (!tips.length) return sl.length || so.length || food.length ? '<p class="muted small">Nothing stands out in the last 7 days. Keep checking in so patterns can show up.</p>' : emptyState('Not enough data yet', 'Recommendations come from your check-ins, training, food and water logs from the last 7 days.', 'moon');
  return `<div class="list">${tips.map(([i, t]) => `<div class="li" style="justify-content:flex-start;align-items:flex-start"><span class="ico" style="width:30px;height:30px;flex:none;color:var(--accent)">${ICONS[i]}</span><span class="small">${esc(t)}</span></div>`).join('')}</div>`;
}

async function ask(q) {

// ---- intel.js ----
// ===================== intelligence layer (Edition 2) =====================
// One place for derived numbers: training load, readiness, skill ratings, development score, priorities,
// balance, projections, nutrition consistency and achievements. Every screen reads these, so they always agree.
// Nothing here invents data: a rating or score that lacks inputs is null and the UI says what to log.

// ----- training load (session RPE x minutes, Foster method) -----
const INT_RPE = { light: 3, moderate: 5, hard: 7 };
const sessionRPE = (x) => Number(x.rpe) || INT_RPE[x.int] || 5;
const sessionLoad = (x) => Math.round(sessionRPE(x) * (Number(x.mins) || 0));
const loadOf = (d) => exList(d).reduce((a, x) => a + sessionLoad(x), 0);
const loadEstimated = (d) => exList(d).some((x) => !x.rpe);
function loadStats(end = todayIso()) {
  const d7 = lastNDays(7, end), d28 = lastNDays(28, end);
  const l7 = d7.map(loadOf), l28 = d28.map(loadOf);
  const acute = sum(l7), chronic = sum(l28) / 4;
  const firstData = allDayKeys().find(isActive);
  const history = firstData ? daysBetween(firstData, end) + 1 : 0;
  const acwr = chronic > 0 && history >= 21 ? acute / chronic : null;
  const m = mean(l7), sd = Math.sqrt(mean(l7.map((v) => (v - m) ** 2)) || 0);
  const monotony = sd > 0 ? m / sd : null;
  return { acute, chronic: Math.round(chronic), acwr: acwr == null ? null : r2(acwr), monotony: monotony == null ? null : r2(monotony), strain: monotony == null ? null : Math.round(acute * monotony), history, est: d7.some(loadEstimated) };
}

// ===================== ATHLETE CALENDAR =====================
// One schedule for everything: events (one-off or weekly), routines, test dates and games. Completing a training event
// logs the workout (training history + load), and completed routines count toward consistency.
// [key, label, color, workout type it logs (or null)]
const EV_TYPES = [
  ['practice', 'Team practice', 'var(--hb)', 'practice'], ['game', 'Game', '#ff6a3d', 'game'], ['shooting', 'Shooting workout', '#22c3ee', 'shooting'],
  ['skill', 'Skill workout', 'var(--accent)', 'skill'], ['workout', 'Workout', 'var(--accent)', 'skill'], ['lift', 'Strength training', 'var(--str)', 'lift'],
  ['conditioning', 'Conditioning', 'var(--cond)', 'conditioning'], ['recovery', 'Recovery', 'var(--good)', 'recovery'], ['film', 'Film study', '#a78bfa', null],
  ['nutrition', 'Nutrition reminder', 'var(--carbs)', null], ['sleep', 'Sleep', '#64748b', null], ['personal', 'Personal', '#94a3b8', null],
  ['testing', 'Testing day', 'var(--warn)', null], ['routine', 'Routine', '#f472b6', null],
];
const EV_PICK = EV_TYPES.filter((x) => !['workout', 'routine'].includes(x[0]));
const evType = (k) => EV_TYPES.find((x) => x[0] === k) || EV_TYPES[4];
const plan = () => doc('aos-plan');
const endTime = (start, mins) => (start && mins ? addMin(start, mins) : null);
const minsBetween = (a, b) => { if (!a || !b) return null; const d = toMinT(b) - toMinT(a); return d > 0 ? d : d + 1440; };
function occursOn(e, date) {
  if ((e.skip || []).includes(date)) return false;

  return !!e.recur?.days?.includes(parseIso(date).getDay()) && date >= e.date && (!e.recur.until || date <= e.recur.until);
}
/** Everything scheduled on a date, sorted by time. */
function itemsOn(date) {
  const out = [];
  for (const e of plan().events || []) if (occursOn(e, date)) out.push({ key: 'e:' + e.id, title: e.title, type: e.type, time: e.start, end: e.end || endTime(e.start, e.mins), mins: e.mins || minsBetween(e.start, e.end), ev: e, recur: !!e.recur, notes: e.notes });
  for (const r of routinesOn(date)) out.push({ key: 'rt:' + r.id, title: r.name, type: 'routine', time: r.start || null, mins: routineMins(r), routine: r });
  for (const [tid, n] of Object.entries(doc('aos-tests').next || {})) if (n === date) { const t = testById(tid); if (t) out.push({ key: 't:' + tid, title: `Test: ${t.name}`, type: 'testing', test: tid }); }
  if (aos().profile?.nextGame === date && !out.some((x) => x.type === 'game')) out.push({ key: 'g:next', title: 'Game day', type: 'game' });
  return out.sort((a, b) => (a.time || '99').localeCompare(b.time || '99'));
}
const isChecked = (date, key) => (key.startsWith('rt:') ? routineComplete(date, key.slice(3)) : !!plan().checks?.[date]?.[key]);
function setChecked(date, key, v) {
  if (key.startsWith('rt:')) return setRoutineAll(date, key.slice(3), v);
  const P = plan(); P.checks = P.checks || {}; P.checks[date] = { ...(P.checks[date] || {}) };
  if (v) P.checks[date][key] = true; else delete P.checks[date][key];
  persist('aos-plan');

function adherence(days, filter = () => true) {
  let sched = 0, done = 0, missed = 0; const today = todayIso(), missedList = [];
  for (const d of days) for (const it of itemsOn(d).filter(filter)) {
    if (d > today) continue; sched++;
    const lt = evType(it.type)[3], ok = isChecked(d, it.key) || (lt && it.type !== 'routine' && exList(d).some((x) => x.type === lt));
    if (ok) done++; else if (d < today) { missed++; missedList.push({ d, it }); }
  }
  return { sched, done, missed, pct: sched ? done / sched : null, missedList };

function routineComplete(date, id) { const s = routineState(date, id), r = routines().find((x) => x.id === id); return !!(s && r && s.done?.length >= r.steps.length && s.done.slice(0, r.steps.length).every(Boolean)); }
function setStep(date, id, i, v) { const L = rlog(); L[date] = { ...(L[date] || {}) }; const s = L[date][id] || { done: [] }; s.done = [...(s.done || [])]; s.done[i] = !!v; s.at = Date.now(); L[date][id] = s; persist('aos-plan'); }
function setRoutineAll(date, id, v) { const r = routines().find((x) => x.id === id); if (!r) return; const L = rlog(); L[date] = { ...(L[date] || {}) }; L[date][id] = { done: r.steps.map(() => !!v), at: Date.now() }; persist('aos-plan'); }
const stepsDone = (date, r) => (routineState(date, r.id)?.done || []).slice(0, r.steps.length).filter(Boolean).length;
function routineStats(r, days = 28) {
  const ds = lastNDays(days).filter((d) => d <= todayIso() && routineScheduled(r, d) && d >= (r.created ? isoDate(new Date(r.created)) : '0'));
  const full = ds.filter((d) => routineComplete(d, r.id)).length, stepsTot = ds.length * r.steps.length, stepsHit = sum(ds.map((d) => stepsDone(d, r)));
  let streak = 0; for (const d of [...ds].reverse()) { if (routineComplete(d, r.id)) streak++; else if (d !== todayIso()) break; }
  const miss = r.steps.map((s, i) => ({ s, i, missed: ds.filter((d) => d < todayIso() && !(routineState(d, r.id)?.done || [])[i]).length }));
  return { sched: ds.length, full, pct: ds.length ? full / ds.length : null, stepPct: stepsTot ? stepsHit / stepsTot : null, streak, miss };
}
/** Share of today's scheduled routine steps completed, for any date (null if nothing scheduled). */
function routineDayPct(date) { const rs = routinesOn(date); if (!rs.length) return null; const tot = sum(rs.map((r) => r.steps.length)); return tot ? sum(rs.map((r) => stepsDone(date, r))) / tot : null; }

// ----- guided player: routine timer (also used by mental training exercises) -----
/** steps: [{title, mins|secs, desc}] ; o: {title, sub, color, startAt, onStep(i, done), onFinish()} */
function runPlayer(steps, o = {}) {
  let i = o.startAt || 0, left = 0, timer = null, paused = false;
  const secsOf = (s) => (s.secs ?? (Number(s.mins) || 1) * 60);
  const d = $('#sheet');
  const tick = () => { if (paused) return; left = Math.max(0, left - 1); paint(); if (left === 0) { clearInterval(timer); timer = null; if (navigator.vibrate) navigator.vibrate([60, 40, 60]); $('#pl-next', d)?.classList.add('pulse'); } };
  const start = () => { left = secsOf(steps[i]); paused = false; clearInterval(timer); timer = setInterval(tick, 1000); draw(); };
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  const paint = () => { const tot = secsOf(steps[i]), f = tot ? 1 - left / tot : 1, c = 2 * Math.PI * 88; const ring = $('#pl-ring', d); if (ring) ring.style.strokeDashoffset = String(c * (1 - f)); const t = $('#pl-time', d); if (t) t.textContent = fmt(left); };
  const draw = () => {
    const s = steps[i], c = 2 * Math.PI * 88;
    d.innerHTML = `<div class="sheet-in player" style="--c:${o.color || 'var(--accent)'}"><div class="sheet-head"><div><span class="tiny muted" style="text-transform:uppercase;letter-spacing:.08em">${esc(o.sub || '')}</span><h3>${esc(o.title || 'Routine')}</h3></div><button type="button" class="icon-btn" id="pl-x" aria-label="Close">✕</button></div>
      <div class="pl-dots">${steps.map((_, k) => `<span class="${k < i ? 'done' : k === i ? 'on' : ''}"></span>`).join('')}</div>
      <p class="muted small" style="text-align:center">Step ${i + 1} of ${steps.length}</p>
      <div class="pl-ring"><svg viewBox="0 0 200 200" width="200" height="200" aria-hidden="true"><circle cx="100" cy="100" r="88" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle id="pl-ring" cx="100" cy="100" r="88" fill="none" stroke="var(--c)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${r1(c)}" stroke-dashoffset="${r1(c)}" transform="rotate(-90 100 100)" style="transition:stroke-dashoffset 1s linear;filter:drop-shadow(0 0 6px var(--c))"/></svg><div class="pl-center"><b id="pl-time" class="num">${fmt(left)}</b></div></div>
      <h2 style="text-align:center;font-size:24px">${esc(s.title)}</h2>${s.desc ? `<p class="small" style="text-align:center;max-width:42ch;margin:0 auto">${esc(s.desc)}</p>` : ''}
      ${steps[i + 1] ? `<p class="muted tiny" style="text-align:center">Next: ${esc(steps[i + 1].title)}</p>` : ''}
      <div class="row" style="justify-content:center"><button type="button" class="btn" id="pl-prev" ${i === 0 ? 'disabled' : ''}>‹ Back</button><button type="button" class="btn" id="pl-pause">${paused ? '▶ Resume' : '❚❚ Pause'}</button><button type="button" class="btn" id="pl-skip">Skip</button><button type="button" class="btn primary" id="pl-next">${i === steps.length - 1 ? '✓ Finish' : '✓ Done, next'}</button></div></div>`;
    paint();
    $('#pl-x', d).onclick = () => { clearInterval(timer); closeSheet(); refresh(); };
    $('#pl-prev', d).onclick = () => { i--; start(); };
    $('#pl-pause', d).onclick = () => { paused = !paused; $('#pl-pause', d).textContent = paused ? '▶ Resume' : '❚❚ Pause'; };
    $('#pl-skip', d).onclick = () => { o.onStep?.(i, false); next(); };
    $('#pl-next', d).onclick = () => { o.onStep?.(i, true); next(); };
  };
  const next = () => { if (i >= steps.length - 1) { clearInterval(timer); closeSheet(); o.onFinish?.(); return refresh(); } i++; start(); };
  d.innerHTML = '<div class="sheet-in"></div>'; if (!d.open) d.showModal();
  d.addEventListener('close', () => clearInterval(timer), { once: true });
  start();
}

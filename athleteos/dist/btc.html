<script>
// ===================== Shared day records: merge instead of overwrite =====================
// Several apps write the same "day-YYYY-MM-DD" doc (MacroLens meals and water, Athlete OS and Recovery Lens check-ins,
// Training Center sessions). Each app saves its whole copy, so a page that stayed open could wipe out what another app
// (or another device) added in the meantime. This layer sits under every page's database: before a day doc is saved it
// reads the account copy and does a three-way merge against what this page last loaded:
//   - a field (or list item, matched by id) this page changed: this page's value wins
//   - anything this page did not touch: the account's newer value is kept, including items other apps added
// Loaded first on every page of the bundle; the apps themselves are unchanged.
(function () {
  const isDay = (id) => /^day-\d{4}-\d{2}-\d{2}$/.test(String(id));
  const J = (x) => JSON.stringify(x === undefined ? null : x);
  const same = (a, b) => J(a) === J(b);
  const plain = (x) => x && typeof x === 'object' && !Array.isArray(x);
  const idList = (a) => Array.isArray(a) && a.length > 0 && a.every((x) => plain(x) && x.id != null);
  function mergeList(b, n, r) {
    b = b || []; r = r || [];
    const B = new Map(b.map((x) => [x.id, x])), R = new Map(r.map((x) => [x.id, x])), N = new Set(n.map((x) => x.id)), out = [];
    for (const x of n) {
      const bx = B.get(x.id), rx = R.get(x.id);
      if (bx && !rx && same(x, bx)) continue; // deleted elsewhere, untouched here
      out.push(bx && rx && same(x, bx) ? rx : x);
    }
    for (const x of r) if (!N.has(x.id) && !B.has(x.id)) out.push(x); // added elsewhere
    return out;
  }
  function merge3(b, n, r) {
    if (same(n, b)) return r === undefined ? n : r; // untouched here
    if (same(r, b) || r === undefined) return n; // untouched elsewhere
    if (plain(n) && plain(r)) {
      const o = {}, bb = plain(b) ? b : {};
      for (const k of new Set([...Object.keys(n), ...Object.keys(r)])) {
        if (!(k in n) && k in bb) continue; // removed here
        const v = merge3(bb[k], n[k], r[k]); if (v !== undefined) o[k] = v;
      }
      return o;
    }
    if (Array.isArray(n) && (idList(n) || idList(r)) && (r == null || Array.isArray(r))) return mergeList(Array.isArray(b) ? b : [], n, r);
    return n; // both changed the same value: this save wins
  }
  const clone = (x) => JSON.parse(J(x));

  function wrapCollection(coll) {
    if (!coll || coll.__dm) return coll;
    const base = new Map(); // day id -> what this page last loaded or saved
    const remember = (snap) => { try { for (const d of snap?.docs || []) if (d.exists && isDay(d.id)) base.set(d.id, clone(d.data())); } catch {} return snap; };
    async function fresh(id) {
      const ref = coll.doc(id);
      if (typeof ref.get === 'function') { const d = await ref.get(); return d?.exists ? clone(d.data()) : undefined; }
      const snap = await coll.get(); const d = (snap.docs || []).find((x) => x.id === id && x.exists); return d ? clone(d.data()) : undefined;
    }
    const t = coll;
    return new Proxy({}, {
      get(_, p) {
        if (p === '__dm') return true;
        if (p === 'get') return async (...a) => remember(await t.get(...a));
        if (p === 'doc') return (id, ...rest) => {
          const ref = t.doc(id, ...rest); if (!isDay(id)) return ref;
          const rt = ref;
          return new Proxy({}, { get(_, rp) {
            if (rp === 'set') return async (data, ...more) => {
              const mine = clone(data);
              let out = mine;
              if (base.has(id)) { try { const r = await fresh(id); if (r !== undefined && !same(r, mine)) out = merge3(base.get(id), mine, r); } catch {} }
              const res = await rt.set(out, ...more);
              base.set(id, mine);
              return res;
            };
            if (rp === 'get') return async (...a) => { const d = await rt.get(...a); try { if (d?.exists) base.set(id, clone(d.data())); } catch {} return d; };
            const v = rt[rp]; return typeof v === 'function' ? v.bind(rt) : v;
          } });
        };
        const v = t[p]; return typeof v === 'function' ? v.bind(t) : v;
      },
    });
  }
  function wrapClaude(c) {
    if (!c || typeof c.use !== 'function' || c.use.__dm) return;
    const use = c.use.bind(c);
    const wrapped = async (name, ...a) => {
      const cap = await use(name, ...a);
      if (name !== 'db' || !cap || typeof cap.collection !== 'function') return cap;
      try {
        const t = cap;
        return new Proxy({}, { get(_, p) { if (p === 'collection') return (path, ...r) => { const col = t.collection(path, ...r); try { return /^data\/users\/[^/]+$/.test(path) ? wrapCollection(col) : col; } catch { return col; } }; const v = t[p]; return typeof v === 'function' ? v.bind(t) : v; } });
      } catch { return cap; }
    };
    wrapped.__dm = true;
    try { c.use = wrapped; } catch {}
  }
  if (window.claude) wrapClaude(window.claude);
  else {
    try {
      let v; Object.defineProperty(window, 'claude', { configurable: true, enumerable: true, get: () => v, set: (x) => { v = x; wrapClaude(x); } });
    } catch {}
  }
  window.DayMerge = { merge3, mergeList };
})();

</script>
<script>
// 14 rotating daily backup slots, so backups never pile up in the shared account collection.
function tcSlot(tag) { var m = /^day-(\d{4})(\d{2})(\d{2})$/.exec(tag); if (!m) return tag; return 'day-' + (Math.floor(Date.UTC(+m[1], +m[2] - 1, +m[3]) / 864e5) % 14); }
// ===================== Athlete suite: shared across every page of the bundle =====================
// One app switcher (the app's name, top-left, on every page), one theme setting, one list of apps.
// Each page calls Suite.mount(el, '<app id>', beforeLeave) — beforeLeave saves pending changes before navigating.
(function () {
  const APPS = [
    { id: 'hub', name: 'Hub', plain: 'Hub', href: 'index.html', desc: 'Every app in one place: your day, alerts and graphs', color: '#14b8a6' },
    { id: 'aos', name: 'Athlete<i>OS</i>', plain: 'Athlete OS', href: 'athlete.html', desc: 'Training, performance, load and the Lab', color: '#3d8bff' },
    { id: 'rl', name: 'Recovery<i>Lens</i>', plain: 'Recovery Lens', href: 'recovery.html', desc: 'Readiness, sleep, soreness and recovery', color: '#2fd29b' },
    { id: 'gp', name: 'Game<i>plan</i>', plain: 'Gameplan', href: 'gameplan.html', desc: 'Your day hour by hour, Top 3, night routine', color: '#22c55e' },
    { id: 'school', name: 'Student<i>Lens</i>', plain: 'Student Lens', href: 'student.html', desc: 'Classes, assignments, grades, studying and exams', color: '#6d7cff' },
    { id: 'btc', name: 'Training<i>Center</i>', plain: 'Training Center', href: 'btc.html', desc: 'Drills, workouts and running your sessions', color: '#f97316' },
    { id: 'ml', name: 'Macro<i>Lens</i>', plain: 'MacroLens', href: 'macrolens.html', desc: 'Food, macros, water and game-day fuel', color: '#eab308' },
  ];
  const THEME_KEY = 'macrolens-theme';
  function theme() {
    let c = 'dark'; try { c = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
    if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c); else document.documentElement.removeAttribute('data-theme');
  }
  const chev = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  function mount(el, current, beforeLeave) {
    if (!el) return;
    const me = APPS.find((a) => a.id === current) || APPS[0];
    el.classList.add('suite');
    el.style.setProperty('--suite-c', me.color);
    el.innerHTML = `<button type="button" class="suite-btn" aria-haspopup="menu" aria-expanded="false" aria-label="${me.plain}: switch app"><span class="suite-mark" aria-hidden="true"></span><span class="suite-name">${me.name}</span>${chev}</button>
      <div class="suite-menu" role="menu" hidden><div class="suite-head">Your apps · same data</div>${APPS.map((a) => `<a role="menuitem" class="suite-item${a.id === me.id ? ' on' : ''}" href="${a.href}" data-suite="${a.id}" style="--c:${a.color}" ${a.id === me.id ? 'aria-current="page"' : ''}><i></i><span><b>${a.plain}</b><small>${a.desc}</small></span>${a.id === me.id ? '<em>Here</em>' : ''}</a>`).join('')}</div>`;
    const btn = el.querySelector('.suite-btn'), menu = el.querySelector('.suite-menu');
    const set = (open) => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('.suite-item:not(.on)')?.focus(); };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(menu.hidden); });
    document.addEventListener('click', (e) => { if (!el.contains(e.target)) set(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { set(false); btn.focus(); } });
    menu.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-suite]'); if (!a) return;
      e.preventDefault(); e.stopPropagation();
      if (a.dataset.suite === me.id) return set(false);
      a.classList.add('going');
      try { await Promise.race([Promise.resolve(beforeLeave?.()), new Promise((r) => setTimeout(r, 2500))]); } catch {}
      location.href = a.getAttribute('href');
    });
  }
  window.Suite = { APPS, mount, theme, THEME_KEY };
})();

</script>

<script>
// ===================== Training Center ↔ Hub bridge =====================
// Runs after the Training Center's own scripts (vendor/training-center, unchanged except its storage names:
// account doc "tc-app", backups "tc-backup-*" in 14 rotating daily slots, device key "tc:local-v3").
// 1. App switcher in place of its brand (saves before leaving).
// 2. Finished sessions become workouts in day-YYYY-MM-DD → exercise[] (CONTRACT.md), one entry per session
//    (id "btc-<session id>", source "training-center"), so they count in the Hub, Athlete OS load and MacroLens.
// 3. Publishes "btc-sig", the Training Center's weekly summary.
(function () {
  const DAY = 864e5;
  const lsJ = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };
  const lsW = (k, v) => { try { localStorage.setItem('ml:' + k, JSON.stringify(v)); } catch {} };
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (t) => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  let coll = null;
  const ready = (async () => {
    if (!window.claude?.use) return null;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) return null;
    coll = db.collection('data/users/' + id); return coll;
  })().catch(() => null);
  async function getDoc(k) {
    const c = await ready; if (!c) return lsJ(k);
    try { const d = await c.doc(k).get(); if (d && d.exists) { const v = JSON.parse(JSON.stringify(d.data())); lsW(k, v); return v; } return null; } catch { return lsJ(k); }
  }
  async function writeDoc(k, v) { lsW(k, v); const c = await ready; if (c) { try { await c.doc(k).set(JSON.parse(JSON.stringify(v))); } catch {} } }

  // ---------- 1. switcher ----------
  async function saveNow() {
    try { clearTimeout(UI.dbTimer); if (UI.dbDoc && UI.ready) await UI.dbDoc.set({ state: S, savedAt: S.savedAt }); } catch {}
    await exportSessions();
  }
  for (const id of ['suite-host-side', 'suite-host']) { const el = document.getElementById(id); if (el) Suite.mount(el, 'btc', saveNow); }

  // ---------- 2. sessions → workouts ----------
  const AREA_TYPE = { Shooting: 'shooting', 'Ball Handling': 'handles', Finishing: 'finishing', Conditioning: 'conditioning', Movement: 'conditioning', Footwork: 'skill', Defense: 'skill' };
  const MET = { shooting: 4.5, handles: 5, finishing: 6, skill: 5.5, conditioning: 9 }, INTF = { light: 0.8, moderate: 1, hard: 1.2 };
  const setsOf = (i) => (Array.isArray(i.sets) ? i.sets : []);
  function stats(s) {
    let att = 0, made = 0, shots = 0;
    for (const i of s.items || []) {
      if (i.metric === 'makes') for (const x of setsOf(i)) { att += +x.att || 0; made += +x.made || 0; }
      else if ((i.category === 'Shooting' || /^shot-/.test(i.drillId || '')) && !setsOf(i).length) shots += +i.reps || 0; // logged shots, makes not counted
    }
    return { attempts: att, makes: made, pct: att ? Math.round((made / att) * 100) : null, shots: att + shots };
  }
  function areaWeights(s) {
    const w = {};
    for (const i of s.items || []) if (i.status !== 'skipped') w[i.category || 'Shooting'] = (w[i.category || 'Shooting'] || 0) + Math.max(1, setsOf(i).length);
    return w;
  }
  function asWorkout(s, weightLb) {
    const w = areaWeights(s), top = Object.entries(w).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Shooting', type = AREA_TYPE[top] || 'skill';
    const rpe = s.rpe ? Math.max(1, Math.min(10, Math.round(+s.rpe))) : null;
    const int = rpe == null ? 'moderate' : rpe >= 7 ? 'hard' : rpe <= 3 ? 'light' : 'moderate', st = stats(s), t = s.startedAt || s.endedAt || Date.now(), d = new Date(t);
    const kcal = Math.round(MET[type] * INTF[int] * (weightLb || 150) * 0.4536 * ((s.minutes || 0) / 60));
    return { date: s.date || iso(t), entry: { id: 'btc-' + s.id, type, name: s.workoutName || 'Training Center session', mins: s.minutes || 0, int, ...(rpe ? { rpe } : {}), time: pad(d.getHours()) + ':' + pad(d.getMinutes()), kcal, addedAt: s.endedAt || t, source: 'training-center', btc: { sessionId: s.id, workoutId: s.workoutId || null, area: top, attempts: st.attempts, makes: st.makes, pct: st.pct, shots: st.shots, completionPct: s.completionPct ?? null } } };
  }
  let exporting = null;
  function exportSessions() {
    if (exporting) return exporting;
    exporting = (async () => {
      await null;
      try {
        const since = Date.now() - 60 * DAY, todo = (S.sessions || []).filter((s) => s && s.id && (s.endedAt || 0) >= since && !s.external);
        if (!todo.length) return;
        const sync = (await getDoc('tc-sync')) || { exported: {} }; sync.exported ||= {};
        const pending = todo.filter((s) => !sync.exported[s.id]);
        if (!pending.length) return;
        const wl = (await getDoc('core'))?.profile?.weightLb;
        const byDate = {}; for (const s of pending) { const x = asWorkout(s, wl); (byDate[x.date] ||= []).push(x.entry); }
        for (const [date, entries] of Object.entries(byDate)) {
          const k = 'day-' + date, doc = (await getDoc(k)) || { breakfast: [], lunch: [], dinner: [], snacks: [], water: 0 }, ids = new Set(entries.map((e) => e.id));
          doc.exercise = [...(doc.exercise || []).filter((e) => !ids.has(e.id)), ...entries];
          if (doc.type === 'rest') doc.type = 'training';
          await writeDoc(k, doc);
          for (const e of entries) sync.exported[e.btc.sessionId] = date;
        }
        await writeDoc('tc-sync', sync);
      } catch (e) { console.error(e); } finally { exporting = null; }
    })();
    return exporting;
  }
  const _commit = commitSession;
  commitSession = function () { const r = _commit.apply(this, arguments); setTimeout(() => { exportSessions().then(writeSig); }, 300); return r; };

  // ---------- 3. weekly signals ----------
  function writeSig() {
    try {
      const now = new Date(), t = iso(now), wd = (now.getDay() + 6) % 7, monMs = new Date(now.getFullYear(), now.getMonth(), now.getDate() - wd).getTime();
      const mins = {};
      for (const s of S.sessions || []) {
        if ((s.endedAt || 0) < Date.now() - 7 * DAY) continue;

      const s = { v: 1, app: 'btc', week: iso(monMs), updated: t, sessionsDone: (S.sessions || []).filter((x) => (x.endedAt || 0) >= monMs).length, minsByArea7d: Object.fromEntries(Object.entries(mins).filter(([, m]) => m > 0).map(([a, m]) => [a, Math.round(m)])), nextPlanned: next ? { date: next.date, title: next.title, type: next.type } : null };
      const cur = lsJ('btc-sig') || {}; if (JSON.stringify({ ...cur, updated: 0 }) === JSON.stringify({ ...s, updated: 0 })) return;
      writeDoc('btc-sig', s);
    } catch (e) { console.error(e); }
  }

  const start = () => { exportSessions().then(writeSig); };
  (function waitReady(n) { if (window.UI && UI.ready) setTimeout(start, 800); else if (n < 60) setTimeout(() => waitReady(n + 1), 250); })(0);

  window.TC_SUITE = { exportSessions, asWorkout, writeSig };
})();

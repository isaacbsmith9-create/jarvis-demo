<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basketball Training Center</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a14; --surface:#171224; --surface2:#211a31; --line:#2f2643;
  --ink:#f3effa; --muted:#a398bb; --accent:#9b6dff; --gold:#f2b84b;
  --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --radius:16px;
  font-family:"Manrope",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);color-scheme:dark;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:21px} h3{font-size:16px}
p{margin:6px 0}
.app{max-width:760px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px;background:rgba(13,10,20,.92);backdrop-filter:blur(8px)}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
nav.bottom a{text-align:center;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;padding:9px 2px;border-radius:12px}
nav.bottom a.on{color:var(--ink);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0}
.card.hi{border-color:#5b3fa0;background:linear-gradient(180deg,#22183a,var(--surface))}
.stack>*+*{margin-top:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:460px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;min-height:40px}
.btn:hover{border-color:#4a3a6e}
.btn.primary{background:var(--accent);color:#120a22;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px;min-height:32px}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn-group{display:flex;gap:6px;flex-wrap:wrap}
input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{resize:vertical;min-height:60px}
label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.check{display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);margin:10px 0}
.check input{width:auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#120a22;border-color:transparent}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.gold{color:var(--gold);border-color:#5c4a22}
.badge.good{color:var(--good);border-color:#23543a}
.badge.warn{color:var(--warn);border-color:#5c4a22}
.badge.bad{color:var(--bad);border-color:#5c2a2a}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px;padding-top:8px}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.col i{width:100%;max-width:38px;background:linear-gradient(180deg,var(--accent),#5a3fa8);border-radius:8px 8px 3px 3px;min-height:2px}
.col.now i{background:linear-gradient(180deg,var(--gold),#a7742b)}
.col span{font-size:11px;color:var(--muted);white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile .n{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted)}
.list>*+*{border-top:1px solid var(--line)}
.li{padding:12px 0}
.drill-row{all:unset;display:block;width:100%;box-sizing:border-box;cursor:pointer;padding:12px 0;border-top:1px solid var(--line)}
.drill-row:first-child{border-top:0}
.drill-row:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.dots{letter-spacing:2px;color:var(--gold)}
.ok{color:var(--good)} .bad-t{color:var(--bad)} .warn-t{color:var(--warn)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 4px}
.empty{color:var(--muted);text-align:center;padding:24px 8px;border:1px dashed var(--line);border-radius:var(--radius)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#2b1f47;border:1px solid #5b3fa0;border-radius:14px;padding:10px 14px;margin:10px 0}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.quick .btn{justify-content:flex-start}
.more{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.more .btn{justify-content:flex-start;min-height:52px}
.coach{margin:8px 0;padding-left:18px}
.coach li{margin:4px 0}
.targets{font-size:13px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.timer-box{text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.timer{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0}
.rest{text-align:center;background:#1f3a2c;border:1px solid #2f6a48;border-radius:14px;padding:10px;margin:10px 0;font-weight:700}
.rest span{font-family:ui-monospace,monospace;font-size:20px;font-variant-numeric:tabular-nums}
.set-log{font-size:13px;color:var(--muted);margin-top:8px}
.item-row{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.queue button{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:9px 6px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.queue button:focus-visible{outline:2px solid var(--gold)}
.queue button.cur{color:var(--gold);font-weight:700}
.queue button.off{color:var(--muted);text-decoration:line-through}
#runner{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
#runner .run{max-width:640px;margin:0 auto}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--surface);width:100%;max-width:720px;max-height:92vh;overflow:auto;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:720px){#modal{align-items:center}#modal .sheet{border-radius:20px}}
[hidden]{display:none!important}
.lbl-inline{display:inline-flex;align-items:center;gap:6px}
.hr{height:1px;background:var(--line);margin:14px 0}
.spacer{height:4px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>/* Basketball Training Center inside the Athlete suite: Athlete OS palette, fonts, cards and tab bar, orange accent,
   light and dark. Overrides its tokens and the few hard-coded colors; its layout and features stay as they are. */
:root {
  --bg: #eef2fb; --surface: #ffffff; --surface2: #e6ebf7; --line: #d5ddef; --ink: #0b1330; --muted: #5b6687;
  --accent: #ea580c; --gold: #b45309; --good: #16a34a; --warn: #b45309; --bad: #c93c3c; --radius: 18px;
  --fg: var(--ink); --surface-2: var(--surface2);
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif; --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-family: var(--f-body);
  --hdr: rgba(238, 242, 251, .9); --hi-a: #fff1e8; --tint-good: #e3f6ea; --on-accent: #ffffff;
}
:root[data-theme="dark"] {
  --bg: #060a17; --surface: #0d1430; --surface2: #161f42; --line: #222d57; --ink: #eef2ff; --muted: #8e9ac4;
  --accent: #ff7a45; --gold: #ffb547; --good: #2fd68a; --warn: #ffb547; --bad: #ff6b7a;
  --hdr: rgba(6, 10, 23, .88); --hi-a: #2a1a14; --tint-good: #0f3326; --on-accent: #1a0b03;
}
body { color-scheme: light; font-family: var(--f-body); }
:root[data-theme="dark"] body { color-scheme: dark; }
h1, h2, h3, .tile .n { font-family: var(--f-display); letter-spacing: -.3px; }
header.top { background: var(--hdr); align-items: flex-start; }
header.top h1 { font-size: 22px; margin-top: 6px; }
.card { box-shadow: 0 1px 2px rgba(20, 30, 70, .06); }
:root[data-theme="dark"] .card { background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, 0) 40%), var(--surface); border-color: rgba(120, 140, 255, .16); box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 12px 30px -18px rgba(0, 0, 0, .8); }
.card.hi { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: linear-gradient(160deg, var(--hi-a), var(--surface) 70%); }
.banner { background: var(--hi-a); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.btn.primary { background: linear-gradient(135deg, #f97316, #ef4444); color: #fff; box-shadow: 0 8px 22px -10px rgba(249, 115, 22, .6); }
.chip.on { background: var(--accent); color: var(--on-accent); }
.badge.gold { border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.badge.good { border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.badge.warn { border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.badge.bad { border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.bar > i { background: linear-gradient(90deg, #f97316, var(--gold)); }
.col i { background: linear-gradient(180deg, #f97316, #c2410c); }
.col.now i { background: linear-gradient(180deg, var(--gold), #b45309); }
.rest { background: var(--tint-good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
input, select, textarea { font-size: 16px; }
nav.bottom { background: var(--surface); }
:root[data-theme="dark"] nav.bottom { background: rgba(9, 14, 34, .86); -webkit-backdrop-filter: blur(18px) saturate(1.6); backdrop-filter: blur(18px) saturate(1.6); border-top-color: rgba(120, 140, 255, .14); }
nav.bottom a.on { box-shadow: inset 0 -2px 0 var(--accent); }
.btc-link { display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 13px; }

/* Athlete suite: the app switcher, identical on every page. Uses each page's own tokens (--fg, --muted, --surface…). */
.suite { position: relative; display: inline-flex; min-width: 0; z-index: 30; }
.suite-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--fg); cursor: pointer; padding: 4px 6px 4px 0; border-radius: 12px; font: 700 18px/1.1 var(--f-display); letter-spacing: -.2px; min-width: 0; }
.suite-btn .suite-name { white-space: nowrap; }
.suite-btn .suite-name i { font-style: normal; color: var(--suite-c); }
.suite-btn svg { color: var(--muted); flex: none; transition: transform .15s; }
.suite-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.suite-btn:focus-visible { outline: 2px solid var(--suite-c); outline-offset: 2px; }
.suite-mark { width: 26px; height: 26px; border-radius: 8px; flex: none; background: linear-gradient(135deg, var(--suite-c), color-mix(in srgb, var(--suite-c) 55%, #7c3aed)); box-shadow: 0 6px 16px -8px var(--suite-c); position: relative; }
.suite-mark::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .9); }
.suite-menu { position: absolute; left: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; padding: 6px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .45); }
.suite-head { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 10px 6px; }
.suite-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; color: var(--fg); text-decoration: none; }
.suite-item:hover, .suite-item:focus-visible { background: var(--surface-2); outline: none; }
.suite-item i { width: 10px; height: 34px; border-radius: 5px; background: var(--c); flex: none; }
.suite-item span { min-width: 0; flex: 1; }
.suite-item b { display: block; font: 600 15px var(--f-body); }
.suite-item small { display: block; color: var(--muted); font: 400 12.5px/1.3 var(--f-body); }
.suite-item em { font: 600 11px var(--f-body); font-style: normal; color: var(--c); }
.suite-item.on { background: color-mix(in srgb, var(--c) 12%, transparent); }
.suite-item.going { opacity: .6; }
</style>
<script>
// ===================== Athlete suite: shared across every page of the bundle =====================
// One app switcher (the app's name, top-left, on every page), one theme setting, one list of apps.
// Each page calls Suite.mount(el, '<app id>', beforeLeave) — beforeLeave saves pending changes before navigating.
(function () {
  const APPS = [
    { id: 'hub', name: 'Hub', plain: 'Hub', href: 'index.html', desc: 'Every app in one place: your day, alerts and graphs', color: '#14b8a6' },
    { id: 'aos', name: 'Athlete<i>OS</i>', plain: 'Athlete OS', href: 'athlete.html', desc: 'Training, performance, load and the Lab', color: '#3d8bff' },
    { id: 'rl', name: 'Recovery<i>Lens</i>', plain: 'Recovery Lens', href: 'recovery.html', desc: 'Readiness, sleep, soreness and recovery', color: '#2fd29b' },
    { id: 'gp', name: 'Game<i>plan</i>', plain: 'Gameplan', href: 'gameplan.html', desc: 'Your day hour by hour, Top 3, night routine', color: '#22c55e' },
    { id: 'school', name: 'School', plain: 'School', href: 'school.html', desc: 'Classes, assignments, tests and grades', color: '#0ea5e9' },
    { id: 'btc', name: 'Training<i>Center</i>', plain: 'Training Center', href: 'btc.html', desc: 'Drills, workouts and running your sessions', color: '#f97316' },
    { id: 'ml', name: 'Macro<i>Lens</i>', plain: 'MacroLens', href: 'macrolens.html', desc: 'Food, macros, water and game-day fuel', color: '#eab308' },
  ];
  const THEME_KEY = 'macrolens-theme';
  function theme() {
    let c = 'dark'; try { c = localStorage.getItem(THEME_KEY) || 'dark'; } catch {}
    if (c === 'light' || c === 'dark') document.documentElement.setAttribute('data-theme', c); else document.documentElement.removeAttribute('data-theme');
  }
  const chev = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  function mount(el, current, beforeLeave) {
    if (!el) return;
    const me = APPS.find((a) => a.id === current) || APPS[0];
    el.classList.add('suite');
    el.style.setProperty('--suite-c', me.color);
    el.innerHTML = `<button type="button" class="suite-btn" aria-haspopup="menu" aria-expanded="false" aria-label="${me.plain}: switch app"><span class="suite-mark" aria-hidden="true"></span><span class="suite-name">${me.name}</span>${chev}</button>
      <div class="suite-menu" role="menu" hidden><div class="suite-head">Your apps · same data</div>${APPS.map((a) => `<a role="menuitem" class="suite-item${a.id === me.id ? ' on' : ''}" href="${a.href}" data-suite="${a.id}" style="--c:${a.color}" ${a.id === me.id ? 'aria-current="page"' : ''}><i></i><span><b>${a.plain}</b><small>${a.desc}</small></span>${a.id === me.id ? '<em>Here</em>' : ''}</a>`).join('')}</div>`;
    const btn = el.querySelector('.suite-btn'), menu = el.querySelector('.suite-menu');
    const set = (open) => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); if (open) menu.querySelector('.suite-item:not(.on)')?.focus(); };
    btn.addEventListener('click', (e) => { e.stopPropagation(); set(menu.hidden); });
    document.addEventListener('click', (e) => { if (!el.contains(e.target)) set(false); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) { set(false); btn.focus(); } });
    menu.addEventListener('click', async (e) => {
      const a = e.target.closest('[data-suite]'); if (!a) return;
      e.preventDefault(); e.stopPropagation();
      if (a.dataset.suite === me.id) return set(false);
      a.classList.add('going');
      try { await Promise.race([Promise.resolve(beforeLeave?.()), new Promise((r) => setTimeout(r, 2500))]); } catch {}
      location.href = a.getAttribute('href');
    });
  }
  window.Suite = { APPS, mount, theme, THEME_KEY };
})();

Suite.theme();
</script>
</head>

<div class="app">
  <header class="top">
    <div>
      <div id="suite-host"></div>
      <h1 id="ttl">Training Center</h1>
    </div>
    <small id="sync" class="muted tiny">Saved in this browser</small>
  </header>
  <div id="banner"></div>
  <main id="main"></main>
</div>

<div id="runner" hidden></div>

<script>
'use strict';
/* ============ helpers ============ */
const KEY = 'ml:btc-local';
const DAY = 864e5;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => fmtD(new Date());
const addDays = (ds, n) => { const d = new Date(ds + 'T12:00:00'); d.setDate(d.getDate() + n); return fmtD(d); };
const dayLabel = ds => new Date(ds + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const sum = (a, f = x => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const pctOf = (m, a) => a ? Math.round(100 * m / a) : null;
const pctTxt = p => p == null ? '—' : p + '%';
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const fmtSec = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + pad(s % 60); };
const fmtMin = m => { m = Math.round(m || 0); return m >= 60 ? Math.floor(m / 60) + 'h ' + pad(m % 60) + 'm' : m + ' min'; };
const dots = n => '<span class="dots" aria-label="Difficulty ' + n + ' of 5">' + '●'.repeat(n) + '<span class="muted">' + '●'.repeat(5 - n) + '</span></span>';

/* ============ reference data ============ */
const AREAS = ['Finishing', 'Shooting', 'Ball Handling', 'Pick-and-Roll', 'Footwork', 'Movement', 'Conditioning', 'Passing', 'Game Situations', 'Partner Training'];
const CATS = { micro: 'Micro (10–20 min)', focused: 'Focused (30–60 min)', competitive: 'Competitive (30–60 min)' };

let dbDoc = null, dbTimer = null;
function setSync(t) { const el = $('#sync'); if (el) el.textContent = t; }
async function initDb() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const ns = await window.claude.use('db');
    if (!ns) return;
    const user = await window.claude.use('user');
    if (!user) return;
    const id = await user.id();
    dbDoc = ns.doc('data/users/' + id + '/btc-app');
    const snap = await dbDoc.get();
    const val = snap && (snap.data !== undefined ? snap.data : snap);
    if (val && val.state && (val.state.savedAt || 0) > (S.savedAt || 0)) {
      S = Object.assign(seed(), val.state);
      render();
    }
    setSync('Saved to your account');
    syncDb();
  } catch (e) { setSync('Saved in this browser'); }
}
function syncDb() {
  if (!dbDoc) return;
  clearTimeout(dbTimer);
  dbTimer = setTimeout(async () => {
    try { await dbDoc.set({ state: S, savedAt: S.savedAt }); setSync('Saved to your account'); }
    catch (e) { setSync('Saved in this browser'); }
  }, 600);
}

const drill = id => S.drills.find(d => d.id === id);
const workout = id => S.workouts.find(w => w.id === id);
const sessionsIn = (start, end) => S.sessions.filter(s => s.endedAt >= start && s.endedAt < end);
const sessionsSince = days => sessionsIn(Date.now() - days * DAY, Date.now() + 1);

function activeItems(s) { return s.items.filter(i => i.status !== 'skipped'); }
function itemStats(items) {
  let att = 0, made = 0;
  items.forEach(i => (i.setLog || []).forEach(l => { att += +l.att || 0; made += +l.made || 0; }));
  return { att, made, pct: pctOf(made, att) };
}
function areaMinutesIn(start, end) {
  const m = {};
  AREAS.forEach(a => m[a] = 0);
  sessionsIn(start, end).forEach(s => {
    const items = activeItems(s);
    const weights = items.map(i => ({ c: i.category, w: Math.max(1, (i.setLog || []).length) }));
    const tot = sum(weights, x => x.w) || 1;
    weights.forEach(x => { m[x.c] = (m[x.c] || 0) + s.minutes * x.w / tot; });
  });
  return m;
}
function areaMinutes(days) { return areaMinutesIn(Date.now() - days * DAY, Date.now() + 1); }
function areaStatsIn(area, start, end) {
  const items = [];
  sessionsIn(start, end).forEach(s => activeItems(s).forEach(i => { if (i.category === area) items.push(i); }));
  return itemStats(items);
}
function lastResultFor(drillId) {
  const sorted = [...S.sessions].sort((a, b) => b.endedAt - a.endedAt);
  for (const s of sorted) {
    const it = s.items.find(i => i.drillId === drillId && i.status !== 'skipped');
    if (it) { const st = itemStats([it]); if (st.pct != null) return st.pct; }
  }
  return null;
}
function habitStreak(h) {
  let n = 0, d = today();
  const met = ds => (h.log[ds] || 0) >= h.target;
  if (!met(d)) d = addDays(d, -1);
  while (met(d)) { n++; d = addDays(d, -1); }
  return n;
}
function patternAnalysis(days = 21) {
  const cut = fmtD(new Date(Date.now() - days * DAY));
  const entries = S.journal.filter(j => j.date >= cut);
  const counts = {};
  entries.forEach(j => new Set(j.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const rows = TAGS.map(t => ({ ...t, n: counts[t.id] || 0 })).filter(r => r.n > 0).sort((a, b) => b.n - a.n);
  const verdict = r => r.n >= 3 ? (r.good ? 'Recurring strength' : 'Recurring weakness') : 'Watching: not enough repeats to act on';
  return { entries: entries.length, rows, verdict };
}
function estMinutes(items) {
  return Math.max(5, Math.round(sum(items, i => { const d = drill(i.drillId); const base = d ? d.minutes : 5; return base * (i.sets / ((d && d.sets) || i.sets || 1)); })));
}

/* Today's recommendation: rules over the plan, recent load and priorities. */
function recommend() {
  const t = today();
  const active = S.priorities.filter(p => p.status === 'active').sort((a, b) => a.rank - b.rank);
  const mins = areaMinutes(14);
  const top = active[0] || null;
  let area = top ? top.area : 'Finishing';
  const untouched = active.find(p => (mins[p.area] || 0) === 0);
  let reason = [];
  if (untouched && top && untouched !== top && (mins[top.area] || 0) > 0) { area = untouched.area; reason.push(untouched.area + ' has had no logged work in 14 days.'); }
  const game = S.plan.some(p => p.date === t && p.type === 'game');
  const practice = S.plan.some(p => p.date === t && p.type === 'team');
  const recentMin = sum(sessionsSince(1), s => s.minutes);
  let mode, minutes, hard = false;
  if (game) { mode = 'Game day'; minutes = 15; reason.push('Game on the schedule: keep it light, with form shots and free throws only.'); }
  else if (practice) { mode = 'Practice day'; minutes = 20; reason.push('Team practice today: a short session on your top area.'); }
  else if (recentMin >= 60) { mode = 'Recovery-leaning'; minutes = 20; reason.push('You trained ' + recentMin + ' min in the last 24 hours, so this block is shorter.'); }
  else { mode = 'Full session'; minutes = 45; hard = true; reason.push('No practice or game today and recent load is low.'); }
  return { area, mode, minutes, hard, reason: reason.join(' '), top, mins, weekMin: sum(sessionsSince(7), s => s.minutes), recentMin };
}

/* Rule-based builder: picks drills for one area, avoids the last two sessions, scales attempts from last results. */
function generate({ minutes, area, partner, hard }) {
  const recent = [...S.sessions].sort((a, b) => b.endedAt - a.endedAt).slice(0, 2);
  const recentIds = new Set();
  recent.forEach(s => s.items.forEach(i => recentIds.add(i.drillId)));
  let pool = S.drills.filter(d => d.category === area && (partner || !d.partner));
  if (!pool.length) pool = S.drills.filter(d => partner || !d.partner);
  pool = pool.sort((a, b) => ((recentIds.has(a.id) ? 1 : 0) - (recentIds.has(b.id) ? 1 : 0)) || (hard ? b.difficulty - a.difficulty : a.difficulty - b.difficulty));
  const items = [];
  let rem = minutes;
  const adjusted = [];
  for (const d of pool) {
    if (rem <= 3 || items.length >= 5) break;
    const sets = hard ? d.sets + 1 : d.sets;
    const est = d.minutes * sets / d.sets;
    if (items.length && est > rem + 2) continue;
    const last = lastResultFor(d.id);
    let att = d.attempts;
    if (last != null && last >= 75) { att = Math.round(att * 1.2); adjusted.push(d.name + ' up'); }
    else if (last != null && last < 40) { att = Math.max(5, Math.round(att * 0.8)); adjusted.push(d.name + ' down'); }
    items.push({ drillId: d.id, sets, attempts: att, restSec: hard ? 30 : 40, timeLimit: 0, targetPct: last != null ? Math.min(90, last + 5) : 0, coaching: '' });
    rem -= est;
  }
  const notes = [
    'Targets ' + area + '. Drills from your last two sessions were moved down the list.',
    adjusted.length ? 'Attempts adjusted from your last results: ' + adjusted.join(', ') + '.' : 'No prior results yet for these drills, so starting at library defaults.'
  ].join(' ');
  const w = {
    id: uid(), name: area + ' ' + minutes + '-min ' + (hard ? 'hard' : 'standard'),
    category: minutes <= 20 ? 'micro' : (partner ? 'competitive' : 'focused'),
    objective: area, secondary: [], duration: minutes, difficulty: hard ? 4 : 3,
    equipment: partner ? 'Ball, hoop, partner' : 'Ball, hoop', mode: partner ? 'Partner' : 'Individual',
    warmup: '5 min: jog, dynamic warm-up, 10 form shots', target: '', notes, template: false, favorite: false,
    created: Date.now(), items
  };
  return w;
}

/* ============ PLAN ============ */

function saveWorkout(startAfter) {
  readEditorForm();
  if (!editDraft.items.length) return;
  const idx = S.workouts.findIndex(x => x.id === editDraft.id);
  if (idx >= 0) S.workouts[idx] = editDraft; else S.workouts.push(editDraft);
  const saved = editDraft;
  editDraft = null;
  closeModal();
  save();
  if (startAfter && !S.run) startRun(saved);
  else render();
}

/* ============ RUNNER ============ */
function startRun(w) {
  if (S.run) return;
  S.run = {
    id: uid(), workoutId: w.id, name: w.name, objective: w.objective, category: w.category,
    startedAt: Date.now(), idx: 0, restEnd: 0, timerFor: null, tAcc: 0, tRunningSince: 0, modified: false, editTargets: false,
    items: w.items.map(it => {
      const d = drill(it.drillId);
      return {
        uid: uid(), drillId: it.drillId, name: d ? d.name : 'Removed drill', category: d ? d.category : w.objective,
        metric: d ? d.metric : 'makes', instructions: d ? d.instructions : '', video: d ? d.video : '',
        coaching: (it.coaching ? [it.coaching] : []).concat(d ? d.coaching : []),
        sets: it.sets, attempts: it.attempts, restSec: it.restSec ?? 30, timeLimit: it.timeLimit || 0,
        targetPct: it.targetPct || 0, status: 'pending', setLog: [], rating: 0, notes: ''
      };
    })
  };
  runnerMin = false;
  save();
  render();
}
function nextPending(from) {
  const r = S.run, n = r.items.length;
  for (let k = 0; k < n; k++) {
    const i = (from + k) % n;
    if (r.items[i].status === 'pending') return i;
  }
  return -1;
}
function ensureTimer(r, cur) {
  if (r.timerFor !== cur.uid) { r.timerFor = cur.uid; r.tAcc = 0; r.tRunningSince = 0; }
}
function timerSec(r, cur) {
  const elapsed = (r.tAcc + (r.tRunningSince ? Date.now() - r.tRunningSince : 0)) / 1000;
  return cur.timeLimit ? Math.max(0, cur.timeLimit - elapsed) : elapsed;
}
function runnerHTML() {
  const r = S.run;
  const total = r.items.length;
  const closed = r.items.filter(i => i.status !== 'pending').length;
  const pct = Math.round(100 * closed / Math.max(1, total));
  const cur = r.items[r.idx] || r.items[0];
  r.idx = r.items.indexOf(cur);
  ensureTimer(r, cur);
  const curIdx = r.idx;
  const running = !!r.tRunningSince;
  const restLeft = Math.ceil((r.restEnd - Date.now()) / 1000);
  const unit = cur.metric === 'reps' ? 'reps' : 'shots';
  const logged = cur.setLog.length;

  const head = `<div class="row">
      <button class="btn small ghost" data-a="run-min">Minimize</button>
      <div class="grow"><div class="tiny muted">${esc(r.name)} · ${closed}/${total} drills closed</div><div class="bar" style="margin-top:6px"><i style="width:${pct}%"></i></div></div>
      <button class="btn small ghost danger" data-a="run-discard">Discard</button>
    </div>`;

  let body;
  if (!cur || (closed === total)) {
    body = `<section class="card" style="margin-top:14px"><h2>All drills closed</h2><p class="muted small">Review the queue below, then finish to save this workout to your history.</p></section>`;
  } else {
    const stats = itemStats([cur]);
    const sets = cur.setLog.map((l, i) => 'Set ' + (i + 1) + ': ' + l.made + '/' + l.att + (l.att ? ' (' + pctOf(l.made, l.att) + '%)' : '')).join(' · ');
    body = `<section class="card" style="margin-top:14px">
      <div class="row"><span class="badge gold">${esc(CAT_SHORT[r.category] || r.category)} · ${esc(cur.category)}</span><span class="tiny muted">Drill ${curIdx + 1} of ${total}</span></div>
      <h2 style="margin-top:10px">${esc(cur.name)}</h2>
      ${cur.instructions ? '<p>' + esc(cur.instructions) + '</p>' : ''}
      ${cur.coaching.length ? '<ul class="coach small">' + cur.coaching.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>' : ''}
      ${cur.video ? '<a class="btn small" href="' + esc(cur.video) + '" target="_blank" rel="noopener">Watch demonstration</a>' : '<span class="tiny muted">No demonstration linked. Add a video link in the Library.</span>'}
      <div class="targets">Sets ${cur.sets} · ${cur.attempts} ${unit} per set · Rest ${cur.restSec}s${cur.targetPct ? ' · Target ' + cur.targetPct + '% makes' : ''}${cur.timeLimit ? ' · Time limit ' + cur.timeLimit + 's' : ''}</div>

      <div class="timer-box">
        <div class="tiny muted">${cur.timeLimit ? 'Countdown' : 'Stopwatch'}</div>
        <div class="timer" id="t-main">${fmtSec(timerSec(r, cur))}</div>
        <div class="btn-group" style="justify-content:center">
          <button class="btn small" data-a="run-timer" data-op="${running ? 'pause' : 'start'}">${running ? 'Pause' : 'Start'}</button>
          <button class="btn small ghost" data-a="run-timer" data-op="reset">Reset</button>
        </div>
      </div>
      ${restLeft > 0 ? '<div class="rest">Rest <span id="t-rest">' + fmtSec(restLeft) + '</span></div>' : (r.restEnd ? '<div class="rest" style="background:#1f3a2c">Rest <span id="t-rest">Go</span></div>' : '')}

      ${cur.status === 'pending' ? `
      <form data-f="runlog" class="stack">
        <div class="tiny muted">Set ${logged + 1} of ${cur.sets}</div>
        <div class="grid2">
          <div><label>Attempts</label><input name="att" type="number" min="0" value="${cur.attempts}" inputmode="numeric" required></div>

          <div><label>Notes</label><input name="notes" value="${esc(cur.notes)}" placeholder="How did it feel?"></div>
        </div>

        <div class="btn-group" style="justify-content:space-between">
          <button type="button" class="btn small ghost" data-a="run-skip">Skip drill</button>
          <button type="button" class="btn small ghost" data-a="run-replace">Replace drill</button>
          <button type="button" class="btn small ghost" data-a="run-add">Add drill</button>

      </form>` : `
      <div class="card" style="background:var(--bg);margin-top:10px">
        <div class="row"><strong>${cur.status === 'done' ? 'Drill complete' : 'Drill skipped'}</strong><span class="tiny muted">${stats.att ? stats.made + '/' + stats.att + ' · ' + pctTxt(stats.pct) : ''}</span></div>
        ${cur.rating ? '<div class="tiny muted">Difficulty ' + cur.rating + '/5</div>' : ''}
        ${cur.notes ? '<p class="small">' + esc(cur.notes) + '</p>' : ''}
        <div class="btn-group" style="margin-top:8px">
          <button class="btn primary" data-a="run-next">${nextPending(curIdx + 1) !== -1 ? 'Next drill' : 'Review and finish'}</button>
          <button class="btn small ghost" data-a="run-reopen">Reopen</button>
        </div>
      </div>`}
      ${sets ? '<div class="set-log">' + sets + '</div>' : ''}
      ${r.editTargets && cur.status === 'pending' ? `
      <form data-f="runtargets" class="card" style="background:var(--bg);margin-top:10px">
        <div class="grid4">
          <div><label>Sets</label><input type="number" name="sets" min="1" value="${cur.sets}"></div>
          <div><label>Attempts</label><input type="number" name="attempts" min="1" value="${cur.attempts}"></div>
          <div><label>Rest (s)</label><input type="number" name="restSec" min="0" value="${cur.restSec}"></div>
          <div><label>Target %</label><input type="number" name="targetPct" min="0" max="100" value="${cur.targetPct || 0}"></div>
        </div>
        <div class="btn-group" style="margin-top:10px"><button class="btn small primary" type="submit">Apply to this drill</button><button type="button" class="btn small ghost" data-a="run-targets">Cancel</button></div>
      </form>` : ''}
    </section>`;
  }

  return `<div class="run">
    ${head}
    ${body}
    <div class="card" style="margin-top:12px"><div class="tiny muted" style="margin-bottom:4px">Queue</div><div class="queue">
      ${r.items.map((it, i) => '<button data-a="run-goto" data-id="' + i + '" class="' + (i === curIdx ? 'cur' : '') + (it.status === 'skipped' ? ' off' : '') + '"><span>' + (i + 1) + '. ' + esc(it.name) + '</span><span class="tiny">' + (it.status === 'done' ? 'Done' : it.status === 'skipped' ? 'Skipped' : it.setLog.length + '/' + it.sets + ' sets') + '</span></button>').join('')}
    </div></div>
    <div class="row end" style="margin-top:14px">
      <button class="btn ghost" data-a="run-min">Minimize</button>
      <button class="btn primary" data-a="run-finish">Finish workout</button>
    </div>
  </div>`;
}
function finishRun() {
  const r = S.run;
  if (!r) return;
  const now = Date.now();
  const active = r.items.filter(i => i.status !== 'skipped');
  const planned = sum(active, i => i.sets) || 1;
  const logged = sum(active, i => Math.min(i.setLog.length, i.sets));
  const minutes = Math.max(1, Math.min(240, Math.round((now - r.startedAt) / 60000)));
  S.sessions.push({
    id: uid(), workoutId: r.workoutId, name: r.name, objective: r.objective, category: r.category,
    startedAt: r.startedAt, endedAt: now, minutes, completionPct: Math.round(100 * logged / planned), modified: !!r.modified,
    items: r.items.map(i => ({ drillId: i.drillId, name: i.name, category: i.category, metric: i.metric, sets: i.sets, attempts: i.attempts, restSec: i.restSec, timeLimit: i.timeLimit, status: i.status, setLog: i.setLog, rating: i.rating, notes: i.notes }))
  });
  S.run = null;
  runnerMin = false;
  save();
  location.hash = 'train';
  trainTab = 'history';
  render();
}
function sessionAsWorkout(s) {
  return { id: s.workoutId || uid(), name: s.name, category: s.category, objective: s.objective || 'Finishing', items: s.items.filter(i => i.drillId).map(i => ({ drillId: i.drillId, sets: i.sets, attempts: i.attempts, restSec: i.restSec ?? 30, timeLimit: i.timeLimit || 0, targetPct: 0, coaching: '' })) };

/* ============ ANALYTICS ============ */
function analyticsView() {
  const days = analyticsDays;
  const now = Date.now();
  const cur = { s: now - days * DAY, e: now + 1 };
  const prev = { s: now - 2 * days * DAY, e: now - days * DAY };
  const sessNow = sessionsIn(cur.s, cur.e), sessPrev = sessionsIn(prev.s, prev.e);
  const minNow = sum(sessNow, s => s.minutes), minPrev = sum(sessPrev, s => s.minutes);
  const stNow = itemStats(sessNow.flatMap(s => activeItems(s)));
  const stPrev = itemStats(sessPrev.flatMap(s => activeItems(s)));
  const dayset = new Set(sessNow.map(s => fmtD(new Date(s.endedAt))));
  const consistency = Math.round(100 * dayset.size / days);
  const weeks = [...Array(8)].map((_, k) => {
    const e = now - k * 7 * DAY + 1, s = e - 7 * DAY;
    return { label: k === 0 ? 'This wk' : k + 'w', min: sum(sessionsIn(s, e), x => x.minutes) };
  }).reverse();
  const maxW = Math.max(60, ...weeks.map(w => w.min));
  const dist = areaMinutesIn(cur.s, cur.e);
  const distTotal = sum(Object.values(dist)) || 1;
  const distRows = Object.entries(dist).filter(([, m]) => m > 0).sort((a, b) => b[1] - a[1]);
  const byDrill = {};
  sessNow.forEach(s => activeItems(s).forEach(i => {
    const k = i.drillId; byDrill[k] = byDrill[k] || { name: i.name, items: [] };
    byDrill[k].items.push(i);
  }));
  const drillRows = Object.values(byDrill).map(x => ({ name: x.name, ...itemStats(x.items) })).filter(x => x.att > 0).sort((a, b) => b.att - a.att).slice(0, 8);
  const feedback = [...Array(4)].map((_, k) => {
    const e = now - k * 7 * DAY + 1, s = e - 7 * DAY;
    const cut1 = fmtD(new Date(s)), cut2 = fmtD(new Date(e));
    const js = S.journal.filter(j => j.date >= cut1 && j.date < cut2);
    return { label: k === 0 ? 'This wk' : k + 'w', avg: js.length ? (sum(js, j => j.difficulty) / js.length) : null, n: js.length };
  }).reverse();
  const imp = AREAS.slice(0, 4).map(a => {
    const x = areaStatsIn(a, cur.s, cur.e), y = areaStatsIn(a, prev.s, prev.e);
    const delta = (x.pct != null && y.pct != null) ? x.pct - y.pct : null;
    return { a, x, y, delta };
  });
  const arrow = d => d == null ? '<span class="muted">not enough data</span>' : d > 0 ? '<span class="ok">▲ ' + d + ' pts</span>' : d < 0 ? '<span class="bad-t">▼ ' + Math.abs(d) + ' pts</span>' : '<span class="muted">no change</span>';
  return `
  <div class="chips" style="margin:12px 0 4px">${[7, 28].map(d => '<button class="chip ' + (days === d ? 'on' : '') + '" data-a="an-period" data-id="' + d + '">Last ' + d + ' days</button>').join('')}</div>
  <div class="tiles" style="margin-top:10px">
    <div class="tile"><div class="n">${fmtMin(minNow)}</div><div class="l">Training time · prev ${fmtMin(minPrev)}</div></div>
    <div class="tile"><div class="n">${sessNow.length}</div><div class="l">Workouts done · prev ${sessPrev.length}</div></div>
    <div class="tile"><div class="n">${consistency}%</div><div class="l">Days trained</div></div>
    <div class="tile"><div class="n">${pctTxt(stNow.pct)}</div><div class="l">Makes · ${stNow.att} attempts</div></div>
  </div>

  <div class="sec-h"><h2>Weekly training minutes</h2></div>
  <div class="card"><div class="cols">${weeks.map((w, i) => '<div class="col ' + (i === weeks.length - 1 ? 'now' : '') + '"><span class="tiny">' + fmtMin(w.min).replace(' min', 'm') + '</span><i style="height:' + Math.max(2, Math.round(100 * w.min / maxW)) + '%"></i><span>' + w.label + '</span></div>').join('')}</div>
    <p class="tiny muted" style="margin-top:8px">Your weekly target is ${S.profile.weeklyMinutes || 0} min, set on your profile.</p></div>

  <div class="sec-h"><h2>Skill distribution</h2></div>
  <div class="card list" style="padding:4px 14px">${distRows.map(([a, m]) => `<div class="li"><div class="row"><strong>${esc(a)}</strong><span class="tiny muted">${fmtMin(m)} · ${Math.round(100 * m / distTotal)}%</span></div><div class="bar" style="margin-top:6px"><i style="width:${Math.round(100 * m / distTotal)}%"></i></div></div>`).join('') || '<div class="li tiny muted">No training logged in this period.</div>'}</div>

  <div class="sec-h"><h2>Improvement vs previous period</h2></div>
  <div class="card list" style="padding:4px 14px">${imp.map(r => `<div class="li row"><div><strong>${esc(r.a)}</strong><div class="tiny muted">${r.x.att} attempts now · ${r.y.att} before</div></div><div>${arrow(r.delta)}</div></div>`).join('')}</div>

  <div class="sec-h"><h2>Drill performance</h2></div>
  <div class="card list" style="padding:4px 14px">${drillRows.map(d => `<div class="li row"><div class="grow"><strong>${esc(d.name)}</strong><div class="bar" style="margin-top:6px"><i style="width:${d.pct || 0}%"></i></div></div><div class="tiny muted" style="text-align:right;min-width:90px">${pctTxt(d.pct)} · ${d.att}</div></div>`).join('') || '<div class="li tiny muted">No shot data in this period.</div>'}</div>

  <div class="sec-h"><h2>Practice feedback</h2></div>
  <div class="card"><div class="cols" style="height:90px">${feedback.map((f, i) => '<div class="col ' + (i === feedback.length - 1 ? 'now' : '') + '"><span class="tiny">' + (f.avg == null ? '—' : f.avg.toFixed(1)) + '</span><i style="height:' + (f.avg == null ? 2 : Math.round(f.avg * 10)) + '%"></i><span>' + f.label + '</span></div>').join('')}</div>
    <p class="tiny muted" style="margin-top:8px">Average practice difficulty (1–10) by week. Entries logged: ${feedback.map(f => f.n).join(', ')}.</p></div>

  <p class="tiny muted" style="margin-top:14px">Shot Lab with location tracking and the full shot chart come in Phase 3.</p>`;
}

/* ============ DEVELOPMENT BOARD ============ */
function devView() {
  const now = Date.now();
  const ps = [...S.priorities].sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || a.rank - b.rank);
  const active = ps.filter(p => p.status === 'active');
  const pa = patternAnalysis(21);
  const areaCards = ps.map((p, idx) => {
    const st = areaStatsIn(p.area, now - 14 * DAY, now + 1);
    const prev = areaStatsIn(p.area, now - 28 * DAY, now - 14 * DAY);
    const delta = (st.pct != null && prev.pct != null) ? st.pct - prev.pct : null;
    const trend = delta == null ? 'Not enough data to compare' : delta > 0 ? 'Improving: +' + delta + ' pts vs prior 14 days' : delta < 0 ? 'Declining: ' + delta + ' pts vs prior 14 days' : 'Flat vs prior 14 days';
    const rel = S.drills.filter(d => d.category === p.area).slice(0, 4);
    const wks = S.workouts.filter(w => w.objective === p.area).slice(0, 3);
    const tagHits = pa.rows.filter(r => r.area === p.area);
    const notes = p.notes.slice(-3).reverse();
    const minutes = Math.round(areaMinutes(14)[p.area] || 0);
    return `<article class="card ${p.status !== 'active' ? '' : 'hi'}">
      <div class="row"><div class="grow"><div class="tiny muted">${esc(p.area)}</div><h3>${esc(p.title)}</h3></div>
        <div class="btn-group">

          ${p.status === 'active' ? '<button class="btn small ghost" data-a="pr-move" data-id="' + p.id + '" data-dir="-1"' + (idx === 0 ? ' disabled' : '') + '>↑</button><button class="btn small ghost" data-a="pr-move" data-id="' + p.id + '" data-dir="1"' + (idx === active.length - 1 ? ' disabled' : '') + '>↓</button>' : ''}
        </div></div>
      <div class="tiles" style="grid-template-columns:repeat(3,1fr);margin:12px 0">
        <div class="tile"><div class="n">${pctTxt(st.pct)}</div><div class="l">Makes, 14 days</div></div>
        <div class="tile"><div class="n">${st.att}</div><div class="l">Attempts, 14 days</div></div>
        <div class="tile"><div class="n">${minutes}</div><div class="l">Min, 14 days</div></div>
      </div>
      <div class="small">${trend}</div>
      ${tagHits.length ? '<div class="tiny" style="margin-top:6px">Journal: ' + tagHits.map(r => esc(r.label) + ' (' + r.n + ')').join(', ') + '</div>' : ''}
      <form data-f="priority" data-id="${p.id}" class="stack" style="margin-top:12px">
        <div class="grid2"><div><label>Title</label><input name="title" value="${esc(p.title)}"></div>
        <div><label>Status</label><select name="status">${['active', 'paused', 'achieved'].map(s => '<option' + (p.status === s ? ' selected' : '') + '>' + s + '</option>').join('')}</select></div></div>
        <label>Starting assessment</label><textarea name="assessment" rows="2" placeholder="Where you are now, with a number if you have one">${esc(p.assessment)}</textarea>
        <label>Measurable target</label><textarea name="target" rows="2" placeholder="e.g. 50% on 100 catch-and-shoot attempts by Dec 20">${esc(p.target)}</textarea>
        <div class="grid2"><div><label>Review date</label><input type="date" name="reviewDate" value="${esc(p.reviewDate)}"></div><div></div></div>
        <div class="btn-group"><button class="btn small primary" type="submit">Save</button><button type="button" class="btn small ghost danger" data-a="pr-del" data-id="${p.id}">Delete</button></div>
      </form>
      <details style="margin-top:10px"><summary class="small muted">Sub-skills and related work</summary>
        <div class="tiny muted" style="margin-top:6px">${p.subskills.map(esc).join(' · ')}</div>
        <div class="tiny" style="margin-top:8px"><strong>Related drills:</strong> ${rel.map(d => esc(d.name)).join(', ') || 'None yet'}</div>
        <div class="tiny" style="margin-top:4px"><strong>Related workouts:</strong> ${wks.map(w => esc(w.name)).join(', ') || 'None yet'}</div>
      </details>
      <form data-f="prNote" data-id="${p.id}" class="row" style="margin-top:10px"><input name="text" placeholder="Log a progress note" style="flex:1" required><button class="btn small" type="submit">Log</button></form>
      ${notes.length ? '<div class="list tiny" style="margin-top:6px">' + notes.map(n => '<div class="li" style="padding:6px 0"><span class="muted">' + dayLabel(n.date) + ':</span> ' + esc(n.text) + '</div>').join('') + '</div>' : ''}
    </article>`;
  }).join('');
  const neglected = active.filter(p => (areaMinutes(14)[p.area] || 0) === 0).map(p => p.title);

  <div class="card" style="margin-top:12px"><h3>Right now</h3>
    <p class="small">${active.length} active priorit${active.length === 1 ? 'y' : 'ies'}.${neglected.length ? ' <span class="warn-t">Needs attention, no work logged in 14 days: ' + neglected.map(esc).join(', ') + '.</span>' : ' Every active area has had work in the last 14 days.'}</p>
    <p class="small muted">Priorities change only when you change them. One bad practice does not reorder them; repeated journal patterns are flagged for you to act on.</p>
  </div>

/* ============ ACTIONS ============ */
function closeModal() { $('#modal').hidden = true; $('#modal').innerHTML = ''; editDraft = null; }
function arm(t, fn) {
  if (t.dataset.armed) { fn(); return; }
  t.dataset.armed = '1';
  const old = t.textContent;
  t.textContent = 'Tap again to confirm';
  setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = old; } }, 3000);
}
function runNext(fromIdx) {
  const r = S.run;
  const n = nextPending(fromIdx + 1);
  if (n === -1) { r.idx = fromIdx; } else { r.idx = n; }
  r.restEnd = 0;
  save(); render();
}
function quickBuild() {
  const r = recommend();
  openWorkoutEditor(generate({ minutes: r.minutes, area: r.area, partner: false, hard: r.hard }));
}
function pickDrill(mode, id) {
  const r = S.run;
  const d = drill(id);
  if (!r || !d) return;
  if (mode === 'replace') {
    const cur = r.items[r.idx];
    if (cur.setLog.length) return;
    Object.assign(cur, { drillId: d.id, name: d.name, category: d.category, metric: d.metric, instructions: d.instructions, video: d.video, coaching: d.coaching, sets: d.sets, attempts: d.attempts, status: 'pending' });
  } else {
    r.items.splice(r.idx + 1, 0, { uid: uid(), drillId: d.id, name: d.name, category: d.category, metric: d.metric, instructions: d.instructions, video: d.video, coaching: d.coaching, sets: d.sets, attempts: d.attempts, restSec: 30, timeLimit: 0, targetPct: 0, status: 'pending', setLog: [], rating: 0, notes: '' });
    r.idx = r.idx + 1;
  }
  r.modified = true;
  closeModal();
  save(); render();
}
function setPriorityFromTag(area) {
  const p = S.priorities.find(x => x.area === area);
  if (p && p.status === 'active') return;
  if (p) { p.status = 'active'; p.rank = Math.max(0, ...S.priorities.map(x => x.rank)) + 1; }
  else S.priorities.push({ id: 'p-' + slug(area) + '-' + uid(), area, title: area, subskills: SUBSKILLS[area] || [], assessment: '', target: '', status: 'active', rank: Math.max(0, ...S.priorities.map(x => x.rank)) + 1, reviewDate: '', notes: [], progress: [] });
  renumber();
}
function renumber() {
  S.priorities.filter(p => p.status === 'active').sort((a, b) => a.rank - b.rank).forEach((p, i) => p.rank = i + 1);
}

/* ============ FORMS ============ */
const FORM = {
  runlog(fd) {
    const r = S.run; if (!r) return;
    const cur = r.items[r.idx];
    if (!cur || cur.status !== 'pending') return;
    const att = Math.max(0, +fd.get('att') || 0);
    const made = Math.max(0, Math.min(att, +fd.get('made') || 0));
    cur.setLog.push({ att, made, at: Date.now() });
    cur.rating = +fd.get('rating') || cur.rating || 0;
    cur.notes = fd.get('notes') || '';
    if (cur.setLog.length >= cur.sets) { cur.status = 'done'; r.restEnd = 0; }
    else { r.restEnd = Date.now() + (cur.restSec || 0) * 1000; }
    save(); render();
  },
  runtargets(fd) {
    const r = S.run; if (!r) return;
    const cur = r.items[r.idx];
    cur.sets = Math.max(1, +fd.get('sets') || cur.sets);
    cur.attempts = Math.max(1, +fd.get('attempts') || cur.attempts);
    cur.restSec = Math.max(0, +fd.get('restSec') || 0);
    cur.targetPct = Math.min(100, Math.max(0, +fd.get('targetPct') || 0));
    r.editTargets = false; r.modified = true;
    save(); render();
  },
  workout(fd) { saveWorkout(false); },
  build(fd) {
    const w = generate({ minutes: +fd.get('minutes') || 20, area: fd.get('area') || 'Finishing', partner: fd.get('partner') === '1', hard: fd.get('hard') === '1' });
    if (!w.items.length) { alertInline('No drills match that mode. Try Individual or another focus.'); return; }
    openWorkoutEditor(w);
  },
  drill(fd) {
    const id = fd.get('id');
    const existing = id ? drill(id) : null;
    const d = {
      id: existing ? existing.id : 'c-' + uid(),
      name: (fd.get('name') || 'Untitled drill').trim(),
      category: fd.get('category') || 'Finishing',
      difficulty: Math.min(5, Math.max(1, +fd.get('difficulty') || 3)),
      secondary: (fd.get('secondary') || '').split(',').map(s => s.trim()).filter(Boolean),
      instructions: fd.get('instructions') || '',
      coaching: (fd.get('coaching') || '').split('\n').map(s => s.trim()).filter(Boolean),
      equipment: fd.get('equipment') || '',
      minutes: Math.max(1, +fd.get('minutes') || 8),
      sets: Math.max(1, +fd.get('sets') || 3),
      attempts: Math.max(1, +fd.get('attempts') || 10),
      metric: fd.get('metric') === 'reps' ? 'reps' : 'makes',
      partner: fd.get('partner') === 'on',
      favorite: existing ? existing.favorite : false,
      custom: existing ? existing.custom : true,
      video: fd.get('video') || ''
    };
    if (existing) Object.assign(existing, d); else S.drills.push(d);
    closeModal(); save(); render();
  },
  coll(fd) {
    const name = (fd.get('name') || '').trim(); if (!name) return;
    S.collections.push({ id: uid(), name, drillIds: [] });
    save(); render();
  },
  profile(fd) {
    ['position', 'secondary', 'height', 'level', 'style', 'strengths', 'weaknesses', 'shortGoals', 'longGoals', 'equipment', 'environments', 'partner', 'schedule', 'games', 'durations'].forEach(k => S.profile[k] = fd.get(k) || '');
    S.profile.weeklyMinutes = Math.max(0, +fd.get('weeklyMinutes') || 0);
    save(); render();
  },
  journal(fd) {
    const text = ['well', 'poorly', 'opps', 'mistakes', 'improve'].map(k => fd.get(k) || '').join(' ');
    const picked = new Set(fd.getAll('tags'));
    const entry = {
      id: uid(), date: fd.get('date') || today(), difficulty: Math.min(10, Math.max(1, +fd.get('difficulty') || 5)),
      well: fd.get('well') || '', poorly: fd.get('poorly') || '', opps: fd.get('opps') || '', mistakes: fd.get('mistakes') || '', improve: fd.get('improve') || '',
      tags: [...picked], created: Date.now()
    };
    if (!text.trim()) return;
    S.journal.push(entry);
    save(); render();
  },
  priority(fd, f) {
    const p = S.priorities.find(x => x.id === f.dataset.id); if (!p) return;
    const prevStatus = p.status;
    p.title = fd.get('title') || p.area;
    p.status = fd.get('status') || 'active';
    p.assessment = fd.get('assessment') || '';
    p.target = fd.get('target') || '';
    p.reviewDate = fd.get('reviewDate') || '';
    if (prevStatus !== p.status && p.status !== 'active') p.rank = 0;
    if (p.status === 'active' && prevStatus !== 'active') p.rank = Math.max(0, ...S.priorities.map(x => x.rank)) + 1;
    renumber(); save(); render();
  },
  priorityNew(fd) {
    const area = fd.get('area') || 'Finishing';
    const nextRank = Math.max(0, ...S.priorities.map(x => x.rank)) + 1;
    S.priorities.push({ id: 'p-' + slug(area) + '-' + uid(), area, title: (fd.get('title') || '').trim() || area, subskills: SUBSKILLS[area] || [], assessment: '', target: '', status: 'active', rank: nextRank, reviewDate: '', notes: [], progress: [] });
    renumber(); save(); render();
  },
  prNote(fd, f) {
    const p = S.priorities.find(x => x.id === f.dataset.id); const text = (fd.get('text') || '').trim();
    if (!p || !text) return;
    p.notes.push({ date: today(), text });
    save(); render();
  },
  plan(fd) {
    const title = (fd.get('title') || '').trim(); if (!title) return;
    S.plan.push({ id: uid(), date: fd.get('date') || today(), type: fd.get('type') || 'workout', title, time: fd.get('time') || '', minutes: +fd.get('minutes') || 0, status: 'planned' });
    planDate = fd.get('date') || null;
    save(); render();
  },
  habit(fd) {
    const name = (fd.get('name') || '').trim(); if (!name) return;
    S.habits.push({ id: uid(), name, target: Math.max(1, +fd.get('target') || 1), unit: (fd.get('unit') || '').trim() || 'reps', log: {} });
    save(); render();
  },
  habitLog(fd, f) {
    const h = S.habits.find(x => x.id === f.dataset.id); if (!h) return;
    const v = Math.max(0, +fd.get('value') || 0);
    const t = today();
    h.log[t] = (h.log[t] || 0) + v;
    save(); render();
  }
};

/* ============ WIRING ============ */
document.addEventListener('click', e => {
  if (e.target && e.target.id === 'modal') { closeModal(); return; }
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const fn = ACT[t.dataset.a];
  if (!fn) return;
  if (t.tagName === 'A') e.preventDefault();
  try { fn(t, t.dataset.id, e); } catch (err) { console.error(err); }
  if (t.dataset.a === 'goto-dev') e.preventDefault();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  const kind = f.dataset.f;
  if (!kind || !FORM[kind]) return;
  try { FORM[kind](new FormData(f), f); } catch (err) { console.error(err); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.ed && editDraft) {
    const it = editDraft.items[+el.dataset.idx];
    if (it) it[el.dataset.ed] = Math.max(el.dataset.ed === 'sets' || el.dataset.ed === 'attempts' ? 1 : 0, +el.value || 0);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'libq') { libFilter.q = e.target.value; renderLibListOnly(); }
  if (e.target.id === 'pick-q') {
    const q = e.target.value.trim().toLowerCase();
    $$('.pick-row').forEach(b => { b.hidden = !!q && !b.dataset.name.includes(q); });
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
window.addEventListener('hashchange', () => { if (!S.run) runnerMin = false; render(); });

setInterval(() => {
  const r = S.run; if (!r) return;
  const cur = r.items[r.idx]; if (!cur) return;
  ensureTimer(r, cur);
  const tm = $('#t-main'); if (tm) tm.textContent = fmtSec(timerSec(r, cur));
  const rt = $('#t-rest');
  if (rt) {
    const left = Math.ceil((r.restEnd - Date.now()) / 1000);
    if (left > 0) rt.textContent = fmtSec(left);
    else { rt.textContent = 'Go'; }
  }
}, 250);

render();
initDb();
</script>
<script>
// ===================== Training Center ↔ Athlete suite bridge =====================
// Runs after the Training Center's own script (vendor/btc.html, unchanged except its storage names).
// 1. App switcher (saves before leaving).
// 2. Finished sessions become workouts in day-YYYY-MM-DD → exercise[] (CONTRACT.md), so they count in Athlete OS load,
//    analytics and the Lab, and in MacroLens calories. One entry per session (id "btc-<session id>"), never twice.
// 3. Today's recommendation also reads Athlete OS: the calendar (games, practices), load ratio and readiness (read-only).
// 4. Publishes "btc-sig", the Training Center's weekly summary.
(function () {
  const lsJ = (k) => { try { return JSON.parse(localStorage.getItem('ml:' + k)); } catch { return null; } };
  const lsW = (k, v) => { try { localStorage.setItem('ml:' + k, JSON.stringify(v)); } catch {} };
  let coll = null;
  const ready = (async () => {
    if (!window.claude?.use) return null;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = user ? await user.id() : null;
    if (!db || !id) return null;
    coll = db.collection('data/users/' + id); return coll;
  })().catch(() => null);
  /** Fresh copies of the docs we need (from the account when available, else this device). */
  async function fetchDocs(keys) {
    const out = {}; for (const k of keys) out[k] = lsJ(k);
    const c = await ready; if (!c) return out;
    try { const snap = await c.get(); for (const d of snap.docs) if (d.exists && keys.includes(d.id)) { out[d.id] = JSON.parse(JSON.stringify(d.data())); lsW(d.id, out[d.id]); } } catch {}
    return out;
  }
  async function writeDoc(k, v) { lsW(k, v); const c = await ready; if (c) { try { await c.doc(k).set(JSON.parse(JSON.stringify(v))); } catch {} } }

  // ---------- 1. switcher ----------
  async function saveNow() {
    clearTimeout(dbTimer);
    if (dbDoc) { try { await dbDoc.set({ state: S, savedAt: S.savedAt }); } catch {} }
    await exportSessions();
  }
  Suite.mount(document.getElementById('suite-host'), 'btc', saveNow);

  // ---------- 2. sessions → workouts ----------
  const AREA_TYPE = { Shooting: 'shooting', 'Ball Handling': 'handles', Finishing: 'finishing', Conditioning: 'conditioning', Movement: 'conditioning' };
  const MET = { shooting: 4.5, handles: 5, finishing: 6, skill: 5.5, conditioning: 9 }, INTF = { light: 0.8, moderate: 1, hard: 1.2 };
  function asWorkout(s, weightLb) {
    const items = activeItems(s), w = {};
    for (const i of items) w[i.category] = (w[i.category] || 0) + Math.max(1, (i.setLog || []).length);
    const top = Object.entries(w).sort((a, b) => b[1] - a[1])[0]?.[0] || s.objective, type = AREA_TYPE[top] || 'skill';
    const rated = items.filter((i) => i.rating), rpe = rated.length ? Math.max(2, Math.min(10, Math.round((sum(rated, (i) => i.rating) / rated.length) * 2))) : null;
    const int = rpe == null ? 'moderate' : rpe >= 7 ? 'hard' : rpe <= 3 ? 'light' : 'moderate', st = itemStats(items), d = new Date(s.startedAt);
    const kcal = Math.round(MET[type] * INTF[int] * (weightLb || 150) * 0.4536 * (s.minutes / 60));
    return { date: fmtD(d), entry: { id: 'btc-' + s.id, type, name: s.name, mins: s.minutes, int, ...(rpe ? { rpe } : {}), time: pad(d.getHours()) + ':' + pad(d.getMinutes()), kcal, addedAt: s.endedAt, source: 'training-center', btc: { sessionId: s.id, workoutId: s.workoutId, area: top, attempts: st.att, makes: st.made, pct: st.pct, completionPct: s.completionPct } } };
  }
  let exporting = null;
  function exportSessions() {
    if (exporting) return exporting;
    // The finally below must run after this assignment, so the work starts after one await.
    exporting = (async () => {
      await null;
      try {
        const since = Date.now() - 60 * DAY, todo = S.sessions.filter((s) => s.endedAt >= since);
        if (!todo.length) return;
        const sync = (await fetchDocs(['btc-sync']))['btc-sync'] || { exported: {} }, pending = todo.filter((s) => !sync.exported[s.id]);
        if (!pending.length) return;
        const wl = (await fetchDocs(['core'])).core?.profile?.weightLb;
        const byDate = {}; for (const s of pending) { const x = asWorkout(s, wl); (byDate[x.date] ||= []).push(x.entry); }
        const days = await fetchDocs(Object.keys(byDate).map((d) => 'day-' + d));
        for (const [date, entries] of Object.entries(byDate)) {
          const k = 'day-' + date, doc = days[k] || { breakfast: [], lunch: [], dinner: [], snacks: [], water: 0 }, ids = new Set(entries.map((e) => e.id));
          doc.exercise = [...(doc.exercise || []).filter((e) => !ids.has(e.id)), ...entries];
          if (doc.type === 'rest') doc.type = 'training';
          await writeDoc(k, doc);
          for (const e of entries) sync.exported[e.btc.sessionId] = date;
        }
        await writeDoc('btc-sync', sync);
      } catch (e) { console.error(e); } finally { exporting = null; }
    })();
    return exporting;
  }
  const _finish = finishRun;
  finishRun = function () { _finish(); exportSessions().then(writeSig); };

  // ---------- 3. Athlete OS context for today's recommendation ----------
  let ctx = null;
  function aosToday() {
    const t = today(), wd = new Date(t + 'T12:00:00').getDay(), evs = (ctx?.plan?.events || []).filter((e) => !(e.skip || []).includes(t) && (e.date === t || (e.recur?.days?.includes(wd) && t >= e.date && (!e.recur.until || t <= e.recur.until))));
    return { game: evs.some((e) => e.type === 'game') || ctx?.aos?.profile?.nextGame === t || (ctx?.core?.game?.date === t), practice: evs.some((e) => e.type === 'practice') };
  }
  const _rec = recommend;
  recommend = function () {
    const r = _rec(); if (!ctx) return r;
    const fresh = ctx.sig && ctx.sig.updated && (Date.now() - new Date(ctx.sig.updated + 'T12:00:00')) < 3 * DAY ? ctx.sig : null, td = aosToday(), notes = [];
    if (td.game && r.mode !== 'Game day') { Object.assign(r, { mode: 'Game day', minutes: 15, hard: false }); notes.push('Your Athlete OS calendar has a game today: form shots and free throws only.'); }
    else if (td.practice && r.mode === 'Full session') { Object.assign(r, { mode: 'Practice day', minutes: 20, hard: false }); notes.push('Your Athlete OS calendar has team practice today.'); }
    if (r.hard && fresh?.acwr != null && fresh.acwr > 1.3) { Object.assign(r, { mode: 'Recovery-leaning', minutes: Math.min(r.minutes, 20), hard: false }); notes.push(`Athlete OS load ratio is ${fresh.acwr}, above 1.3, so this block is lighter.`); }
    else if (r.hard && fresh?.readiness != null && fresh.readiness < 45) { Object.assign(r, { mode: 'Recovery-leaning', minutes: Math.min(r.minutes, 20), hard: false }); notes.push(`Athlete OS readiness is ${fresh.readiness}/100 today.`); }
    if (r.mode === 'Full session' && fresh?.acwr != null) r.reason = r.reason.replace('recent load is low', `your Athlete OS load ratio is ${fresh.acwr}`);
    if (notes.length) r.reason = [r.reason.replace('No practice or game today and recent load is low.', '').trim(), ...notes].filter(Boolean).join(' ');
    r.fromAos = true;
    return r;
  };

  // ---------- 4. weekly signals ----------
  function writeSig() {
    try {
      const t = today(), wd = (new Date(t + 'T12:00:00').getDay() + 6) % 7, mon = addDays(t, -wd), monMs = new Date(mon + 'T00:00:00').getTime();
      const mins = areaMinutes(7), next = S.plan.filter((p) => p.date >= t && p.status !== 'done').sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')))[0];
      const s = { v: 1, app: 'btc', week: mon, updated: t, sessionsDone: S.sessions.filter((x) => x.endedAt >= monMs).length, minsByArea7d: Object.fromEntries(Object.entries(mins).filter(([, m]) => m > 0).map(([a, m]) => [a, Math.round(m)])), nextPlanned: next ? { date: next.date, title: next.title, type: next.type } : null };
      const cur = lsJ('btc-sig') || {}; if (JSON.stringify({ ...cur, updated: 0 }) === JSON.stringify({ ...s, updated: 0 })) return;
      writeDoc('btc-sig', s);
    } catch (e) { console.error(e); }
  }

  (async () => {
    const d = await fetchDocs(['aos-signals', 'aos-plan', 'aos', 'core']);
    ctx = { sig: d['aos-signals'], plan: d['aos-plan'], aos: d.aos, core: d.core };
    render();
    setTimeout(() => { exportSessions().then(writeSig); }, 1500);
  })();
  window.addEventListener('pagehide', () => { try { if (dbDoc) dbDoc.set({ state: S, savedAt: S.savedAt }); } catch {} });
  window.BTC_SUITE = { exportSessions, asWorkout, ctx: () => ctx };
})();

</script>

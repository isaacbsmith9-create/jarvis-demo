<title>Basketball IQ Lab</title>
<meta name="description" content="Possession simulator and film room for point guards: read pick-and-roll coverages, make live decisions, and get graded on the decision, not the outcome.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/*CSS*/
</style>
<div class="app">
  <aside class="rail" aria-label="Sections">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>IQ<i>Lab</i></span></div>
    <nav class="rail-nav" id="rail-nav"></nav>
    <div class="rail-foot"><span class="sync" id="sync" data-s="local">This device</span></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="brand"><span class="mark" aria-hidden="true"></span><span>Basketball IQ<i>Lab</i></span></div>
      <span class="sync" id="sync-m" data-s="local"></span>
    </header>
    <main id="views">
      <section id="view-home" class="view"></section>
      <section id="view-sim" class="view" hidden></section>
      <section id="view-pnr" class="view" hidden></section>
      <section id="view-iq" class="view" hidden></section>
      <section id="view-playbook" class="view" hidden></section>
      <section id="view-teamsim" class="view" hidden></section>
      <section id="view-defense" class="view" hidden></section>
      <section id="view-cv" class="view" hidden></section>
      <section id="view-film" class="view" hidden></section>
      <section id="view-challenges" class="view" hidden></section>
      <section id="view-me" class="view" hidden></section>
      <section id="view-quiz" class="view" hidden></section>
      <section id="view-play" class="view" hidden>
        <div class="play-head">
          <button type="button" class="btn ghost sm" id="pl-back">‹ Back</button>
          <div class="ph-title"><span class="eyebrow" id="pl-eyebrow"></span><h2 id="pl-title"></h2></div>
          <div class="seg" id="pl-mode" role="group" aria-label="Mode">
            <button type="button" data-mode="live" id="pl-mode-live">Live</button>
            <button type="button" data-mode="film" id="pl-mode-film">Film</button>
          </div>
        </div>
        <div class="play-grid">
          <div class="stage-col">
            <div class="stage" id="stage">
              <canvas id="court" aria-label="Half court" role="img"></canvas>
              <div class="hud">
                <div class="hud-mode" id="hud-mode">LIVE</div>
                <div class="hud-clock" id="hud-clock"><small>SHOT CLOCK</small><b>14.0</b></div>
                <div class="hud-count" id="hud-count" hidden>
                  <svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="ring-bg"></circle><circle cx="22" cy="22" r="19" class="ring-fg" id="hud-ring"></circle></svg>
                  <b id="hud-count-n">3.0</b>
                </div>
                <div class="hud-prompt" id="hud-prompt" hidden></div>
                <div class="hud-stamp" id="hud-stamp" hidden></div>
              </div>
            </div>
            <div class="timeline" id="timeline">
              <button type="button" class="icon-btn" id="tl-play" aria-label="Play"></button>
              <button type="button" class="icon-btn" id="tl-restart" aria-label="Replay from start"></button>
              <div class="tl-track">
                <input type="range" id="tl-range" min="0" max="10" step="0.01" value="0" aria-label="Possession timeline">
                <div class="tl-marks" id="tl-marks"></div>
              </div>
              <span class="tl-time" id="tl-time">0.0s</span>
              <button type="button" class="chip-btn" id="tl-speed" aria-label="Playback speed">1×</button>
            </div>
            <div class="overlays" id="overlays" role="group" aria-label="Court overlays">
              <button type="button" class="tog" data-ov="lanes" id="ov-lanes"><span class="sw lanes"></span>Passing lanes</button>
              <button type="button" class="tog" data-ov="links" id="ov-links"><span class="sw help"></span>Help defense</button>
              <button type="button" class="tog" data-ov="spacing" id="ov-spacing"><span class="sw spacing"></span>Spacing</button>
              <button type="button" class="tog" data-ov="trails" id="ov-trails"><span class="sw trails"></span>Movement</button>
            </div>
          </div>
          <aside class="panel" id="panel" aria-live="polite"></aside>
        </div>
      </section>
    </main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
/*JS*/
</script>

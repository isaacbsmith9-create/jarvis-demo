<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Basketball IQ Lab</title>
<meta name="description" content="Possession simulator and film room for point guards: read pick-and-roll coverages, make live decisions, and get graded on the decision, not the outcome.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: desktop = side rail + content; phone = top bar + bottom tab bar. The court stage is the hero of every page. */
:root {
  color-scheme: dark;
  --bg: #070b16;
  --bg-2: #0a1020;
  --panel: #0f1629;
  --panel-2: #141d36;
  --line: rgba(130, 160, 255, .13);
  --line-2: rgba(130, 160, 255, .24);
  --text: #e9eeff;
  --muted: #8f9cc2;
  --dim: #5f6b90;
  --blue: #3d8bff;
  --blue-2: #79aeff;
  --blue-ink: #06122e;
  --green: #2fd68a;
  --green-ink: #03261a;
  --purple: #9b7bff;
  --purple-2: #c4b2ff;
  --amber: #ffc23d;
  --red: #ff5a6e;
  --f-display: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 14px;
  --r-sm: 9px;
}
html, body { background: var(--bg); color: var(--text); }
body { font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--blue-2); outline-offset: 2px; border-radius: 6px; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.rail { display: none; }
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 14px 6px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 18px var(--f-display); letter-spacing: -.02em; }
.brand i { font-style: normal; color: var(--blue-2); margin-left: 3px; }
.mark { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffb067, #f0731f 55%, #9c3d0b); box-shadow: 0 0 0 2px rgba(61,139,255,.5), 0 0 18px rgba(61,139,255,.35); position: relative; flex: none; }
.mark::before, .mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 1.4px solid rgba(50,18,4,.7); clip-path: inset(0 48% 0 48%); }
.mark::after { clip-path: inset(48% 0 48% 0); }
.sync { font: 600 11px var(--f-body); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; letter-spacing: .02em; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.sync[data-s="synced"]::before { background: var(--green); box-shadow: 0 0 8px var(--green); }
.sync[data-s="error"]::before { background: var(--red); }
.sync[data-s="loading"]::before { background: var(--amber); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(6, 1fr); background: rgba(9, 14, 30, .94); backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 6px max(6px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; border: 0; background: none; color: var(--muted); font: 600 10.5px var(--f-body); cursor: pointer; border-radius: 10px; min-width: 0; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--text); }
.tab[aria-current="page"] svg { color: var(--blue-2); filter: drop-shadow(0 0 6px rgba(61,139,255,.6)); }
@media (min-width: 960px) {
  .app { grid-template-columns: 228px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 22px 14px; border-right: 1px solid var(--line); background: linear-gradient(180deg, #0a1124, #070b16); }
  .rail-nav { display: flex; flex-direction: column; gap: 2px; }
  .rail-nav .tab { flex-direction: row; gap: 12px; font-size: 14px; padding: 10px 12px; justify-content: flex-start; }
  .rail-nav .tab svg { width: 19px; height: 19px; }
  .rail-nav .tab[aria-current="page"] { background: linear-gradient(90deg, rgba(61,139,255,.18), rgba(61,139,255,0)); }
  .rail-foot { margin-top: auto; padding: 0 12px; }
  .topbar, .tabbar { display: none; }
  .main { padding-left: 36px; padding-right: 36px; padding-block: 26px 48px; }
}
.view { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; animation: rise .35s ease both; }
@keyframes rise { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- type & atoms ---------- */
.eyebrow { font: 700 11px var(--f-body); letter-spacing: .14em; text-transform: uppercase; color: var(--blue-2); }
.eyebrow.purple { color: var(--purple-2); }
.eyebrow.green { color: var(--green); }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-size: clamp(26px, 4vw, 36px); }
.page-head p { color: var(--muted); max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 11px; padding: 11px 18px; font: 600 14px var(--f-body); cursor: pointer; background: var(--blue); color: #fff; transition: transform .12s, background .15s, border-color .15s, box-shadow .15s; text-decoration: none; white-space: nowrap; }
.btn:hover { background: #4f97ff; box-shadow: 0 6px 22px rgba(61,139,255,.35); }
.btn:active { transform: translateY(1px); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 9px; }
.btn.ghost { background: transparent; border-color: var(--line-2); color: var(--text); }
.btn.ghost:hover { background: rgba(130,160,255,.08); box-shadow: none; }
.btn.green { background: var(--green); color: var(--green-ink); }
.btn.green:hover { background: #52e3a0; box-shadow: 0 6px 22px rgba(47,214,138,.3); }
.btn.purple { background: var(--purple); color: #fff; }
.btn.purple:hover { background: #ab90ff; box-shadow: 0 6px 22px rgba(155,123,255,.35); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font: 600 11.5px var(--f-body); background: rgba(61,139,255,.14); color: var(--blue-2); white-space: nowrap; }
.chip.purple { background: rgba(155,123,255,.16); color: var(--purple-2); }
.chip.green { background: rgba(47,214,138,.14); color: var(--green); }
.chip.amber { background: rgba(255,194,61,.14); color: var(--amber); }
.chip.red { background: rgba(255,90,110,.14); color: var(--red); }
.chip.gray { background: rgba(143,156,194,.14); color: var(--muted); }
.diff { display: inline-flex; gap: 3px; }
.diff i { width: 6px; height: 12px; border-radius: 2px; background: var(--line-2); }
.diff i.on { background: var(--amber); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-title h2 { font-size: 20px; }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 34px 20px; border: 1px dashed var(--line-2); border-radius: var(--r); background: radial-gradient(ellipse at top, rgba(61,139,255,.08), transparent 70%); }
.empty svg { width: 72px; height: 72px; color: var(--blue-2); opacity: .9; }
.empty h3 { font-size: 18px; }
.empty p { color: var(--muted); max-width: 44ch; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; flex: none; }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn:hover { border-color: var(--blue); }
.chip-btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 8px; padding: 6px 9px; font: 700 12px var(--f-mono); cursor: pointer; }
.seg { display: inline-flex; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; }
.seg button { border: 0; background: none; padding: 7px 14px; border-radius: 8px; font: 600 13px var(--f-body); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--blue); color: #fff; box-shadow: 0 2px 12px rgba(61,139,255,.4); }
.toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; background: #1a2546; border: 1px solid var(--line-2); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: .25s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 960px) { .toast { bottom: 28px; } }

/* ---------- home ---------- */
.hero { position: relative; display: grid; grid-template-columns: 1fr; gap: 0; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: radial-gradient(ellipse at 80% 0%, rgba(61,139,255,.22), transparent 55%), linear-gradient(160deg, #0d1733, #080d1d); }
.hero-copy { padding: 26px 22px 20px; display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 1; }
.hero-copy h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.02; letter-spacing: -.03em; }
.hero-copy h1 em { font-style: normal; color: var(--blue-2); }
.hero-copy p { color: var(--muted); max-width: 46ch; }
.hero-court { position: relative; padding: 0 14px 14px; }
.hero-court canvas { display: block; border-radius: 12px; }
.hero-tag { position: absolute; left: 26px; top: 10px; font: 700 10.5px var(--f-body); letter-spacing: .12em; color: #fff; background: rgba(8,12,32,.7); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line-2); }
@media (min-width: 860px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; } .hero-court { padding: 18px 18px 18px 0; } .hero-copy { padding: 34px; } .hero-tag { left: 10px; top: 28px; } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (min-width: 700px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stat { display: flex; flex-direction: column; gap: 4px; }
.stat b { font: 700 28px var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat span { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.stat small { color: var(--dim); font-size: 12px; }
.next-card { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: center; background: linear-gradient(120deg, rgba(155,123,255,.16), rgba(61,139,255,.06)); border-color: rgba(155,123,255,.3); }
@media (min-width: 700px) { .next-card { grid-template-columns: 220px 1fr; } }
.next-card img { width: 100%; border-radius: 10px; display: block; aspect-ratio: 54 / 50.5; object-fit: cover; background: var(--bg-2); }
.next-card .copy { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.next-card h3 { font-size: 21px; }
.sec-link { display: flex; gap: 14px; align-items: flex-start; text-decoration: none; color: inherit; cursor: pointer; transition: border-color .15s, transform .15s; text-align: left; }
.sec-link:hover { border-color: var(--blue); transform: translateY(-2px); }
.sec-link .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: rgba(61,139,255,.14); color: var(--blue-2); flex: none; }
.sec-link .ic.purple { background: rgba(155,123,255,.16); color: var(--purple-2); }
.sec-link .ic.green { background: rgba(47,214,138,.14); color: var(--green); }
.sec-link .ic svg { width: 22px; height: 22px; }
.sec-link h3 { font-size: 16px; }
.sec-link p { color: var(--muted); font-size: 13.5px; margin-top: 2px; }

/* ---------- scenario cards ---------- */
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 13px; font: 600 13px var(--f-body); color: var(--muted); cursor: pointer; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.scen { display: flex; flex-direction: column; gap: 0; padding: 0; overflow: hidden; cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; }
.scen:hover { border-color: var(--blue); transform: translateY(-2px); }
.scen .thumb { position: relative; aspect-ratio: 54 / 38; overflow: hidden; background: #0a1230; }
.scen .thumb img { width: 100%; display: block; }
.scen .thumb .best { position: absolute; right: 10px; top: 10px; }
.scen .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 7px; }
.scen h3 { font-size: 16.5px; }
.scen p { color: var(--muted); font-size: 13.5px; }
.scen .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- play view ---------- */
.play-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ph-title { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 2px; }
.ph-title h2 { font-size: clamp(19px, 2.6vw, 25px); }
.play-grid { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 1020px) { .play-grid { grid-template-columns: minmax(0, 1.55fr) minmax(330px, 1fr); } }
.stage-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage { position: relative; border-radius: 16px; overflow: hidden; border: 1px solid var(--line-2); box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(61,139,255,.08); background: #0a1230; touch-action: manipulation; }
.stage canvas { display: block; cursor: default; }
.stage.pickable canvas { cursor: pointer; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud-mode { position: absolute; left: 10px; top: 10px; font: 700 10.5px var(--f-body); letter-spacing: .14em; padding: 4px 8px; border-radius: 6px; background: rgba(8,12,32,.78); border: 1px solid var(--line-2); }
.hud-mode[data-m="live"] { color: #ff8b9a; border-color: rgba(255,90,110,.5); }
.hud-mode[data-m="live"]::before { content: "● "; animation: blink 1.2s infinite; }
.hud-mode[data-m="film"] { color: var(--purple-2); border-color: rgba(155,123,255,.5); }
@keyframes blink { 50% { opacity: .2; } }
.hud-clock { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; align-items: flex-end; padding: 4px 10px 5px; border-radius: 8px; background: rgba(8,12,32,.82); border: 1px solid var(--line-2); }
.hud-clock small { font: 700 8.5px var(--f-body); letter-spacing: .14em; color: var(--muted); }
.hud-clock b { font: 700 20px var(--f-mono); color: var(--amber); font-variant-numeric: tabular-nums; line-height: 1.1; }
.hud-clock.low b { color: var(--red); text-shadow: 0 0 12px rgba(255,90,110,.6); }
.hud-count { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 54px; height: 54px; display: grid; place-items: center; }
.hud-count svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-bg { fill: rgba(8,12,32,.82); stroke: rgba(255,255,255,.14); stroke-width: 3.5; }
.ring-fg { fill: none; stroke: var(--green); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 119.4; transition: stroke .2s; }
.hud-count b { position: relative; font: 700 15px var(--f-mono); }
.hud-prompt { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px); text-align: center; padding: 8px 14px; border-radius: 10px; background: rgba(8,12,32,.86); border: 1px solid rgba(155,123,255,.45); font-weight: 600; font-size: 13.5px; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
.hud-stamp { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%) rotate(-4deg); font: 800 clamp(22px, 5vw, 40px) var(--f-display); letter-spacing: .04em; padding: 6px 18px; border: 3px solid currentColor; border-radius: 10px; background: rgba(8,12,32,.55); animation: stamp .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-4deg) scale(1.8); opacity: 0; } }
.timeline { display: flex; align-items: center; gap: 8px; }
.tl-track { position: relative; flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; }
.tl-track input { width: 100%; margin: 0; accent-color: var(--blue); height: 36px; background: transparent; position: relative; z-index: 1; }
.tl-marks { position: absolute; left: 8px; right: 8px; top: 0; bottom: 0; pointer-events: none; }
.tl-marks i { position: absolute; top: 3px; width: 3px; height: 8px; border-radius: 2px; transform: translateX(-50%); }
.tl-marks i[data-k="decision"] { background: var(--purple); height: 30px; top: 3px; width: 2px; opacity: .9; }
.tl-marks i[data-k="pass"] { background: var(--blue-2); }
.tl-marks i[data-k="shot"] { background: var(--amber); }
.tl-marks i[data-k="make"] { background: var(--green); }
.tl-marks i[data-k="miss"] { background: var(--muted); }
.tl-marks i[data-k="tov"] { background: var(--red); }
.tl-time { font: 600 12px var(--f-mono); color: var(--muted); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.overlays { display: flex; gap: 8px; flex-wrap: wrap; }
.tog { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 6px 12px; font: 600 12.5px var(--f-body); color: var(--muted); cursor: pointer; }
.tog[aria-pressed="true"] { color: var(--text); background: rgba(130,160,255,.1); border-color: var(--blue); }
.tog .sw { width: 14px; height: 4px; border-radius: 2px; }
.sw.lanes { background: linear-gradient(90deg, #2fd68a 50%, #ffc23d 50%); }
.sw.help { background: #ff4d6d; }
.sw.spacing { background: #3d8bff; }
.sw.trails { background: #78aaff; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel h3 { font-size: 17px; }
.brief { color: var(--muted); }
.keys { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.keys li { display: flex; gap: 10px; font-size: 14px; }
.keys li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--purple); }
.mode-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mode-card { border: 1px solid var(--line-2); border-radius: 12px; padding: 13px; background: var(--panel-2); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
.mode-card b { font: 700 15px var(--f-display); }
.mode-card span { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.mode-card[aria-pressed="true"] { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; transition: border-color .12s, transform .12s, background .12s; }
.opt:hover { border-color: var(--blue); background: #182447; }
.opt:active { transform: scale(.99); }
.opt .k { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 13px var(--f-mono); background: rgba(155,123,255,.18); color: var(--purple-2); }
.opt b { font-weight: 600; font-size: 14.5px; }
.opt small { display: block; color: var(--muted); font-size: 12px; }
.opt .kind { color: var(--dim); font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; }
.decide-head { display: flex; flex-direction: column; gap: 6px; }
.decide-head p { font-weight: 600; }
.hint { color: var(--muted); font-size: 12.5px; }

/* ---------- breakdown ---------- */
.score-row { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.score-ring { position: relative; width: 104px; height: 104px; }

<script>
// ---- icons.js ----
// ===================== icons (inline SVG, stroke = currentColor) =====================
const ICON_PATHS = {
  home: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  sim: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><path d="M5.6 5.6c3 2.4 3 10.4 0 12.8M18.4 5.6c-3 2.4-3 10.4 0 12.8"/>',
  learn: '<path d="M3 8l9-4 9 4-9 4z"/><path d="M7 10v5c3 2 7 2 10 0v-5"/><path d="M21 8v6"/>',
  iq: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  film: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M3 15h18M8 5v4M16 5v4M8 15v4M16 15v4"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4"/><path d="M12 13v4M8 20h8M9 17h6"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  play: '<path d="M7 5l12 7-12 7z" fill="currentColor"/>',
  pause: '<path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="currentColor"/>',
  restart: '<path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/>',
  star: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  spark: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  court: '<rect x="3" y="3" width="18" height="18" rx="1"/><path d="M8 3v7h8V3"/><path d="M5 21a7 7 0 0 1 14 0"/><circle cx="12" cy="6" r="1"/>',
};
const icon = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name] || ''}</svg>`;

// ---- store.js ----
'use strict';
// ===================== storage =====================
// Progress is saved on this device first ("iq:" keys) and synced to the viewer's private Claude account
// collection when the app runs inside Claude. Docs: "profile", "results" (every graded possession), "progress".
const cache = {};
let remote = null;
const pending = new Set();
let flushTimer = null, flushPromise = null;
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem('iq:' + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('iq:' + k, JSON.stringify(v)); } catch {} };
const lsKeys = () => { try { return Object.keys(localStorage).filter((k) => k.startsWith('iq:')).map((k) => k.slice(3)); } catch { return []; } };
const BLANK = {
  profile: () => ({ name: '', position: 'PG', created: Date.now() }),
  results: () => ({ list: [] }),
  progress: () => ({ scen: {}, daily: {}, best: {} }),
};
function doc(key) {
  if (!(key in cache)) cache[key] = lsGet(key) ?? (BLANK[key] ? BLANK[key]() : null);
  return cache[key];
}
function persist(key) {
  lsSet(key, cache[key]);
  if (!remote) return;
  pending.add(key);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}
function flush() {
  if (flushPromise) return flushPromise;
  if (!remote || !pending.size) return Promise.resolve();
  flushPromise = (async () => {
    try {
      while (pending.size) {
        const k = pending.values().next().value; pending.delete(k);
        await remote.doc(k).set(JSON.parse(JSON.stringify(cache[k])));
      }
      setSync('synced');
    } catch { setSync('error'); } finally { flushPromise = null; }
  })();
  return flushPromise;
}
function setSync(s) {
  const el = document.getElementById('sync'); if (!el) return;
  el.dataset.s = s;
  el.title = s === 'synced' ? 'Progress synced to your Claude account' : s === 'error' ? 'Saved on this device; sync failed' : s === 'loading' ? 'Syncing…' : 'Saved on this device';
}
async function connectStore(onReady) {
  if (!window.claude?.use) return setSync('local');
  setSync('loading');
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = user ? await user.id() : null;
  if (!db || !id) return setSync('local');
  const coll = db.collection('data/users/' + id);
  const timer = setTimeout(() => setSync('local'), 10000);
  try {
    const snap = await coll.get();
    clearTimeout(timer);
    remote = coll;
    const have = new Set();
    for (const d of snap.docs) { if (!d.exists) continue; have.add(d.id); cache[d.id] = JSON.parse(JSON.stringify(d.data())); lsSet(d.id, cache[d.id]); }
    for (const k of lsKeys()) if (!have.has(k) && BLANK[k]) { doc(k); pending.add(k); }
    setSync('synced');
    if (pending.size) flush();
    onReady?.();
  } catch { clearTimeout(timer); setSync('local'); }
}
window.addEventListener('pagehide', () => { if (pending.size) flush(); });

// ===================== helpers =====================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, u) => a + (b - a) * u;
const r1 = (x) => Math.round(x * 10) / 10;
const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
const uid = (p = 'id') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const isoDate = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmtDate = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

const SC = Object.fromEntries(SCENARIOS.map((s) => [s.id, s]));

/** A mirrored copy (x → -x) so the same read shows up on the other side of the floor. */
function flipScenario(sc) {
  const f = (p) => [R(-p[0]), p[1]];
  const fm = (m) => (m ? Object.fromEntries(Object.entries(m).map(([k, v]) => [k, f(v)])) : m);
  const fb = (b) => ({ ...b, m: fm(b.m), rebSpot: b.rebSpot ? f(b.rebSpot) : undefined, after: fm(b.after) });
  return {
    ...sc, flipped: true,
    pos: fm(sc.pos), setup: sc.setup.map(fb),
    decision: { ...sc.decision, drift: fb(sc.decision.drift), options: sc.decision.options.map((o) => ({ ...o, to: o.to ? f(o.to) : undefined, beats: o.beats.map(fb) })) },
  };
}
const getScenario = (id, flip) => (flip ? flipScenario(SC[id]) : SC[id]);
const bestOption = (sc) => sc.decision.options.reduce((a, b) => (score3(b) > score3(a) ? b : a));
const score3 = (o) => 0.35 * o.read + 0.35 * o.q + 0.15 * o.sp;

// ---- grade.js ----
// ===================== possessions & grading =====================
// A played possession is fully described by {sid, flip, opt, f, seed, mode}: scenario, side of the floor, the option
// chosen ('timeout' when the window ran out), how late in the decision window it came (f, 0..1), the RNG seed for
// the outcome, and live/film. Everything else (track, outcome, grade) is recomputed from that, so replays are exact.

const WEIGHTS = { read: 0.35, action: 0.35, spacing: 0.15, timing: 0.15 };

/** Track for the setup plus the full drift (used before the decision). */
function preTrack(sc) {
  const start = { pos: sc.pos, ball: sc.ball };
  const tr = compile(start, [...sc.setup, { ...sc.decision.drift, ball: undefined, cap: sc.decision.drift.cap }]);
  tr.setupEnd = sc.setup.reduce((a, b) => a + b.d, 0);
  return tr;
}
function holderAfterSetup(sc) { return compile({ pos: sc.pos, ball: sc.ball }, sc.setup).end.ball; }

/** The option played when the window runs out. */
function hesitation(sc, holder) {
  const late = sc.clock <= 6;
  return {
    id: 'timeout', kind: 'hold', label: late ? 'Held it: shot-clock violation' : 'Hesitated', read: 15, q: 10, sp: 40,
    make: late ? 0 : 0.24, tov: late ? 1 : 0, clock: late,
    beats: [mv(0.8, {}, 'Hesitation: the defense recovers'), shoot(holder, 1.0, {}, { cap: 'Forced, contested shot', reb: 'D5' })],
    miss: late ? 'You held the ball until the shot clock expired. Late clock means the first clean look is the shot.' : 'You waited too long. Every half-second you hold the ball, the defense gets back into position.',
  };
}
function optionFor(sc, id) {
  if (id === 'timeout') return hesitation(sc, holderAfterSetup(sc));
  return sc.decision.options.find((o) => o.id === id);
}

/** Sample the outcome from the seed: turnover first, then make/miss for the final shot. */
function sampleOutcome(opt, f, seed, forceMake) {
  const r = rng(seed * 2654435761);
  r(); r(); r();
  const u1 = r(), u2 = r();
  const tovP = opt.tov ? clamp(opt.tov + f * 0.08, 0, 1) : 0;
  const makeP = opt.make != null ? clamp(opt.make * (1 - 0.22 * f), 0, 1) : null;
  if (forceMake) return { tov: false, make: true, makeP, tovP };
  const tov = u1 < tovP;
  return { tov, make: !tov && makeP != null && u2 < makeP, makeP, tovP };
}

/** Build the full possession: setup, the part of the drift that happened before the decision, then the option. */
function buildPossession(sc, choice) {
  const opt = optionFor(sc, choice.opt), f = clamp(choice.f || 0, 0, 1);
  const pre = preTrack(sc), setupEnd = pre.setupEnd, drift = sc.decision.drift;
  const atSetup = compile({ pos: sc.pos, ball: sc.ball }, sc.setup).end;
  const beats = [...sc.setup];
  const dd = drift.d * f;
  if (dd > 0.02) {
    const e = easeIO(f), m = {};
    for (const [id, to] of Object.entries(drift.m)) { const a = atSetup.pos[id]; m[id] = [R(lerp(a[0], to[0], e)), R(lerp(a[1], to[1], e))]; }
    beats.push({ d: dd, m, cap: 'Reading the floor' });
  }
  const oc = sampleOutcome(opt, f, choice.seed, choice.forceMake);
  let ob = opt.beats.map((b) => ({ ...b }));
  const holder = atSetup.ball;
  if (oc.tov && opt.strip) {
    // Dribble gets poked away by the strip defender during the first move.
    const first = ob[0], thief = opt.strip;
    const at = first.m?.[holder] || pre.segs[0].from[holder];
    ob = [{ d: Math.max(0.45, first.d), m: { ...(first.m || {}), [thief]: [R(at[0] + 1), R(at[1] + 0.6)] }, ball: { steal: [holder, thief] }, cap: 'Stripped!' },
      { d: 1.1, m: { [thief]: [R(at[0] * 0.5), 44] }, ball: thief, cap: 'Turnover' }];
  } else if (oc.tov && opt.clock) {
    // The shot doesn't get off: replace the last shot with the horn.
    const i = ob.map((b) => isShotBall(b.ball)).lastIndexOf(true);
    if (i >= 0) { const shooter = ob[i].ball.shot; ob[i] = { d: 0.9, m: ob[i].m, ball: shooter, cap: 'Shot-clock violation' }; ob = ob.slice(0, i + 1); }
  }
  const track = compile({ pos: sc.pos, ball: sc.ball }, beats.concat(ob), { make: oc.make, tov: oc.tov && !opt.strip && !opt.clock });
  const tDecision = setupEnd + (dd > 0.02 ? dd : 0);
  // What actually happened.
  let result = 'none', pts = 0, three = false;
  for (const s of track.segs) {
    if (s.ball?.steal) result = 'tov';
    if (isShotBall(s.ball)) { three = !!s.ball.three; result = s.ball.make ? 'make' : 'miss'; }
  }
  if (oc.tov && opt.clock) result = 'violation';
  if (result === 'make') pts = three ? 3 : 2;
  // Timeline markers.
  const markers = [{ t: tDecision, kind: 'decision', label: 'Decision' }];
  for (const s of track.segs) {
    if (s.t0 < tDecision - 0.01) continue;
    if (s.ball?.pass) markers.push({ t: s.t0, kind: 'pass', label: 'Pass' });
    else if (s.ball?.steal) markers.push({ t: s.t0, kind: 'tov', label: 'Turnover' });
    else if (isShotBall(s.ball)) markers.push({ t: s.t0, kind: 'shot', label: 'Shot' });
    else if (s.ball?.net) markers.push({ t: s.t0, kind: 'make', label: 'Make' });
    else if (s.ball?.reb) markers.push({ t: s.t0, kind: 'miss', label: 'Miss' });
    else if (s.beat?.cap === 'Shot-clock violation') markers.push({ t: s.t0 + s.t1 - s.t0, kind: 'tov', label: 'Violation' });
  }
  // Floating score effects.
  const fx = [];
  for (const s of track.segs) {
    if (s.ball?.net) fx.push({ text: '+' + pts, at: [0, 9], color: '#2fd68a', t0: s.t0 });
    if (s.ball?.reb) fx.push({ text: 'MISS', at: [0, 9], color: '#c7d2f0', t0: s.t0 });
    if (s.ball?.steal) fx.push({ text: 'TURNOVER', at: [0, 22], color: '#ff5a6e', t0: s.t0 + 0.3 });
    if (s.beat?.cap === 'Shot-clock violation') fx.push({ text: '0.0', at: [0, 22], color: '#ff5a6e', t0: s.t0 + 0.3 });
  }
  return { track, opt, oc, result, pts, three, tDecision, setupEnd, markers, fx, holder };
}

/** Grade a decision. Timing only counts in live mode. */
function gradeDecision(sc, opt, f, mode) {
  const parts = { read: opt.read, action: opt.q, spacing: opt.sp };
  let score;
  if (mode === 'live') {
    parts.timing = opt.id === 'timeout' ? 0 : Math.round(100 - 85 * Math.max(0, f - 0.15) / 0.85);
    score = WEIGHTS.read * parts.read + WEIGHTS.action * parts.action + WEIGHTS.spacing * parts.spacing + WEIGHTS.timing * parts.timing;
  } else {
    score = (WEIGHTS.read * parts.read + WEIGHTS.action * parts.action + WEIGHTS.spacing * parts.spacing) / (1 - WEIGHTS.timing);
  }
  return { score: Math.round(score), parts };
}
const scoreBand = (s) => (s >= 90 ? { k: 'elite', t: 'Elite read' } : s >= 75 ? { k: 'good', t: 'Good read' } : s >= 55 ? { k: 'ok', t: 'Playable' } : { k: 'bad', t: 'Wrong read' });
const RESULT_TEXT = { make: 'Make', miss: 'Miss', tov: 'Turnover', violation: 'Shot-clock violation', none: 'Possession reset' };

/** Readable floor read at the decision moment, computed from the geometry. */
function floorReport(track, t, holder) {
  const st = stateAt(track, t), fl = readFloor(st.pos, holder);
  const mates = Object.entries(fl.mates).map(([id, m]) => ({ id, role: ROLE[id], ...m })).sort((a, b) => b.open - a.open);
  const tag = (m) => (m.open > 0.66 ? 'open' : m.open > 0.38 ? 'workable' : 'covered');
  return {
    mates: mates.map((m) => ({ ...m, tag: tag(m), laneTxt: m.lane >= 6 ? 'clean lane' : m.lane >= 3 ? 'lane tight' : 'lane blocked' })),
    spacing: fl.spacing, spacingTxt: spacingGrade(fl.spacing), paint: fl.paint, ballDef: fl.ballDef,
  };
}

/** One-stop: play + grade a choice. */
function evaluate(sid, choice) {
  const sc = getScenario(sid, choice.flip);
  const poss = buildPossession(sc, choice);
  const g = gradeDecision(sc, poss.opt, choice.f || 0, choice.mode);
  const best = bestOption(sc);
  const floor = floorReport(poss.track, poss.tDecision, poss.holder);
  return { sc, poss, ...g, best, floor, isBest: poss.opt.id === best.id };
}

/** Expected points of an option if chosen at lateness f: P(no turnover) x P(make) x shot value. */
function expectedPts(opt, f = 0) {
  if (opt.make == null) return 0;
  const shotBeat = [...opt.beats].reverse().find((b) => isShotBall(b.ball));
  const val = shotBeat?.ball.three ? 3 : 2;
  const tov = opt.tov ? clamp(opt.tov + f * 0.08, 0, 1) : 0;
  return (1 - tov) * clamp(opt.make * (1 - 0.22 * f), 0, 1) * val;
}

// ---------------------------------------------------------------- render loop
function ensureLoop() { if (!P.raf) { P.last = performance.now(); P.raf = requestAnimationFrame(tick); } }

  const dt = Math.min(0.05, (now - P.last) / 1000); P.last = now;
  const tr = curTrack();

    P.t += dt * P.speed;
    if (P.t >= P.pre.setupEnd) enterDecide();
  } else if (P.phase === 'decide' && P.mode === 'live') {
    const el = (now - P.decideStart) / 1000, w = P.sc.decision.window, f = clamp(el / w, 0, 1);
    P.t = P.pre.setupEnd + P.sc.decision.drift.d * f;

    if (P.phase === 'done') { P.phase = P.saved || P.res ? 'replay' : P.phase; if (P.t >= curTrack().t1 - 0.01) P.t = 0; P.playing = true; hideStamp(); syncTimeline(); return; }
    P.playing = !P.playing;
  };
  $('#tl-restart').onclick = () => {
    if (P.phase === 'setup') { P.t = 0; P.playing = true; return; }
    if (P.res) { P.phase = 'replay'; P.t = 0; P.playing = true; hideStamp(); renderPlayHead(); syncTimeline(); }
    else if (P.mode === 'film' && P.phase === 'decide') { P.t = 0; }
  };
  $('#tl-range').addEventListener('input', (e) => {
    P.t = Number(e.target.value); P.playing = false;
    if (P.phase === 'outcome') { P.phase = 'replay'; }

    hideStamp();
  });
  $('#tl-speed').onclick = () => { P.speed = P.speed === 1 ? 0.5 : P.speed === 0.5 ? 0.25 : 1; $('#tl-speed').textContent = (P.speed === 1 ? '1' : P.speed === 0.5 ? '½' : '¼') + '×'; };
  for (const b of $$('#overlays .tog')) b.onclick = () => { P.ov[b.dataset.ov] = !P.ov[b.dataset.ov]; b.setAttribute('aria-pressed', String(P.ov[b.dataset.ov])); };
  $('#court').addEventListener('pointerdown', (e) => {
    if (P.phase !== 'decide' || !P.view) return;
    const rect = e.currentTarget.getBoundingClientRect(), [cx, cy] = P.view.toCourt(e.clientX - rect.left, e.clientY - rect.top);
    const st = stateAt(P.pre, P.t); let best = null, bd = 4.2;
    for (const id of OFF) { if (id === st.holder) continue; const d = dist(st.pos[id], [cx, cy]); if (d < bd) { bd = d; best = id; } }
    if (!best) return;
    const op = P.sc.decision.options.find((o) => o.kind === 'pass' && o.target === best);
    if (op) commit(op.id); else toast(`No pass to ${roleName(best)} in this read. Pick an option.`);
  });
  document.addEventListener('keydown', (e) => {
    if ($('#view-play').hidden || e.target.closest('input, textarea')) return;
    if (P.phase === 'decide' && /^[1-6]$/.test(e.key)) { const o = P.sc.decision.options[Number(e.key) - 1]; if (o) { e.preventDefault(); commit(o.id); } }
    else if (e.key === ' ' && P.phase !== 'decide' && P.phase !== 'intro' && !e.target.closest('button')) { e.preventDefault(); $('#tl-play').click(); }
  });
  window.addEventListener('resize', () => { if (P.view) { P.view.resize(); } });
}

// ---------- IQ math ----------
function iqStats() {
  const R = results();
  const recent = R.slice(-20);
  const rating = recent.length ? Math.round(mean(recent.map((r) => r.score))) : null;
  const level = rating == null ? '' : rating >= 90 ? 'Elite' : rating >= 80 ? 'Floor general' : rating >= 70 ? 'Starter' : rating >= 55 ? 'Rotation player' : 'Developing';
  const live = R.filter((r) => r.mode === 'live' && r.opt !== 'timeout' && r.rt != null);
  const rt = live.length ? mean(live.slice(-20).map((r) => r.rt)) / 1000 : null;
  const played = new Set(R.map((r) => r.sid)).size;
  const today = isoDate(); const d = prog().daily[today];
  return { rating, level, rt, played, total: R.length, daily: d ? Object.keys(d.scores).length : 0 };
}
function topicMastery(topic) {
  const R = results().filter((r) => (SC[r.sid]?.topic || r.topic) === topic).slice(-5);
  return R.length ? Math.round(mean(R.map((r) => r.score))) : null;
}
function recommend() {
  const pg = prog().scen;
  const unplayed = SCENARIOS.filter((s) => !pg[s.id]).sort((a, b) => a.diff - b.diff);
  if (unplayed.length) return { sc: unplayed[0], why: 'Next new read' };
  const weakest = [...SCENARIOS].sort((a, b) => (pg[a.id].best - pg[b.id].best) || (pg[a.id].ts - pg[b.id].ts))[0];
  return { sc: weakest, why: pg[weakest.id].best >= 90 ? 'Keep it sharp' : 'Your weakest read' };
}

}

  if (done) {
    const n = QZ.answers.filter((x) => x.right).length, pg = prog();
    const best = pg.best.quiz == null || n > pg.best.quiz; if (best) { pg.best.quiz = n; persist('progress'); }
    $('#view-quiz').innerHTML = `<div class="page-head"><span class="eyebrow">Coverage ID quiz</span><h1>${n} / ${QZ.items.length}</h1><p>${n >= 7 ? 'You see coverages early. That\'s the first step to beating them.' : n >= 5 ? 'Solid. Review the coverages you missed in the Pick-and-Roll Academy.' : 'Watch the big first: where he is when you come off the screen tells you the coverage.'}${best ? ' New personal best.' : ''}</p></div>
      <div class="quiz-progress">${QZ.answers.map((x) => `<i class="${x.right ? 'right' : 'wrong'}"></i>`).join('')}</div>
      <div class="row"><button type="button" class="btn" id="qz-again">Take it again</button><button type="button" class="btn ghost" id="qz-academy">Pick-and-Roll Academy</button><button type="button" class="btn ghost" id="qz-back">Challenges</button></div>`;
    $('#qz-again').onclick = startQuiz; $('#qz-academy').onclick = () => go('pnr'); $('#qz-back').onclick = () => go('challenges');
    return;
  }
  $('#view-quiz').innerHTML = `
    <div class="play-head"><button type="button" class="btn ghost sm" id="qz-quit">‹ Quit</button><div class="ph-title"><span class="eyebrow">Coverage ID quiz · clip ${QZ.i + 1} of ${QZ.items.length}</span><h2>What coverage is this?</h2></div></div>
    <div class="quiz-progress">${QZ.items.map((_, k) => `<i class="${k < QZ.i ? (QZ.answers[k].right ? 'right' : 'wrong') : k === QZ.i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="quiz-wrap">
      <div class="stage-col"><div class="stage"><canvas id="quiz-court" aria-label="Pick-and-roll clip" role="img"></canvas></div>
        <div class="row"><button type="button" class="btn ghost sm" id="qz-replay">${icon('restart')} Replay clip</button><span class="hint">Watch the screener's defender and your defender.</span></div></div>
      <div class="panel">
        <div class="quiz-choices">${QUIZ_CHOICES.map((c) => `<button type="button" data-q="${c}" class="${a ? (c === sc.quiz ? 'right' : c === a.pick ? 'wrong' : '') : ''}" ${a ? 'disabled' : ''}>${c}</button>`).join('')}</div>
        ${a ? `<div class="bd ${a.right ? 'good' : 'miss'}"><h4>${a.right ? 'Correct' : 'It was ' + esc(sc.quiz)}</h4><p>${esc(sc.defense)}</p></div>
          <button type="button" class="btn" id="qz-next">${QZ.i + 1 < QZ.items.length ? 'Next clip ›' : 'See score'}</button>` : '<p class="hint">Pick as soon as you recognize it.</p>'}
      </div></div>`;
  $('#qz-quit').onclick = () => go('challenges');
  $('#qz-replay').onclick = playQuizClip;
  for (const b of $$('[data-q]', $('#view-quiz'))) b.onclick = () => { QZ.answers[QZ.i] = { pick: b.dataset.q, right: b.dataset.q === sc.quiz }; renderQuiz(); };
  $('#qz-next') && ($('#qz-next').onclick = () => { QZ.i++; renderQuiz(); if (QZ.i < QZ.items.length) playQuizClip(); });
  QZ.view = new CourtView($('#quiz-court'));
  if (!QZ.track || QZ.trackFor !== QZ.i) playQuizClip(); else drawQuiz();
}
function playQuizClip() {
  const it = QZ.items[QZ.i]; if (!it) return;
  QZ.track = preTrack(getScenario(it.id, it.flip)); QZ.trackFor = QZ.i; QZ.t = 0; QZ.last = performance.now();
  cancelAnimationFrame(QZ.raf);
  const step = (now) => {
    if ($('#view-quiz').hidden || !$('#quiz-court')) return;
    QZ.t = Math.min(QZ.track.setupEnd, QZ.t + Math.min(0.05, (now - QZ.last) / 1000)); QZ.last = now;
    drawQuiz();
    if (QZ.t < QZ.track.setupEnd) QZ.raf = requestAnimationFrame(step);
  };
  QZ.raf = requestAnimationFrame(step);
}
function drawQuiz() { if (QZ.view && QZ.track) QZ.view.draw(QZ.track, QZ.t, { captions: false, overlays: QZ.answers[QZ.i] ? { links: true } : {} }); }

// ---------- My IQ ----------
let meConfirm = false;
function renderMe() {
  const R = results(), s = iqStats();
  if (!R.length) {
    $('#view-me').innerHTML = `<div class="page-head"><span class="eyebrow green">My IQ</span><h1>Your basketball IQ</h1></div>
      ${emptyState('chart', 'No possessions yet', 'Your IQ rating, mastery by read, reaction time and decision-vs-outcome matrix build from the possessions you play.', '<button type="button" class="btn" data-go="sim">Play a possession</button>')}`;
    for (const b of $$('[data-go]', $('#view-me'))) b.onclick = () => go(b.dataset.go);
    return;
  }
  const scored = R.filter((r) => r.result !== 'none');
  const m = { gg: 0, gb: 0, bg: 0, bb: 0 };
  for (const r of scored) { const g = r.score >= 75, ok = r.result === 'make'; m[(g ? 'g' : 'b') + (ok ? 'g' : 'b')]++; }
  const topics = Object.keys(TOPIC_NAMES).map((k) => ({ k, name: TOPIC_NAMES[k], v: topicMastery(k), n: R.filter((r) => (SC[r.sid]?.topic || r.topic) === k).length }));
  const live = R.filter((r) => r.mode === 'live' && r.rt != null && r.opt !== 'timeout');
  const fast = live.length ? Math.min(...live.map((r) => r.rt)) / 1000 : null;
  const timeouts = R.filter((r) => r.opt === 'timeout').length;
  const bestPct = Math.round(100 * R.filter((r) => r.best).length / R.length);
  $('#view-me').innerHTML = `
    <div class="page-head"><span class="eyebrow green">My IQ</span><h1>Your basketball IQ</h1><p>Built from the decision scores of your last 20 possessions. Outcomes are tracked separately: a good read that misses still counts as a good read.</p></div>
    <div class="card iq-hero">
      <div class="iq-rating"><b>${s.rating}</b><span>${s.level}</span></div>
      <div class="stats" style="min-width:0">
        <div class="stat"><span>Possessions</span><b>${R.length}</b><small>${s.played}/${SCENARIOS.length} reads seen</small></div>
        <div class="stat"><span>Best read found</span><b>${bestPct}%</b><small>Chose the top option</small></div>
        <div class="stat"><span>Avg decision</span><b>${s.rt == null ? '—' : s.rt.toFixed(2) + 's'}</b><small>${fast == null ? 'Play live to measure' : 'Fastest ' + fast.toFixed(2) + 's'}</small></div>
        <div class="stat"><span>Hesitations</span><b>${timeouts}</b><small>Window ran out</small></div>
      </div>
    </div>
    <div class="card"><div class="section-title"><h2>Decision score trend</h2><span class="muted small">Last ${Math.min(30, R.length)} possessions</span></div>${trendChart(R.slice(-30))}</div>
    <div class="two-col">
      <div class="card"><div class="section-title"><h2>Mastery by read</h2><span class="muted small">Avg of last 5</span></div>
        <div class="mastery-list" style="margin-top:12px">${topics.map((t) => `<div class="m-row"><span>${t.name}</span><span class="bar"><i style="width:${t.v ?? 0}%;background:${t.v == null ? 'transparent' : t.v >= 90 ? 'var(--green)' : t.v >= 75 ? 'var(--blue)' : t.v >= 55 ? 'var(--amber)' : 'var(--red)'}"></i></span><span>${t.v == null ? 'not played' : t.v + ' · ' + t.n}</span></div>`).join('')}</div></div>
      <div class="card"><div class="section-title"><h2>Decision vs. outcome</h2><span class="muted small">${scored.length} shots or turnovers</span></div>
        <div class="matrix" style="margin-top:12px">
          <span></span><span class="h">Made it</span><span class="h">Missed / turnover</span>
          <span class="h left">Good read (75+)</span><div class="c gg"><b>${m.gg}</b><span>Right read, rewarded</span></div><div class="c gb"><b>${m.gb}</b><span>Right read, unlucky. Keep doing it.</span></div>
          <span class="h left">Wrong read</span><div class="c bg"><b>${m.bg}</b><span>Lucky. Don't trust these.</span></div><div class="c bb"><b>${m.bb}</b><span>Wrong read, punished</span></div>
        </div>
        <p class="hint" style="margin-top:10px">The left column is what you control. Grow the top row.</p></div>
    </div>
    <div class="card"><div class="section-title"><h2>Reaction time</h2><span class="muted small">Live mode, seconds to decide</span></div>${rtChart(live.slice(-30))}</div>
    <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3 style="font-size:16px">Data</h3>
      <p class="muted small">Progress is saved on this device${doc('profile') && remoteReady() ? ' and synced to your Claude account' : ''}.</p>
      ${meConfirm ? `<div class="confirm"><b>Erase all possessions and progress?</b><p class="small muted">This removes your Film Room, IQ history, scores and challenge records. It can't be undone.</p><div class="row"><button type="button" class="btn sm" style="background:var(--red)" id="me-erase">Erase everything</button><button type="button" class="btn ghost sm" id="me-cancel">Cancel</button></div></div>` : '<div><button type="button" class="btn ghost sm" id="me-reset">Reset progress…</button></div>'}
    </div>`;
  $('#me-reset') && ($('#me-reset').onclick = () => { meConfirm = true; renderMe(); });
  $('#me-cancel') && ($('#me-cancel').onclick = () => { meConfirm = false; renderMe(); });
  $('#me-erase') && ($('#me-erase').onclick = () => { cache.results = BLANK.results(); cache.progress = BLANK.progress(); persist('results'); persist('progress'); meConfirm = false; toast('Progress erased'); renderMe(); });
}
const remoteReady = () => !!remote;
function trendChart(R) {
  const W = 640, H = 200, L = 30, Rr = 10, T = 12, B = 22, n = R.length;
  const x = (i) => L + (n <= 1 ? (W - L - Rr) / 2 : (i / (n - 1)) * (W - L - Rr)), y = (v) => T + (1 - v / 100) * (H - T - B);
  const grid = [0, 25, 50, 75, 100].map((v) => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(130,160,255,${v === 75 ? '.35' : '.1'})" ${v === 75 ? 'stroke-dasharray="4 4"' : ''}/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
  const pts = R.map((r, i) => [x(i), y(r.score)]);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = n > 1 ? `${line} L${pts[n - 1][0].toFixed(1)} ${y(0)} L${pts[0][0].toFixed(1)} ${y(0)} Z` : '';
  const dots = R.map((r, i) => `<circle cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${i === n - 1 ? 5 : 3}" fill="${r.result === 'make' ? '#2fd68a' : r.result === 'none' ? '#79aeff' : '#0f1629'}" stroke="${scoreBand(r.score).k === 'bad' ? '#ff5a6e' : '#79aeff'}" stroke-width="2"><title>${esc(SC[r.sid]?.title || '')}: ${r.score} (${RESULT_TEXT[r.result]})</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Decision scores over time"><defs><linearGradient id="tg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3d8bff" stop-opacity=".35"/><stop offset="1" stop-color="#3d8bff" stop-opacity="0"/></linearGradient></defs>${grid}<text x="${W - Rr}" y="${y(75) - 5}" text-anchor="end">good read</text>${area ? `<path d="${area}" fill="url(#tg)"/>` : ''}<path d="${line}" fill="none" stroke="#3d8bff" stroke-width="2.2" stroke-linejoin="round"/>${dots}</svg>
    <div class="row small muted" style="gap:14px;margin-top:6px"><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#2fd68a"/></svg> made</span><span><svg width="10" height="10"><circle cx="5" cy="5" r="3.5" fill="#0f1629" stroke="#79aeff" stroke-width="2"/></svg> missed / turnover</span><span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="#79aeff"/></svg> reset</span></div>`;
}
function rtChart(L) {
  if (!L.length) return '<p class="muted small" style="margin-top:10px">Play in Live mode to measure how fast you read the floor.</p>';
  const W = 640, H = 150, Lm = 30, T = 10, B = 20, n = L.length, max = Math.max(3, ...L.map((r) => r.rt / 1000));
  const bw = (W - Lm - 10) / n;
  const y = (v) => T + (1 - v / max) * (H - T - B);
  const grid = [0, 1, 2, 3].filter((v) => v <= max).map((v) => `<line x1="${Lm}" x2="${W - 10}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(130,160,255,.1)"/><text x="${Lm - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}s</text>`).join('');
  const bars = L.map((r, i) => { const v = r.rt / 1000, h = y(0) - y(v); return `<rect x="${(Lm + i * bw + bw * 0.18).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${r.score >= 75 ? '#2fd68a' : '#ffc23d'}"><title>${v.toFixed(2)}s · score ${r.score}</title></rect>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Decision time per live possession">${grid}${bars}</svg><div class="row small muted" style="gap:14px;margin-top:6px"><span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="#2fd68a"/></svg> good read</span><span><svg width="10" height="10"><rect width="10" height="10" rx="2" fill="#ffc23d"/></svg> below 75</span></div>`;
}

// ---- main.js ----
// ===================== shell: navigation, routing, boot =====================
const NAV = [
  { v: 'home', t: 'Home', i: 'home' },
  { v: 'sim', t: 'Simulator', i: 'sim' },
  { v: 'pnr', t: 'PnR Academy', i: 'learn', m: 'Learn' },
  { v: 'iq', t: 'IQ Academy', i: 'iq', rail: true },
  { v: 'challenges', t: 'Challenges', i: 'trophy' },
  { v: 'film', t: 'Film Room', i: 'film', m: 'Film' },
  { v: 'me', t: 'My IQ', i: 'chart' },
];
const VIEWS = ['home', 'sim', 'pnr', 'iq', 'film', 'challenges', 'me', 'play', 'quiz'];
const RENDER = { home: renderHome, sim: renderSim, pnr: () => renderAcademy('pnr'), iq: () => renderAcademy('iq'), film: renderFilm, challenges: renderChallenges, me: renderMe };
let current = 'home';

function buildNav() {
  $('#rail-nav').innerHTML = NAV.map((n) => `<button type="button" class="tab" data-v="${n.v}">${icon(n.i)}<span>${n.t}</span></button>`).join('');
  $('#tabbar').innerHTML = NAV.filter((n) => !n.rail).map((n) => `<button type="button" class="tab" data-v="${n.v}">${icon(n.i)}<span>${n.m || n.t.replace(' Academy', '')}</span></button>`).join('');
  for (const b of $$('.tab')) b.onclick = () => go(b.dataset.v);
}
function markNav(v) {
  const navV = v === 'play' ? (P.from && VIEWS.includes(P.from) ? P.from : 'sim') : v === 'quiz' ? 'challenges' : v;
  for (const b of $$('.tab')) {
    const on = b.dataset.v === navV || (b.closest('#tabbar') && b.dataset.v === 'pnr' && navV === 'iq');
    if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  }
}
/** Show a view without re-routing (used by play and quiz, which carry in-page state). */
function showView(v) {
  current = v;
  document.body.dataset.v = v;
  for (const id of VIEWS) $('#view-' + id).hidden = id !== v;
  markNav(v);
  if (location.hash.slice(1) !== v) { try { history.replaceState(null, '', '#' + v); } catch {} }
  window.scrollTo({ top: 0 });
  if (v === 'play') ensureLoop();
}
function go(v) {
  if (!RENDER[v]) v = 'home';
  showView(v);
  RENDER[v]();
}
function rerender() { if (RENDER[current]) RENDER[current](); else if (current === 'play') renderPanel(); }

window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  if (v === current) return;
  if (v === 'play' && P.sc) return showView('play');
  go(v);
});

function boot() {
  buildNav();
  initPlayControls();
  const h = location.hash.slice(1);
  go(RENDER[h] ? h : 'home');
  connectStore(() => { const s = $('#sync'), m = $('#sync-m'); if (m) { m.dataset.s = s.dataset.s; m.textContent = ''; } rerender(); });
  // Mirror the sync dot onto the mobile header.
  new MutationObserver(() => { const s = $('#sync'), m = $('#sync-m'); m.dataset.s = s.dataset.s; m.title = s.title; s.textContent = { synced: 'Synced', error: 'Sync failed', loading: 'Syncing…' }[s.dataset.s] || 'This device'; }).observe($('#sync'), { attributes: true });
  if (window.claude?.use) claude.use('sample').then((s) => { if (s) { AI.sample = s; if (current === 'play' && P.phase === 'done') renderPanel(); } }).catch(() => {});
}
boot();

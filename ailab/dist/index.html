<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Athlete Intelligence Lab</title>
<meta name="description" content="Sports-science analytics for one athlete or a roster: testing lab, basketball shot charts, benchmark scores with documented formulas, strengths, weaknesses and development priorities.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: instrument-panel lab. Desktop = graphite rail + work area; phone = top bar + bottom tabs.
   Color: cool graphite neutrals, one teal instrument accent; charts use the validated categorical palette. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa; --surface-3: #eaeef2; --line: #d9dee5; --line-2: #c4ccd6;
  --ink: #0f1720; --ink-2: #3f4b59; --ink-3: #6b7787; --ink-4: #a8b2bf;
  --acc: #0a7f86; --acc-2: #075e63; --acc-soft: #e0f1f1; --acc-ink: #ffffff;
  --rail: #121820; --rail-ink: #c9d2dc; --rail-hi: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #2a78d6; --seq-5: #184f95;
  --cold-0: #e6e8eb; --cold-1: #b7d3f6; --cold-2: #6da7ec; --cold-3: #2a78d6;
  --hot-0: #e6e8eb; --hot-1: #f6c1bd; --hot-2: #ec8a86; --hot-3: #e34948; --zone-none: #f1f3f5;
  --court: #f7f3ec; --court-line: #9aa3ad;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(15, 23, 32, .06), 0 4px 16px rgba(15, 23, 32, .05);
  --f-disp: "Archivo", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0f13; --surface: #12181e; --surface-2: #171e25; --surface-3: #1d252e; --line: #26313c; --line-2: #34414e;
  --ink: #e8edf2; --ink-2: #b4bfcb; --ink-3: #8593a3; --ink-4: #4f5b68;
  --acc: #2bb7b0; --acc-2: #5fd3cc; --acc-soft: #0f2c2d; --acc-ink: #04201f;
  --rail: #080b0e; --rail-ink: #a7b2bd; --rail-hi: #ffffff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
  --cold-0: #2a2f35; --cold-1: #1c3f6e; --cold-2: #2a6bc0; --cold-3: #5598e7;
  --hot-0: #2a2f35; --hot-1: #5c2a2c; --hot-2: #a8403f; --hot-3: #e66767; --zone-none: #171d23;
  --court: #1a1f24; --court-line: #5d6874;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0b0f13; --surface: #12181e; --surface-2: #171e25; --surface-3: #1d252e; --line: #26313c; --line-2: #34414e;
  --ink: #e8edf2; --ink-2: #b4bfcb; --ink-3: #8593a3; --ink-4: #4f5b68;
  --acc: #2bb7b0; --acc-2: #5fd3cc; --acc-soft: #0f2c2d; --acc-ink: #04201f;
  --rail: #080b0e; --rail-ink: #a7b2bd; --rail-hi: #ffffff;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --seq-1: #0d366b; --seq-2: #184f95; --seq-3: #256abf; --seq-4: #3987e5; --seq-5: #86b6ef;
  --cold-0: #2a2f35; --cold-1: #1c3f6e; --cold-2: #2a6bc0; --cold-3: #5598e7;
  --hot-0: #2a2f35; --hot-1: #5c2a2c; --hot-2: #a8403f; --hot-3: #e66767; --zone-none: #171d23;
  --court: #1a1f24; --court-line: #5d6874;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
html, body { background: var(--bg); color: var(--ink); }
body { font: 14.5px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-family: var(--f-disp); font-stretch: 85%; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.rail { display: none; }
.main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 96px; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; padding-block: 10px; background: var(--bg); border-bottom: 1px solid var(--line); margin: 0 -16px 18px; padding-inline: 16px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .bt { font: 800 13px/1.1 var(--f-disp); font-stretch: 75%; text-transform: uppercase; letter-spacing: .06em; }
.logo { width: 26px; height: 26px; border-radius: 7px; flex: none; background: conic-gradient(from 210deg, var(--acc) 0 25%, transparent 0 50%, var(--acc) 0 75%, transparent 0) , var(--ink); box-shadow: inset 0 0 0 2px var(--ink); position: relative; }
.logo::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.ath-chip { display: flex; align-items: center; gap: 8px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px 4px 4px; cursor: pointer; max-width: 46vw; }
.ath-chip .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc-2); font: 700 11px var(--f-mono); flex: none; }
.ath-chip b { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.range select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 13px; max-width: 150px; }
.custom-range { display: flex; gap: 12px; flex-wrap: wrap; margin: -8px 0 16px; font-size: 13px; color: var(--ink-3); }
.custom-range input { margin-left: 6px; }
.sync { display: inline-flex; align-items: center; gap: 6px; font: 500 11.5px var(--f-mono); color: var(--rail-ink); }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-4); }
.sync[data-s="synced"]::before { background: var(--good); }
.sync[data-s="error"]::before { background: var(--crit); }
.sync[data-s="loading"]::before { background: var(--warn); }
.sync.m { font-size: 0; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding: 4px max(4px, env(safe-area-inset-right, 0px)) calc(4px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px; border: 0; background: none; color: var(--ink-3); font: 600 10.5px var(--f-body); cursor: pointer; border-radius: 8px; min-width: 0; }
.tab svg { width: 21px; height: 21px; }
.tab[aria-current="page"] { color: var(--acc); }
@media (min-width: 980px) {
  .app { grid-template-columns: 232px 1fr; }
  .rail { display: flex; flex-direction: column; gap: 24px; position: sticky; top: 0; height: 100vh; padding: 20px 12px; background: var(--rail); color: var(--rail-ink); }
  .rail .brand .bt { color: var(--rail-hi); }
  .rail .logo { box-shadow: inset 0 0 0 2px var(--rail); background: conic-gradient(from 210deg, var(--acc) 0 25%, transparent 0 50%, var(--acc) 0 75%, transparent 0), #2a333d; }
  .rail .logo::after { background: var(--rail); }
  .rail-nav { display: flex; flex-direction: column; gap: 1px; }
  .rail-nav .tab { flex-direction: row; justify-content: flex-start; gap: 11px; font-size: 13.5px; font-weight: 500; padding: 9px 11px; color: var(--rail-ink); }
  .rail-nav .tab svg { width: 18px; height: 18px; }
  .rail-nav .tab:hover { color: var(--rail-hi); background: rgba(255,255,255,.04); }
  .rail-nav .tab[aria-current="page"] { color: var(--rail-hi); background: rgba(43, 183, 176, .16); box-shadow: inset 2px 0 0 var(--acc); }
  .rail-foot { margin-top: auto; padding: 0 11px; }
  .tabbar, .brand.m { display: none; }
  .main { padding-left: 32px; padding-right: 32px; padding-block: 0 48px; }
  .top { margin: 0 -32px 22px; padding-inline: 32px; padding-block: 14px; }
  .sync.m { display: none; }
}
.view { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

/* ---------- type & atoms ---------- */
.eyebrow { font: 600 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--acc); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.page-head > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.page-head h1 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 800; font-stretch: 80%; text-transform: uppercase; letter-spacing: .01em; line-height: 1; }
.page-head p { color: var(--ink-3); max-width: 70ch; }
.muted { color: var(--ink-3); } .small { font-size: 12.5px; } .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: 13.5px; cursor: pointer; background: var(--acc); color: var(--acc-ink); white-space: nowrap; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--acc-2); }
.btn svg { width: 16px; height: 16px; }
.btn.ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn.ghost:hover { border-color: var(--acc); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.danger { background: var(--crit); color: #fff; }
.btn.link { background: none; color: var(--acc); padding: 0; border: 0; font-weight: 600; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 7px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink-2); flex: none; }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { border-color: var(--acc); color: var(--acc); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.card-h h2, .card-h h3 { font-size: 15px; font-weight: 700; font-stretch: 90%; text-transform: uppercase; letter-spacing: .04em; }
.card-h .meta { color: var(--ink-3); font: 500 11.5px var(--f-mono); }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 12; } .span-6 { grid-column: span 12; } .span-4 { grid-column: span 12; } .span-3 { grid-column: span 6; }
@media (min-width: 760px) { .span-6 { grid-column: span 6; } .span-4 { grid-column: span 6; } .span-3 { grid-column: span 3; } }
@media (min-width: 1180px) { .span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px; font: 600 9.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; vertical-align: 2px; }
.tag.m { background: var(--ink); color: var(--surface); }
.tag.e { border: 1px dashed var(--ink-3); color: var(--ink-2); }
.tag.pr { background: var(--warn); color: #3a2800; }
.tag.demo { background: var(--surface-3); color: var(--ink-2); }
.tag.ai { background: var(--acc-soft); color: var(--acc-2); }
.tag.prov { border: 1px solid var(--serious); color: var(--serious); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.status.good { color: var(--good); } .status.warn { color: #b37c00; } .status.crit { color: var(--crit); } .status.ser { color: var(--serious); }
.fx { font: 500 11px var(--f-mono); color: var(--acc); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 9px 13px; font-weight: 600; font-size: 13.5px; color: var(--ink-3); cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--acc); }
.seg { display: inline-flex; padding: 2px; background: var(--surface-3); border-radius: 8px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 34px 18px; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); }
.empty svg { width: 64px; height: 64px; color: var(--acc); }
.empty h3 { font-size: 19px; text-transform: uppercase; font-stretch: 80%; }
.empty p { color: var(--ink-3); max-width: 50ch; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 80; background: var(--ink); color: var(--surface); padding: 9px 15px; border-radius: 9px; font-weight: 600; font-size: 13.5px; transition: .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (min-width: 980px) { .toast { bottom: 24px; } }
#tip { position: fixed; z-index: 90; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.4; padding: 6px 9px; border-radius: 6px; opacity: 0; transition: opacity .1s; max-width: 260px; }
#tip.on { opacity: 1; }

/* ---------- tables & forms ---------- */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); background: var(--surface-2); padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.sel td { background: var(--acc-soft); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form .full { grid-column: 1 / -1; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font: 600 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.fld small { color: var(--ink-3); font-size: 12px; }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 0; }
textarea { min-height: 70px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
.checks input { accent-color: var(--acc); }
.err { color: var(--crit); font-size: 12.5px; font-weight: 600; }
.sheet { border: 0; padding: 0; border-radius: 14px; width: min(620px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.sheet::backdrop { background: rgba(10, 14, 18, .45); }
.sheet-in { display: flex; flex-direction: column; gap: 14px; padding: 18px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-h h2 { font-size: 19px; text-transform: uppercase; font-stretch: 80%; }
.sheet-f { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--crit); background: color-mix(in srgb, var(--crit) 7%, var(--surface)); }
@media (max-width: 560px) { .form { grid-template-columns: 1fr; } .sheet { width: 100vw; max-width: 100vw; margin: auto 0 0; border-radius: 14px 14px 0 0; max-height: 92vh; } }

/* ---------- command center ---------- */
.ais { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.ais-dial { position: relative; width: 150px; height: 150px; }
.ais-dial svg { width: 100%; height: 100%; }
.ais-dial .n { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ais-dial b { font: 800 52px/1 var(--f-disp); font-stretch: 75%; font-variant-numeric: tabular-nums; }
.ais-dial small { font: 500 10.5px var(--f-mono); color: var(--ink-3); letter-spacing: .08em; }
.ais-sub { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.kpi span { font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.kpi b { font: 700 24px var(--f-disp); font-stretch: 80%; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--ink-3); font-size: 11.5px; }
@media (max-width: 520px) { .ais { grid-template-columns: 1fr; justify-items: center; } .ais-sub { width: 100%; } }
.cov { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.cov i { display: block; height: 100%; background: var(--acc); }
.list { display: flex; flex-direction: column; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.list li:last-child { border-bottom: 0; }
.list .k { font: 600 10px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; white-space: nowrap; flex: none; margin-top: 1px; }
.k.s { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.k.w { background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); }
.k.i { background: color-mix(in srgb, var(--serious) 14%, transparent); color: var(--serious); }
.k.n { background: var(--surface-3); color: var(--ink-3); }
.list .t { flex: 1; min-width: 0; }
.list .t b { font-weight: 600; }
.customize { display: flex; flex-direction: column; gap: 6px; }
.cz-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); font-size: 13px; }
.cz-row label { flex: 1; display: flex; gap: 8px; align-items: center; cursor: pointer; }

<script>
// ---- store.js ----
'use strict';
// ===================== storage =====================
// Everything is saved on this device first ("ail:" keys) and synced to the viewer's private Claude account
// collection (data/users/<id>) when the app runs inside Claude.
// Docs: "athletes" (profiles + current), "records" (test results), "shots", "drills" (handling + finishing), "games",
// "meta" (custom tests, training blocks, comparison groups, dashboard layout, benchmarks, reports, AI insight).
const cache = {};
let remote = null;
const pending = new Set();
let flushTimer = null, flushPromise = null;
const lsGet = (k) => { try { return JSON.parse(localStorage.getItem('ail:' + k)); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem('ail:' + k, JSON.stringify(v)); } catch {} };
const lsKeys = () => { try { return Object.keys(localStorage).filter((k) => k.startsWith('ail:')).map((k) => k.slice(4)); } catch { return []; } };
const BLANK = {
  athletes: () => ({ list: [], current: null }),
  records: () => ({ list: [] }),
  shots: () => ({ list: [] }),
  drills: () => ({ list: [] }),
  games: () => ({ list: [] }),
  meta: () => ({ customTests: [], blocks: [], groups: [], cards: null, bench: {}, reports: [], ai: null }),
};
function doc(key) {
  if (!(key in cache)) cache[key] = lsGet(key) ?? (BLANK[key] ? BLANK[key]() : null);
  return cache[key];
}
function persist(key) {
  lsSet(key, cache[key]);
  if (!remote) return;
  pending.add(key);
  clearTimeout(flushTimer);
  flushTimer = setTimeout(flush, 700);
}
// Big lists are split across documents ("shots", "shots_1", "shots_2", …) because one database document holds at most
// 256 KiB. Only chunks whose content changed are rewritten.
const LISTS = new Set(['records', 'shots', 'drills', 'games']);
const CHUNK = 180000;
const written = {}; // key -> [serialized chunk strings last written]
function chunksOf(k) {
  const list = cache[k].list, out = []; let cur = [], size = 0;
  for (const it of list) { const n = JSON.stringify(it).length + 1; if (size + n > CHUNK && cur.length) { out.push(cur); cur = []; size = 0; } cur.push(it); size += n; }
  out.push(cur);
  return out;
}
async function writeKey(k) {
  if (!LISTS.has(k)) return remote.doc(k).set(JSON.parse(JSON.stringify(cache[k])));
  const parts = chunksOf(k), prev = written[k] || [], now = [];
  for (let i = 0; i < parts.length; i++) {
    const body = JSON.stringify({ list: parts[i], parts: parts.length }); now.push(body);
    if (prev[i] !== body) await remote.doc(i ? `${k}_${i}` : k).set(JSON.parse(body));
  }
  for (let i = parts.length; i < prev.length; i++) await remote.doc(`${k}_${i}`).delete();
  written[k] = now;
}
function flush() {
  if (flushPromise) return flushPromise;
  if (!remote || !pending.size) return Promise.resolve();
  flushPromise = (async () => {
    try {
      while (pending.size) { const k = pending.values().next().value; pending.delete(k); await writeKey(k); }
      setSync('synced');
    } catch { setSync('error'); } finally { flushPromise = null; }
  })();
  return flushPromise;
}
function setSync(s) {
  const el = document.getElementById('sync'); if (!el) return;
  el.dataset.s = s;
  el.textContent = { synced: 'Synced', error: 'Sync failed', loading: 'Syncing…' }[s] || 'This device';
  el.title = s === 'synced' ? 'Progress synced to your Claude account' : s === 'error' ? 'Saved on this device; sync failed' : s === 'loading' ? 'Syncing…' : 'Saved on this device';
}
async function connectStore(onReady) {
  if (!window.claude?.use) return setSync('local');
  setSync('loading');
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = user ? await user.id() : null;
  if (!db || !id) return setSync('local');
  const coll = db.collection('data/users/' + id);
  const timer = setTimeout(() => setSync('local'), 10000);
  try {
    const snap = await coll.get();
    clearTimeout(timer);
    remote = coll;
    const have = new Set(), parts = {};
    for (const d of snap.docs) {
      if (!d.exists) continue;
      const m = /^(.+)_(\d+)$/.exec(d.id), base = m && LISTS.has(m[1]) ? m[1] : d.id, i = m && LISTS.has(m[1]) ? Number(m[2]) : 0;
      if (LISTS.has(base)) { (parts[base] ||= [])[i] = d.data(); continue; }
      have.add(d.id); cache[d.id] = JSON.parse(JSON.stringify(d.data())); lsSet(d.id, cache[d.id]);
    }
    for (const [k, arr] of Object.entries(parts)) {
      const n = arr[0]?.parts || arr.length, got = arr.slice(0, n);
      if (got.length < n || got.some((x) => !x)) continue; // incomplete set: keep the device copy and rewrite it
      have.add(k); cache[k] = { list: got.flatMap((x) => JSON.parse(JSON.stringify(x.list || []))) }; lsSet(k, cache[k]);
      written[k] = got.map((x) => JSON.stringify({ list: x.list, parts: x.parts }));
    }
    for (const k of lsKeys()) if (!have.has(k) && BLANK[k]) { doc(k); pending.add(k); }
    setSync('synced');
    if (pending.size) flush();
    onReady?.();
  } catch { clearTimeout(timer); setSync('local'); }
}
window.addEventListener('pagehide', () => { if (pending.size) flush(); });


// ---- util.js ----
// ===================== helpers & statistics =====================
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const uid = (p = 'id') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DAY = 86400000;
const pad2 = (n) => String(n).padStart(2, '0');
const isoDate = (d = new Date()) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
/** 'YYYY-MM-DD' → ms at local noon (so day arithmetic never crosses a DST edge). */
const dms = (iso) => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12).getTime(); };
const addDays = (iso, n) => isoDate(new Date(dms(iso) + n * DAY));
const fmtDate = (iso, opt = { month: 'short', day: 'numeric', year: 'numeric' }) => new Date(dms(iso)).toLocaleDateString(undefined, opt);
const fmtShort = (iso) => fmtDate(iso, { month: 'short', day: 'numeric' });
const daysBetween = (a, b) => Math.round((dms(b) - dms(a)) / DAY);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
const uiGet = (k, d) => { try { const v = localStorage.getItem('ailui:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const uiSet = (k, v) => { try { localStorage.setItem('ailui:' + k, JSON.stringify(v)); } catch {} };

/** Format a number with fixed decimals; '—' for null. */
const fmt = (v, dec = 1) => (v == null || !isFinite(v) ? '—' : Number(v).toFixed(dec));
const fmtPct = (v, dec = 1) => (v == null || !isFinite(v) ? '—' : (v * 100).toFixed(dec) + '%');
const signed = (v, dec = 1, suf = '') => (v == null || !isFinite(v) ? '—' : (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(dec) + suf);
/** Parse "4:32", "4:32.5" or "272" into seconds. */
function parseTime(s) {
  s = String(s).trim(); if (!s) return null;
  if (s.includes(':')) { const [m, sec] = s.split(':'); const v = Number(m) * 60 + Number(sec); return isFinite(v) ? v : null; }
  const v = Number(s); return isFinite(v) ? v : null;
}
const fmtClock = (sec) => `${Math.floor(sec / 60)}:${(sec % 60).toFixed(1).padStart(4, '0')}`;

// ---- statistics (all documented on the Methodology page) ----
const sum = (a) => a.reduce((x, y) => x + y, 0);
const mean = (a) => (a.length ? sum(a) / a.length : null);
function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
/** Sample standard deviation (n − 1). */
function sd(a) { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(sum(a.map((x) => (x - m) ** 2)) / (a.length - 1)); }
/** Coefficient of variation = SD / mean. Lower = more consistent. */
function cv(a) { const s = sd(a), m = mean(a); return s == null || !m ? null : Math.abs(s / m); }
/** Least-squares line through (x, y). Returns slope, intercept, r² and n. */
function linreg(xs, ys) {
  const n = xs.length; if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let sxy = 0, sxx = 0, syy = 0;
  for (let i = 0; i < n; i++) { sxy += (xs[i] - mx) * (ys[i] - my); sxx += (xs[i] - mx) ** 2; syy += (ys[i] - my) ** 2; }
  if (!sxx) return null;
  const slope = sxy / sxx, intercept = my - slope * mx;
  const r2 = syy ? (sxy * sxy) / (sxx * syy) : 1;
  return { slope, intercept, r2, n };
}
/** Pearson correlation. */
function pearson(xs, ys) {
  const n = xs.length; if (n < 3) return null;
  const mx = mean(xs), my = mean(ys); let a = 0, b = 0, c = 0;
  for (let i = 0; i < n; i++) { a += (xs[i] - mx) * (ys[i] - my); b += (xs[i] - mx) ** 2; c += (ys[i] - my) ** 2; }
  return b && c ? a / Math.sqrt(b * c) : null;
}
/** Improvement from a to b as a fraction, positive = better given the metric's direction. */
const improvement = (a, b, dir) => (a == null || b == null || !a ? null : dir === 'lower' ? (a - b) / Math.abs(a) : (b - a) / Math.abs(a));
/** Wilson 95% interval for a proportion (used to show shooting uncertainty). */
function wilson(k, n) {
  if (!n) return null; const z = 1.96, p = k / n, d = 1 + (z * z) / n;
  const c = (p + (z * z) / (2 * n)) / d, h = (z * Math.sqrt((p * (1 - p)) / n + (z * z) / (4 * n * n))) / d;
  return [Math.max(0, c - h), Math.min(1, c + h)];
}

// ---- catalog.js ----
// ===================== catalog: categories, tests, reference ranges =====================
// ref.floor = result that scores 0, ref.elite = result that scores 100 on the benchmark scale (see Methodology).
// They are default reference points for a high-school / early-college basketball athlete, editable in Methodology.
// input: value (single number) | time (accepts m:ss) | lift (load × reps → estimated 1RM) | attempts (several trials).

const CATS = {
  speed: { name: 'Speed', group: 'physical' },
  power: { name: 'Jump & power', group: 'physical' },
  strength: { name: 'Strength', group: 'physical' },
  agility: { name: 'Agility', group: 'physical' },
  conditioning: { name: 'Conditioning', group: 'physical' },
  shooting: { name: 'Shooting', group: 'skill' },
  handling: { name: 'Ball handling', group: 'skill' },
  finishing: { name: 'Finishing', group: 'skill' },
  game: { name: 'Game impact', group: 'skill' },
};
const CAT_IDS = Object.keys(CATS);
const PHYS = CAT_IDS.filter((c) => CATS[c].group === 'physical');
const SKILL = CAT_IDS.filter((c) => CATS[c].group === 'skill');

const SPRINT_GUIDE = 'Electronic timing (gates) is most reliable. Hand timing usually reads 0.1–0.2 s fast; log the method in conditions so results are compared like-for-like. Same surface and footwear each time.';
const TESTS = [
  // ---- speed
  { id: 'sprint10', name: '10-yard sprint', cat: 'speed', unit: 's', dir: 'lower', dec: 2, input: 'value', ref: { floor: 2.05, elite: 1.55 },
    inst: 'Two-point stance, front foot on the line. Sprint through the 10-yard mark. Best of 2–3 trials with full rest (2+ min).', guide: SPRINT_GUIDE },

const TEST = Object.fromEntries(TESTS.map((t) => [t.id, t]));

/** Epley estimated 1RM. Exact when reps = 1. */
const epley = (load, reps) => (reps <= 1 ? load : load * (1 + reps / 30));
/** VO₂max estimates (ml·kg⁻¹·min⁻¹). Always flagged as estimates. */
function vo2Estimate(test, value, age) {
  if (test.vo2 === 'yoyo') return value * 0.0084 + 36.4;
  if (test.vo2 === 'beep' && age) { const lvl = Math.floor(value), sh = Math.round((value - lvl) * 10); const speed = 8 + 0.5 * (lvl + Math.min(sh, 15) / 16); return 31.025 + 3.238 * speed - 3.248 * age + 0.1536 * age * speed; }
  return null;
}

};

/** Court zones for the shot chart (feet: x −25..25, y 0 = baseline, hoop at (0, 5.25)). */
const HOOP = { x: 0, y: 5.25 };
const ZONES = {
  ra: { name: 'Restricted area', pts: 2, exp: 0.6 }, paint: { name: 'Paint (non-RA)', pts: 2, exp: 0.42 },
  midL: { name: 'Left baseline mid', pts: 2, exp: 0.4 }, midLW: { name: 'Left elbow mid', pts: 2, exp: 0.4 }, midC: { name: 'Top mid', pts: 2, exp: 0.4 },
  midRW: { name: 'Right elbow mid', pts: 2, exp: 0.4 }, midR: { name: 'Right baseline mid', pts: 2, exp: 0.4 },
  c3L: { name: 'Left corner 3', pts: 3, exp: 0.38 }, w3L: { name: 'Left wing 3', pts: 3, exp: 0.35 }, t3: { name: 'Top 3', pts: 3, exp: 0.35 },
  w3R: { name: 'Right wing 3', pts: 3, exp: 0.35 }, c3R: { name: 'Right corner 3', pts: 3, exp: 0.38 },
};
function zoneOf(x, y) {
  const d = Math.hypot(x - HOOP.x, y - HOOP.y);
  const three = (Math.abs(x) >= 22 && y <= 14.2) || (y > 14.2 && d >= 23.75);
  const ang = (Math.atan2(y - HOOP.y, x - HOOP.x) * 180) / Math.PI; // 0 = right, 90 = straight out
  if (three) { if (y <= 14.2) return x < 0 ? 'c3L' : 'c3R'; return ang > 112 ? 'w3L' : ang < 68 ? 'w3R' : 't3'; }
  if (d <= 4) return 'ra';
  if (Math.abs(x) <= 8 && y <= 19) return 'paint';
  if (y <= 14.2) return x < 0 ? 'midL' : 'midR';
  return ang > 112 ? 'midLW' : ang < 68 ? 'midRW' : 'midC';
}
const distFt = (x, y) => Math.hypot(x - HOOP.x, y - HOOP.y);

// ---- model.js ----
// ===================== data model & intelligence engine =====================
// Every number here is computed from records the user entered. Each metric knows whether a value is MEASURED or an
// ESTIMATE (e.g. 1RM from a 5-rep set, VO₂max from a field test, projections). Formulas are on the Methodology page.

// ---------- athletes ----------
const athletes = () => doc('athletes').list;
const curAthlete = () => { const a = doc('athletes'); return a.list.find((x) => x.id === a.current) || a.list[0] || null; };
const AID = () => curAthlete()?.id;
function ageOf(a, at = isoDate()) { if (!a?.birth) return a?.age ?? null; const b = new Date(dms(a.birth)), d = new Date(dms(at)); let y = d.getFullYear() - b.getFullYear(); if (d.getMonth() < b.getMonth() || (d.getMonth() === b.getMonth() && d.getDate() < b.getDate())) y--; return y; }
const fmtHeight = (inch) => (inch ? `${Math.floor(inch / 12)}′${Math.round(inch % 12)}″` : '—');

// ---------- record access (current athlete, optional date range) ----------
const inRange = (iso, R) => (!R?.from || iso >= R.from) && (!R?.to || iso <= R.to);
const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.ts || 0) - (b.ts || 0));
const listOf = (k, R, aid = AID()) => doc(k).list.filter((r) => r.aid === aid && inRange(r.date, R) && (!R?.ctx || !r.ctx || r.ctx === R.ctx)).sort(byDate);
const allTests = () => [...TESTS, ...doc('meta').customTests];
const testDef = (id) => TEST[id] || doc('meta').customTests.find((t) => t.id === id);

/** Result value of a test record (aggregate of attempts, estimated 1RM for lifts). */
function recValue(r, t = testDef(r.test)) {
  if (!t) return null;
  if (t.input === 'lift') return epley(r.load, r.reps);
  if (t.input === 'attempts' && r.attempts?.length) return t.agg === 'mean' ? mean(r.attempts) : t.dir === 'lower' ? Math.min(...r.attempts) : Math.max(...r.attempts);
  return r.value;
}
const recEst = (r, t = testDef(r.test)) => !!(t && t.input === 'lift' && r.reps > 1);
const bodyweight = (r, a) => r.bw || a?.weight || null;

// ---------- metric registry ----------
// Each metric: id, name, cat, unit, dir, dec, ref, scored, kind, series(R) → [{date, v, est, n?, k?}], agg(R) → {v, est, n, need}
const HOOP_METRICS = [
  // shooting (pooled makes / attempts over the range)
  { id: 'fg', name: 'Overall FG%', cat: 'shooting', min: 30, ref: { floor: 0.35, elite: 0.55 }, f: (s) => s.type !== 'ft' },
  { id: 'three', name: 'Three-point %', cat: 'shooting', min: 20, ref: { floor: 0.25, elite: 0.42 }, f: (s) => s.type !== 'ft' && shotPts(s) === 3 },

  { id: 'ft', name: 'Free-throw %', cat: 'shooting', min: 20, ref: { floor: 0.55, elite: 0.85 }, f: (s) => s.type === 'ft' },
  { id: 'catch', name: 'Catch-and-shoot %', cat: 'shooting', min: 15, ref: { floor: 0.3, elite: 0.48 }, f: (s) => SHOT_TYPES[s.type]?.group === 'catch' },
  { id: 'offdrib', name: 'Off-the-dribble %', cat: 'shooting', min: 15, ref: { floor: 0.25, elite: 0.42 }, f: (s) => SHOT_TYPES[s.type]?.group === 'dribble' },
  { id: 'screen', name: 'Off screens %', cat: 'shooting', min: 10, ref: { floor: 0.28, elite: 0.45 }, f: (s) => s.type === 'screen', sub: true },
  { id: 'pullup', name: 'Pull-up %', cat: 'shooting', min: 10, ref: { floor: 0.25, elite: 0.42 }, f: (s) => s.type === 'pullup', sub: true },
  { id: 'spotup', name: 'Spot-up %', cat: 'shooting', min: 10, ref: { floor: 0.3, elite: 0.48 }, f: (s) => s.type === 'spotup', sub: true },
];
const shotZone = (s) => s.zone || (s.x != null ? zoneOf(s.x, s.y) : null);
const shotPts = (s) => (s.type === 'ft' ? 1 : s.pts || (shotZone(s) ? ZONES[shotZone(s)].pts : 2));

function makeMetrics() {
  const M = [];
  for (const t of allTests()) {
    M.push({ id: t.id, name: t.name, cat: t.cat, unit: t.unit, dir: t.dir, dec: t.dec ?? 1, ref: t.ref, scored: !!t.ref && t.input !== 'lift', kind: 'test', test: t,
      series: (R) => listOf('records', R).filter((r) => r.test === t.id).map((r) => ({ date: r.date, v: recValue(r, t), est: recEst(r, t), id: r.id })) });
    if (t.input === 'lift') M.push({ id: 'rel_' + t.id, name: 'Relative ' + t.name.toLowerCase(), cat: t.cat, unit: '× BW', dir: 'higher', dec: 2, ref: t.rel, scored: true, kind: 'derived', base: t.id,
      series: (R) => listOf('records', R).filter((r) => r.test === t.id && bodyweight(r, curAthlete())).map((r) => ({ date: r.date, v: recValue(r, t) / bodyweight(r, curAthlete()), est: recEst(r, t) || !r.bw, id: r.id })) });
    if (t.vo2) M.push({ id: 'vo2_' + t.id, name: 'Est. VO₂max (' + t.name + ')', cat: t.cat, unit: 'ml/kg/min', dir: 'higher', dec: 1, ref: null, scored: false, kind: 'derived', base: t.id, alwaysEst: true,
      series: (R) => listOf('records', R).filter((r) => r.test === t.id).map((r) => ({ date: r.date, v: vo2Estimate(t, recValue(r, t), ageOf(curAthlete(), r.date)), est: true, id: r.id })).filter((p) => p.v != null) });
    if (t.id === 'rsa') M.push({ id: 'rsa_fi', name: 'Repeated-sprint fatigue index', cat: t.cat, unit: '%', dir: 'lower', dec: 1, ref: null, scored: false, kind: 'derived', base: t.id,
      series: (R) => listOf('records', R).filter((r) => r.test === 'rsa' && r.attempts?.length >= 2).map((r) => ({ date: r.date, v: (100 * (Math.max(...r.attempts) - Math.min(...r.attempts))) / Math.min(...r.attempts), id: r.id })) });
    if (t.id === 'rjump') M.push({ id: 'rjump_cv', name: 'Jump consistency (CV)', cat: t.cat, unit: '%', dir: 'lower', dec: 1, ref: null, scored: false, kind: 'derived', base: t.id,
      series: (R) => listOf('records', R).filter((r) => r.test === 'rjump' && r.attempts?.length >= 3).map((r) => ({ date: r.date, v: 100 * cv(r.attempts), id: r.id })) });
  }
  for (const h of HOOP_METRICS) M.push({ ...h, unit: '%', dir: 'higher', dec: 1, pct: true, scored: !h.sub, kind: 'shots',
    pool: (R) => { const L = listOf('shots', R).filter(h.f); return { k: sum(L.map((s) => s.makes)), n: sum(L.map((s) => s.att)) }; },
    series: (R) => sessions(listOf('shots', R).filter(h.f), 5) });
  const drills = (R, f = () => true) => listOf('drills', R).filter((d) => d.kind === 'handle' && f(d));
  M.push({ id: 'security', name: 'Ball security', cat: 'handling', unit: '%', dir: 'higher', dec: 1, pct: true, min: 100, ref: { floor: 0.85, elite: 0.99 }, scored: true, kind: 'drills',
    pool: (R) => { const L = drills(R); const reps = sum(L.map((d) => d.reps)), tov = sum(L.map((d) => d.tov)); return { k: reps, n: reps + tov }; },
    series: (R) => byDay(drills(R), (L) => { const reps = sum(L.map((d) => d.reps)), tov = sum(L.map((d) => d.tov)); return reps + tov >= 20 ? { v: reps / (reps + tov), n: reps + tov } : null; }) });
  M.push({ id: 'combo', name: 'Combination execution', cat: 'handling', unit: '%', dir: 'higher', dec: 1, pct: true, min: 50, ref: { floor: 0.8, elite: 0.97 }, scored: false, kind: 'drills', sub: true,
    pool: (R) => { const L = drills(R, (d) => DRILL[d.drill]?.kind === 'combo'); const reps = sum(L.map((d) => d.reps)), tov = sum(L.map((d) => d.tov)); return { k: reps, n: reps + tov }; },
    series: (R) => byDay(drills(R, (d) => DRILL[d.drill]?.kind === 'combo'), (L) => { const reps = sum(L.map((d) => d.reps)), tov = sum(L.map((d) => d.tov)); return reps + tov >= 10 ? { v: reps / (reps + tov), n: reps + tov } : null; }) });
  M.push({ id: 'weakratio', name: 'Weak-hand ratio', cat: 'handling', unit: '× strong', dir: 'higher', dec: 2, min: 1, ref: { floor: 0.6, elite: 1.0 }, scored: true, kind: 'drills',
    pool: (R) => weakRatio(drills(R)),
    series: (R) => byDay(drills(R), (L) => { const w = weakRatio(L); return w.v != null ? { v: w.v, n: w.n } : null; }) });
  M.push({ id: 'codrate', name: 'Change-of-direction drill rate', cat: 'handling', unit: 'reps/min', dir: 'higher', dec: 1, ref: null, scored: false, kind: 'drills',
    series: (R) => byDay(drills(R, (d) => DRILL[d.drill]?.kind === 'cod' && d.dur > 0), (L) => ({ v: (60 * sum(L.map((d) => d.reps))) / sum(L.map((d) => d.dur)), n: L.length })) });
  M.push({ id: 'completion', name: 'Drill completion rate', cat: 'handling', unit: '%', dir: 'higher', dec: 0, pct: true, min: 5, ref: { floor: 0.5, elite: 0.95 }, scored: true, kind: 'drills',
    pool: (R) => { const L = drills(R); return { k: L.filter((d) => d.done).length, n: L.length }; },
    series: (R) => byDay(drills(R), (L) => ({ v: L.filter((d) => d.done).length / L.length, n: L.length })) });
  const fin = (R, f = () => true) => listOf('drills', R).filter((d) => d.kind === 'finish' && f(d));
  const finPool = (f) => (R) => { const L = fin(R, f); return { k: sum(L.map((d) => d.makes)), n: sum(L.map((d) => d.att)) }; };
  const finSeries = (f) => (R) => byDay(fin(R, f), (L) => { const n = sum(L.map((d) => d.att)); return n >= 5 ? { v: sum(L.map((d) => d.makes)) / n, n } : null; });

/**

  for (const f of o.fits || []) g += `<line x1="${X(f.x1)}" y1="${Y(f.y1)}" x2="${X(f.x2)}" y2="${Y(f.y2)}" style="stroke:${f.color || 'var(--ink-3)'}" class="fit"/>`;

/** Scatter with optional least-squares line. o: {pts:[{x,y,tip}], xLabel, yLabel, xFmt, yFmt, fit} */

/** Histogram of values. o: {values, fmt, bins, color, mark (value to highlight)} */

// ---- court.js ----
// ===================== shot chart court (SVG in feet; hoop at the top) =====================
// x −25..25 (sideline to sideline), y 0 = baseline, hoop at (0, 5.25). Zones colored by FG% minus the zone's
// expected rate (diverging: cold blue → neutral → hot red), only when a zone has 5+ attempts.
const CELL = 1.25;
let ZONE_CELLS = null;
function zoneCells() {
  if (ZONE_CELLS) return ZONE_CELLS;
  ZONE_CELLS = [];
  for (let x = -25; x < 25; x += CELL) for (let y = 0; y < 34; y += CELL) ZONE_CELLS.push({ x, y, z: zoneOf(x + CELL / 2, y + CELL / 2) });
  return ZONE_CELLS;
}
const ZONE_LABEL_AT = { ra: [0, 7.6], paint: [0, 14.5], midL: [-15, 6], midLW: [-12.5, 18.5], midC: [0, 23.5], midRW: [12.5, 18.5], midR: [15, 6], c3L: [-23.6, 7.5], w3L: [-19, 26], t3: [0, 31.5], w3R: [19, 26], c3R: [23.6, 7.5] };
/** Aggregate shots by zone. */
function zoneStats(shots) {
  const z = {}; for (const k of Object.keys(ZONES)) z[k] = { k: 0, n: 0 };
  for (const s of shots) { const zz = shotZone(s); if (zz && z[zz]) { z[zz].k += s.makes; z[zz].n += s.att; } }
  return z;
}
function zoneFill(st, zk) {
  if (st.n < 5) return 'var(--zone-none)';
  const d = st.k / st.n - ZONES[zk].exp; // + hot, − cold
  const t = clamp(Math.abs(d) / 0.15, 0, 1), step = Math.round(t * 3);
  return d >= 0 ? `var(--hot-${step})` : `var(--cold-${step})`;
}
/** Court SVG. o: {shots, mode: 'zones'|'dots'|'both', pending:[x,y]} */
function courtSVG(o) {
  const shots = o.shots || [], zs = zoneStats(shots);
  let g = `<rect x="-25" y="-1.5" width="50" height="37.5" class="c-floor"/>`;
  if (o.mode !== 'dots') for (const c of zoneCells()) g += `<rect x="${c.x}" y="${c.y}" width="${CELL + 0.02}" height="${CELL + 0.02}" style="fill:${zoneFill(zs[c.z], c.z)}"/>`;
  // lines
  const a = Math.atan2(14.2 - 5.25, 22) ;
  g += `<g class="c-lines"><rect x="-25" y="0" width="50" height="36" fill="none"/><rect x="-8" y="0" width="16" height="19" fill="none"/><path d="M-6 0V19M6 0V19" class="thin"/>
    <path d="M-6 19A6 6 0 0 0 6 19"/><path d="M-6 19A6 6 0 0 1 6 19" class="thin dash"/>
    <path d="M-22 0V14.2A23.75 23.75 0 0 0 22 14.2V0"/><path d="M-4 5.25A4 4 0 0 0 4 5.25"/>
    <line x1="-3" x2="3" y1="4" y2="4" class="board"/><circle cx="0" cy="5.25" r="0.75" class="rim"/></g>`;
  if (o.mode !== 'dots') for (const [k, [lx, ly]] of Object.entries(ZONE_LABEL_AT)) {
    const st = zs[k]; if (!st.n) continue;
    g += `<g class="z-lab" data-tip="<b>${esc(ZONES[k].name)}</b><br>${st.k}/${st.n} · ${fmtPct(st.k / st.n)}<br>Expected ${fmtPct(ZONES[k].exp, 0)}${st.n < 5 ? '<br><i>Under 5 attempts: not colored</i>' : ''}"><rect x="${lx - 3.3}" y="${ly - 1.55}" width="6.6" height="3.1" rx="0.6"/><text x="${lx}" y="${ly - 0.15}" text-anchor="middle">${Math.round((100 * st.k) / st.n)}%</text><text x="${lx}" y="${ly + 1.05}" text-anchor="middle" class="sm">${st.k}/${st.n}</text></g>`;
  }
  if (o.mode !== 'zones') for (const s of shots) {
    if (s.x == null) continue;
    const tip = `${s.makes ? 'Make' : 'Miss'} · ${esc(SHOT_TYPES[s.type]?.name || s.type)} · ${fmt(distFt(s.x, s.y), 0)} ft<br>${fmtDate(s.date)} · ${CTX[s.ctx] || ''} · ${PRESSURE[s.pressure] || ''}${s.notes ? '<br>' + esc(s.notes) : ''}`;
    g += s.makes ? `<circle cx="${s.x}" cy="${s.y}" r="0.55" class="mk" data-tip="${tip}"/>` : `<path d="M${s.x - 0.45} ${s.y - 0.45}L${s.x + 0.45} ${s.y + 0.45}M${s.x + 0.45} ${s.y - 0.45}L${s.x - 0.45} ${s.y + 0.45}" class="ms" data-tip="${tip}"/>`;
  }
  if (o.pending) g += `<circle cx="${o.pending[0]}" cy="${o.pending[1]}" r="1.1" class="pend"/><circle cx="${o.pending[0]}" cy="${o.pending[1]}" r="0.35" class="pend-d"/>`;
  return `<svg class="court" viewBox="-25.5 -2 51 38.5" role="img" aria-label="Shot chart">${g}</svg>`;
}
/** Convert a click on the court SVG into court feet. */
function courtPoint(svg, e) {
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [Math.round(clamp(p.x, -25, 25) * 10) / 10, Math.round(clamp(p.y, 0, 35.5) * 10) / 10];
}

function metricSelect(id, val, f = () => true) {

/** Summary statistics for a metric's results in a range (documented in Methodology). */
function statsOf(m, s) {
  const v = s.map((p) => p.v); if (!v.length) return null;
  const first = s[0], last = s[s.length - 1], better = (a, b) => (m.dir === 'lower' ? a < b : a > b);
  return { n: v.length, mean: mean(v), median: median(v), best: v.reduce((a, b) => (better(b, a) ? b : a)), worst: v.reduce((a, b) => (better(b, a) ? a : b)), sd: sd(v), cv: cv(v), imp: v.length > 1 ? improvement(first.v, last.v, m.dir) : null, tr: trendOf(m, s), first, last };
}
/** Value of a metric over a period: pooled rate for makes/attempts data, mean of results otherwise. */
function periodValue(m, R) {
  if (m.pool) { const c = current(m, R); return c.v != null && c.n ? { v: c.v, n: c.n, ok: c.ok } : null; }
  const s = m.series(R); return s.length ? { v: mean(s.map((p) => p.v)), n: s.length, ok: true } : null;
}

// ===================== Methodology: every formula, plus editable benchmark references =====================
function renderMethod() {
  const el = $('#view-method');
  const sec = (id, title, html) => `<section class="card method" id="m-${id}"><h2>${title}</h2>${html}</section>`;
  const scored = metrics().filter((m) => m.ref);
  el.innerHTML = `<div class="page-head"><div><span class="eyebrow">Methodology</span><h1>How every number is calculated</h1><p>Nothing here is a black box. Each score is a documented formula applied to records you entered. Measured values and estimates are labelled everywhere: ${MEASURED} ${ESTIMATE}</p></div></div>
  ${sec('bench', 'Benchmark score (0–100)', `<p>Each scored measure is placed on a linear scale between two reference points: a <b>floor</b> (scores 0) and an <b>elite</b> value (scores 100). Results beyond either end are clamped.</p>
    <div class="formula">higher is better:  score = 100 × (value − floor) ÷ (elite − floor)
lower is better:   score = 100 × (floor − value) ÷ (floor − elite)
score = clamp(score, 0, 100), rounded</div>
    <p>The default references are approximate ranges for a high-school to early-college basketball athlete. They are reference points, not norms from a study, so you can change them below to match your level, age group or team. The current value of a test is its <b>latest</b> result in the date range; for makes ÷ attempts data it is the <b>pooled rate</b> over the range.</p>`)}
  ${sec('ais', 'Athlete Intelligence Score', `<div class="formula">category score  S_c = mean(benchmark scores of the scored measures in category c that have enough data)
AIS = Σ (w_c × S_c) ÷ Σ w_c      over categories that have a score
Physical index / Skill index = same formula over physical / skill categories only
coverage = Σ w_c (categories with data) ÷ Σ w_c (all categories)</div>
    <p>Categories with no data are <b>left out</b>, never counted as zero. The score is marked <b>provisional</b> when coverage is under 60% or fewer than 4 categories have data. For strength, relative strength (estimated 1RM ÷ bodyweight) is used when bodyweight is known; otherwise the absolute lift is used.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Category</th>${Object.keys(POS_WEIGHTS).map((g) => `<th class="n">${g}</th>`).join('')}</tr></thead><tbody>${CAT_IDS.map((c) => `<tr><td>${CATS[c].name}</td>${Object.values(POS_WEIGHTS).map((w) => `<td class="n">${w[c]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <p class="small muted">Position groups: guard = PG, SG, combo guard · wing = SF, forward · big = PF, C · any = other sports.</p>`)}
  ${sec('stats', 'Statistics', `<div class="formula">average (mean) = Σx ÷ n          median = middle value of sorted results
standard deviation = √( Σ(x − mean)² ÷ (n − 1) )      (sample SD)
consistency (CV) = SD ÷ mean           variability (range) = |best − worst|
improvement = (latest − first) ÷ first          (sign flipped when lower is better, so + = better)
trend / month = least-squares slope × 30 days ÷ mean      (needs 3+ results over 14+ days)</div>`)}
  ${sec('cv', 'Consistency', `<p>Consistency uses the coefficient of variation of a measure's last 6 results (3 minimum). ≤3% is labelled very consistent; 3–8% normal; above 8% inconsistent. Percentages (shooting, finishing) are judged differently, because a 15-shot session is noisy by nature: only sessions with 10+ attempts count, and a rate is inconsistent only when its swings are at least 1.5× what chance alone would produce at that sample size.</p>`)}
  ${sec('sw', 'Strength & weakness rules', `<div class="formula">Top performer      benchmark score ≥ 70
Fast improver      trend ≥ +2% per month (3+ results, 14+ days)
Most consistent    CV ≤ 3% over the last 3–6 test results
New benchmark      latest result is a personal record
Low performer      benchmark score < 40
Stagnant           |trend| < 0.5% per month over 45+ days, and score < 80
Regressing         trend ≤ −2% per month
Inconsistent       CV ≥ 8% for tests; for rates (FG%, finishing %), session-to-session SD ≥ 1.5 ×
                   the chance-only SD √(p(1−p)/n) over the last 4–8 sessions of 10+ attempts
Imbalances         L vs R finishing gap ≥ 15 pts (10+ attempts each hand) · weak-hand ratio < 0.8
                   max − standing vertical < 3 in · relative bench ÷ relative squat > 0.95</div>
    <p>A measure only enters these rules after it meets its minimum sample (shown on the Strengths & Weaknesses page). Otherwise it is listed as “not enough data” and is not called a weakness.</p>`)}
  ${sec('pri', 'Development priority engine', `<div class="formula">priority = gap × position weight × trend factor × goal factor × confidence
gap = 100 − benchmark score
trend factor = 1.3 regressing · 1.2 stagnant · 0.85 improving fast · 1.0 otherwise
goal factor = 1.3 if the category is one of the athlete's goals, else 1.0
confidence = clamp(results ÷ 3, 0.5, 1) for tests; clamp(attempts ÷ (2 × minimum), 0.5, 1) for rates</div>`)}
  ${sec('proj', 'Projections (estimates)', `<p>A projection extends the least-squares line through a measure's results 30 and 90 days past the latest result. It needs 3+ results spanning 21+ days, is capped at 10% of the reference span beyond the elite value, and is flagged as a <b>weak fit</b> when r² &lt; 0.3 or fewer than 4 points. Real progress is rarely linear: treat projections as a direction, not a promise.</p>`)}
  ${sec('est', 'Estimates', `<div class="formula">Estimated 1RM (Epley)         = load × (1 + reps ÷ 30)          exact when reps = 1
Relative strength              = 1RM ÷ bodyweight (bodyweight on test day, else profile weight)
VO₂max from Yo-Yo IR1         = distance(m) × 0.0084 + 36.4          (Bangsbo et al., 2008)
VO₂max from 20 m shuttle       = 31.025 + 3.238·S − 3.248·age + 0.1536·age·S   (Léger, 1988; S = final speed km/h)
Repeated-sprint fatigue index  = (slowest − fastest) ÷ fastest × 100
Jump consistency               = CV of the five repeated-jump heights</div>`)}
  ${sec('shoot', 'Shooting', `<div class="formula">FG% (any split) = Σ makes ÷ Σ attempts over the range (pooled, not an average of percentages)
catch-and-shoot = spot-up + moving catch-and-shoot + off-screen shots
off-the-dribble = pull-ups + other dribble jumpers
mid-range = 2-point shots outside the paint and restricted area
95% range shown on hover = Wilson score interval
hot / cold zone = zone FG% − expected FG% for that zone (colored only with 5+ attempts)</div>
    <p>Minimum samples before a split is scored: overall 30, three-point 20, free throw 20, mid-range 15, catch-and-shoot 15, off-the-dribble 15 attempts. Expected zone rates: ${Object.values(ZONES).map((z) => `${z.name} ${Math.round(z.exp * 100)}%`).join(', ')}.</p>`)}
  ${sec('handle', 'Ball handling', `<div class="formula">ball security = clean reps ÷ (clean reps + ball losses)          (100+ reps)
weak-hand ratio = mean over drills of (weak reps/min ÷ strong reps/min)   (same drill timed with each hand)
combination execution = ball security in combination drills
completion rate = drills completed to standard ÷ drills attempted   (5+ drills)
change-of-direction rate = reps per minute in change-of-direction drills (tracked, not scored)</div>`)}
  ${sec('finish', 'Finishing', `<div class="formula">finishing % = Σ makes ÷ Σ attempts (20+)
left/right balance = lower hand % ÷ higher hand %   (10+ attempts with each hand)</div>`)}
  ${sec('game', 'Game impact', `<div class="formula">true shooting % = PTS ÷ (2 × (FGA + 0.44 × FTA))
effective FG% = (FGM + 0.5 × 3PM) ÷ FGA
assist-to-turnover = AST ÷ max(1, TOV)
Game Score (simplified Hollinger) = PTS + 0.4·FGM − 0.7·FGA − 0.4·(FTA − FTM) + 0.5·REB + STL + 0.7·AST + 0.7·BLK − TOV</div>
    <p class="small muted">Game Score here has no offensive/defensive rebound split and no foul term, because those are not collected. Game metrics need 3+ games.</p>`)}
  ${sec('compare', 'Comparisons', `<p>Period comparisons use the mean of a test's results in each period and pooled rates for makes ÷ attempts data. Seasons run August 1 – July 31. “First vs latest” uses each measure's first and most recent result ever. Changes are direction-aware: positive always means better.</p>`)}
  ${sec('corr', 'Correlation', `<p>Pearson r between paired results (each X result paired with the nearest Y result within 14 days), shown with 4+ pairs. |r| ≥ 0.7 strong, 0.4–0.7 moderate, below 0.4 weak.</p>`)}
  ${sec('refs', 'Benchmark references (editable)', `<p class="small muted">Changing a reference changes every score that uses it, everywhere in the lab. Leave a field as it is to keep the default.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Measure</th><th>Direction</th><th class="n">Floor (0)</th><th class="n">Elite (100)</th><th></th></tr></thead><tbody>${scored.map((m) => { const r = refOf(m), mod = !!doc('meta').bench[m.id], k = m.pct ? 100 : 1; return `<tr><td>${esc(m.name)} <span class="muted small">${m.pct ? '%' : esc(m.unit)}</span>${mod ? ' <span class="tag demo">edited</span>' : ''}</td><td class="small">${m.dir === 'lower' ? 'lower better' : 'higher better'}</td><td class="n"><input class="bench-in" type="number" step="any" data-bf="${m.id}" value="${+(r.floor * k).toFixed(3)}" aria-label="${esc(m.name)} floor"></td><td class="n"><input class="bench-in" type="number" step="any" data-be="${m.id}" value="${+(r.elite * k).toFixed(3)}" aria-label="${esc(m.name)} elite"></td><td>${mod ? `<button type="button" class="btn link" data-breset="${m.id}">Reset</button>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`)}`;
  bindActs(el);
  const saveRef = (id) => {
    const m = metric(id), k = m.pct ? 100 : 1, f = Number($(`[data-bf="${id}"]`).value) / k, e = Number($(`[data-be="${id}"]`).value) / k;
    if (!isFinite(f) || !isFinite(e) || f === e) return toast('Floor and elite must be different numbers');
    if (m.dir === 'higher' ? e < f : e > f) return toast(m.dir === 'higher' ? 'Elite must be above the floor for this measure' : 'Elite must be below the floor for this measure');
    doc('meta').bench[id] = { floor: f, elite: e }; persist('meta'); toast('Reference updated'); renderMethod();
  };
  for (const i of $$('[data-bf], [data-be]', el)) i.onchange = () => saveRef(i.dataset.bf || i.dataset.be);
  for (const b of $$('[data-breset]', el)) b.onclick = () => { delete doc('meta').bench[b.dataset.breset]; persist('meta'); renderMethod(); };
}

// ---- main.js ----
// ===================== boot & routing =====================
const RENDER = { command: renderCommand, data: renderData, testing: renderTesting, hoops: renderHoops, analytics: renderAnalytics, intel: renderIntel, reports: renderReports, method: renderMethod };
function buildNav() {
  $('#rail-nav').innerHTML = NAV.map((n) => `<button type="button" class="tab" data-v="${n.v}">${icon(n.v)}<span>${n.t}</span></button>`).join('');
  $('#tabbar').innerHTML = NAV.filter((n) => !n.more).map((n) => `<button type="button" class="tab" data-v="${n.v}">${icon(n.v)}<span>${n.m}</span></button>`).join('') + `<button type="button" class="tab" data-v="more">${icon('more')}<span>More</span></button>`;
  for (const b of $$('.tab')) b.onclick = () => (b.dataset.v === 'more' ? moreMenu() : go(b.dataset.v));
}
function moreMenu() {
  openSheet('More', `<div class="customize">${NAV.filter((n) => n.more).map((n) => `<button type="button" class="cz-row" data-mv="${n.v}">${icon(n.v)}<b>${n.t}</b></button>`).join('')}</div>`, { cancel: 'Close', onOpen: (d) => { for (const b of $$('[data-mv]', d)) b.onclick = () => { closeSheet(); go(b.dataset.mv); }; } });
}
function markNav() {
  const more = NAV.find((n) => n.v === S.view)?.more;
  for (const b of $$('.tab')) { const on = b.dataset.v === S.view || (more && b.dataset.v === 'more'); on ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'); }
}
function go(v) {
  if (!RENDER[v]) v = 'command';
  if (v !== S.view) window.scrollTo({ top: 0 });
  S.view = v;
  for (const k of Object.keys(RENDER)) $('#view-' + k).hidden = k !== v;
  if (location.hash.slice(1) !== v) { try { history.replaceState(null, '', '#' + v); } catch {} }
  markNav(); renderHeader(); RENDER[v]();
}
function rerender() { renderHeader(); RENDER[S.view](); }
function renderHeader() {
  const a = curAthlete(), chip = $('#ath-chip');
  chip.innerHTML = a ? `<span class="av">${esc(a.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase())}</span><b>${esc(a.name)}</b>` : `<span class="av">+</span><b>Add athlete</b>`;
  chip.onclick = () => (a ? athletePicker() : athleteForm());
  const rs = $('#range-sel');
  rs.innerHTML = Object.entries(RANGES).map(([k, l]) => `<option value="${k}" ${S.R.key === k ? 'selected' : ''}>${l}</option>`).join('');
  $('#custom-range').hidden = S.R.key !== 'custom';
}
function setRange(key) {
  const from = $('#range-from').value, to = $('#range-to').value;
  S.R = rangeFrom(key, from, to); uiSet('range', { key, from, to });
  rerender();
}
function boot() {
  initTooltip();
  const saved = uiGet('range', { key: 'all' });
  $('#range-from').value = saved.from || addDays(isoDate(), -60); $('#range-to').value = saved.to || isoDate();
  S.R = rangeFrom(saved.key || 'all', $('#range-from').value, $('#range-to').value);
  buildNav();
  $('#range-sel').onchange = (e) => setRange(e.target.value);
  $('#range-from').onchange = () => setRange('custom'); $('#range-to').onchange = () => setRange('custom');
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (RENDER[v] && v !== S.view) go(v); });
  const h = location.hash.slice(1);
  go(RENDER[h] ? h : 'command');
  // Keep the mobile sync dot in step with the rail's.
  new MutationObserver(() => { const s = $('#sync'), m = $('#sync-m'); m.dataset.s = s.dataset.s; m.title = s.title; }).observe($('#sync'), { attributes: true });
  connectStore(() => rerender());
  if (window.claude?.use) claude.use('sample').then((s) => { if (s) { AI.sample = s; if (['command', 'reports'].includes(S.view)) rerender(); } }).catch(() => {});
}
boot();

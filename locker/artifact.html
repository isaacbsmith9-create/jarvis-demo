<style>
/* Layout: a phone home screen of your own apps. A today strip of live numbers on top, then folders of icon tiles in a 4-column grid. Dark-first, like a phone at night. */
:root {
  --bg: #0d0f13;
  --surface: #171a21;
  --surface-2: #20242d;
  --line: #2b303a;
  --fg: #f2f4f8;
  --muted: #8d95a5;
  --accent: #ffb020;
  --accent-ink: #1a1200;
  --good: #3fcf8e;
  --f-display: "Archivo", "Inter", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) { --bg: #eef0f4; --surface: #ffffff; --surface-2: #e8ebf1; --line: #d7dce5; --fg: #11141a; --muted: #5d6676; --accent: #c77700; --accent-ink: #ffffff; --good: #15803d; color-scheme: light; }
}
:root[data-theme="light"] { --bg: #eef0f4; --surface: #ffffff; --surface-2: #e8ebf1; --line: #d7dce5; --fg: #11141a; --muted: #5d6676; --accent: #c77700; --accent-ink: #ffffff; --good: #15803d; color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.top > div { min-width: 0; }
.brand { font-family: var(--f-display); font-weight: 900; font-size: 30px; letter-spacing: -.8px; line-height: 1; text-transform: uppercase; }
.brand span { color: var(--accent); }
.greet { color: var(--muted); font-size: 14px; margin-top: 6px; }
.top-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pill-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.pill-btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* today strip */
.today { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.widget { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px; display: grid; gap: 4px; text-decoration: none; color: inherit; min-width: 0; }
.widget:last-child:nth-child(odd) { grid-column: 1 / -1; }
.widget .w-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.widget .w-head svg { width: 16px; height: 16px; border-radius: 4px; flex: none; }
.widget b { font-family: var(--f-display); font-size: 22px; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.widget small { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
.widget.todo b { color: var(--accent); }
.bar { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 2px; }
.bar div { height: 100%; border-radius: 99px; }

/* search */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input, .search input[type=text] { border: 0; background: none; outline: none; padding: 11px 0; width: 100%; min-width: 0; border-radius: 0; }

/* folders */
.folder { display: grid; gap: 10px; }
.folder-head { display: flex; justify-content: space-between; align-items: baseline; }
.folder-head h2 { font-family: var(--f-display); font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 0; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 10px; }
.tile { display: grid; justify-items: center; gap: 6px; text-decoration: none; color: inherit; position: relative; min-width: 0; cursor: pointer; background: none; border: 0; padding: 0; }
.tile .ic { width: 100%; max-width: 66px; aspect-ratio: 1; border-radius: 22.5%; overflow: hidden; display: grid; place-items: center; box-shadow: 0 0 0 .5px rgba(127,127,127,.25); transition: transform .12s; }
.tile:active .ic { transform: scale(.94); }
.tile .ic svg { width: 100%; height: 100%; display: block; }
.tile .letter { font-family: var(--f-display); font-weight: 900; font-size: 26px; color: #fff; }
.tile span.name { font-size: 12px; font-weight: 500; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .badge { position: absolute; top: -4px; right: calc(50% - 38px); background: #ff3b30; color: #fff; font-size: 11px; font-weight: 700; min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; padding: 0 5px; }
.tile .x { position: absolute; top: -6px; left: calc(50% - 40px); width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.editing .tile .ic { animation: wiggle .3s ease-in-out infinite alternate; }
@keyframes wiggle { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
@media (prefers-reduced-motion: reduce) { .editing .tile .ic { animation: none; } .tile .ic { transition: none; } }
.add-tile .ic { border: 2px dashed var(--line); box-shadow: none; color: var(--muted); font-size: 28px; }
.empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px; }
.note { font-size: 13px; color: var(--muted); border-left: 3px solid var(--accent); padding-left: 10px; margin: 0; }

/* sheets */
dialog.sheet { width: min(560px, 100vw); max-width: 100vw; max-height: 92vh; margin: auto auto 0; border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; background: var(--surface); color: var(--fg); overflow-y: auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .55); }
.form { display: grid; gap: 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-head h3 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.close { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); cursor: pointer; }
label { display: grid; gap: 5px; font-size: 13px; color: var(--muted); }
input[type=text], input[type=url], select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; outline: none; }
input:focus, select:focus { border-color: var(--accent); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; }
.swatches button.on { border-color: var(--fg); }
.preview { display: flex; align-items: center; gap: 12px; }
.preview .ic { width: 58px; height: 58px; border-radius: 22.5%; display: grid; place-items: center; overflow: hidden; }
.btn { display: inline-flex; justify-content: center; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 12px 16px; font-weight: 600; cursor: pointer; text-decoration: none; color: inherit; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: #ff6b5e; }
.links { display: grid; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--fg); }
.detail-icon { width: 64px; height: 64px; border-radius: 22.5%; overflow: hidden; flex: none; display: grid; place-items: center; }
.detail-icon svg { width: 100%; height: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

<dialog id="settings-sheet" class="sheet" aria-labelledby="s-title">

  </div>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const todayIso = () => isoDate(new Date());
const shiftIso = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const toMin = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + m; };
const fmtMin = (m) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setMinutes(m); return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }); };
const inClaude = !!window.claude?.use;
const SITE = 'https://isaacbsmith9-create.github.io/jarvis-demo/';

// ===================== your apps =====================
const ICONS = {

};

  { id: 'jarvis', name: 'Jarvis', folder: 'Command', tag: 'Your AI command center', desc: 'Talk to Jarvis to log food, add tasks and homework, run timers, and get a daily briefing across every app. Also finds patterns in your last 2 weeks.', claude: SITE + 'jarvis/', web: SITE + 'jarvis/' },
  { id: 'liferpg', name: 'Life RPG', folder: 'Command', tag: 'Your player card', desc: 'A 2K-style OVR rating from your real habits, with levels, daily quests and a weekly boss.', claude: SITE + 'jarvis/#player', web: SITE + 'jarvis/#player' },

// ===================== storage =====================
const PREFIX = 'lk:';
let state = { customs: [], hidden: [], openIn: 'auto' };
let remoteDoc = null;
try { state = { ...state, ...(JSON.parse(localStorage.getItem(PREFIX + 'core')) || {}) }; } catch {}
let saveT;
function save() {
  try { localStorage.setItem(PREFIX + 'core', JSON.stringify(state)); } catch {}
  if (!remoteDoc) return;
  clearTimeout(saveT); saveT = setTimeout(() => remoteDoc.set(JSON.parse(JSON.stringify(state))).catch(() => {}), 500);
}
async function connectStore() {
  if (!inClaude) { $('#sync-note').textContent = 'Your added apps are saved in this browser.'; return; }
  const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
  const id = user ? await user.id() : null;
  if (!db || !id) { $('#sync-note').textContent = 'Your added apps are saved in this browser.'; return; }
  remoteDoc = db.doc(`data/users/${id}/core`);
  try {
    const snap = await remoteDoc.get();
    if (snap.exists) { state = { ...state, ...JSON.parse(JSON.stringify(snap.data())) }; try { localStorage.setItem(PREFIX + 'core', JSON.stringify(state)); } catch {} render(); }
    else if (state.customs.length || state.hidden.length) save();
    $('#sync-note').textContent = 'Your added apps sync to your Claude account.';
  } catch { $('#sync-note').textContent = 'Your added apps are saved in this browser.'; }
}

// ===================== today strip (website only: apps share this site's storage) =====================
const readLS = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
function macroToday() {
  const core = readLS('ml:core'), d = readLS('ml:day-' + todayIso());
  if (!core && !d) return null;
  const t = { calories: 2800, protein: 140, ...(core?.targets || {}) };
  for (const [k, v] of Object.entries(core?.overrides || {})) if (v > 0) t[k] = v;
  if (d?.type === 'rest') { const cut = Math.round(t.carbs * 0.3 || 0); t.calories -= cut * 4; }
  let cal = 0, pro = 0;
  for (const m of ['breakfast', 'lunch', 'dinner', 'snacks']) for (const e of d?.[m] || []) { const s = e.servings ?? 1; cal += (e.calories || 0) * s; pro += (e.protein || 0) * s; }
  return { left: Math.round(t.calories - cal), pct: Math.min(1, cal / t.calories), protein: Math.round(pro), pTarget: t.protein, logged: cal > 0 };
}
function readyToday() {
  const d = readLS('ru:day-' + todayIso()), core = readLS('ru:core');
  if (!d?.checkin && !core) return null;
  return d?.checkin ? { done: true, sleep: d.checkin.sleepH, soreness: d.checkin.soreness, pain: d.checkin.pain } : { done: false };
}
function charlaToday() {
  const core = readLS('ch:core'); if (!core) return null;
  const goal = (core.settings?.goal || 5) * 60, secs = (readLS('ch:day-' + todayIso())?.secs) || 0;
  let n = 0, d = todayIso(); if (secs < goal) d = shiftIso(d, -1);
  while ((readLS('ch:day-' + d)?.secs || 0) >= goal) { n++; d = shiftIso(d, -1); }
  return { mins: Math.floor(secs / 60), goal: goal / 60, streak: n, done: secs >= goal };
}
function weekNext() {
  const core = readLS('wb:core'); if (!core) return null;
  const t = todayIso(), dt = new Date(t + 'T12:00:00'), wd = (dt.getDay() + 6) % 7;
  const mon = shiftIso(t, -wd), w = readLS('wb:w-' + mon) || { items: [], done: {}, skip: {} };
  const reps = (core.rules || []).filter((r) => r.days.includes(wd) && !w.skip?.[`${r.id}|${t}`]).map((r) => ({ title: r.title, start: r.start, done: !!w.done?.[`${r.id}|${t}`] }));
  const items = [...reps, ...(w.items || []).filter((i) => i.date === t)];
  const now = new Date().getHours() * 60 + new Date().getMinutes();
  const next = items.filter((i) => i.start && !i.done && toMin(i.start) + 0 >= now - 15).sort((a, b) => toMin(a.start) - toMin(b.start))[0];
  const left = items.filter((i) => !i.done).length;
  return { next, left, total: items.length };
}
function gameplanToday() {
  const core = readLS('gp:core'); if (!core) return null;
  const t = todayIso(), tops = (core.tasks || []).filter((x) => x.top === t);
  return { tops: tops.length, done: tops.filter((x) => x.done).length, running: core.running };
}
function iconSvg(id) { return `<svg viewBox="0 0 64 64" aria-hidden="true">${ICONS[id]}</svg>`; }
function renderToday() {
  const el = $('#today');
  if (inClaude) { el.hidden = true; return; }
  const ws = [];
  const m = macroToday();
  // MacroLens writes mlw:today (protein, targets after smart adjustments, next meal) every time its diary renders.
  const mw = readLS('mlw:today'), mwOk = mw && mw.date === todayIso();
  if (m) {
    const pLeft = mwOk ? Math.max(0, mw.pTarget - mw.protein) : Math.max(0, m.pTarget - m.protein), kLeft = mwOk ? mw.kcalLeft : m.left;
    const nx = mwOk && mw.next ? (mw.next.now ? `Now: ${esc(mw.next.title)}` : `Next: ${esc(mw.next.title)} ${esc(fmtMin(mw.next.at))}`) : `${kLeft >= 0 ? kLeft.toLocaleString() + ' kcal left' : Math.abs(kLeft).toLocaleString() + ' kcal over'}`;
    ws.push(`<a class="widget${m.logged ? '' : ' todo'}" href="${appHref(BUILT_IN[2])}"><div class="w-head">${iconSvg('macrolens')}MacroLens</div><b>${pLeft ? pLeft + ' g' : 'Protein done'}</b><small>${pLeft ? 'protein left · ' : ''}${nx}</small><div class="bar"><div style="width:${Math.min(100, ((mwOk ? mw.protein : m.protein) / (mwOk ? mw.pTarget : m.pTarget)) * 100)}%;background:#3b7dd8"></div></div></a>`);
  }
  const r = readyToday();
  if (r) ws.push(`<a class="widget${r.done ? '' : ' todo'}" href="${appHref(BUILT_IN[3])}"><div class="w-head">${iconSvg('readyup')}ReadyUp</div><b>${r.done ? `${r.sleep} h` : 'Check in'}</b><small>${r.done ? `sleep · ${r.pain ? 'pain flagged, see trainer' : 'soreness ' + r.soreness + '/5'}` : 'Takes 30 seconds'}</small></a>`);
  const w = weekNext();
  if (w) ws.push(`<a class="widget" href="${appHref(BUILT_IN[4])}"><div class="w-head">${iconSvg('weekboard')}Weekboard</div><b>${w.next ? esc(fmtMin(toMin(w.next.start))) : w.left ? `${w.left} to do` : 'All done'}</b><small>${w.next ? esc(w.next.title) : w.total ? 'Nothing else timed today' : 'Nothing planned today'}</small></a>`);
  const c = charlaToday();
  if (c) ws.push(`<a class="widget${c.done ? '' : ' todo'}" href="${appHref(BUILT_IN[5])}"><div class="w-head">${iconSvg('charla')}Charla</div><b>${c.streak} day${c.streak === 1 ? '' : 's'}</b><small>${c.done ? 'streak · goal done today' : `streak · ${c.goal - c.mins} min to go`}</small><div class="bar"><div style="width:${Math.min(100, (c.mins / c.goal) * 100)}%;background:#e9a300"></div></div></a>`);
  const g = gameplanToday();
  if (g) ws.push(`<a class="widget${g.tops && g.done === g.tops ? '' : ' todo'}" href="${appHref(BUILT_IN[6])}"><div class="w-head">${iconSvg('dayplan')}Top 3</div><b>${g.tops ? `${g.done}/${g.tops} done` : 'Pick 3'}</b><small>${g.running ? 'Timer running' : g.tops ? 'today\'s priorities' : 'Nothing picked for today'}</small><div class="bar"><div style="width:${g.tops ? (g.done / g.tops) * 100 : 0}%;background:#f2a33a"></div></div></a>`);
  el.hidden = !ws.length;
  el.innerHTML = ws.join('');
}

// ===================== grid =====================
let editing = false;
function appHref(a) {
  if (a.url) return a.url;
  const mode = state.openIn === 'auto' ? (inClaude ? 'claude' : 'web') : state.openIn;
  return mode === 'claude' ? a.claude : a.web;
}
function allApps() {
  return [...BUILT_IN.map((a) => ({ ...a, builtIn: true })), ...state.customs];
}
function tileIcon(a) {
  if (a.builtIn) return iconSvg(a.id);
  return `<span class="letter">${esc(a.glyph || a.name.slice(0, 1).toUpperCase())}</span>`;
}
function render() {
  const h = new Date().getHours();
  $('#greet').textContent = `${h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'} · ${new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' })}`;
  $('#wrap').classList.toggle('editing', editing);
  $('#edit-btn').textContent = editing ? 'Done' : 'Edit'; $('#edit-btn').classList.toggle('on', editing);
  renderToday();
  const q = $('#q').value.trim().toLowerCase();
  const apps = allApps().filter((a) => !state.hidden.includes(a.id) && (!q || `${a.name} ${a.tag || ''} ${a.folder}`.toLowerCase().includes(q)));
  const folders = FOLDERS.map((f) => [f, apps.filter((a) => a.folder === f)]).filter(([f, list]) => list.length || (editing && !q && f !== 'Other'));
  $('#folders').innerHTML = folders.map(([f, list]) => `<section class="folder"><div class="folder-head"><h2>${f}</h2><span class="muted small">${list.length}</span></div><div class="grid">
    ${list.map((a) => {
      const style = a.builtIn ? '' : `style="background:${esc(a.color || COLORS[0])}"`;
      const inner = `<div class="ic" ${style}>${tileIcon(a)}</div><span class="name">${esc(a.name)}</span>${editing ? `<span class="x" aria-hidden="true">${a.builtIn ? '–' : '✕'}</span>` : ''}`;
      return editing ? `<button type="button" class="tile" data-edit="${esc(a.id)}" aria-label="${a.builtIn ? 'Hide' : 'Edit'} ${esc(a.name)}">${inner}</button>`
        : `<a class="tile" href="${esc(appHref(a))}" target="_blank" rel="noopener" data-id="${esc(a.id)}">${inner}</a>`;
    }).join('')}
    ${!q ? `<button type="button" class="tile add-tile" data-add="${f}" aria-label="Add an app to ${f}"><div class="ic">＋</div><span class="name muted">Add</span></button>` : ''}
  </div></section>`).join('') || `<div class="empty">No apps match "${esc(q)}".</div>`;
  $('#foot-note').textContent = inClaude
    ? 'Tip: hold any app for details and both links. Today\'s numbers show on the website version of Locker, where your apps share storage.'
    : 'Tip: hold any app for details and both links. Today\'s numbers come from your apps on this website and this device.';
}
// long-press (or right-click) opens details; tap opens the app
let pressT = null, longPressed = false;
$('#folders').addEventListener('pointerdown', (e) => {
  const t = e.target.closest('a.tile'); if (!t) return;
  longPressed = false;
  pressT = setTimeout(() => { longPressed = true; openDetail(t.dataset.id); }, 450);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => $('#folders').addEventListener(ev, () => clearTimeout(pressT)));
$('#folders').addEventListener('contextmenu', (e) => { const t = e.target.closest('a.tile'); if (t) { e.preventDefault(); openDetail(t.dataset.id); } });
$('#folders').addEventListener('click', (e) => {
  if (e.target.closest('a.tile') && longPressed) { e.preventDefault(); longPressed = false; return; }
  const add = e.target.closest('[data-add]'); if (add) return openAdd(null, add.dataset.add);
  const ed = e.target.closest('[data-edit]'); if (!ed) return;
  const a = allApps().find((x) => x.id === ed.dataset.edit);
  if (a.builtIn) { state.hidden.push(a.id); save(); render(); toast(`${a.name} hidden. Bring it back in Settings.`); }
  else openAdd(a);
});
$('#edit-btn').addEventListener('click', () => { editing = !editing; render(); });
$('#add-btn').addEventListener('click', () => openAdd(null, 'Other'));
$('#q').addEventListener('input', render);

// ===================== detail sheet =====================
function openDetail(id) {
  const a = allApps().find((x) => x.id === id); if (!a) return;
  $('#d-icon').innerHTML = a.builtIn ? iconSvg(a.id) : `<span class="letter" style="font-family:var(--f-display);font-weight:900;font-size:28px;color:#fff">${esc(a.glyph || a.name[0])}</span>`;
  $('#d-icon').style.background = a.builtIn ? '' : (a.color || COLORS[0]);
  $('#d-name').textContent = a.name; $('#d-tag').textContent = a.tag || a.folder;
  $('#d-desc').textContent = a.desc || a.url || '';
  $('#d-links').innerHTML = a.builtIn
    ? `<a class="btn primary" href="${a.claude}" target="_blank" rel="noopener">Open in Claude (free AI, synced)</a><a class="btn" href="${a.web}" target="_blank" rel="noopener">Open website version</a>
       <button type="button" class="btn" data-copy="${a.web}">Copy website link</button>`
    : `<a class="btn primary" href="${esc(a.url)}" target="_blank" rel="noopener">Open ${esc(a.name)}</a><button type="button" class="btn" data-edit-custom="${esc(a.id)}">Edit</button>`;
  $('#detail-sheet').showModal();
}
$('#d-links').addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) navigator.clipboard.writeText(c.dataset.copy).then(() => toast('Link copied'), () => toast(c.dataset.copy));
  const ed = e.target.closest('[data-edit-custom]');
  if (ed) { $('#detail-sheet').close(); openAdd(state.customs.find((x) => x.id === ed.dataset.editCustom)); }
});

// ===================== add / edit custom app =====================
let addEditing = null, addColor = COLORS[0];
$('#a-folder').innerHTML = FOLDERS.map((f) => `<option>${f}</option>`).join('');
function paintPreview() {
  const name = $('#a-name').value.trim();
  $('#a-preview').style.background = addColor;
  $('#a-preview').innerHTML = `<span style="font-family:var(--f-display);font-weight:900;font-size:26px;color:#fff">${esc($('#a-glyph').value.trim() || name.slice(0, 1).toUpperCase() || '?')}</span>`;
  $('#a-colors').innerHTML = COLORS.map((c) => `<button type="button" data-color="${c}" class="${c === addColor ? 'on' : ''}" style="background:${c}" aria-label="Color ${c}"></button>`).join('');
}
function openAdd(app, folder) {
  addEditing = app || null; addColor = app?.color || COLORS[Math.floor(Math.random() * COLORS.length)];
  $('#add-title').textContent = app ? `Edit ${app.name}` : 'Add an app';
  $('#a-name').value = app?.name || ''; $('#a-url').value = app?.url || ''; $('#a-glyph').value = app?.glyph || '';
  $('#a-folder').value = app?.folder || folder || 'Other';
  $('#a-delete').hidden = !app; $('#a-delete').textContent = 'Remove'; $('#a-delete').dataset.confirm = '';
  paintPreview(); $('#add-sheet').showModal();
}
$('#a-name').addEventListener('input', paintPreview);
$('#a-glyph').addEventListener('input', paintPreview);
$('#a-colors').addEventListener('click', (e) => { const b = e.target.closest('[data-color]'); if (b) { addColor = b.dataset.color; paintPreview(); } });
$('#add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  let url = $('#a-url').value.trim();
  if (!/^https:\/\//i.test(url)) return toast('Use a link that starts with https://');
  try { url = new URL(url).href; } catch { return toast('That link does not look right'); }
  const app = { id: addEditing?.id || 'c' + Date.now().toString(36), name: $('#a-name').value.trim().slice(0, 24), url, folder: $('#a-folder').value, color: addColor, glyph: $('#a-glyph').value.trim().slice(0, 2) };
  state.customs = [...state.customs.filter((x) => x.id !== app.id), app]; save();
  $('#add-sheet').close(); render(); toast(addEditing ? 'Saved' : `${app.name} added`);
});
$('#a-delete').addEventListener('click', () => {
  if ($('#a-delete').dataset.confirm !== '1') { $('#a-delete').dataset.confirm = '1'; $('#a-delete').textContent = 'Tap again to remove'; return; }
  state.customs = state.customs.filter((x) => x.id !== addEditing.id); save(); $('#add-sheet').close(); render(); toast('Removed');
});

// ===================== settings =====================
function renderSettings() {
  $$('#open-in button').forEach((b) => b.classList.toggle('on', b.dataset.v === state.openIn));
  const hid = BUILT_IN.filter((a) => state.hidden.includes(a.id));
  $('#hidden-list').innerHTML = hid.length ? hid.map((a) => `<button type="button" class="pill-btn" data-unhide="${a.id}" style="margin:0 6px 6px 0">Show ${esc(a.name)}</button>`).join('') : 'None';
}
$('#settings-btn').addEventListener('click', () => { renderSettings(); $('#settings-sheet').showModal(); });
$('#open-in').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (!b) return; state.openIn = b.dataset.v; save(); renderSettings(); render(); });
$('#hidden-list').addEventListener('click', (e) => { const b = e.target.closest('[data-unhide]'); if (!b) return; state.hidden = state.hidden.filter((x) => x !== b.dataset.unhide); save(); renderSettings(); render(); });
$$('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));
$$('dialog').forEach((d) => d.addEventListener('click', (e) => { if (e.target === d) d.close(); }));
window.addEventListener('focus', renderToday);
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderToday(); });

render();
connectStore();
</script>

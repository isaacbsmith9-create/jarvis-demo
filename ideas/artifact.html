<style>
/* Layout: a numbered catalog. Search and category chips stick to the top; ideas are tappable rows grouped by category; picks collect in a bar at the bottom. */
:root {

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0d0f13; --surface: #171a21; --surface-2: #20242d; --line: #2b303a; --fg: #f2f4f8; --muted: #8d95a5; --accent: #ffb020; --accent-ink: #1a1200; --pick: #3fcf8e; --pick-soft: #143a28; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0d0f13; --surface: #171a21; --surface-2: #20242d; --line: #2b303a; --fg: #f2f4f8; --muted: #8d95a5; --accent: #ffb020; --accent-ink: #1a1200; --pick: #3fcf8e; --pick-soft: #143a28; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 680px; margin: 0 auto; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero { padding-block: 18px 8px; display: grid; gap: 6px; }
.hero h1 { font-family: var(--f-display); font-weight: 900; font-size: 34px; letter-spacing: -1px; line-height: 1; margin: 0; text-transform: uppercase; }
.hero h1 span { color: var(--accent); }
.hero p { margin: 0; color: var(--muted); max-width: 52ch; }
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { border: 0; background: none; outline: none; padding: 11px 0; width: 100%; min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .n { color: var(--muted); font-weight: 500; margin-left: 4px; }
.chip.on .n { color: inherit; opacity: .7; }
.cat { margin-top: 18px; }
.cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.cat-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 14px; letter-spacing: 1.2px; text-transform: uppercase; margin: 0; display: flex; align-items: center; gap: 8px; }
.cat-head h2 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.list { display: grid; gap: 6px; }
.idea { display: grid; grid-template-columns: 44px 1fr 26px; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.idea:hover { border-color: var(--muted); }
.idea.on { border-color: var(--pick); background: var(--pick-soft); }
.idea .num { font-family: var(--f-display); font-weight: 800; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.idea .body { min-width: 0; }
.idea b { font-weight: 700; }
.idea .star { color: var(--accent); font-size: 12px; font-weight: 700; margin-left: 6px; white-space: nowrap; }
.idea small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.idea .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.idea.on .box { background: var(--pick); border-color: var(--pick); }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tray-inner { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.tray-inner > div:first-child { min-width: 0; flex: 1; }
.tray-inner > div:last-child { flex: none; }
.tray b { font-family: var(--f-display); font-size: 17px; }
.tray small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
#toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>

const IDEAS = []; CATS.forEach(([cat, color, list]) => list.forEach(([name, desc, top]) => IDEAS.push({ n: IDEAS.length + 1, cat, color, name, desc, top: !!top })));

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
let picks = new Set(), filter = 'All';
try { picks = new Set(JSON.parse(localStorage.getItem('vault-picks') || '[]')); } catch {}
const savePicks = () => { try { localStorage.setItem('vault-picks', JSON.stringify([...picks])); } catch {} };
let toastT; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

function renderChips() {
  const opts = [['All', IDEAS.length], ['Top picks', IDEAS.filter((i) => i.top).length], ...CATS.map(([c, , l]) => [c, l.length])];
  $('#chips').innerHTML = opts.map(([c, n]) => `<button type="button" class="chip${filter === c ? ' on' : ''}" data-f="${esc(c)}">${c === 'Top picks' ? '★ ' : ''}${esc(c)}<span class="n">${n}</span></button>`).join('');
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const shown = IDEAS.filter((i) => (filter === 'All' || (filter === 'Top picks' ? i.top : i.cat === filter)) && (!q || `${i.n} ${i.name} ${i.desc} ${i.cat}`.toLowerCase().includes(q)));
  const groups = CATS.map(([c, color]) => [c, color, shown.filter((i) => i.cat === c)]).filter(([, , l]) => l.length);
  $('#list').innerHTML = groups.length ? groups.map(([c, color, list]) => `<section class="cat"><div class="cat-head"><h2><i style="background:${color}"></i>${esc(c)}</h2><span class="muted small" style="color:var(--muted);font-size:13px">${list.length}</span></div><div class="list">
    ${list.map((i) => `<button type="button" class="idea${picks.has(i.n) ? ' on' : ''}" data-n="${i.n}" aria-pressed="${picks.has(i.n)}"><span class="num">#${i.n}</span><span class="body"><b>${esc(i.name)}</b>${i.top ? '<span class="star">★ top pick</span>' : ''}<small>${esc(i.desc)}</small></span><span class="box" aria-hidden="true">${picks.has(i.n) ? '✓' : ''}</span></button>`).join('')}
  </div></section>`).join('') : `<div class="empty">No ideas match "${esc(q)}". Try another word.</div>`;
  renderTray();
}
function renderTray() {
  const list = [...picks].sort((a, b) => a - b);
  $('#pick-count').textContent = `${list.length} picked`;
  $('#pick-list').textContent = list.length ? list.map((n) => `#${n} ${IDEAS[n - 1].name}`).join(', ') : 'Tap ideas to pick them';
  $('#copy').disabled = $('#clear').disabled = !list.length;
}
$('#chips').addEventListener('click', (e) => { const c = e.target.closest('[data-f]'); if (!c) return; filter = c.dataset.f; renderChips(); render(); window.scrollTo(0, 0); });
$('#q').addEventListener('input', render);
$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-n]'); if (!b) return;
  const n = Number(b.dataset.n); picks.has(n) ? picks.delete(n) : picks.add(n); savePicks();
  b.classList.toggle('on', picks.has(n)); b.setAttribute('aria-pressed', String(picks.has(n))); b.querySelector('.box').textContent = picks.has(n) ? '✓' : '';
  renderTray();
});
$('#clear').addEventListener('click', () => { picks.clear(); savePicks(); render(); });
$('#copy').addEventListener('click', () => {
  const list = [...picks].sort((a, b) => a - b);
  const text = 'Build these from the Idea Vault: ' + list.map((n) => `#${n} ${IDEAS[n - 1].name}`).join(', ');
  navigator.clipboard.writeText(text).then(() => toast('Copied. Paste it in the chat.'), () => { $('#pick-list').textContent = text; toast('Copy is blocked here. The list is shown below; send me the numbers.'); });
});
renderChips(); render();
</script>
